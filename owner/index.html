<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>空家ポケット 運営センター</title>
<style>
:root{--navy:#082b58;--bg:#f4f7fb;--line:#dfe6ef;--green:#0c7a43;--red:#b42318;--orange:#9a3412}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:#172033}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.num{font-size:28px;font-weight:850;color:var(--navy)}.label{font-size:12px;color:#68788d}.btn{border:1px solid #cbd5e1;border-radius:10px;padding:10px 14px;background:#fff;font-weight:750;cursor:pointer}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.good{background:#ecfdf3;color:var(--green);border-color:#abefc6}.danger{background:#fff1f0;color:var(--red);border-color:#fecaca}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.login{max-width:430px;margin:8vh auto}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.notice{padding:12px;border-radius:10px;background:#fff7ed;color:var(--orange);font-size:13px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 9px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:700}.on{background:#ecfdf3;color:var(--green)}.off{background:#fff1f0;color:var(--red)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid #eef2f6;text-align:left;vertical-align:top}.scroll{overflow:auto}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:850;color:var(--navy)}.sub{font-size:12px;color:#65758b}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div id="loginView" class="wrap login">
  <div class="card">
    <div class="brand">空家ポケット 運営センター</div>
    <p class="sub">本人専用。お客様用サイトとは完全に分離しています。</p>
    <div class="field"><label>管理者メール</label><input id="email" value="jmdjdtdjdt@gmail.com" autocomplete="username"></div>
    <div class="field"><label>管理パスワード</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="loginBtn">ログイン</button>
    <div id="loginMsg" class="sub" style="margin-top:10px"></div>
  </div>
</div>
<div id="appView" class="hidden">
  <div class="top"><div class="wrap head"><div><div class="brand">空家ポケット 運営センター</div><div class="sub">管理画面＋完全自動化コントロール</div></div><div class="actions"><button class="btn" id="refreshBtn">更新</button><button class="btn" id="logoutBtn">ログアウト</button></div></div></div>
  <main class="wrap">
    <div class="grid">
      <div class="card"><div class="label">実会員</div><div class="num" id="members">0</div></div>
      <div class="card"><div class="label">依頼</div><div class="num" id="requests">0</div></div>
      <div class="card"><div class="label">支払済み</div><div class="num" id="paid">0</div></div>
      <div class="card"><div class="label">あなたがやる案件</div><div class="num" id="work">0</div></div>
      <div class="card"><div class="label">売上</div><div class="num" id="revenue">¥0</div></div>
      <div class="card"><div class="label">7日間行動データ</div><div class="num" id="events">0</div></div>
    </div>
    <div class="card">
      <h2>完全自動化</h2>
      <div class="chips" id="autoChips"></div>
      <div class="actions" style="margin-top:12px"><button class="btn good" id="autoOn">完全自動 ON</button><button class="btn danger" id="autoOff">完全自動 OFF</button><button class="btn" id="metricsBtn">今すぐ集計</button><button class="btn" id="diagBtn">障害診断</button></div>
      <div class="notice" style="margin-top:12px"><b>外部メール送信：強制OFF</b><br>完全自動ONでも、営業メール・DM・登録完了メール等を勝手に送りません。</div>
      <div id="diagMsg" class="sub" style="margin-top:10px"></div>
    </div>
    <div class="card"><h2>あなたがやる案件</h2><div class="scroll"><table><thead><tr><th>案件</th><th>物件</th><th>状態</th><th>決済</th><th>訪問日</th><th>金額</th></tr></thead><tbody id="jobs"></tbody></table></div></div>
    <div class="card"><h2>最近の会員</h2><div class="scroll"><table><thead><tr><th>会員</th><th>物件地域</th><th>流入元</th></tr></thead><tbody id="people"></tbody></table></div></div>
    <div class="card"><h2>現地確認が終わったら報告して終了</h2><div class="field"><label>案件ID</label><input id="rid" placeholder="AKR-..."></div><div class="field"><label>報告メモ</label><textarea id="memo" rows="3" placeholder="外観・敷地の確認結果"></textarea></div><div class="field"><label>写真枚数</label><input id="photos" type="number" min="0" value="0"></div><div class="field"><label>報告URL（任意）</label><input id="reportUrl"></div><button class="btn primary" id="completeBtn">報告完了にする</button><div id="completeMsg" class="sub" style="margin-top:10px"></div></div>
  </main>
</div>
<script>
const API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner';
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('akiya_owner_token')||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,token})});const x=await r.json();if(r.status===401&&action!=='login'){token='';sessionStorage.removeItem('akiya_owner_token');showLogin()}return x}
function showLogin(){$('loginView').classList.remove('hidden');$('appView').classList.add('hidden')}function showApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}
async function load(){const x=await api('dashboard');if(!x.ok)return;showApp();const d=x.data;$('members').textContent=d.members;$('requests').textContent=d.requests;$('paid').textContent=d.paid;$('work').textContent=d.work;$('revenue').textContent=yen(d.revenue);$('events').textContent=d.events;const st=d.settings;$('autoChips').innerHTML=`<span class="chip ${st.full_auto_enabled?'on':'off'}">完全自動 ${st.full_auto_enabled?'ON':'OFF'}</span><span class="chip ${st.growth_enabled?'on':'off'}">集客自動化 ${st.growth_enabled?'ON':'OFF'}</span><span class="chip ${st.health_monitor_enabled?'on':'off'}">障害監視 ${st.health_monitor_enabled?'ON':'OFF'}</span><span class="chip off">メール 強制OFF</span>`;$('jobs').innerHTML=(d.recentRequests||[]).map(r=>`<tr><td>${esc(r.request_id)}</td><td>${esc(r.property_address)}</td><td>${esc(r.status)}</td><td>${esc(r.payment_status)}</td><td>${esc(r.visit_date||'—')}</td><td>${yen(r.quoted_total)}</td></tr>`).join('')||'<tr><td colspan="6">まだ依頼はありません。</td></tr>';$('people').innerHTML=(d.recentMembers||[]).map(m=>`<tr><td>${esc(m.name)}<br><span class="sub">${esc(m.member_no)}</span></td><td>${esc((m.property_prefecture||'')+' '+(m.property_city||''))}</td><td>${esc(m.acquisition_source||'direct')}</td></tr>`).join('')||'<tr><td colspan="3">まだ実会員はいません。</td></tr>'}
$('loginBtn').onclick=async()=>{const x=await api('login',{email:$('email').value,password:$('password').value});$('loginMsg').textContent=x.ok?'ログインしました。':'ログインできません。';if(x.ok){token=x.token;sessionStorage.setItem('akiya_owner_token',token);load()}};$('logoutBtn').onclick=async()=>{await api('logout');token='';sessionStorage.removeItem('akiya_owner_token');showLogin()};$('refreshBtn').onclick=load;$('autoOn').onclick=async()=>{await api('set_auto',{enabled:true});load()};$('autoOff').onclick=async()=>{await api('set_auto',{enabled:false});load()};$('metricsBtn').onclick=async()=>{const x=await api('refresh_metrics');$('diagMsg').textContent=x.ok?'集計しました。':'集計できませんでした。';if(x.ok)load()};$('diagBtn').onclick=async()=>{const x=await api('diagnostic');$('diagMsg').textContent=x.ok?(x.checks||[]).map(c=>(c.ok?'正常':'異常')+' '+c.label+' '+c.status).join(' / '):'診断できませんでした。'};$('completeBtn').onclick=async()=>{const x=await api('complete_report',{requestId:$('rid').value,summary:$('memo').value,photoCount:$('photos').value,reportUrl:$('reportUrl').value});$('completeMsg').textContent=x.ok?'報告完了にしました。':'完了できませんでした。';if(x.ok)load()};if(token)load();else showLogin();
</script>
</body></html>
