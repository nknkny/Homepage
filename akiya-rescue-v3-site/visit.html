<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>実家現地確認｜空き家レスキュー</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="styles.css"><script src="site-config.js" defer></script><script src="app.js" defer></script></head><body><div class="status">無料会員限定。相談送信だけでは契約・課金は成立しません。</div><header class="header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">空家</span><span data-config="siteName">空き家レスキュー</span></a><a class="button small" href="index.html">トップへ戻る</a></div></header><main class="form-page"><div class="narrow"><article class="form-card"><p class="eyebrow">無料会員限定</p><h1>実家現地確認のご相談</h1><p class="form-lead">建物外観と敷地を安全な範囲から確認し、写真と所見を原則1〜2営業日以内に報告します。送信後に対象地域、日程、合計料金をご案内します。</p><div class="grid-2"><div class="note"><strong>通常料金：</strong>4,980円（税込）／回</div><div class="note"><strong>地域加算：</strong>片道20km超〜35km以内は1,100円</div></div><form data-mail-form data-form-kind="実家現地確認の相談"><div class="field-grid"><div class="field"><label>お名前<span class="required">必須</span></label><input name="name" data-label="お名前" required></div><div class="field"><label>電話番号<span class="required">必須</span></label><input name="phone" data-label="電話番号" required></div><div class="field full"><label>メールアドレス<span class="required">必須</span></label><input type="email" name="email" data-label="メールアドレス" required></div><div class="field full"><label>対象物件の住所<span class="required">必須</span></label><input name="property_address" data-label="対象物件の住所" required></div><div class="field"><label>対象物件との関係<span class="required">必須</span></label><select name="authority" data-label="対象物件との関係" required><option value="">選択してください</option><option>所有者本人</option><option>所有者の家族・親族</option><option>正当な管理権限を持つ</option><option>その他（確認が必要）</option></select></div><div class="field"><label>希望時期</label><input name="preferred_date" data-label="希望時期" placeholder="例：今週中"></div><div class="field full"><label>確認してほしい内容<span class="required">必須</span></label><textarea name="request" data-label="確認してほしい内容" required></textarea></div></div><div class="checks"><label class="check"><input type="checkbox" name="consent" required><span><a class="text-link" href="legal/visit.html" target="_blank">実家現地確認の条件</a>、<a class="text-link" href="legal/terms.html" target="_blank">利用規約</a>、<a class="text-link" href="legal/privacy.html" target="_blank">プライバシーポリシー</a>に同意します。</span></label><label class="check"><input type="checkbox" name="newsletter"><span>地域情報・サービス案内メールを受け取ります（任意）。</span></label></div><div class="form-actions"><button class="button" type="submit">相談内容をメールで送信</button><a class="button ghost" data-email-link href="#">直接メールする</a></div></form></article></div></main></body></html>
