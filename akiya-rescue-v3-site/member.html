<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無料会員登録｜空き家レスキュー</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="styles.css"><script src="site-config.js" defer></script><script src="app.js" defer></script></head><body><div class="status">登録料・月額費用は無料です。メール送信後に受付確認をご案内します。</div><header class="header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">空家</span><span data-config="siteName">空き家レスキュー</span></a><a class="button small" href="index.html">トップへ戻る</a></div></header><main class="form-page"><div class="narrow"><article class="form-card"><p class="eyebrow">登録料・月額費用 0円</p><h1>無料会員登録</h1><p class="form-lead">今すぐ空き家ではない方も登録できます。入力内容はメール作成画面へ転記され、送信後に登録申込みとなります。</p><div class="note"><strong>自動課金はありません。</strong>地域情報メールの受信は任意で、いつでも停止できます。</div><form data-mail-form data-form-kind="無料会員登録"><div class="field-grid"><div class="field"><label>お名前<span class="required">必須</span></label><input name="name" data-label="お名前" required></div><div class="field"><label>電話番号<span class="required">必須</span></label><input name="phone" data-label="電話番号" required></div><div class="field full"><label>メールアドレス<span class="required">必須</span></label><input type="email" name="email" data-label="メールアドレス" required></div><div class="field"><label>実家・住宅の市区町村<span class="required">必須</span></label><input name="municipality" data-label="実家・住宅の市区町村" required placeholder="例：青森県むつ市"></div><div class="field"><label>住宅との関係<span class="required">必須</span></label><select name="relationship" data-label="住宅との関係" required><option value="">選択してください</option><option>所有者本人</option><option>所有者の家族・親族</option><option>将来相続する可能性がある</option><option>管理を任されている</option><option>その他</option></select></div><div class="field full"><label>現在の住宅状況<span class="required">必須</span></label><select name="status" data-label="現在の住宅状況" required><option value="">選択してください</option><option>現在空き家である</option><option>1年以内に空き家になる可能性がある</option><option>1〜3年以内に空き家になる可能性がある</option><option>時期は未定だが将来心配している</option><option>親・家族が居住中で遠方から支援したい</option><option>現在は情報収集のみ</option></select></div><div class="field full"><label>関心のある内容</label><textarea name="interests" data-label="関心のある内容" placeholder="除雪、草刈り、施設入居後の管理、相続前の準備など"></textarea></div></div><div class="checks"><label class="check"><input type="checkbox" name="consent" required><span><a class="text-link" href="legal/terms.html" target="_blank">利用規約</a>と<a class="text-link" href="legal/privacy.html" target="_blank">プライバシーポリシー</a>に同意します。</span></label><label class="check"><input type="checkbox" name="newsletter"><span>地域情報・サービス案内メールを受け取ります（任意）。</span></label></div><div class="form-actions"><button class="button" type="submit">登録内容をメールで送信</button><a class="button ghost" data-email-link href="#">直接メールする</a></div></form></article></div></main></body></html>
