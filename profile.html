<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登録情報の変更｜空き家レスキュー</title><meta name="description" content="会員登録情報を変更します。"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/style.css"></head><body><header class="site-header"><div class="wrap head"><a class="brand" href="index.html"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 31 32 10l24 21v25H39V40H25v16H8Z" fill="#082b58"/><path d="m42 25 5 5 9-11" fill="none" stroke="#eb5b1b" stroke-width="5"/></svg><span>空き家レスキュー</span></a><nav class="nav" aria-label="主要メニュー"><a href="service.html">サービス内容</a><a href="report-sample.html">報告見本</a><a href="faq.html">よくある質問</a><a href="about.html">事業者情報</a></nav><div class="header-actions"><a class="btn btn-ghost" href="member.html">会員ページ</a><button class="btn btn-primary js-logout" type="button">ログアウト</button></div></div></header><main><section class="page-hero"><div class="wrap"><h1>登録情報の変更</h1></div></section><section class="section section-soft"><div class="wrap form-shell"><form method="post" action="/form-unavailable.html" id="profileForm" class="panel"><div class="field-grid"><div class="field"><label>お名前</label><input name="name" required></div><div class="field"><label>ふりがな</label><input name="nameKana"></div><div class="field"><label>メールアドレス<span class="required">必須</span></label><input name="email" type="email" required></div><div class="field"><label>電話番号</label><input name="phone" type="tel"></div><div class="field"><label>物件の都道府県</label><input name="propertyPrefecture"></div><div class="field"><label>物件の市区町村</label><input name="propertyCity"></div><div class="field"><label>現在のパスワード<span class="required">必須</span></label><input name="currentPassword" type="password" autocomplete="current-password" minlength="8" required><p class="small muted">登録情報の変更確認に使用します。</p></div></div><label class="choice"><input type="checkbox" name="marketingOptIn" value="yes"><span>地域情報・サービス案内を受け取る</span></label><label class="choice"><input type="checkbox" name="aiTrainingOptIn" value="yes"><span>識別情報を除去した情報のAI学習資産利用に同意する（任意）。チェックを外して保存すると、将来の利用に対する同意を撤回します。<a href="ai-training-policy.html" target="_blank" rel="noopener noreferrer">利用範囲</a></span></label><div id="profileStatus" class="status-box"></div><div class="form-actions"><a class="btn btn-ghost" href="member.html">戻る</a><button class="btn btn-primary" type="submit">変更を保存</button></div></form></div></section></main><footer class="footer"><div class="wrap foot"><div><a class="brand" href="index.html">空き家レスキュー</a><p>遠方にある実家・空き家の外観と敷地を確認し、写真でご報告するサービスです。</p></div><div><b>サービス</b><p><a href="register.html">無料会員登録</a><br><a href="member-login.html">会員ログイン</a><br><a href="service.html">現地確認サービス</a><br><a href="report-sample.html">報告見本</a></p></div><div><b>規約・連絡先</b><p><a href="terms.html">無料会員規約</a><br><a href="service-terms.html">現地確認提供条件</a><br><a href="privacy.html">プライバシーポリシー</a><br><a href="commercial.html">特定商取引法表記</a><br><a href="contact.html">お問い合わせ</a></p></div></div></footer><script src="assets/config.js"></script><script src="assets/api.js"></script><script src="assets/site.js"></script><script>(async()=>{if(!AkiyaAPI.token())return location.replace('member-login.html');try{const r=await AkiyaAPI.submit('get_dashboard',{sessionToken:AkiyaAPI.token()});if(!r.ok){AkiyaAPI.setToken('');return location.replace('member-login.html')}const m=r.member;for(const k of ['name','nameKana','email','phone','propertyPrefecture','propertyCity'])if(profileForm.elements[k])profileForm.elements[k].value=m[k]||'';profileForm.marketingOptIn.checked=!!m.marketingOptIn;profileForm.aiTrainingOptIn.checked=!!m.aiTrainingOptIn}catch(err){AkiyaUI.show(profileStatus,err.message||'登録情報を取得できませんでした。')}})();profileForm.addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;AkiyaUI.busy(b,true);try{const d=AkiyaUI.formData(profileForm);d.sessionToken=AkiyaAPI.token();const r=await AkiyaAPI.submit('update_profile',d);AkiyaUI.show(profileStatus,r.message||'登録情報を更新しました。',!!r.ok);if(r.ok)profileForm.currentPassword.value=''}catch(err){AkiyaUI.show(profileStatus,err.message||'登録情報を更新できませんでした。')}finally{AkiyaUI.busy(b,false)}});</script></body></html>
