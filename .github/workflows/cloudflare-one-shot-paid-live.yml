name: Cloudflare one-shot paid-live deployment

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/cloudflare-auth/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_WORKER: rapid-hat-f45c
      ADMIN_WORKER: akiya-pocket-owner-private
      OWNER_EMAIL: jmdjdtdjdt@gmail.com
      CANDIDATE_BRANCH: akiya-r13-ready-20260818
      ROLLBACK_BRANCH: akiya-r13-static
    steps:
      - uses: actions/checkout@v4

      - name: Prepare encrypted runtime channel before Cloudflare timer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/cfcli" wrangler@latest >/dev/null 2>&1
          WRANGLER="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          "$WRANGLER" --version
          openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -subj "/CN=akiya-cloudflare-one-shot-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1
          cert=$(base64 -w0 "$RUNNER_TEMP/cert.pem")
          body=$(jq -n --arg run "$GITHUB_RUN_ID" --arg cert "$cert" \
            '{body:("CLOUDFLARE_RUNTIME_READY\nRUN_ID="+$run+"\nRUNTIME_CERT_B64="+$cert+"\nSTATUS=Cloudflare authorization has NOT started. Waiting only for encrypted runtime payload.")}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            -d "$body" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          echo 'RUNTIME_CHANNEL_READY=PASS'

      - name: Receive and validate encrypted runtime payload from PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 420); do
            comments=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")
            payload=$(printf '%s' "$comments" | jq -r --arg run "$GITHUB_RUN_ID" '
              [.[] | select(.body | startswith("CLOUDFLARE_RUNTIME_PAYLOAD\nRUN_ID="+$run+"\n")) | .body] | last // "" |
              split("\n")[] | select(startswith("PAYLOAD_B64=")) | sub("^PAYLOAD_B64=";"")' | tail -1)
            if [ -n "$payload" ]; then
              if python3 - "$payload" "$RUNNER_TEMP/runtime.cms" <<'PY'
          import base64,sys
          s=''.join(sys.argv[1].split())
          try:
              raw=base64.b64decode(s,validate=True)
          except Exception:
              raise SystemExit(1)
          open(sys.argv[2],'wb').write(raw)
          PY
              then
                if openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/runtime.cms" \
                  -recip "$RUNNER_TEMP/cert.pem" -inkey "$RUNNER_TEMP/key.pem" \
                  -out "$RUNNER_TEMP/payload.json" 2>/dev/null; then
                  if jq -e '.owner_ui_key and .entry_key and .owner_email and .owner_password' "$RUNNER_TEMP/payload.json" >/dev/null 2>&1; then
                    ready=1
                    break
                  fi
                fi
              fi
            fi
            sleep 1
          done
          test "$ready" = 1
          test "$(jq -r '.owner_email' "$RUNNER_TEMP/payload.json")" = "$OWNER_EMAIL"
          echo 'ENCRYPTED_RUNTIME_VALIDATED=PASS'

      - name: Start minimum-scope Cloudflare device authorization only after runtime is ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          "$WRANGLER" login --device \
            --scopes account:read --scopes user:read --scopes workers:write --scopes workers_scripts:write \
            --no-use-keyring >"$RUNNER_TEMP/login.log" 2>&1 &
          pid=$!
          echo "$pid" > "$RUNNER_TEMP/login.pid"
          device_url=''
          for _ in $(seq 1 90); do
            device_url=$(grep -Eo 'https://dash\.cloudflare\.com/oauth2/device/verify\?user_code=[A-Za-z0-9]+' "$RUNNER_TEMP/login.log" | tail -1 || true)
            [ -n "$device_url" ] && break
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/login.log"; exit 1; fi
            sleep 1
          done
          test -n "$device_url"
          body=$(jq -n --arg run "$GITHUB_RUN_ID" --arg url "$device_url" \
            '{body:("CLOUDFLARE_DEVICE_READY\nRUN_ID="+$run+"\nCLOUDFLARE_DEVICE_URL="+$url+"\nSTATUS=Encrypted runtime already validated. Owner approval is the only remaining input before deployment.")}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            -d "$body" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          echo 'DEVICE_AUTH_READY_FOR_OWNER=PASS'
          wait "$pid"
          "$WRANGLER" whoami > "$RUNNER_TEMP/whoami.txt"
          grep -Fq 'workers (write)' "$RUNNER_TEMP/whoami.txt"
          if grep -Eq 'email_sending|email_routing|ai \(write\)|pages \(write\)' "$RUNNER_TEMP/whoami.txt"; then
            echo 'EXCESS_SCOPE_DETECTED'; exit 1
          fi
          echo 'MINIMUM_SCOPE_OWNER_OAUTH=PASS'

      - name: Identify exact Cloudflare account and existing Worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          "$WRANGLER" auth token --json > "$RUNNER_TEMP/token.json"
          token=$(jq -r '.token // empty' "$RUNNER_TEMP/token.json")
          test -n "$token"
          curl -fsSL -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/accounts?per_page=50' > "$RUNNER_TEMP/accounts.json"
          jq -e '.success==true' "$RUNNER_TEMP/accounts.json" >/dev/null
          : > "$RUNNER_TEMP/matches.txt"
          while read -r aid; do
            code=$(curl -sS -o "$RUNNER_TEMP/worker-$aid.json" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$TARGET_WORKER/settings")
            if [ "$code" = 200 ] && jq -e '.success==true' "$RUNNER_TEMP/worker-$aid.json" >/dev/null 2>&1; then
              echo "$aid" >> "$RUNNER_TEMP/matches.txt"
            fi
          done < <(jq -r '.result[].id' "$RUNNER_TEMP/accounts.json")
          test "$(wc -l < "$RUNNER_TEMP/matches.txt")" -eq 1
          ACCOUNT_ID=$(cat "$RUNNER_TEMP/matches.txt")
          echo "$ACCOUNT_ID" > "$RUNNER_TEMP/account-id.txt"
          curl -fsSL -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain" > "$RUNNER_TEMP/subdomain.json"
          jq -e '.success==true and (.result.subdomain|length>0)' "$RUNNER_TEMP/subdomain.json" >/dev/null
          jq -r '.result.subdomain' "$RUNNER_TEMP/subdomain.json" > "$RUNNER_TEMP/subdomain.txt"
          echo 'EXACT_EXISTING_WORKER_OWNERSHIP=PASS'

      - name: Deploy audited paid-live customer site to exact existing Worker
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(cat "$RUNNER_TEMP/account-id.txt")
          WRANGLER="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          mkdir -p "$RUNNER_TEMP/customer-deploy"
          git clone -q --depth 1 --single-branch --branch "$CANDIDATE_BRANCH" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/customer-deploy/site"
          rm -rf "$RUNNER_TEMP/customer-deploy/site/.git" "$RUNNER_TEMP/customer-deploy/site/.github"
          grep -Fq 'siteVersion=2026-08-18-paid-live-r1' "$RUNNER_TEMP/customer-deploy/site/VERSION.txt"
          cat > "$RUNNER_TEMP/customer-deploy/wrangler.jsonc" <<EOF
          {"name":"$TARGET_WORKER","account_id":"$ACCOUNT_ID","compatibility_date":"2026-08-18","workers_dev":true,"assets":{"directory":"./site"}}
          EOF
          "$WRANGLER" deploy --dry-run --config "$RUNNER_TEMP/customer-deploy/wrangler.jsonc" >/dev/null
          "$WRANGLER" deploy --keep-vars --config "$RUNNER_TEMP/customer-deploy/wrangler.jsonc" > "$RUNNER_TEMP/customer-deploy.log"
          echo 'CUSTOMER_DEPLOY_COMMAND=PASS'

      - name: Verify live customer production and rollback automatically on failure
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://rapid-hat-f45c.jmdjdtdjdt.workers.dev'
          verify_live(){
            curl -fsSL --max-time 30 "$ORIGIN/VERSION.txt?one-shot=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/live-version.txt" &&
            curl -fsSL --max-time 30 "$ORIGIN/assets/config.js?one-shot=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/live-config.js" &&
            curl -fsSL --max-time 30 "$ORIGIN/register.html?one-shot=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/live-register.html" &&
            curl -fsSL --max-time 30 "$ORIGIN/member-login.html?one-shot=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/live-login.html" &&
            curl -fsSL --max-time 30 "$ORIGIN/request.html?one-shot=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/live-request.html" &&
            curl -fsSL --max-time 30 "$ORIGIN/checkout.html?one-shot=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/live-checkout.html" &&
            grep -Fq 'siteVersion=2026-08-18-paid-live-r1' "$RUNNER_TEMP/live-version.txt" &&
            grep -Fq 'akiya-pocket-api' "$RUNNER_TEMP/live-config.js" &&
            grep -Fq 'akiya-pocket-payment-api' "$RUNNER_TEMP/live-config.js" &&
            grep -Fq 'id="registerForm"' "$RUNNER_TEMP/live-register.html" &&
            grep -Fq 'id="loginForm"' "$RUNNER_TEMP/live-login.html" &&
            grep -Fq '3,480円' "$RUNNER_TEMP/live-request.html" &&
            grep -Fq '3,480円' "$RUNNER_TEMP/live-checkout.html" &&
            ! grep -q '遨ｺ螳ｶ' "$RUNNER_TEMP/live-register.html"
          }
          ok=0
          for _ in $(seq 1 15); do
            if verify_live; then ok=1; break; fi
            sleep 4
          done
          if [ "$ok" -ne 1 ]; then
            echo 'LIVE_VERIFY_FAILED_ROLLING_BACK'
            ACCOUNT_ID=$(cat "$RUNNER_TEMP/account-id.txt")
            WRANGLER="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
            rm -rf "$RUNNER_TEMP/rollback-deploy"; mkdir -p "$RUNNER_TEMP/rollback-deploy"
            git clone -q --depth 1 --single-branch --branch "$ROLLBACK_BRANCH" \
              "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/rollback-deploy/site"
            rm -rf "$RUNNER_TEMP/rollback-deploy/site/.git" "$RUNNER_TEMP/rollback-deploy/site/.github"
            cat > "$RUNNER_TEMP/rollback-deploy/wrangler.jsonc" <<EOF
          {"name":"$TARGET_WORKER","account_id":"$ACCOUNT_ID","compatibility_date":"2026-08-18","workers_dev":true,"assets":{"directory":"./site"}}
          EOF
            "$WRANGLER" deploy --keep-vars --config "$RUNNER_TEMP/rollback-deploy/wrangler.jsonc" >/dev/null
            exit 1
          fi
          echo 'CUSTOMER_LIVE_PAID_R1=PASS'

      - name: Deploy private owner dashboard Worker with server-side secrets
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(cat "$RUNNER_TEMP/account-id.txt")
          WRANGLER="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          mkdir -p "$RUNNER_TEMP/admin-deploy/src"
          cp .github/cloudflare/akiya-owner-worker.js "$RUNNER_TEMP/admin-deploy/src/index.js"
          cat > "$RUNNER_TEMP/admin-deploy/wrangler.jsonc" <<EOF
          {"name":"$ADMIN_WORKER","account_id":"$ACCOUNT_ID","main":"./src/index.js","compatibility_date":"2026-08-18","workers_dev":true}
          EOF
          "$WRANGLER" deploy --config "$RUNNER_TEMP/admin-deploy/wrangler.jsonc" >/dev/null
          OWNER_UI_KEY=$(jq -r '.owner_ui_key' "$RUNNER_TEMP/payload.json")
          ENTRY_KEY=$(jq -r '.entry_key' "$RUNNER_TEMP/payload.json")
          printf '%s' "$OWNER_UI_KEY" | "$WRANGLER" secret put OWNER_UI_KEY --config "$RUNNER_TEMP/admin-deploy/wrangler.jsonc" >/dev/null
          printf '%s' "$ENTRY_KEY" | "$WRANGLER" secret put ENTRY_KEY --config "$RUNNER_TEMP/admin-deploy/wrangler.jsonc" >/dev/null
          echo 'ADMIN_WORKER_DEPLOY=PASS'

      - name: Verify private owner dashboard end to end
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN=$(cat "$RUNNER_TEMP/subdomain.txt")
          ADMIN_ORIGIN="https://${ADMIN_WORKER}.${SUBDOMAIN}.workers.dev"
          ENTRY_KEY=$(jq -r '.entry_key' "$RUNNER_TEMP/payload.json")
          OWNER_EMAIL_PAYLOAD=$(jq -r '.owner_email' "$RUNNER_TEMP/payload.json")
          OWNER_PASSWORD=$(jq -r '.owner_password' "$RUNNER_TEMP/payload.json")
          test "$OWNER_EMAIL_PAYLOAD" = "$OWNER_EMAIL"
          code=$(curl -sS -o "$RUNNER_TEMP/admin-root.html" -w '%{http_code}' "$ADMIN_ORIGIN/")
          test "$code" = 404
          ! grep -Fq '運営センター' "$RUNNER_TEMP/admin-root.html"
          ENTRY_ESCAPED=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$ENTRY_KEY")
          curl -fsSL -c "$RUNNER_TEMP/admin.cookies" -b "$RUNNER_TEMP/admin.cookies" -L \
            "$ADMIN_ORIGIN/enter?key=$ENTRY_ESCAPED" -o "$RUNNER_TEMP/admin-owner.html"
          grep -Fq '空家ポケット 運営センター' "$RUNNER_TEMP/admin-owner.html"
          ! grep -Fq 'OWNER_UI_KEY' "$RUNNER_TEMP/admin-owner.html"
          login=$(jq -n --arg e "$OWNER_EMAIL_PAYLOAD" --arg p "$OWNER_PASSWORD" '{action:"login",email:$e,password:$p}')
          curl -fsSL -c "$RUNNER_TEMP/admin.cookies" -b "$RUNNER_TEMP/admin.cookies" \
            -H 'content-type: application/json' -d "$login" "$ADMIN_ORIGIN/api/owner" -o "$RUNNER_TEMP/admin-login.json"
          jq -e '.ok==true and (.token|not)' "$RUNNER_TEMP/admin-login.json" >/dev/null
          curl -fsSL -c "$RUNNER_TEMP/admin.cookies" -b "$RUNNER_TEMP/admin.cookies" \
            -H 'content-type: application/json' -d '{"action":"dashboard"}' "$ADMIN_ORIGIN/api/owner" -o "$RUNNER_TEMP/admin-dashboard.json"
          jq -e '.ok==true and (.data.members|type=="number") and (.data.requests|type=="number") and .data.settings.external_email_enabled==false' "$RUNNER_TEMP/admin-dashboard.json" >/dev/null
          curl -fsSL -c "$RUNNER_TEMP/admin.cookies" -b "$RUNNER_TEMP/admin.cookies" \
            -H 'content-type: application/json' -d '{"action":"logout"}' "$ADMIN_ORIGIN/api/owner" >/dev/null
          echo "$ADMIN_ORIGIN" > "$RUNNER_TEMP/admin-origin.txt"
          echo 'ADMIN_PRIVATE_E2E=PASS'

      - name: Revoke one-shot Cloudflare OAuth and remove plaintext runtime
        if: always()
        shell: bash
        run: |
          WRANGLER="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          if [ -x "$WRANGLER" ]; then "$WRANGLER" logout >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/token.json" "$RUNNER_TEMP/runtime.cms" || true
          echo 'ONE_SHOT_OAUTH_REVOKED_AND_RUNTIME_REMOVED=PASS'
