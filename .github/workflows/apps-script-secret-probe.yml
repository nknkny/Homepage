name: Apps Script Credential Presence Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check common Apps Script deployment credentials without exposing values
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          GOOGLE_SCRIPT_ID: ${{ secrets.GOOGLE_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CLASPRC_JSON CLASP_CREDENTIALS GOOGLE_CREDENTIALS GOOGLE_OAUTH_CREDENTIALS APPS_SCRIPT_ID GOOGLE_SCRIPT_ID; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
