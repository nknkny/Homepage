name: Akiya Public Event Strict Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_API_BUILD: 2026-08-14-legal-final-r10
  SITE_ORIGIN: https://akiya-pocket-aomori.pages.dev
  API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api

jobs:
  strict-public-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current API readiness and public-event validation transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --max-time 30 -H "Origin: $SITE_ORIGIN" "$API_URL" -o evidence/health.json
          jq -e --arg b "$EXPECTED_API_BUILD" '.ok==true and .ready==true and .buildVersion==$b' evidence/health.json >/dev/null

          # Missing eventType must fail closed and must not create an analytics row.
          code=$(curl --silent --show-error --max-time 30 -o evidence/missing-event-type.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "Origin: $SITE_ORIGIN" \
            -X POST "$API_URL" \
            --data '{"action":"track_public_event","event_name":"__ci_invalid__","event_id":""}')
          test "$code" -ge 400 && test "$code" -lt 500
          jq -e '.ok==false and .code=="EVENT_TYPE_REQUIRED"' evidence/missing-event-type.json >/dev/null

          # A syntactically complete but non-allowlisted event must also fail closed.
          code2=$(curl --silent --show-error --max-time 30 -o evidence/invalid-event-type.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "Origin: $SITE_ORIGIN" \
            -X POST "$API_URL" \
            --data '{"action":"track_public_event","eventType":"__ci_invalid__","anonymousId":"ANON-CI","sessionId":"SES-CI","page":"/"}')
          test "$code2" -ge 400 && test "$code2" -lt 500
          jq -e '.ok==false and .code=="EVENT_TYPE_INVALID"' evidence/invalid-event-type.json >/dev/null

          # Even an allowlisted event must provide the required public identifiers.
          code3=$(curl --silent --show-error --max-time 30 -o evidence/missing-session.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "Origin: $SITE_ORIGIN" \
            -X POST "$API_URL" \
            --data '{"action":"track_public_event","eventType":"site_visit","anonymousId":"ANON-CI","page":"/"}')
          test "$code3" -ge 400 && test "$code3" -lt 500
          jq -e '.ok==false and .code=="SESSION_ID_INVALID"' evidence/missing-session.json >/dev/null

          # Unknown actions must also fail closed rather than return success.
          code4=$(curl --silent --show-error --max-time 30 -o evidence/unknown-action.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "Origin: $SITE_ORIGIN" \
            -X POST "$API_URL" --data '{"action":"__ci_unknown__"}')
          test "$code4" -ge 400 && test "$code4" -lt 500
          jq -e '.ok==false' evidence/unknown-action.json >/dev/null

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akiya-public-event-strict-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
