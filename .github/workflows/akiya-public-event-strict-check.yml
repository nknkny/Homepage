name: Akiya Public Event Strict Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_API_BUILD: 2026-08-14-legal-final-r10
  SITE_ORIGIN: https://akiya-pocket-aomori.pages.dev
  API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api

jobs:
  strict-public-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current API readiness and public-event validation transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --max-time 30 -H "Origin: $SITE_ORIGIN" "$API_URL" -o evidence/health.json
          jq -e --arg b "$EXPECTED_API_BUILD" '.ok==true and .ready==true and .buildVersion==$b' evidence/health.json >/dev/null

          # Exercise the current Supabase action endpoint with an intentionally
          # invalid event. This verifies POST routing/validation without adding
          # synthetic analytics rows to production.
          code=$(curl --silent --show-error --max-time 30 -o evidence/invalid-event.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "Origin: $SITE_ORIGIN" \
            -X POST "$API_URL" \
            --data '{"action":"track_public_event","event_name":"__ci_invalid__","event_id":""}')
          test "$code" -ge 400 && test "$code" -lt 500
          jq -e '.ok==false' evidence/invalid-event.json >/dev/null

          # Unknown actions must also fail closed rather than return success.
          code2=$(curl --silent --show-error --max-time 30 -o evidence/unknown-action.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "Origin: $SITE_ORIGIN" \
            -X POST "$API_URL" --data '{"action":"__ci_unknown__"}')
          test "$code2" -ge 400 && test "$code2" -lt 500
          jq -e '.ok==false' evidence/unknown-action.json >/dev/null

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akiya-public-event-strict-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
