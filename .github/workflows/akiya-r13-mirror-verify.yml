name: Akiya production display verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify customer and owner pages
        shell: bash
        run: |
          set -euo pipefail
          CF='https://rapid-hat-f45c.jmdjdtdjdt.workers.dev/'
          OWNER='https://nknkny.github.io/Homepage/'
          OWNER_API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner'

          curl -fsSL --max-time 30 "$CF" -o customer.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('customer.html').read_text(encoding='utf-8')
          assert '空家ポケット' in s
          assert '遨ｺ螳ｶ' not in s
          print('CUSTOMER_CLOUDFLARE_UTF8=PASS')
          PY

          curl -fsS -D owner.headers --max-time 30 "$OWNER" -o owner.html
          python3 - <<'PY'
          from pathlib import Path
          h=Path('owner.headers').read_text(encoding='utf-8',errors='replace').lower()
          s=Path('owner.html').read_text(encoding='utf-8')
          assert 'text/html' in h
          assert '空家ポケット 運営センター' in s
          assert '遨ｺ螳ｶ' not in s
          assert '完全自動 ON' in s
          print('OWNER_GITHUB_PAGES_UTF8=PASS')
          PY

          curl -isS --max-time 30 -X OPTIONS "$OWNER_API" \
            -H 'Origin: https://nknkny.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' > cors.txt
          grep -qi '^access-control-allow-origin: https://nknkny.github.io' cors.txt
          grep -qi '^access-control-allow-methods: .*POST' cors.txt
          echo OWNER_API_CORS=PASS
          echo AKIYA_VISIBLE_PAGES_VERIFY=PASS
