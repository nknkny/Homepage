name: Akiya current connection audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only audit current production connection
        shell: bash
        run: |
          set -euo pipefail
          CF='https://rapid-hat-f45c.jmdjdtdjdt.workers.dev'
          OWNER_OLD='https://nknkny.github.io/Homepage/owner/'
          OWNER_API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner'
          curl -fsSL --max-time 30 "$CF/" -o home.html
          curl -fsSL --max-time 30 "$CF/assets/config.js?audit=${GITHUB_SHA}" -o config.js
          curl -fsSL --max-time 30 "$CF/assets/api.js?audit=${GITHUB_SHA}" -o api.js
          curl -fsSL --max-time 30 "$CF/register.html?audit=${GITHUB_SHA}" -o register.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          home=Path('home.html').read_text('utf-8')
          cfg=Path('config.js').read_text('utf-8')
          api=Path('api.js').read_text('utf-8')
          reg=Path('register.html').read_text('utf-8')
          print('HOME_UTF8=', '空家ポケット' in home and '遨ｺ螳ｶ' not in home)
          print('REGISTER_PAGE_PRESENT=', '無料会員' in reg or '会員登録' in reg)
          m=re.search(r'API_URL:\s*"([^"]+)"',cfg)
          api_url=m.group(1) if m else ''
          print('LIVE_API_URL='+api_url)
          print('CONFIG_USES_APPS_SCRIPT=', api_url.startswith('https://script.google.com/macros/s/'))
          print('API_JS_APPS_SCRIPT_ONLY=', 'script\\.google\\.com' in api and 'trustedApiMessageOrigin' in api)
          Path('api-url.txt').write_text(api_url,encoding='utf-8')
          PY
          API_URL=$(cat api-url.txt)
          code=$(curl -sSL -o api-response.txt -D api-headers.txt -w '%{http_code}' --max-time 30 "$API_URL?audit=${GITHUB_SHA}" || true)
          echo "LEGACY_API_HTTP=$code"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('api-response.txt').read_text('utf-8',errors='replace') if Path('api-response.txt').exists() else ''
          lo=s.lower()
          print('LEGACY_API_GOOGLE_LOGIN=', ('accounts.google.com' in lo) or ('sign in' in lo) or ('ログイン' in s and '<html' in lo))
          PY
          old_code=$(curl -sSL -o old-owner.html -w '%{http_code}' --max-time 30 "$OWNER_OLD" || true)
          echo "OLD_PUBLIC_OWNER_HTTP=$old_code"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('old-owner.html').read_text('utf-8',errors='replace') if Path('old-owner.html').exists() else ''
          print('OLD_PUBLIC_OWNER_HAS_ADMIN=', '空家ポケット 運営センター' in s or '完全自動 ON' in s)
          PY
          keyless=$(curl -sS -o keyless.json -w '%{http_code}' --max-time 30 -X POST "$OWNER_API" -H 'Content-Type: application/json' --data '{"action":"dashboard","token":"fake"}' || true)
          echo "OWNER_API_KEYLESS_HTTP=$keyless"
          cat keyless.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('keyless.json').read_text('utf-8'))
          assert x.get('ok') is False and x.get('code')=='UI_KEY_REQUIRED'
          print('OWNER_API_UI_KEY_LOCK=PASS')
          PY
