name: Google Apps Script Head Capture

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRIPT_ID: 1pHn5wId7xIMZ3iwNqSqpePLf6eSMuiagDfvCktAZepSfpxQ0JgWcWhZp
      TARGET_DEPLOYMENT: AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w
      OWNER_EMAIL: jmdjdtdjdt@gmail.com
      BRANCH: agent/auth-cli-bundle-20260807
    steps:
      - name: Prepare session transport
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -subj "/CN=akiya-capture-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1
          cert=$(base64 -w0 "$RUNNER_TEMP/cert.pem")
          file=".github/auth/capture-${GITHUB_RUN_ID}.b64"
          body=$(jq -n --arg r "$GITHUB_RUN_ID" --arg c "$cert" --arg f "$file" '{body:("GOOGLE_HEAD_CAPTURE_READY\nRUN_ID="+$r+"\nAUTH_CERT_B64="+$c+"\nAUTH_FILE="+$f)}')
          curl -fsSL --retry 5 --retry-all-errors -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          enc=''
          for i in $(seq 1 300); do
            url="https://raw.githubusercontent.com/nknkny/Homepage/$BRANCH/$file?run=$GITHUB_RUN_ID&i=$i"
            if enc=$(curl -fsSL --retry 2 --retry-all-errors -H 'Cache-Control: no-cache' "$url" 2>/dev/null); then [ -n "$enc" ] && break; fi
            sleep 1
          done
          test -n "$enc"
          printf '%s' "$enc" | base64 -d > "$RUNNER_TEMP/session.cms"
          openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/session.cms" -recip "$RUNNER_TEMP/cert.pem" -inkey "$RUNNER_TEMP/key.pem" -out "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo SESSION_RESTORED=PASS

      - name: Capture exact target HEAD
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/gcli" @google/clasp@3.3.0 >/dev/null 2>&1
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          "$CLASP" show-authorized-user --json > "$RUNNER_TEMP/user.json"
          jq -e --arg e "$OWNER_EMAIL" '.loggedIn==true and ((.email // "")|ascii_downcase)==($e|ascii_downcase)' "$RUNNER_TEMP/user.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/target"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > "$RUNNER_TEMP/target/.clasp.json"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json list-deployments > deployments.json
          grep -Fq "$TARGET_DEPLOYMENT" deployments.json
          access_token=$(jq -r '.tokens.default.access_token // empty' "$HOME/.clasprc.json")
          curl -fsSL -H "Authorization: Bearer $access_token" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" -o head-content.json
          python - <<'PY'
          import json,hashlib
          x=json.load(open('head-content.json'))
          srcs=[f['source'] for f in x.get('files',[]) if f.get('type')=='SERVER_JS']
          assert len(srcs)==1
          open('head-Code.gs','w',encoding='utf-8',newline='').write(srcs[0])
          print('HEAD_BYTES',len(srcs[0].encode()))
          print('HEAD_SHA256',hashlib.sha256(srcs[0].encode()).hexdigest())
          print('BUILD_OK', '2026-08-06-insurance-optional' in srcs[0])
          PY
          cp deployments.json head-deployments.json
          echo HEAD_CAPTURE=PASS

      - name: Upload HEAD evidence
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-head-capture-${{ github.run_id }}
          path: |
            head-content.json
            head-Code.gs
            head-deployments.json
          retention-days: 7
