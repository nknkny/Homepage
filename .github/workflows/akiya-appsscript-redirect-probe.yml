name: Akiya Apps Script Redirect Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Apps Script identifiers and legacy project-key routes
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT='AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w'
          URL="https://script.google.com/macros/s/$DEPLOYMENT/exec?probe_redirect=1"
          curl -sS -D headers.txt -o /dev/null "$URL"
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' headers.txt)
          lib=$(python - "$location" <<'PY'
          import sys, urllib.parse
          u=urllib.parse.urlparse(sys.argv[1])
          print(urllib.parse.parse_qs(u.query).get('lib',[''])[0])
          PY
          )
          echo "OUR_LIB=$lib"
          test -n "$lib"

          echo '=== OUR LEGACY EDITOR ROUTE ==='
          curl -sS -D - -o /tmp/ourbody --max-redirs 0 "https://script.google.com/d/$lib/edit?usp=drive_web" || true
          head -c 300 /tmp/ourbody || true
          echo

          echo '=== PUBLIC LEGACY PROJECT KEY CONTROL ==='
          PUBLIC_KEY='MKvHYYdYA4G5JJHj7hxIcoh8V4oX7X1M_'
          curl -sS -L --max-time 30 -o /tmp/publicbody -w 'EFFECTIVE_URL=%{url_effective}\nHTTP=%{http_code}\n' "https://script.google.com/d/$PUBLIC_KEY/edit?usp=drive_web" || true
          head -c 1000 /tmp/publicbody || true
          echo
          grep -Eo '1[A-Za-z0-9_-]{40,}' /tmp/publicbody | sort -u | head -20 || true
