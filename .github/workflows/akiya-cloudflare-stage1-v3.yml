name: Akiya Cloudflare stage1 v3

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: >-
      github.event.issue.number == 42 &&
      (contains(github.event.comment.body, 'START_AKIYA_CF_STAGE1_V3') ||
       contains(github.event.comment.body, 'VERIFY_AKIYA_CF_PARITY_V3'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Resolve mode
        id: mode
        shell: bash
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if grep -Fq 'START_AKIYA_CF_STAGE1_V3' <<<"$COMMENT"; then
            echo 'name=deploy' >> "$GITHUB_OUTPUT"
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'name=verify' >> "$GITHUB_OUTPUT"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve customer source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git log -1 --format=%H -- akiya-pocket scripts/build-akiya-cloudflare-pages.mjs)
          test -n "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Customer source SHA: $source_sha"

      - name: Cloudflare device authorization
        if: steps.mode.outputs.deploy == 'true'
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-login.log"
          clean="$RUNNER_TEMP/wrangler-login-clean.log"
          : > "$log"
          (CI='' npx --yes wrangler@4.119.0 login --device --browser=false >"$log" 2>&1) &
          pid=$!
          plain_url='https://dash.cloudflare.com/oauth2/device'
          complete_url=''
          code=''
          for n in $(seq 1 60); do
            perl -pe 's/\e\[[0-9;]*[mK]//g' "$log" > "$clean" || true
            complete_url=$(grep -Eo 'https://dash\.cloudflare\.com/oauth2/device\?user_code=[A-Za-z0-9-]+' "$clean" | tail -1 || true)
            code=$(grep -Eo '[A-Za-z0-9]{4}-[A-Za-z0-9]{4}' "$clean" | tail -1 || true)
            if [ -n "$complete_url" ] && [ -n "$code" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ -z "$code" ]; then
            cat "$clean" || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          if [ -z "$complete_url" ]; then
            complete_url="${plain_url}?user_code=${code}"
          fi
          url_code=${complete_url##*user_code=}
          if [ "$url_code" != "$code" ]; then
            echo "Device code mismatch: url=$url_code parsed=$code" >&2
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          body=$(jq -n --arg url "$plain_url" --arg complete "$complete_url" --arg code "$code" --arg run "$GITHUB_RUN_ID" '{body:("AKIYA_CF_AUTH_NOW\nVERIFY_URL="+$url+"\nVERIFY_URL_COMPLETE="+$complete+"\nCODE="+$code+"\nRUN_ID="+$run)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
          wait "$pid"

      - name: Resolve canonical Pages project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          origin=$(tr -d '[:space:]' < akiya-pocket/CLOUDFLARE_CANONICAL.txt)
          case "$origin" in https://*.pages.dev) ;; *) echo "Invalid canonical Pages origin: $origin" >&2; exit 1;; esac
          project=$(node -e 'const u=new URL(process.argv[1]); console.log(u.hostname.replace(/\.pages\.dev$/,""))' "$origin")
          test -n "$project"
          echo "name=$project" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Build Cloudflare Pages artifact
        env:
          AKIYA_CANONICAL_ORIGIN: ${{ steps.project.outputs.origin }}
          AKIYA_DEPLOYMENT_URL: ${{ steps.project.outputs.origin }}
          AKIYA_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/build-akiya-cloudflare-pages.mjs

      - name: Validate artifact
        env:
          ORIGIN: ${{ steps.project.outputs.origin }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "<link rel=\"canonical\" href=\"${ORIGIN}/\">" dist/index.html
          grep -Fq "SITE_ORIGIN: \"${ORIGIN}\"" dist/assets/config.js
          ! grep -R -F 'https://nknkny.github.io/Homepage/akiya-pocket' dist --include='*.html' --include='*.js' --include='*.xml' --include='*.txt'
          ! grep -Fq '"telephone":' dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/DEPLOYMENT.json
          jq -e --arg o "$ORIGIN" --arg s "$SOURCE_SHA" '.canonicalOrigin==$o and .build=="2026-08-21-cloudflare-pages-r1" and .sourceSha==$s' dist/DEPLOYMENT.json >/dev/null
          grep -Fq '/DEPLOYMENT.json' dist/_headers
          grep -Fq '/assets/site.js' dist/_headers
          grep -Fq '/assets/style.css' dist/_headers
          test ! -d dist/control-center
          grep -Fq '/control-center/* https://nknkny.github.io/Homepage/akiya-pocket/control-center/:splat 302' dist/_redirects

      - name: Deploy Cloudflare Pages
        if: steps.mode.outputs.deploy == 'true'
        id: pages_deploy
        env:
          PROJECT: ${{ steps.project.outputs.name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$SOURCE_SHA" --commit-message 'Akiya Pocket production deployment'

      - name: Verify stable live public site and artifact parity
        id: verify
        env:
          ORIGIN: ${{ steps.project.outputs.origin }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api
          PAY: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-payment-api
        shell: bash
        run: |
          set -euo pipefail

          check_sweep() {
            local sweep="$1"
            local mismatches=0
            local marker="$RUNNER_TEMP/deployment-$sweep.json"
            if ! curl -fsSL --max-time 20 "$ORIGIN/DEPLOYMENT.json?parity=$GITHUB_RUN_ID-$sweep-marker" -o "$marker"; then
              echo 'LIVE_MISSING DEPLOYMENT.json'
              return 1
            fi
            if ! jq -e --arg o "$ORIGIN" --arg s "$SOURCE_SHA" '.canonicalOrigin==$o and .build=="2026-08-21-cloudflare-pages-r1" and .sourceSha==$s' "$marker" >/dev/null; then
              echo 'LIVE_MISMATCH DEPLOYMENT.json metadata'
              return 1
            fi

            while IFS= read -r -d '' file; do
              rel=${file#dist/}
              case "$rel" in _headers|_redirects|DEPLOYMENT.json) continue;; esac
              tmp=$(mktemp)
              if ! curl -fsSL --max-time 30 "$ORIGIN/$rel?parity=$GITHUB_RUN_ID-$sweep" -o "$tmp"; then
                echo "LIVE_MISSING $rel"
                mismatches=$((mismatches+1))
              elif ! cmp -s "$file" "$tmp"; then
                echo "LIVE_MISMATCH $rel"
                mismatches=$((mismatches+1))
              fi
              rm -f "$tmp"
            done < <(find dist -type f -print0)
            test "$mismatches" = 0
          }

          consecutive=0
          for attempt in $(seq 1 12); do
            echo "Parity sweep $attempt"
            if check_sweep "$attempt"; then
              consecutive=$((consecutive+1))
              echo "Clean sweep $consecutive/2"
            else
              consecutive=0
            fi
            if [ "$consecutive" -ge 2 ]; then break; fi
            sleep 5
          done
          test "$consecutive" -ge 2

          curl -fsSL --max-time 20 "$ORIGIN/?v=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/home"
          grep -Fq '空家ポケット' "$RUNNER_TEMP/home"
          grep -Fq "<link rel=\"canonical\" href=\"${ORIGIN}/\">" "$RUNNER_TEMP/home"

          curl -fsSL -H "Origin: $ORIGIN" "$API" -o "$RUNNER_TEMP/api.json"
          jq -e '.ok==true and .ready==true and .accountDeletionAnonymizes==true' "$RUNNER_TEMP/api.json" >/dev/null
          curl -fsSL -H "Origin: $ORIGIN" "$PAY" -o "$RUNNER_TEMP/pay.json"
          jq -e '.ok==true and .ready==true and .amountJpy==3480 and .paymentLinkReady==true' "$RUNNER_TEMP/pay.json" >/dev/null

          curl -fsSI "$ORIGIN/control-center/" -o "$RUNNER_TEMP/admin-redirect-headers.txt"
          tr -d '\r' < "$RUNNER_TEMP/admin-redirect-headers.txt" > "$RUNNER_TEMP/admin-redirect-headers-normalized.txt"
          grep -Eiq '^HTTP/[0-9.]+ 30[12378]' "$RUNNER_TEMP/admin-redirect-headers-normalized.txt"
          grep -Eiq '^location:[[:space:]]*https://nknkny\.github\.io/Homepage/akiya-pocket/control-center/?[[:space:]]*$' "$RUNNER_TEMP/admin-redirect-headers-normalized.txt"

      - name: Report stage1 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: ${{ steps.project.outputs.origin }}
          PROJECT: ${{ steps.project.outputs.name }}
          MODE: ${{ steps.mode.outputs.name }}
          AUTH: ${{ steps.auth.outcome }}
          DEPLOY: ${{ steps.pages_deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = verify ]; then
            if [ "$VERIFY" = success ]; then overall=PASS; else overall=FAIL; fi
          else
            if [ "$AUTH" = success ] && [ "$DEPLOY" = success ] && [ "$VERIFY" = success ]; then overall=PASS; else overall=FAIL; fi
          fi
          body=$(jq -n --arg o "$overall" --arg m "$MODE" --arg u "$ORIGIN" --arg p "$PROJECT" --arg r "$GITHUB_RUN_ID" --arg a "$AUTH" --arg d "$DEPLOY" --arg v "$VERIFY" --arg s "$SOURCE_SHA" '{body:("AKIYA_CF_STAGE1="+$o+"\nMODE="+$m+"\nRUN_ID="+$r+"\nSOURCE_SHA="+$s+"\nPROJECT="+$p+"\nURL="+$u+"/\nAUTH="+$a+"\nDEPLOY="+$d+"\nPUBLIC_VERIFY="+$v)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
