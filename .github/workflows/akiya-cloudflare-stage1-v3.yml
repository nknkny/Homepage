name: Akiya Cloudflare stage1 v3

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: github.event.issue.number == 42 && contains(github.event.comment.body, 'START_AKIYA_CF_STAGE1_V3')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Cloudflare device authorization
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-login.log"
          clean="$RUNNER_TEMP/wrangler-login-clean.log"
          : > "$log"
          (CI='' npx --yes wrangler@4.119.0 login --device --browser=false >"$log" 2>&1) &
          pid=$!
          url=''; code=''
          for n in $(seq 1 240); do
            perl -pe 's/\e\[[0-9;]*[mK]//g' "$log" > "$clean" || true
            url=$(grep -Eo 'https://dash\.cloudflare\.com/oauth2/device/verify' "$clean" | tail -1 || true)
            code=$(grep -E '^[[:space:]]*[A-Za-z0-9]{8}[[:space:]]*$' "$clean" | tr -d '[:space:]' | tail -1 || true)
            if [ -n "$url" ] && [ -n "$code" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ -z "$url" ] || [ -z "$code" ]; then
            cat "$clean" || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          body=$(jq -n --arg url "$url" --arg code "$code" --arg run "$GITHUB_RUN_ID" '{body:("AKIYA_CF_AUTH_NOW\nVERIFY_URL="+$url+"\nCODE="+$code+"\nRUN_ID="+$run)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
          wait "$pid"

      - name: Resolve canonical Pages project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          origin=$(tr -d '[:space:]' < akiya-pocket/CLOUDFLARE_CANONICAL.txt)
          case "$origin" in https://*.pages.dev) ;; *) echo "Invalid canonical Pages origin: $origin" >&2; exit 1;; esac
          project=$(node -e 'const u=new URL(process.argv[1]); console.log(u.hostname.replace(/\.pages\.dev$/,""))' "$origin")
          test -n "$project"
          echo "name=$project" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Build Cloudflare Pages artifact
        env:
          AKIYA_CANONICAL_ORIGIN: ${{ steps.project.outputs.origin }}
          AKIYA_DEPLOYMENT_URL: ${{ steps.project.outputs.origin }}
        run: node scripts/build-akiya-cloudflare-pages.mjs

      - name: Validate artifact
        env:
          ORIGIN: ${{ steps.project.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "<link rel=\"canonical\" href=\"${ORIGIN}/\">" dist/index.html
          grep -Fq "SITE_ORIGIN: \"${ORIGIN}\"" dist/assets/config.js
          ! grep -R -F 'https://nknkny.github.io/Homepage/akiya-pocket' dist --include='*.html' --include='*.js' --include='*.xml' --include='*.txt'
          ! grep -Fq '"telephone":' dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/DEPLOYMENT.json
          test ! -d dist/control-center
          grep -Fq '/control-center/* https://nknkny.github.io/Homepage/akiya-pocket/control-center/:splat 302' dist/_redirects

      - name: Deploy Cloudflare Pages
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message 'Akiya Pocket production deployment'

      - name: Verify live public site and exact artifact parity
        id: verify
        env:
          ORIGIN: ${{ steps.project.outputs.origin }}
          API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api
          PAY: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-payment-api
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 40); do
            if curl -fsSL --max-time 20 "$ORIGIN/?v=$GITHUB_RUN_ID-$n" -o "$RUNNER_TEMP/home" && grep -Fq '空家ポケット' "$RUNNER_TEMP/home" && grep -Fq "<link rel=\"canonical\" href=\"${ORIGIN}/\">" "$RUNNER_TEMP/home"; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1

          curl -fsSL "$ORIGIN/DEPLOYMENT.json?v=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/deployment.json"
          jq -e --arg o "$ORIGIN" '.canonicalOrigin==$o and .build=="2026-08-21-cloudflare-pages-r1"' "$RUNNER_TEMP/deployment.json" >/dev/null
          curl -fsSL -H "Origin: $ORIGIN" "$API" -o "$RUNNER_TEMP/api.json"
          jq -e '.ok==true and .ready==true and .buildVersion=="2026-08-14-legal-final-r10"' "$RUNNER_TEMP/api.json" >/dev/null
          curl -fsSL -H "Origin: $ORIGIN" "$PAY" -o "$RUNNER_TEMP/pay.json"
          jq -e '.ok==true and .ready==true and .amountJpy==3480 and .paymentLinkReady==true' "$RUNNER_TEMP/pay.json" >/dev/null

          curl -fsSI "$ORIGIN/control-center/" -o "$RUNNER_TEMP/admin-redirect-headers.txt"
          tr -d '\r' < "$RUNNER_TEMP/admin-redirect-headers.txt" > "$RUNNER_TEMP/admin-redirect-headers-normalized.txt"
          grep -Eiq '^HTTP/[0-9.]+ 30[12378]' "$RUNNER_TEMP/admin-redirect-headers-normalized.txt"
          grep -Eiq '^location:[[:space:]]*https://nknkny\.github\.io/Homepage/akiya-pocket/control-center/?[[:space:]]*$' "$RUNNER_TEMP/admin-redirect-headers-normalized.txt"

          mismatches=0
          while IFS= read -r -d '' file; do
            rel=${file#dist/}
            case "$rel" in _headers|_redirects) continue;; esac
            tmp=$(mktemp)
            if ! curl -fsSL --max-time 30 "$ORIGIN/$rel?parity=$GITHUB_RUN_ID" -o "$tmp"; then
              echo "LIVE_MISSING $rel"
              mismatches=$((mismatches+1))
            elif ! cmp -s "$file" "$tmp"; then
              echo "LIVE_MISMATCH $rel"
              mismatches=$((mismatches+1))
            fi
            rm -f "$tmp"
          done < <(find dist -type f -print0)
          test "$mismatches" = 0

      - name: Report stage1 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: ${{ steps.project.outputs.origin }}
          PROJECT: ${{ steps.project.outputs.name }}
          AUTH: ${{ steps.auth.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTH" = success ] && [ "$VERIFY" = success ]; then overall=PASS; else overall=FAIL; fi
          body=$(jq -n --arg o "$overall" --arg u "$ORIGIN" --arg p "$PROJECT" --arg r "$GITHUB_RUN_ID" --arg a "$AUTH" --arg v "$VERIFY" --arg s "$GITHUB_SHA" '{body:("AKIYA_CF_STAGE1_DEPLOY="+$o+"\nRUN_ID="+$r+"\nSOURCE_SHA="+$s+"\nPROJECT="+$p+"\nURL="+$u+"/\nAUTH="+$a+"\nPUBLIC_VERIFY="+$v)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
