name: Google Apps Script Final Owner Recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OWNER_EMAIL: jmdjdtdjdt@gmail.com
      OLD_PROJECT_KEY: Mr8jtt7g-n-GmM5Z7OVWja83LjTh8Dp91
      DEPLOYMENT_ID: AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w
      EXPECTED_BUILD: 2026-08-06-insurance-optional
      SPREADSHEET_ID: 12nRr3Fkq8tYZWd-MQvdQXpeO9p9cGuT3CvtRnL_omw8
      API_URL: https://script.google.com/macros/s/AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w/exec
    steps:
      - name: Recover existing owner deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/gcli" @google/clasp@3.3.0 >/dev/null 2>&1
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"

          openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -subj "/CN=akiya-google-reuse-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1

          fifo="$RUNNER_TEMP/clasp-input"
          mkfifo "$fifo"
          exec 3<>"$fifo"
          "$CLASP" login --no-localhost --redirect-port 8888 <&3 >"$RUNNER_TEMP/login.log" 2>&1 &
          LOGIN_PID=$!

          auth_url=''
          for _ in $(seq 1 180); do
            auth_url=$(grep -Eo 'https://accounts\.google\.com/o/oauth2/v2/auth\?[^[:space:]]+' "$RUNNER_TEMP/login.log" | tail -1 || true)
            [ -n "$auth_url" ] && break
            sleep 1
          done
          test -n "$auth_url"
          auth_url="${auth_url}&login_hint=jmdjdtdjdt%40gmail.com&prompt=consent"

          cert_b64=$(base64 -w0 "$RUNNER_TEMP/cert.pem")
          prefix="GOOGLE_REUSE_CALLBACK_CMS_${GITHUB_RUN_ID}="
          body=$(jq -n --arg u "$auth_url" --arg c "$cert_b64" --arg r "$GITHUB_RUN_ID" --arg p "$prefix" \
            '{body:("GOOGLE_REUSE_AUTH_READY\nRUN_ID="+$r+"\nOWNER_REQUIRED=jmdjdtdjdt@gmail.com\nGOOGLE_AUTH_URL="+$u+"\nAUTH_CERT_B64="+$c+"\nCALLBACK_COMMENT_PREFIX="+$p)}')
          curl --retry 5 --retry-all-errors -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            -d "$body" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          echo 'AUTH_CHANNEL_READY=true'

          callback_enc=''
          for _ in $(seq 1 720); do
            : > "$RUNNER_TEMP/all-comments.ndjson"
            for page in $(seq 1 10); do
              out="$RUNNER_TEMP/comments-$page.json"
              if ! curl --retry 5 --retry-all-errors -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100&page=$page" -o "$out"; then
                continue
              fi
              count=$(jq 'length' "$out" 2>/dev/null || echo 0)
              [ "$count" -eq 0 ] && break
              jq -c '.[]' "$out" >> "$RUNNER_TEMP/all-comments.ndjson"
              [ "$count" -lt 100 ] && break
            done
            callback_enc=$(jq -rs --arg p "$prefix" '[.[]|.body|select(startswith($p))|.[($p|length):]][-1] // empty' "$RUNNER_TEMP/all-comments.ndjson")
            [ -n "$callback_enc" ] && break
            sleep 2
          done
          test -n "$callback_enc"

          printf '%s' "$callback_enc" | base64 -d > "$RUNNER_TEMP/callback.cms"
          openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/callback.cms" \
            -recip "$RUNNER_TEMP/cert.pem" -inkey "$RUNNER_TEMP/key.pem" \
            -out "$RUNNER_TEMP/callback.txt" >/dev/null 2>&1
          callback_url=$(cat "$RUNNER_TEMP/callback.txt")
          case "$callback_url" in http://localhost:8888*|http://127.0.0.1:8888*) ;; *) echo INVALID_CALLBACK; exit 1;; esac
          printf '%s\n' "$callback_url" >&3
          wait "$LOGIN_PID"
          exec 3>&-

          "$CLASP" show-authorized-user --json > "$RUNNER_TEMP/user.json"
          cat "$RUNNER_TEMP/user.json"
          python - "$RUNNER_TEMP/user.json" "$OWNER_EMAIL" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('loggedIn') is True,p
          assert (p.get('email') or '').lower()==sys.argv[2].lower(),p
          print('OWNER_ACCOUNT_MATCH=PASS')
          PY

          "$CLASP" --json list-scripts --noShorten > "$RUNNER_TEMP/scripts.json" 2> "$RUNNER_TEMP/list.err" || true
          cat "$RUNNER_TEMP/scripts.json" 2>/dev/null || true
          cat "$RUNNER_TEMP/list.err" 2>/dev/null || true

          mapfile -t ids < <(python - "$RUNNER_TEMP/scripts.json" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: d=[]
          if not isinstance(d,list): d=[]
          exact=[x for x in d if x.get('name')=='空き家レスキュー会員管理']
          likely=exact or [x for x in d if '空き家レスキュー' in (x.get('name') or '')]
          for x in (likely or d):
              if x.get('id'): print(x['id'])
          PY
          )
          ids+=("$OLD_PROJECT_KEY")

          chosen_dir=''
          seen='|'
          for sid in "${ids[@]}"; do
            [[ "$seen" == *"|$sid|"* ]] && continue
            seen+="$sid|"
            d="$RUNNER_TEMP/candidate-${#seen}"
            mkdir -p "$d"
            if (cd "$d" && "$CLASP" --json clone-script "$sid" >clone.json 2>clone.err); then
              echo "CLONE_OK=$sid"
              if grep -RFl --exclude='.clasp.json' "$EXPECTED_BUILD" "$d" >/dev/null 2>&1 && \
                 grep -RFl --exclude='.clasp.json' "$SPREADSHEET_ID" "$d" >/dev/null 2>&1 && \
                 (cd "$d" && "$CLASP" --json list-deployments >deployments.json 2>deployments.err) && \
                 grep -Fq "$DEPLOYMENT_ID" "$d/deployments.json"; then
                chosen_dir="$d"
                echo 'VALIDATED_PROJECT_AND_DEPLOYMENT=PASS'
                break
              fi
            else
              echo "CLONE_FAIL=$sid"
              cat "$d/clone.err" || true
            fi
          done
          test -n "$chosen_dir"

          cd "$chosen_dir"
          "$CLASP" update-deployment "$DEPLOYMENT_ID" --description 'Production recovery 2026-08-07' --json > "$RUNNER_TEMP/deploy.json"
          cat "$RUNNER_TEMP/deploy.json"
          grep -Fq "$DEPLOYMENT_ID" "$RUNNER_TEMP/deploy.json"

          curl --fail --silent --show-error --location --max-time 30 "$API_URL?recovery=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.json"
          cat "$RUNNER_TEMP/live.json"
          python - "$RUNNER_TEMP/live.json" "$EXPECTED_BUILD" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('buildVersion')==sys.argv[2],p
          assert p.get('app')=='空き家レスキュー会員管理',p
          assert p.get('ready') is True,p
          print('APPS_SCRIPT_PRODUCTION_RECOVERY=PASS')
          PY
