name: Akiya acquisition predeploy validation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.issue.number == 42 && contains(github.event.comment.body, 'VALIDATE_AKIYA_ACQUISITION_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git log -1 --format=%H -- akiya-pocket scripts/build-akiya-cloudflare-pages.mjs)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          AKIYA_CANONICAL_ORIGIN: https://akiya-pocket-aomori.pages.dev
          AKIYA_DEPLOYMENT_URL: https://akiya-pocket-aomori.pages.dev
          AKIYA_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/build-akiya-cloudflare-pages.mjs
      - name: Validate
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg s "$SOURCE_SHA" '.build=="2026-08-31-acquisition-r3" and .sourceSha==$s and .canonicalOrigin=="https://akiya-pocket-aomori.pages.dev"' dist/DEPLOYMENT.json >/dev/null
          test -f dist/assets/navigation-r1.css
          grep -Fq 'assets/navigation-r1.css' dist/index.html
          grep -Fq '新規無料会員登録' dist/index.html
          grep -Fq '現地確認を依頼する' dist/index.html
          grep -Fq '登録なしで無料チェック' dist/index.html
          grep -Fq '先に報告見本を見る' dist/index.html
          grep -Fq 'data-akiya-intent="request"' dist/index.html
          grep -Fq 'og:title' dist/index.html
          grep -Fq '空き家の取得は「相続」が57.9%' dist/index.html
          grep -Fq '青森市は全域が特別豪雪地帯' dist/index.html
          grep -Fq 'display:inline-flex!important' dist/assets/navigation-r1.css
          test ! -d dist/control-center

          # Every existing public URL is a compatibility contract.
          while IFS= read -r path; do
            case "$path" in ''|'#'*) continue ;; esac
            test -f "dist/$path" || { echo "PUBLIC_URL_MISSING=$path"; exit 1; }
          done < akiya-pocket/PUBLIC_URLS.txt

          # High-intent life-event pages must participate in the full attribution funnel.
          for page in \
            remote-home-aomori.html \
            inherited-home-aomori.html \
            parent-facility-home-aomori.html \
            vacant-home-notice-aomori.html \
            vacant-home-weeds-aomori.html \
            vacant-home-after-storm-aomori.html \
            snow-vacant-home-aomori.html; do
            grep -Fq 'assets/config.js' "dist/$page"
            grep -Fq 'assets/api.js' "dist/$page"
            grep -Fq 'assets/site.js' "dist/$page"
          done

          # A visible "free checklist" promise must never silently route to membership registration.
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class AnchorAudit(HTMLParser):
              def __init__(self, path):
                  super().__init__(); self.path=path; self.href=''; self.text=[]; self.in_a=False; self.bad=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='a':
                      self.in_a=True; self.text=[]; self.href=dict(attrs).get('href','')
              def handle_data(self, data):
                  if self.in_a: self.text.append(data)
              def handle_endtag(self, tag):
                  if tag=='a' and self.in_a:
                      label=''.join(self.text).strip().replace('\n',' ')
                      if self.href.startswith('register.html') and any(x in label for x in ('無料チェックリスト','登録なしで無料チェック','無料チェックを使う')):
                          self.bad.append((label,self.href))
                      self.in_a=False; self.text=[]; self.href=''

          failures=[]
          for p in Path('dist').glob('*.html'):
              a=AnchorAudit(p.name); a.feed(p.read_text(encoding='utf-8'))
              failures.extend((p.name,*x) for x in a.bad)
          if failures:
              for f in failures: print('CTA_SEMANTIC_MISMATCH', *f)
              raise SystemExit(1)
          PY
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          if [ "${{ job.status }}" = success ]; then result=PASS; else result=FAIL; fi
          body=$(jq -n --arg r "$result" --arg run "$GITHUB_RUN_ID" --arg s "$SOURCE_SHA" '{body:("AKIYA_ACQUISITION_VALIDATE="+$r+"\nRUN_ID="+$run+"\nSOURCE_SHA="+$s)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
