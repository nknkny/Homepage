name: Event Platform Production Check

on:
  push:
    branches: [main]
    paths:
      - 'event-platform/**'
      - '.github/workflows/event-platform-autopilot.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-platform-production-check
  cancel-in-progress: true

env:
  SITE_URL: https://nknkny.github.io/Homepage/event-platform/
  API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/event-platform-api
  WEBHOOK_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/event-platform-stripe-webhook

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Static security and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check event-platform/app.js
          node --check event-platform/billing.js
          grep -Fq '2026-08-15-supabase-v2' event-platform/app.js
          grep -Fq '2026-08-15-paid-ui-v2' event-platform/billing.js
          grep -Fq 'Content-Security-Policy' event-platform/index.html
          grep -Fq 'Pro 30日パス' event-platform/index.html
          grep -Fq '1,980円' event-platform/index.html
          grep -Fq '自動更新なし' event-platform/index.html
          grep -Fq '利用規約' event-platform/terms.html
          grep -Fq 'プライバシーポリシー' event-platform/privacy.html
          grep -Fq '特定商取引法に基づく表記' event-platform/tokusho.html
          grep -Fq '1,980円（税込）' event-platform/tokusho.html
          grep -Fq '自動更新' event-platform/tokusho.html
          ! grep -R -E 'sk_(live|test)_[A-Za-z0-9]+' event-platform .github/workflows/event-platform-autopilot.yml
          ! grep -R -E 'sb_secret_[A-Za-z0-9_-]+' event-platform .github/workflows/event-platform-autopilot.yml
          ! grep -R -E 'whsec_[A-Za-z0-9]+' event-platform .github/workflows/event-platform-autopilot.yml
          ! grep -R -F 'HUSR0MdzDglXbAQ9lD9R8sJrECAIr9kGo_TNJ3iTjX8' event-platform .github/workflows/event-platform-autopilot.yml
          ! grep -Fq 'firebase' event-platform/index.html
          ! grep -Fq 'firebase' event-platform/app.js

      - name: Verify paid API and public read
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$API_URL?action=health" -o /tmp/api-health.json
          grep -Fq '"ok":true' /tmp/api-health.json
          grep -Fq '2026-08-15-paid-v1' /tmp/api-health.json
          grep -Fq 'pro_30d' /tmp/api-health.json
          curl --fail --silent --show-error --max-time 30 "$API_URL?action=public_listings" -o /tmp/public-listings.json
          grep -Fq '"ok":true' /tmp/public-listings.json
          curl --fail --silent --show-error --max-time 30 -X OPTIONS \
            -H 'Origin: https://nknkny.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            "$API_URL?action=bootstrap" -D /tmp/cors-headers.txt -o /tmp/cors-body.txt
          grep -Fiq 'access-control-allow-origin: https://nknkny.github.io' /tmp/cors-headers.txt
          code=$(curl --silent --show-error --max-time 30 -o /tmp/webhook-denied.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$WEBHOOK_URL")
          test "$code" = "403"

      - name: Verify published paid site
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            code=$(curl --silent --show-error --location --max-time 30 -o /tmp/site.html -w '%{http_code}' "$SITE_URL?run=$GITHUB_RUN_ID" || true)
            if [ "$code" = "200" ] && grep -Fq 'Pro 30日パス' /tmp/site.html && grep -Fq '1,980円' /tmp/site.html; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"
          for file in app.js billing.js styles.css billing.css terms.html privacy.html tokusho.html; do
            curl --fail --silent --show-error --location --max-time 30 "${SITE_URL}${file}?run=$GITHUB_RUN_ID" -o "/tmp/${file//\//_}"
          done
          grep -Fq '2026-08-15-supabase-v2' /tmp/app.js
          grep -Fq '2026-08-15-paid-ui-v2' /tmp/billing.js
          grep -Fq '利用規約' /tmp/terms.html
          grep -Fq '利用目的' /tmp/privacy.html
          grep -Fq '1,980円（税込）' /tmp/tokusho.html
          ! grep -E 'whsec_|sk_live_|sb_secret_' /tmp/billing.js /tmp/site.html

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-platform-production-evidence-${{ github.run_id }}
          path: |
            /tmp/api-health.json
            /tmp/public-listings.json
            /tmp/cors-headers.txt
            /tmp/webhook-denied.json
            /tmp/site.html
            /tmp/app.js
            /tmp/billing.js
            /tmp/terms.html
            /tmp/privacy.html
            /tmp/tokusho.html
          if-no-files-found: ignore
          retention-days: 14
