name: Event Platform Production Check

on:
  push:
    branches: [main]
    paths:
      - 'event-platform/**'
      - '.github/workflows/event-platform-autopilot.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-platform-production-check
  cancel-in-progress: true

env:
  SITE_URL: https://nknkny.github.io/Homepage/event-platform/
  API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/event-platform-api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Static security and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check event-platform/app.js
          grep -Fq '2026-08-15-supabase-v2' event-platform/app.js
          grep -Fq 'Content-Security-Policy' event-platform/index.html
          grep -Fq 'fpgtwgtoqtokpitzlbie.supabase.co' event-platform/index.html
          ! grep -Fq 'firebase' event-platform/index.html
          ! grep -Fq 'firebase' event-platform/app.js
          ! grep -Eq 'sk_(live|test)_[A-Za-z0-9]+' event-platform/app.js
          ! grep -Eq 'sb_secret_[A-Za-z0-9_-]+' event-platform/app.js

      - name: Verify Supabase API health and public read
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$API_URL?action=health" -o /tmp/api-health.json
          grep -Fq '"ok":true' /tmp/api-health.json
          grep -Fq '2026-08-15-supabase-v1' /tmp/api-health.json
          curl --fail --silent --show-error --max-time 30 "$API_URL?action=public_listings" -o /tmp/public-listings.json
          grep -Fq '"ok":true' /tmp/public-listings.json
          curl --fail --silent --show-error --max-time 30 -X OPTIONS \
            -H 'Origin: https://nknkny.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            "$API_URL?action=bootstrap" -D /tmp/cors-headers.txt -o /tmp/cors-body.txt
          grep -Fiq 'access-control-allow-origin: https://nknkny.github.io' /tmp/cors-headers.txt

      - name: Verify published site
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            code=$(curl --silent --show-error --location --max-time 30 -o /tmp/site.html -w '%{http_code}' "$SITE_URL?run=$GITHUB_RUN_ID" || true)
            if [ "$code" = "200" ] && grep -Fq 'イベントと、必要な資源を' /tmp/site.html; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"
          curl --fail --silent --show-error --location --max-time 30 "${SITE_URL}app.js?run=$GITHUB_RUN_ID" -o /tmp/app.js
          curl --fail --silent --show-error --location --max-time 30 "${SITE_URL}styles.css?run=$GITHUB_RUN_ID" -o /tmp/styles.css
          grep -Fq '2026-08-15-supabase-v2' /tmp/app.js
          ! grep -Fq 'firebase' /tmp/app.js

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-platform-production-evidence-${{ github.run_id }}
          path: |
            /tmp/api-health.json
            /tmp/public-listings.json
            /tmp/cors-headers.txt
            /tmp/site.html
            /tmp/app.js
            /tmp/styles.css
          if-no-files-found: ignore
          retention-days: 14
