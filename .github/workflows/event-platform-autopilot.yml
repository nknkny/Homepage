name: Event Platform Live Check

on:
  push:
    branches: [main]
    paths:
      - 'event-platform/**'
      - '.github/workflows/event-platform-autopilot.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-platform-live-check
  cancel-in-progress: true

env:
  PREVIEW_URL: https://nknkny.github.io/Homepage/event-platform/
  API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/localspace-api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Static UI and JavaScript checks
        shell: bash
        run: |
          set -euo pipefail
          for file in event-platform/app.js event-platform/app-data.js event-platform/app-render.js event-platform/app-form.js event-platform/app-dashboard.js event-platform/app-init.js; do
            node --check "$file"
          done
          test -f event-platform/enterprise.css
          grep -Fq 'enterprise-search' event-platform/enterprise.css
          grep -Fq 'installEnterpriseDiscovery' event-platform/app-init.js
          grep -Fq 'enterpriseSearchBtn' event-platform/app-init.js
          grep -Fq 'dateRangeForPreset' event-platform/app-render.js
          grep -Fq 'noindex,nofollow,noarchive' event-platform/index.html
          grep -Fq '開発プレビュー' event-platform/index.html
          grep -Fq 'イベントを探したい' event-platform/index.html
          grep -Fq 'イベントを開きたい' event-platform/index.html
          grep -Fq '場所を貸したい' event-platform/index.html
          grep -Fq 'homeEventGrid' event-platform/index.html
          grep -Fq '開催場所と企画を探す' event-platform/index.html
          grep -Fq '予約・契約・決済・成功報酬は停止中' event-platform/index.html
          for id in storageStatus storageNote healthBtn prefectureFilter municipalityFilter q categoryFilter sort searchBtn resetSearchBtn loadMoreBtn calendarPrefecture calendarMunicipality calendarQ calendarCategory calendarSearchBtn calendarList postForm postType editId convertedFromId title prefecture municipality areaDetail category description dateStart dateEnd availableFrom availableTo capacity sizeSqm priceAmount budgetMax placeName eventPrice spaceKind indoorOutdoor allowedUses prohibitedUses tags contactUrl images imagePreview existingImages imageRightsConfirmed spaceAuthority spaceInfoOnly temporaryUseOnly eventRightsConfirmed promoOptIn terms validationBox submitBtn resetBtn identityBox mineGrid recommendationGrid notificationList markReadBtn exportBtn importBtn importFile favGrid modal modalClose modalBody toast; do
            grep -Fq "id=\"$id\"" event-platform/index.html || { echo "missing DOM id: $id"; exit 1; }
          done
          test -f event-platform/terms.html
          test -f event-platform/privacy.html
          test -f event-platform/legal-boundaries.html
          ! grep -R -E 'sk_(live|test)_[A-Za-z0-9]+' event-platform
          ! grep -R -E 'sb_secret_[A-Za-z0-9_-]+' event-platform
          ! grep -R -E 'whsec_[A-Za-z0-9]+' event-platform

      - name: Verify current API safety scope
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$API_URL?action=health" -o /tmp/api-health.json
          cat /tmp/api-health.json
          jq -e '.ok==true' /tmp/api-health.json
          jq -e '.structuredGeography==true and .serverKeywordSearch==true and .cityStats==true and .imageSignatureValidation==true and .accountDeletion==true' /tmp/api-health.json
          jq -e '.commercialPayments==false and .successFee==false and .booking==false and .privateMessaging==false and .employmentMatching==false and .realEstateBrokerage==false and .underlyingPayments==false' /tmp/api-health.json
          curl --fail --silent --show-error --max-time 30 "$API_URL?action=public_listings&prefecture=%E9%9D%92%E6%A3%AE%E7%9C%8C&municipality=%E9%9D%92%E6%A3%AE%E5%B8%82&limit=5&offset=0" -o /tmp/public-listings.json
          jq -e '.ok==true' /tmp/public-listings.json
          jq -e 'all(.listings[]?; (.type=="space" or .type=="want" or .type=="event"))' /tmp/public-listings.json

      - name: Verify GitHub Pages deployment
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            code=$(curl --silent --show-error --location --max-time 30 -o /tmp/site.html -w '%{http_code}' "$PREVIEW_URL?run=$GITHUB_RUN_ID-$i" || true)
            if [ "$code" = "200" ] && grep -Fq 'イベントを見つける。' /tmp/site.html && grep -Fq 'イベントを開きたい' /tmp/site.html && grep -Fq '場所を貸したい' /tmp/site.html && grep -Fq 'noindex,nofollow,noarchive' /tmp/site.html; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"
          for file in styles.css enterprise.css app.js app-data.js app-render.js app-form.js app-dashboard.js app-init.js terms.html privacy.html legal-boundaries.html; do
            curl --fail --silent --show-error --location --max-time 30 "${PREVIEW_URL}${file}?run=$GITHUB_RUN_ID" -o "/tmp/${file//\//_}"
          done
          grep -Fq 'journey-grid' /tmp/styles.css
          grep -Fq 'enterprise-search' /tmp/enterprise.css
          grep -Fq 'installEnterpriseDiscovery' /tmp/app-init.js
          grep -Fq 'enterpriseSearchBtn' /tmp/app-init.js
          grep -Fq 'dateRangeForPreset' /tmp/app-render.js
          grep -Fq 'renderHomeEvents' /tmp/app-render.js
          grep -Fq 'data-quick-post' /tmp/site.html

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-platform-live-evidence-${{ github.run_id }}
          path: |
            /tmp/api-health.json
            /tmp/public-listings.json
            /tmp/site.html
            /tmp/styles.css
            /tmp/enterprise.css
            /tmp/app.js
            /tmp/app-data.js
            /tmp/app-render.js
            /tmp/app-form.js
            /tmp/app-dashboard.js
            /tmp/app-init.js
          if-no-files-found: ignore
          retention-days: 14