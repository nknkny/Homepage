name: Event Platform Core Market Check

on:
  push:
    branches: [main]
    paths:
      - 'event-platform/**'
      - '.github/workflows/event-platform-autopilot.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-platform-core-market-check
  cancel-in-progress: true

env:
  PREVIEW_URL: https://nknkny.github.io/Homepage/event-platform/
  API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/event-platform-api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Static product legal-scope and security checks
        shell: bash
        run: |
          set -euo pipefail
          node --check event-platform/app.js
          grep -Fq '2026-08-26-core-market-v2' event-platform/app.js
          grep -Fq 'noindex,nofollow,noarchive' event-platform/index.html
          grep -Fq '開発プレビュー' event-platform/index.html
          grep -Fq '正式公開前・料金・予約・決済機能は停止中' event-platform/index.html
          grep -Fq '場所を貸したい' event-platform/index.html
          grep -Fq '場所を探している' event-platform/index.html
          grep -Fq 'イベントカレンダー' event-platform/index.html
          grep -Fq '掲載権限' event-platform/index.html
          grep -Fq '成功報酬' event-platform/legal-boundaries.html
          grep -Fq '宅地建物取引業法' event-platform/legal-boundaries.html
          grep -Fq '利用規約' event-platform/terms.html
          grep -Fq 'プライバシーポリシー' event-platform/privacy.html
          test -f event-platform/LEGAL_RESEARCH.md
          test -f event-platform/STRATEGY.md
          ! grep -R -E 'buy\.stripe\.com|Pro 30日パス|1,980円' event-platform
          ! grep -Fq 'create_interest' event-platform/app.js
          ! grep -Fq 'request_action' event-platform/app.js
          ! grep -Fq 'prepare_pro_purchase' event-platform/app.js
          ! grep -E "promotion|'exhibitor'|'performer'|'contractor'" event-platform/app.js
          ! grep -E 'data-post-type="(promotion|exhibitor|performer|contractor)"' event-platform/index.html
          ! grep -R -E 'sk_(live|test)_[A-Za-z0-9]+' event-platform .github/workflows/event-platform-autopilot.yml
          ! grep -R -E 'sb_secret_[A-Za-z0-9_-]+' event-platform .github/workflows/event-platform-autopilot.yml
          ! grep -R -E 'whsec_[A-Za-z0-9]+' event-platform .github/workflows/event-platform-autopilot.yml

      - name: Verify API scope
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$API_URL?action=health" -o /tmp/api-health.json
          jq -e '.ok==true and .build=="2026-08-26-core-market-v2" and .businessModel=="free_information_matching"' /tmp/api-health.json
          jq -e '.listingTypes==["space","want","event"]' /tmp/api-health.json
          jq -e '.commercialPayments==false and .successFee==false and .booking==false and .privateMessaging==false and .employmentMatching==false and .realEstateBrokerage==false and .underlyingPayments==false' /tmp/api-health.json
          curl --fail --silent --show-error --max-time 30 "$API_URL?action=public_listings" -o /tmp/public-listings.json
          jq -e '.ok==true' /tmp/public-listings.json
          jq -e 'all(.listings[]?; (.type=="space" or .type=="want" or .type=="event"))' /tmp/public-listings.json

      - name: Core market API E2E and forbidden-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(cat /proc/sys/kernel/random/uuid)
          KEY=$(openssl rand -hex 32)
          IDS=()
          cleanup() {
            set +e
            for ID in "${IDS[@]:-}"; do
              [ -z "$ID" ] && continue
              curl -sS --max-time 20 -X POST \
                -H "x-owner-id: $OWNER" -H "x-owner-key: $KEY" -H 'Content-Type: application/json' \
                "$API_URL?action=delete_listing" -d "{\"id\":\"$ID\"}" >/dev/null
            done
          }
          trap cleanup EXIT
          H=(-H "x-owner-id: $OWNER" -H "x-owner-key: $KEY" -H 'Content-Type: application/json')
          curl --fail --silent --show-error --max-time 30 -X POST "${H[@]}" "$API_URL?action=bootstrap" -d '{}' -o /tmp/bootstrap.json
          jq -e '.ok==true' /tmp/bootstrap.json
          D1=$(date -u -d '+2 day' +%F)
          D2=$(date -u -d '+3 day' +%F)

          jq -n --arg d1 "$D1" --arg d2 "$D2" '{type:"space",title:"E2E 青森市の小さな店先スペース",area:"青森市",category:"ポップアップ・物販",description:"小規模なポップアップや展示に使える私有の店先スペースです。掲載権限を持つ者が登録している自動テストです。",availableFrom:$d1,availableTo:$d2,capacity:8,sizeSqm:12,priceAmount:1500,spaceKind:"店先・軒先",indoorOutdoor:"屋外",allowedUses:"物販、展示、小規模ワークショップ",prohibitedUses:"火気、大音量",tags:["小規模","物販"],contactUrl:"https://example.com/contact",spaceAuthority:true,spaceInfoOnly:true,termsAccepted:true}' >/tmp/space-in.json
          curl --fail --silent --show-error --max-time 30 -X POST "${H[@]}" "$API_URL?action=save_listing" --data-binary @/tmp/space-in.json -o /tmp/space-out.json
          SPACE_ID=$(jq -r '.listing.id' /tmp/space-out.json); test "$SPACE_ID" != null; IDS+=("$SPACE_ID")

          jq -n --arg d1 "$D1" '{type:"want",title:"E2E ハンドメイド販売の場所を探しています",area:"青森市",category:"ポップアップ・物販",description:"ハンドメイド作品を一日だけ販売するための小さな場所を探しています。来場は少人数を想定した自動テストです。",dateStart:$d1,dateEnd:$d1,capacity:5,budgetMax:2000,tags:["小規模","物販"],contactUrl:"https://example.com/organizer",temporaryUseOnly:true,termsAccepted:true}' >/tmp/want-in.json
          curl --fail --silent --show-error --max-time 30 -X POST "${H[@]}" "$API_URL?action=save_listing" --data-binary @/tmp/want-in.json -o /tmp/want-out.json
          WANT_ID=$(jq -r '.listing.id' /tmp/want-out.json); test "$WANT_ID" != null; IDS+=("$WANT_ID")

          jq -n --arg d1 "$D1" --arg wid "$WANT_ID" '{type:"event",title:"E2E 青森ミニポップアップ",area:"青森市",category:"ポップアップ・物販",description:"開催が決まった小さなハンドメイド販売イベントです。地域向けイベントカレンダー変換の自動テストです。",dateStart:$d1,dateEnd:$d1,placeName:"青森市内テスト会場",eventPrice:"入場無料",tags:["小規模","物販"],contactUrl:"https://example.com/event",eventRightsConfirmed:true,promoOptIn:true,convertedFromId:$wid,termsAccepted:true}' >/tmp/event-in.json
          curl --fail --silent --show-error --max-time 30 -X POST "${H[@]}" "$API_URL?action=save_listing" --data-binary @/tmp/event-in.json -o /tmp/event-out.json
          EVENT_ID=$(jq -r '.listing.id' /tmp/event-out.json); test "$EVENT_ID" != null; IDS+=("$EVENT_ID")
          jq -e --arg wid "$WANT_ID" '.listing.converted_from_id==$wid' /tmp/event-out.json

          jq -n '{type:"space",title:"E2E 無権限スペース",area:"青森市",category:"ポップアップ・物販",description:"権限確認なしの場所掲載を拒否するための自動テスト用として十分な文字数を確保しています。",spaceKind:"空き地",contactUrl:"https://example.com/x",spaceAuthority:false,spaceInfoOnly:true,termsAccepted:true}' >/tmp/bad-space-in.json
          code=$(curl -sS --max-time 30 -o /tmp/bad-space-out.json -w '%{http_code}' -X POST "${H[@]}" "$API_URL?action=save_listing" --data-binary @/tmp/bad-space-in.json)
          test "$code" = 422
          jq -e '.error=="MODERATION_REJECTED" and any(.errors[]; contains("掲載・利用許諾できる権限"))' /tmp/bad-space-out.json

          jq -n --arg d1 "$D1" --arg d2 "$D2" '{type:"want",title:"E2E 賃貸住宅を探しています",area:"青森市",category:"その他",description:"賃貸住宅として長期賃貸できる住居を探しています。入居者として使う想定の禁止境界自動テストです。",dateStart:$d1,dateEnd:$d2,contactUrl:"https://example.com/y",temporaryUseOnly:true,termsAccepted:true}' >/tmp/bad-long-in.json
          code=$(curl -sS --max-time 30 -o /tmp/bad-long-out.json -w '%{http_code}' -X POST "${H[@]}" "$API_URL?action=save_listing" --data-binary @/tmp/bad-long-in.json)
          test "$code" = 422
          jq -e 'any(.errors[]; contains("住居・長期賃貸用途"))' /tmp/bad-long-out.json

          jq -n --arg d1 "$D1" '{type:"event",title:"E2E スタッフ募集イベント",area:"青森市",category:"その他",description:"イベント当日のアルバイトを時給で募集するための禁止境界を確認する自動テスト用の説明です。",dateStart:$d1,dateEnd:$d1,placeName:"青森市",contactUrl:"https://example.com/z",eventRightsConfirmed:true,termsAccepted:true}' >/tmp/bad-job-in.json
          code=$(curl -sS --max-time 30 -o /tmp/bad-job-out.json -w '%{http_code}' -X POST "${H[@]}" "$API_URL?action=save_listing" --data-binary @/tmp/bad-job-in.json)
          test "$code" = 422
          jq -e 'any(.errors[]; contains("求人・求職"))' /tmp/bad-job-out.json

          code=$(curl -sS --max-time 30 -o /tmp/old-action.json -w '%{http_code}' -X POST "${H[@]}" "$API_URL?action=create_interest" -d '{}')
          test "$code" = 404

          curl --fail --silent --show-error --max-time 30 "$API_URL?action=public_listings" -o /tmp/public-after-e2e.json
          jq -e --arg s "$SPACE_ID" --arg w "$WANT_ID" --arg e "$EVENT_ID" '([.listings[].id] | index($s)) != null and ([.listings[].id] | index($w)) != null and ([.listings[].id] | index($e)) != null' /tmp/public-after-e2e.json

      - name: Verify development preview deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            code=$(curl --silent --show-error --location --max-time 30 -o /tmp/site.html -w '%{http_code}' "$PREVIEW_URL?run=$GITHUB_RUN_ID-$i" || true)
            if [ "$code" = "200" ] && grep -Fq '開発プレビュー' /tmp/site.html && grep -Fq '場所を貸したい' /tmp/site.html && grep -Fq 'イベントカレンダー' /tmp/site.html && grep -Fq 'noindex,nofollow,noarchive' /tmp/site.html; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"
          for file in app.js styles.css terms.html privacy.html legal-boundaries.html; do
            curl --fail --silent --show-error --location --max-time 30 "${PREVIEW_URL}${file}?run=$GITHUB_RUN_ID" -o "/tmp/${file//\//_}"
          done
          grep -Fq '2026-08-26-core-market-v2' /tmp/app.js
          grep -Fq '成功報酬' /tmp/legal-boundaries.html
          ! grep -E 'buy\.stripe\.com|Pro 30日パス|1,980円' /tmp/site.html /tmp/app.js

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-platform-core-market-evidence-${{ github.run_id }}
          path: |
            /tmp/api-health.json
            /tmp/public-listings.json
            /tmp/bootstrap.json
            /tmp/space-out.json
            /tmp/want-out.json
            /tmp/event-out.json
            /tmp/bad-space-out.json
            /tmp/bad-long-out.json
            /tmp/bad-job-out.json
            /tmp/old-action.json
            /tmp/site.html
            /tmp/app.js
            /tmp/terms.html
            /tmp/privacy.html
            /tmp/legal-boundaries.html
          if-no-files-found: ignore
          retention-days: 14
