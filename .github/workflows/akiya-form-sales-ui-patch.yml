name: Akiya Form Sales UI Patch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.number == 42 && contains(github.event.comment.body, 'RUN_AKIYA_FORM_SALES_UI_PATCH')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch only stale hard-coded module-count copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('akiya-pocket/control-center/index.html')
          s=p.read_text(encoding='utf-8')
          old1='「完全自動で全作業を開始」は10モジュールをすべてONにして一括開始します。'
          new1='「完全自動で全作業を開始」は全モジュール・全個別機能をONにして一括開始します。'
          old2='完全自動を開始しました。10モジュールすべてONで毎時継続処理します。'
          new2='完全自動を開始しました。全モジュール・全個別機能ONで毎時継続処理します。'
          if old1 not in s or old2 not in s:
              raise SystemExit('expected copy not found; aborting without changing unrelated code')
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit exact UI copy change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add akiya-pocket/control-center/index.html
          git diff --cached --check
          git commit -m 'fix: make full-auto copy dynamic for form sales module'
          git push origin HEAD:main
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          node - <<'NODE'
          const body={body:`AKIYA_FORM_SALES_UI_PATCH=${process.env.STATUS==='success'?'PASS':'FAIL'}`};
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/42/comments`,{method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'content-type':'application/json','accept':'application/vnd.github+json'},body:JSON.stringify(body)});
          if(!r.ok) throw new Error(`comment ${r.status}`);
          NODE
