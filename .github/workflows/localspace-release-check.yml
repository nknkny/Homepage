name: LocalSpace Release Gate

on:
  push:
    branches: [main]
    paths:
      - 'event-platform/**'
      - 'scripts/build-localspace-cloudflare-pages.mjs'
      - '.github/workflows/localspace-release-check.yml'
      - '.github/workflows/localspace-cloudflare-production.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: localspace-release-gate
  cancel-in-progress: true

env:
  API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/localspace-api
  PROD_ORIGIN: https://nknkny-localspace.pages.dev

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Static and production build checks
        shell: bash
        run: |
          set -euo pipefail
          for f in event-platform/app*.js; do node --check "$f"; done
          node --check scripts/build-localspace-cloudflare-pages.mjs
          grep -Fq "2026-08-27-ui-v4" event-platform/app.js
          grep -Fq 'noindex,nofollow,noarchive' event-platform/index.html
          grep -Fq '開発プレビュー' event-platform/index.html
          grep -Fq 'prefectureFilter' event-platform/index.html
          grep -Fq 'imageRightsConfirmed' event-platform/index.html
          grep -Fq '成功報酬' event-platform/legal-boundaries.html
          grep -Fq '180日' event-platform/privacy.html
          ! grep -R -E 'buy\.stripe\.com|Pro 30日パス|1,980円|create_interest|request_action|prepare_pro_purchase' event-platform
          ! grep -R -E 'sk_(live|test)_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+' event-platform scripts/build-localspace-cloudflare-pages.mjs
          LOCALSPACE_CANONICAL_ORIGIN="$PROD_ORIGIN" LOCALSPACE_SOURCE_SHA="$GITHUB_SHA" node scripts/build-localspace-cloudflare-pages.mjs
          grep -Fq 'index,follow,max-image-preview:large' dist-localspace/index.html
          ! grep -Fq 'noindex,nofollow' dist-localspace/index.html
          grep -Fq '<strong>無料公開版</strong>' dist-localspace/index.html
          grep -Fq "<link rel=\"canonical\" href=\"$PROD_ORIGIN/\">" dist-localspace/index.html
          grep -Fq 'Content-Security-Policy:' dist-localspace/_headers
          grep -Fq "Sitemap: $PROD_ORIGIN/sitemap.xml" dist-localspace/robots.txt
          jq -e --arg o "$PROD_ORIGIN" --arg s "$GITHUB_SHA" '.app=="localspace" and .canonicalOrigin==$o and .sourceSha==$s and .commercialPayments==false and .successFee==false' dist-localspace/DEPLOYMENT.json >/dev/null

      - name: API health and CORS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$API?action=health" -o /tmp/health.json
          jq -e '.ok==true and .build=="2026-08-27-localspace-api-v1" and .listingTypes==["space","want","event"] and .structuredGeography==true and .firstPartyAnalytics==true and .analyticsRetentionDays==180 and .images==true and .imageSignatureValidation==true and .accountDeletion==true and .serverKeywordSearch==true and .cityStats==true and .commercialPayments==false and .successFee==false and .booking==false and .privateMessaging==false and .employmentMatching==false and .realEstateBrokerage==false and .underlyingPayments==false' /tmp/health.json >/dev/null
          curl -fsSL -X OPTIONS -H 'Origin: https://nknkny.github.io' -H 'Access-Control-Request-Method: POST' "$API?action=bootstrap" -D /tmp/cors-gh.txt -o /dev/null
          grep -Fiq 'access-control-allow-origin: https://nknkny.github.io' /tmp/cors-gh.txt
          curl -fsSL -X OPTIONS -H "Origin: $PROD_ORIGIN" -H 'Access-Control-Request-Method: POST' "$API?action=bootstrap" -D /tmp/cors-cf.txt -o /dev/null
          grep -Fiq "access-control-allow-origin: $PROD_ORIGIN" /tmp/cors-cf.txt
          code=$(curl -sS -o /tmp/bad-origin.json -w '%{http_code}' -H 'Origin: https://evil.example' "$API?action=health")
          test "$code" = 403

      - name: Live API legal-boundary E2E
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(python - <<'PY'
          import uuid; print(uuid.uuid4())
          PY
          )
          KEY=$(openssl rand -hex 32)
          SID=$(python - <<'PY'
          import uuid; print(uuid.uuid4())
          PY
          )
          H=(-H "x-owner-id: $OWNER" -H "x-owner-key: $KEY" -H 'Content-Type: application/json')
          cleanup(){ curl -sS -X POST "${H[@]}" -d '{}' "$API?action=delete_account" >/dev/null || true; }
          trap cleanup EXIT
          curl -fsSL -X POST "${H[@]}" -d '{}' "$API?action=bootstrap" | jq -e '.ok==true' >/dev/null
          START=$(date -u -d '+7 days' +%F); END=$(date -u -d '+8 days' +%F)

          cat >/tmp/space.json <<JSON
          {"type":"space","title":"E2E 青森駅前の小さな店先","prefecture":"青森県","municipality":"青森市","areaDetail":"古川","category":"ポップアップ・物販","description":"自動テスト用の一時利用スペースです。物販や展示など小規模な催しを想定しています。","availableFrom":"$START","availableTo":"$END","capacity":10,"sizeSqm":6,"priceAmount":2000,"spaceKind":"店先・軒先","indoorOutdoor":"半屋外","allowedUses":"物販、展示","prohibitedUses":"火気不可","tags":["屋外","少人数"],"contactUrl":"https://example.com/contact","spaceAuthority":true,"spaceInfoOnly":true,"termsAccepted":true}
          JSON
          curl -fsSL -X POST "${H[@]}" --data-binary @/tmp/space.json "$API?action=save_listing" -o /tmp/space-out.json
          SPACE=$(jq -r '.listing.id' /tmp/space-out.json); test "$SPACE" != null

          cat >/tmp/want.json <<JSON
          {"type":"want","title":"E2E 小さな物販場所を探しています","prefecture":"青森県","municipality":"青森市","areaDetail":"青森駅周辺","category":"ポップアップ・物販","description":"自動テスト用の場所探しです。週末に少量の商品を販売できる一時利用場所を探しています。","dateStart":"$START","dateEnd":"$END","capacity":5,"budgetMax":5000,"tags":["屋外","少人数"],"contactUrl":"https://example.com/contact","temporaryUseOnly":true,"termsAccepted":true}
          JSON
          curl -fsSL -X POST "${H[@]}" --data-binary @/tmp/want.json "$API?action=save_listing" -o /tmp/want-out.json
          WANT=$(jq -r '.listing.id' /tmp/want-out.json); test "$WANT" != null

          jq --arg id "$WANT" --arg s "$START" --arg e "$END" '.type="event" | .title="E2E 開催決定ポップアップ" | .description="自動テスト用の開催決定イベントです。地域カレンダーへの変換動作を確認しています。" | .placeName="E2Eテスト会場" | .eventPrice="無料" | .eventRightsConfirmed=true | .promoOptIn=true | .convertedFromId=$id | .dateStart=$s | .dateEnd=$e | del(.temporaryUseOnly,.budgetMax)' /tmp/want.json >/tmp/event.json
          curl -fsSL -X POST "${H[@]}" --data-binary @/tmp/event.json "$API?action=save_listing" -o /tmp/event-out.json
          EVENT=$(jq -r '.listing.id' /tmp/event-out.json); test "$EVENT" != null
          jq -e --arg w "$WANT" '.listing.converted_from_id==$w' /tmp/event-out.json >/dev/null

          jq '.spaceAuthority=false' /tmp/space.json >/tmp/no-authority.json
          code=$(curl -sS -o /tmp/no-authority-out.json -w '%{http_code}' -X POST "${H[@]}" --data-binary @/tmp/no-authority.json "$API?action=save_listing")
          test "$code" = 422; grep -Fq '掲載・利用許諾できる権限' /tmp/no-authority-out.json

          jq '.description="住居として長期賃貸する人を探すための掲載です。これは自動拒否試験用の文章です。"' /tmp/want.json >/tmp/longterm.json
          code=$(curl -sS -o /tmp/longterm-out.json -w '%{http_code}' -X POST "${H[@]}" --data-binary @/tmp/longterm.json "$API?action=save_listing")
          test "$code" = 422; grep -Fq '長期賃貸' /tmp/longterm-out.json

          jq '.description="アルバイトを時給で募集する自動拒否試験用の掲載です。実際の求人ではありません。"' /tmp/want.json >/tmp/job.json
          code=$(curl -sS -o /tmp/job-out.json -w '%{http_code}' -X POST "${H[@]}" --data-binary @/tmp/job.json "$API?action=save_listing")
          test "$code" = 422; grep -Fq '求人・求職' /tmp/job-out.json

          FAKE=$(python - <<'PY'
          import base64; print(base64.b64encode(b'not-an-image'+b'x'*140).decode())
          PY
          )
          code=$(curl -sS -o /tmp/fake-img.json -w '%{http_code}' -X POST "${H[@]}" -d "{\"listingId\":\"$SPACE\",\"mime\":\"image/webp\",\"base64\":\"$FAKE\",\"rightsConfirmed\":true}" "$API?action=upload_image")
          test "$code" = 400; jq -e '.error=="BAD_IMAGE_SIGNATURE"' /tmp/fake-img.json >/dev/null

          PNG=$(python - <<'PY'
          import base64
          b=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zl8sAAAAASUVORK5CYII=')+b'\0'*80
          print(base64.b64encode(b).decode())
          PY
          )
          curl -fsSL -X POST "${H[@]}" -d "{\"listingId\":\"$SPACE\",\"mime\":\"image/png\",\"base64\":\"$PNG\",\"rightsConfirmed\":true}" "$API?action=upload_image" -o /tmp/good-img.json
          IMG_PATH=$(jq -r '.path' /tmp/good-img.json); test -n "$IMG_PATH"; test "$IMG_PATH" != null
          curl -fsSL -X POST "${H[@]}" -d "{\"listingId\":\"$SPACE\",\"path\":\"$IMG_PATH\"}" "$API?action=delete_image" | jq -e '.ok==true' >/dev/null

          curl -sS -o /tmp/track.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"sessionId\":\"$SID\",\"eventName\":\"listing_view\",\"listingId\":\"$SPACE\",\"listingType\":\"space\",\"prefecture\":\"青森県\",\"municipality\":\"青森市\"}" "$API?action=track" | grep -qx 202
          jq -e '.ok==true' /tmp/track.json >/dev/null

          curl -fsSL "$API?action=public_listings&type=space&prefecture=%E9%9D%92%E6%A3%AE%E7%9C%8C&municipality=%E9%9D%92%E6%A3%AE%E5%B8%82&limit=100" -o /tmp/public.json
          jq -e --arg id "$SPACE" '[.listings[].id] | index($id) != null' /tmp/public.json >/dev/null
          curl -fsSL "$API?action=public_listings&type=space&prefecture=%E9%9D%92%E6%A3%AE%E7%9C%8C&municipality=%E9%9D%92%E6%A3%AE%E5%B8%82&q=%E9%A7%85%E5%89%8D&limit=100" -o /tmp/search.json
          jq -e --arg id "$SPACE" '[.listings[].id] | index($id) != null' /tmp/search.json >/dev/null
          curl -fsSL "$API?action=city_stats&prefecture=%E9%9D%92%E6%A3%AE%E7%9C%8C&municipality=%E9%9D%92%E6%A3%AE%E5%B8%82" -o /tmp/stats.json
          jq -e '.ok==true and .space>=1 and .want>=1 and .event>=1' /tmp/stats.json >/dev/null

          for old in create_interest request_action prepare_pro_purchase; do
            code=$(curl -sS -o /tmp/old.json -w '%{http_code}' -X POST "${H[@]}" -d '{}' "$API?action=$old")
            test "$code" = 404; jq -e '.error=="UNKNOWN_ACTION"' /tmp/old.json >/dev/null
          done

          curl -fsSL -X POST "${H[@]}" -d '{}' "$API?action=delete_account" | jq -e '.ok==true and .deleted==true' >/dev/null
          trap - EXIT
          sleep 1
          curl -fsSL "$API?action=public_listings&type=space&prefecture=%E9%9D%92%E6%A3%AE%E7%9C%8C&municipality=%E9%9D%92%E6%A3%AE%E5%B8%82&limit=100" -o /tmp/after-delete.json
          jq -e --arg id "$SPACE" '[.listings[].id] | index($id) == null' /tmp/after-delete.json >/dev/null

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localspace-release-evidence-${{ github.run_id }}
          path: |
            /tmp/health.json
            /tmp/cors-gh.txt
            /tmp/cors-cf.txt
            /tmp/space-out.json
            /tmp/want-out.json
            /tmp/event-out.json
            /tmp/no-authority-out.json
            /tmp/longterm-out.json
            /tmp/job-out.json
            /tmp/fake-img.json
            /tmp/good-img.json
            /tmp/public.json
            /tmp/search.json
            /tmp/stats.json
            dist-localspace/DEPLOYMENT.json
          if-no-files-found: ignore
          retention-days: 14
