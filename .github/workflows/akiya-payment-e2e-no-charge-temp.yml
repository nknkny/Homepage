name: Akiya payment bridge no-charge E2E
on:
  push:
    branches: [akiya-r13-ready-20260818]
    paths: [.github/workflows/akiya-payment-e2e-no-charge-temp.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify payment URL generation only
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-payment-e2e-no-charge'
          curl -fsSL --max-time 45 "$URL" -o result.json
          cat result.json
          jq -e '.ok == true and .http == 200 and .build == "2026-08-18-payment-bridge-r2" and .amount == 3480 and .currency == "jpy" and .paymentLinkId == "plink_1U5fWMJr5LJIePsMGtxB5aI1" and .stripeHost == "buy.stripe.com" and .clientReferenceId == "AKR-E2E-0C55CEBA" and .charged == false and .followedStripeUrl == false' result.json >/dev/null
          echo 'AKIYA_PAYMENT_NO_CHARGE_E2E=PASS'
