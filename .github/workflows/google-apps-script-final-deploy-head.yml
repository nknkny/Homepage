name: Google Apps Script Final Deploy Head

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRIPT_ID: 1pHn5wId7xIMZ3iwNqSqpePLf6eSMuiagDfvCktAZepSfpxQ0JgWcWhZp
      OLD_PROJECT_KEY: Mr8jtt7g-n-GmM5Z7OVWja83LjTh8Dp91
      TARGET_DEPLOYMENT: AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w
      EXPECTED_BUILD: 2026-08-06-insurance-optional
      EXPECTED_SHA256: 9dba6c727262a63e54d10514a76d410476793267e3b079c8b219dcbe4a9657ef
      SPREADSHEET_ID: 12nRr3Fkq8tYZWd-MQvdQXpeO9p9cGuT3CvtRnL_omw8
      API_URL: https://script.google.com/macros/s/AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w/exec
      OWNER_EMAIL: jmdjdtdjdt@gmail.com
    steps:
      - uses: actions/checkout@v4

      - name: Restore encrypted clasp session
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes -keyout "$RUNNER_TEMP/resume-key.pem" -out "$RUNNER_TEMP/resume-cert.pem" -subj "/CN=akiya-final-deploy-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1
          cert=$(base64 -w0 "$RUNNER_TEMP/resume-cert.pem")
          file=".github/auth/resume-${GITHUB_RUN_ID}.b64"
          body=$(jq -n --arg r "$GITHUB_RUN_ID" --arg c "$cert" --arg f "$file" '{body:("GOOGLE_FINAL_DEPLOY_SESSION_READY\nRUN_ID="+$r+"\nAUTH_CERT_B64="+$c+"\nAUTH_FILE="+$f)}')
          curl -fsSL --retry 5 --retry-all-errors -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          enc=''
          for _ in $(seq 1 900); do
            ref=$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["HEAD_REF"],safe=""))')
            url="https://api.github.com/repos/$REPO/contents/$file?ref=$ref"
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" -o "$RUNNER_TEMP/session-file.json" 2>/dev/null; then
              enc=$(jq -r '.content // empty' "$RUNNER_TEMP/session-file.json" | tr -d '\n' | base64 -d 2>/dev/null || true)
              [ -n "$enc" ] && break
            fi
            sleep 1
          done
          test -n "$enc"
          printf '%s' "$enc" | base64 -d > "$RUNNER_TEMP/session.cms"
          openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/session.cms" -recip "$RUNNER_TEMP/resume-cert.pem" -inkey "$RUNNER_TEMP/resume-key.pem" -out "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo SESSION_RESTORED=PASS

      - name: Verify exact target and HEAD source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/gcli" @google/clasp@3.3.0 >/dev/null 2>&1
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          "$CLASP" show-authorized-user --json > "$RUNNER_TEMP/user.json"
          jq -e --arg e "$OWNER_EMAIL" '.loggedIn==true and ((.email // "")|ascii_downcase)==($e|ascii_downcase)' "$RUNNER_TEMP/user.json" >/dev/null
          echo OWNER_MATCH=PASS

          mkdir -p "$RUNNER_TEMP/target"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > "$RUNNER_TEMP/target/.clasp.json"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json list-deployments > "$RUNNER_TEMP/deployments-before.json"
          cat "$RUNNER_TEMP/deployments-before.json"
          grep -Fq "$TARGET_DEPLOYMENT" "$RUNNER_TEMP/deployments-before.json"
          echo TARGET_DEPLOYMENT_OWNERSHIP=PASS

          access_token=$(jq -r '.tokens.default.access_token // empty' "$HOME/.clasprc.json")
          test -n "$access_token"
          curl -fsSL -H "Authorization: Bearer $access_token" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" -o "$RUNNER_TEMP/head-content.json"
          jq -e --arg b "$EXPECTED_BUILD" --arg s "$SPREADSHEET_ID" '[.files[]? | select(.type=="SERVER_JS") | .source] | join("\n") | contains($b) and contains($s)' "$RUNNER_TEMP/head-content.json" >/dev/null

          python - "$RUNNER_TEMP/head-content.json" "$GITHUB_WORKSPACE/.github/recovery/akiya-backend-20260807.gs.gz.b64" "$EXPECTED_SHA256" <<'PY'
          import json,gzip,base64,hashlib,sys
          head=json.load(open(sys.argv[1]))
          srcs=[f.get('source','') for f in head.get('files',[]) if f.get('type')=='SERVER_JS']
          assert srcs, 'no SERVER_JS source'
          remote='\n'.join(srcs).replace('\r\n','\n').rstrip('\n')
          blob=base64.b64decode(open(sys.argv[2],'rb').read())
          approved=gzip.decompress(blob).decode('utf-8').replace('\r\n','\n').rstrip('\n')
          approved_hash=hashlib.sha256((approved+'\n').encode()).hexdigest()
          raw_hash=hashlib.sha256(gzip.decompress(blob)).hexdigest()
          print('REMOTE_SOURCE_BYTES='+str(len(remote.encode())))
          print('APPROVED_SOURCE_BYTES='+str(len(approved.encode())))
          print('APPROVED_RAW_SHA256='+raw_hash)
          assert raw_hash==sys.argv[3], (raw_hash,sys.argv[3])
          if remote != approved:
              import difflib
              diff=list(difflib.unified_diff(approved.splitlines(),remote.splitlines(),n=2))
              print('SOURCE_DIFF_LINES='+str(len(diff)))
              print('\n'.join(diff[:80]))
              raise SystemExit('HEAD source differs from approved backend')
          print('HEAD_SOURCE_EXACT_MATCH=PASS')
          PY

          cp "$RUNNER_TEMP/head-content.json" "$GITHUB_WORKSPACE/apps-script-head-before-deploy.json"

      - name: Update existing production deployment to verified HEAD
        shell: bash
        run: |
          set -euo pipefail
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json update-deployment "$TARGET_DEPLOYMENT" --description 'Production recovery 2026-08-07 verified HEAD' > "$RUNNER_TEMP/update.json"
          cat "$RUNNER_TEMP/update.json"
          grep -Fq "$TARGET_DEPLOYMENT" "$RUNNER_TEMP/update.json"
          echo EXISTING_DEPLOYMENT_UPDATED=PASS

      - name: Verify fixed production exec
        shell: bash
        run: |
          set -euo pipefail
          ok=''
          for _ in $(seq 1 40); do
            if curl -fsSL --location --max-time 30 "$API_URL?recovery=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.json" 2>/dev/null; then
              if jq -e --arg b "$EXPECTED_BUILD" '.buildVersion==$b and .app=="空き家レスキュー会員管理" and .ready==true' "$RUNNER_TEMP/live.json" >/dev/null 2>&1; then
                ok=1; break
              fi
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/live.json"
          test -n "$ok"
          echo APPS_SCRIPT_PRODUCTION_RECOVERY=PASS

      - name: Upload verified pre-deploy source backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-head-before-deploy-${{ github.run_id }}
          path: apps-script-head-before-deploy.json
          retention-days: 7
