name: Build Auth CLI Bundle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Build local authentication CLI bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir auth-cli
          cd auth-cli
          npm init -y >/dev/null
          npm install --no-audit --no-fund @google/clasp@3.3.0 wrangler@4.114.0
          cd ..
          tar -czf auth-cli-bundle.tgz auth-cli
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: auth-cli-bundle
          path: auth-cli-bundle.tgz
          retention-days: 1
