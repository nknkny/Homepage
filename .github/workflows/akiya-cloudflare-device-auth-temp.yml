name: Akiya Cloudflare one-time repair deploy

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: akiya-cloudflare-repair-now-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 42 &&
       contains(github.event.comment.body, 'START_AKIYA_CF_REPAIR_NOW'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Resolve production target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git log -1 --format=%H -- akiya-pocket scripts/build-akiya-cloudflare-pages.mjs)
          origin=$(tr -d '[:space:]' < akiya-pocket/CLOUDFLARE_CANONICAL.txt)
          case "$origin" in https://*.pages.dev) ;; *) echo "Invalid canonical Pages origin: $origin" >&2; exit 1;; esac
          project=$(node -e 'const u=new URL(process.argv[1]); console.log(u.hostname.replace(/\.pages\.dev$/, ""))' "$origin")
          test -n "$source_sha" && test -n "$project"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Cloudflare device authorization
        id: auth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-login.log"
          clean="$RUNNER_TEMP/wrangler-login-clean.log"
          : > "$log"
          (CI='' npx --yes wrangler@4.119.0 login --device --browser=false >"$log" 2>&1) &
          pid=$!
          url=''
          code=''
          for n in $(seq 1 60); do
            perl -pe 's/\e\[[0-9;]*[mK]//g' "$log" > "$clean" || true
            url=$(grep -Eo 'https://dash\.cloudflare\.com/oauth2/device(/verify)?' "$clean" | tail -1 || true)
            code=$(grep -Eo '([A-Za-z0-9]{4}-[A-Za-z0-9]{4}|[A-Za-z0-9]{8})' "$clean" | tail -1 || true)
            if [ -n "$url" ] && [ -n "$code" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ -z "$url" ] || [ -z "$code" ]; then
            cat "$clean" || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          complete_url="${url}?user_code=${code}"
          body=$(jq -n --arg url "$complete_url" --arg code "$code" --arg run "$GITHUB_RUN_ID" \
            '{body:("AKIYA_CF_REPAIR_AUTH_READY\nURL="+$url+"\nCODE="+$code+"\nRUN_ID="+$run+"\nEXPIRES_IN_APPROX=5_MINUTES")}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
          wait "$pid"
          CI='' npx --yes wrangler@4.119.0 whoami >/dev/null
          rm -f "$log" "$clean"

      - name: Build and validate current artifact
        env:
          AKIYA_CANONICAL_ORIGIN: ${{ steps.target.outputs.origin }}
          AKIYA_DEPLOYMENT_URL: ${{ steps.target.outputs.origin }}
          AKIYA_SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          ORIGIN: ${{ steps.target.outputs.origin }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-akiya-cloudflare-pages.mjs
          test -f dist/DEPLOYMENT.json
          jq -e --arg o "$ORIGIN" --arg s "$SOURCE_SHA" '.canonicalOrigin==$o and .build=="2026-08-31-acquisition-r3" and .sourceSha==$s' dist/DEPLOYMENT.json >/dev/null
          grep -Fq "<link rel=\"canonical\" href=\"${ORIGIN}/\">" dist/index.html
          grep -Fq '新規無料会員登録' dist/index.html
          grep -Fq '現地確認を依頼する' dist/index.html
          grep -Fq '登録なしで無料チェック' dist/index.html
          grep -Fq '先に報告見本を見る' dist/index.html
          grep -Fq 'data-akiya-intent="request"' dist/index.html
          grep -Fq 'DeRiEY9nqJJKMJH_5k6HD9hK1i3I6Urvqid4mG2VxS8' dist/index.html
          test -f dist/assets/navigation-r1.css
          test ! -d dist/control-center
          ! grep -R -F 'https://nknkny.github.io/Homepage/akiya-pocket' dist --include='*.html' --include='*.js' --include='*.xml' --include='*.txt'
          while IFS= read -r path; do
            case "$path" in ''|'#'*) continue ;; esac
            test -f "dist/$path" || { echo "PUBLIC_URL_MISSING=$path"; exit 1; }
          done < akiya-pocket/PUBLIC_URLS.txt
          for page in remote-home-aomori.html inherited-home-aomori.html parent-facility-home-aomori.html vacant-home-notice-aomori.html vacant-home-weeds-aomori.html vacant-home-after-storm-aomori.html snow-vacant-home-aomori.html; do
            grep -Fq 'assets/site.js' "dist/$page"
          done

      - name: Inspect Cloudflare Pages project mode
        id: inspect
        env:
          PROJECT: ${{ steps.target.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          CI='' npx --yes wrangler@4.119.0 pages project list > "$RUNNER_TEMP/projects.txt"
          grep -Fq "$PROJECT" "$RUNNER_TEMP/projects.txt"

      - name: Deploy current main to Cloudflare Pages
        id: deploy
        env:
          PROJECT: ${{ steps.target.outputs.project }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: CI='' npx --yes wrangler@4.119.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$SOURCE_SHA" --commit-message 'Akiya Pocket repaired verified production deploy'

      - name: Verify production and core APIs
        id: verify
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api
          PAY: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-payment-api
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 18); do
            marker="$RUNNER_TEMP/deployment-$attempt.json"
            if curl -fsSL --max-time 20 "$ORIGIN/DEPLOYMENT.json?repair=$GITHUB_RUN_ID-$attempt" -o "$marker" \
              && jq -e --arg o "$ORIGIN" --arg s "$SOURCE_SHA" '.canonicalOrigin==$o and .build=="2026-08-31-acquisition-r3" and .sourceSha==$s' "$marker" >/dev/null; then
              matched=1; break
            fi
            sleep 5
          done
          test "$matched" = 1
          mismatches=0
          while IFS= read -r -d '' file; do
            rel=${file#dist/}
            case "$rel" in _headers|_redirects|DEPLOYMENT.json) continue;; esac
            tmp=$(mktemp)
            if ! curl -fsSL --max-time 30 "$ORIGIN/$rel?repair=$GITHUB_RUN_ID" -o "$tmp"; then
              echo "LIVE_MISSING $rel"; mismatches=$((mismatches+1))
            elif ! cmp -s "$file" "$tmp"; then
              echo "LIVE_MISMATCH $rel"; mismatches=$((mismatches+1))
            fi
            rm -f "$tmp"
          done < <(find dist -type f -print0)
          test "$mismatches" = 0
          curl -fsSL -H "Origin: $ORIGIN" "$API" -o "$RUNNER_TEMP/api.json"
          jq -e '.ok==true and .ready==true and .accountDeletionAnonymizes==true' "$RUNNER_TEMP/api.json" >/dev/null
          curl -fsSL -H "Origin: $ORIGIN" "$PAY" -o "$RUNNER_TEMP/pay.json"
          jq -e '.ok==true and .ready==true and .amountJpy==3480 and .paymentLinkReady==true' "$RUNNER_TEMP/pay.json" >/dev/null
          curl -fsSL --max-time 30 -D "$RUNNER_TEMP/headers.txt" -o /dev/null "$ORIGIN/?repair=$GITHUB_RUN_ID"
          tr -d '\r' < "$RUNNER_TEMP/headers.txt" > "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^strict-transport-security:.*max-age=' "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^content-security-policy:' "$RUNNER_TEMP/headers-normalized.txt"

      - name: Report repair result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH: ${{ steps.auth.outcome }}
          BUILD: ${{ steps.inspect.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$AUTH" = success ] && [ "$BUILD" = success ] && [ "$DEPLOY" = success ] && [ "$VERIFY" = success ]; then overall=PASS; else overall=FAIL; fi
          body=$(jq -n --arg o "$overall" --arg r "$GITHUB_RUN_ID" --arg a "$AUTH" --arg b "$BUILD" --arg d "$DEPLOY" --arg v "$VERIFY" --arg s "$SOURCE_SHA" \
            '{body:("AKIYA_CF_REPAIR_NOW="+$o+"\nRUN_ID="+$r+"\nSOURCE_SHA="+$s+"\nAUTH="+$a+"\nBUILD_INSPECT="+$b+"\nDEPLOY="+$d+"\nPUBLIC_VERIFY="+$v)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null

  retire_legacy_worker:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.event.comment.user.login == 'nknkny' &&
      github.event.comment.body == 'RETIRE_AKIYA_LEGACY_WORKER_20261128'
    permissions:
      contents: read
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify and redirect only the legacy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          export WORK="$work"
          OLD=https://rapid-hat-f45c.jmdjdtdjdt.workers.dev
          NEW=https://akiya-pocket-aomori.pages.dev
          curl -fsS --max-time 20 "$NEW/" -o "$work/current.html"
          grep -q '空家ポケット' "$work/current.html"
          curl -sS --max-time 20 -D "$work/old.headers" "$OLD/" -o "$work/old.html"
          python - <<'PY'
          import os,pathlib,re
          p=pathlib.Path(os.environ["WORK"])
          headers=(p/"old.headers").read_text(errors="replace")
          body=(p/"old.html").read_text(errors="replace")
          status=re.findall(r"HTTP/\S+ (\d{3})",headers)
          print("LEGACY_HTTP="+(status[-1] if status else "unknown"))
          if not status or status[-1]!="200": raise SystemExit("STOP: old site is not an independent HTTP 200 site")
          if not any(x in body for x in ["空家ポケット","空き家レスキュー","空家レスキュー","空き家","空家"]): raise SystemExit("STOP: old site identity not verified")
          print("LEGACY_SITE_IDENTITY=PASS")
          PY
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            oidc=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=akiya-cloudflare-ci-broker" | jq -er '.value')
            bundle=$(curl -fsSL -X POST -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' -d '{"action":"get"}' https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-cloudflare-ci-broker | jq -er '.credentialBundle')
            config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/.wrangler/config"
            mkdir -p "$config_dir"
            printf '%s' "$bundle" | base64 -d > "$config_dir/default.toml"
            chmod 600 "$config_dir/default.toml"
            unset oidc bundle
            npx --yes wrangler@4.119.0 whoami >/dev/null 2>&1 || { echo 'STOP: Cloudflare OAuth unavailable'; exit 1; }
          elif [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'STOP: incomplete credential configuration'; exit 1
          fi
          python - <<'PY'
          import os,json,urllib.request,urllib.error,tomllib,pathlib,urllib.parse
          p=pathlib.Path(os.environ["WORK"])
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          if not token:
            path=pathlib.Path(os.environ.get("XDG_CONFIG_HOME",str(pathlib.Path.home()/".config")))/".wrangler/config/default.toml"
            token=tomllib.loads(path.read_text()).get("oauth_token","")
          if not token: raise SystemExit("STOP: no usable credential")
          def get(path):
            req=urllib.request.Request("https://api.cloudflare.com/client/v4"+path,headers={"Authorization":"Bearer "+token})
            try:
              with urllib.request.urlopen(req,timeout=20) as r: d=json.load(r)
            except urllib.error.HTTPError as e:
              raise SystemExit("STOP: Cloudflare read permission or target unavailable: HTTP "+str(e.code)+" at "+path.split("/")[-1])
            if not d.get("success"): raise SystemExit("STOP: Cloudflare response unsuccessful")
            return d
          if not account:
            accounts=get("/accounts?per_page=50")
            if accounts.get("result_info",{}).get("total_pages",1)>1: raise SystemExit("STOP: multiple account pages")
            matches=[]
            for a in accounts["result"]:
              sub=get("/accounts/"+a["id"]+"/workers/subdomain")["result"]
              if sub.get("subdomain")=="jmdjdtdjdt": matches.append(a["id"])
            if len(matches)!=1: raise SystemExit("STOP: account not uniquely matched")
            account=matches[0]
          base="/accounts/"+account+"/workers"
          if get(base+"/subdomain")["result"].get("subdomain")!="jmdjdtdjdt": raise SystemExit("STOP: account subdomain mismatch")
          name="rapid-hat-f45c"
          script=base+"/scripts/"+name
          scripts=get(base+"/scripts")["result"]
          if not any(x.get("id")==name for x in scripts): raise SystemExit("STOP: Worker not found")
          settings=get(script+"/settings")["result"]
          if any(b.get("type") not in ("assets",) for b in settings.get("bindings",[])): raise SystemExit("STOP: legacy Worker has non-asset dependencies")
          if any(x.get("service")==name for x in get(base+"/domains")["result"]): raise SystemExit("STOP: custom domain dependency")
          schedules=get(script+"/schedules")["result"]
          if (schedules.get("schedules",[]) if isinstance(schedules,dict) else schedules): raise SystemExit("STOP: scheduled dependency")
          zones=get("/zones?account.id="+urllib.parse.quote(account)+"&per_page=50")
          if zones.get("result_info",{}).get("total_pages",1)>1: raise SystemExit("STOP: route audit requires more pages")
          for z in zones["result"]:
            if any(x.get("script")==name for x in get("/zones/"+z["id"]+"/workers/routes")["result"]): raise SystemExit("STOP: zone route dependency")
          if len(scripts)>35: raise SystemExit("STOP: dependency audit exceeds bounded scope")
          for w in scripts:
            if w.get("id")==name: continue
            other=get(base+"/scripts/"+urllib.parse.quote(w["id"],safe="")+"/settings")["result"]
            if any(b.get("type")=="service" and b.get("service")==name for b in other.get("bindings",[])): raise SystemExit("STOP: service binding dependency")
          dep=get(script+"/deployments")["result"]
          versions=dep.get("deployments",[]) if isinstance(dep,dict) else dep
          if not versions: raise SystemExit("STOP: no rollback deployment metadata")
          print("LEGACY_DEPENDENCY_AUDIT=PASS")
          print("LEGACY_PREVIOUS_DEPLOYMENT="+str(versions[0].get("id","unknown")))
          (p/"account").write_text(account)
          PY
          export CLOUDFLARE_ACCOUNT_ID=$(cat "$work/account")
          cat > "$work/worker.mjs" <<'JS'
          const origin='https://akiya-pocket-aomori.pages.dev';
          const pages=new Set(['about','service','faq','contact','request','report-sample','checklist','aomori-city','aomori-vacant-house-checklist','aomori-vacant-house-one-time-check','aomori-vacant-house-photo-report','inherited-home-aomori','parent-facility-home-aomori','remote-home-aomori','snow-vacant-home-aomori','vacant-home-after-storm-aomori','vacant-home-notice-aomori','vacant-home-weeds-aomori','privacy','terms','service-terms','commercial','ai-training-policy']);
          export default {fetch(request){
            const old=new URL(request.url);
            if(old.hostname!=='rapid-hat-f45c.jmdjdtdjdt.workers.dev') return new Response('Gone',{status:410,headers:{'Cache-Control':'no-store'}});
            if(!['GET','HEAD'].includes(request.method)) return new Response('旧受付は終了しました。正式サイトからご依頼ください。',{status:410,headers:{'Content-Type':'text/plain; charset=utf-8','Cache-Control':'no-store'}});
            const slug=old.pathname.replace(/^\/|\/$/g,'').replace(/\.html$/,'');
            const dest=new URL(pages.has(slug)?'/'+slug+'.html':/^register(?:-complete)?$|^member(?:-login)?$|^checkout$|^payment$/.test(slug)?'/request.html':'/',origin);
            for(const [key,val] of old.searchParams) if(/^utm_(source|medium|campaign|content|term)$|^(fbclid|gclid)$/.test(key)&&val.length<=512)dest.searchParams.set(key,val);
            return new Response(null,{status:301,headers:{Location:dest.href,'Cache-Control':'public, max-age=300','X-Content-Type-Options':'nosniff'}});
          }};
          JS
          cat > "$work/wrangler.toml" <<'TOML'
          name = "rapid-hat-f45c"
          main = "worker.mjs"
          compatibility_date = "2026-11-28"
          workers_dev = true
          preview_urls = false
          TOML
          node --input-type=module - "$work/worker.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import {pathToFileURL} from 'node:url';
          const worker=(await import(pathToFileURL(process.argv[2]).href)).default;
          const base='https://rapid-hat-f45c.jmdjdtdjdt.workers.dev';
          for(const [p,target] of [['/','/'],['/request.html?utm_source=facebook&token=secret','/request.html?utm_source=facebook'],['/register.html','/request.html'],['/unknown','/']]){
            const r=worker.fetch(new Request(base+p)); assert.equal(r.status,301); assert.equal(r.headers.get('location'),'https://akiya-pocket-aomori.pages.dev'+target);
          }
          assert.equal(worker.fetch(new Request(base+'/request.html',{method:'POST'})).status,410);
          assert.equal(worker.fetch(new Request('https://other.example/')).status,410);
          console.log('LEGACY_REDIRECT_LOCAL_TEST=6/6');
          JS
          (cd "$work"; npx --yes wrangler@4.119.0 deploy --config wrangler.toml --keep-vars > deploy.log 2>&1) || { echo 'STOP: Worker deploy failed; inspect permissions in Cloudflare dashboard'; exit 1; }
          echo 'LEGACY_WORKER_DEPLOY=SUCCESS'
          for path in / /request.html /register.html /unknown; do
            result=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' "$OLD$path")
            case "$path" in /request.html|/register.html) expected="301 $NEW/request.html";; *) expected="301 $NEW/";; esac
            test "$result" = "$expected" || { echo 'STOP: live redirect mismatch'; exit 1; }
          done
          test "$(curl -sS --max-time 20 -X POST -o /dev/null -w '%{http_code}' "$OLD/request.html")" = 410
          curl -fsS --max-time 20 "$NEW/DEPLOYMENT.json" -o "$work/pages-after.json"
          jq -e '.canonicalOrigin=="https://akiya-pocket-aomori.pages.dev"' "$work/pages-after.json" >/dev/null
          echo 'LEGACY_REDIRECT_LIVE_VERIFY=PASS'
      - name: Record outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: gh issue comment 42 --body "AKIYA_LEGACY_REDIRECT_RUN=$GITHUB_RUN_ID RESULT=$RESULT TARGET=rapid-hat-f45c"
