name: Emergency Akiya Cloudflare OAuth bootstrap

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: akiya-cloudflare-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 42 &&
       contains(github.event.comment.body, 'START_AKIYA_CF_BOOTSTRAP'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_BROKER_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-cloudflare-ci-broker
      CF_BROKER_AUDIENCE: akiya-cloudflare-ci-broker
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Verify GitHub OIDC broker
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CF_BROKER_AUDIENCE}"
          jwt=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value')
          test -n "$jwt" && test "$jwt" != "null"
          response="$RUNNER_TEMP/broker-health.json"
          status=$(curl -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $jwt" \
            -H 'Content-Type: application/json' \
            --data '{"action":"health"}' \
            "$CF_BROKER_URL")
          test "$status" = 200
          jq -e '.ok==true and .ready==true' "$response" >/dev/null
          rm -f "$response"
          unset jwt

      - name: Authorize Cloudflare and store OAuth credentials
        id: auth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cloudflare-device.log"
          clean="$RUNNER_TEMP/cloudflare-device-clean.log"
          : > "$log"

          (CI='' npx --yes wrangler@4.119.0 login --device --browser=false --no-use-keyring >"$log" 2>&1) &
          pid=$!
          code=''
          for n in $(seq 1 45); do
            perl -pe 's/\e\[[0-9;]*[mK]//g' "$log" > "$clean" || true
            code=$(grep -Eo '([A-Za-z0-9]{4}-[A-Za-z0-9]{4}|[A-Za-z0-9]{8})' "$clean" | tail -1 || true)
            if [ -n "$code" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ -z "$code" ]; then
            cat "$clean" || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi

          verify_url="https://dash.cloudflare.com/oauth2/device/verify"
          complete_url="${verify_url}?user_code=${code}"
          body=$(jq -n --arg url "$complete_url" --arg code "$code" --arg run "$GITHUB_RUN_ID" \
            '{body:("AKIYA_CF_BOOTSTRAP_AUTH_READY\nURL="+$url+"\nCODE="+$code+"\nRUN_ID="+$run+"\nEXPIRES_IN_APPROX=5_MINUTES")}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -d "$body" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null

          wait "$pid"
          credential_file="$HOME/.config/.wrangler/config/default.toml"
          test -s "$credential_file"
          chmod 600 "$credential_file"
          npx --yes wrangler@4.119.0 whoami >/dev/null

          bundle=$(base64 -w0 < "$credential_file")
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CF_BROKER_AUDIENCE}"
          jwt=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value')
          payload="$RUNNER_TEMP/broker-put.json"
          jq -n --arg b "$bundle" '{action:"put",credentialBundle:$b}' > "$payload"
          response="$RUNNER_TEMP/broker-put-response.json"
          status=$(curl -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $jwt" \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload" \
            "$CF_BROKER_URL")
          test "$status" = 200
          jq -e '.ok==true and .stored==true' "$response" >/dev/null
          unset bundle jwt
          rm -f "$payload" "$response" "$log" "$clean"

      - name: Resolve source and project
        id: target
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git log -1 --format=%H -- akiya-pocket scripts/build-akiya-cloudflare-pages.mjs)
          origin=$(tr -d '[:space:]' < akiya-pocket/CLOUDFLARE_CANONICAL.txt)
          case "$origin" in https://*.pages.dev) ;; *) echo "Invalid canonical Pages origin: $origin" >&2; exit 1;; esac
          project=$(node -e 'const u=new URL(process.argv[1]); console.log(u.hostname.replace(/\.pages\.dev$/,""))' "$origin")
          test -n "$source_sha" && test -n "$project"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Build and validate current production artifact
        env:
          AKIYA_CANONICAL_ORIGIN: ${{ steps.target.outputs.origin }}
          AKIYA_DEPLOYMENT_URL: ${{ steps.target.outputs.origin }}
          AKIYA_SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          ORIGIN: ${{ steps.target.outputs.origin }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-akiya-cloudflare-pages.mjs
          test -f dist/DEPLOYMENT.json
          jq -e --arg o "$ORIGIN" --arg s "$SOURCE_SHA" '.canonicalOrigin==$o and .build=="2026-08-31-acquisition-r3" and .sourceSha==$s' dist/DEPLOYMENT.json >/dev/null
          grep -Fq "<link rel=\"canonical\" href=\"${ORIGIN}/\">" dist/index.html
          grep -Fq '新規無料会員登録' dist/index.html
          grep -Fq '現地確認を依頼する' dist/index.html
          grep -Fq '登録なしで無料チェック' dist/index.html
          grep -Fq '先に報告見本を見る' dist/index.html
          grep -Fq 'data-akiya-intent="request"' dist/index.html
          test -f dist/assets/navigation-r1.css
          ! grep -R -F 'https://nknkny.github.io/Homepage/akiya-pocket' dist --include='*.html' --include='*.js' --include='*.xml' --include='*.txt'
          test ! -d dist/control-center
          while IFS= read -r path; do
            case "$path" in ''|'#'*) continue ;; esac
            test -f "dist/$path" || { echo "PUBLIC_URL_MISSING=$path"; exit 1; }
          done < akiya-pocket/PUBLIC_URLS.txt

      - name: Deploy current main to Cloudflare Pages
        id: deploy
        env:
          PROJECT: ${{ steps.target.outputs.project }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$SOURCE_SHA" --commit-message 'Akiya Pocket Cloudflare OAuth bootstrap and production repair'

      - name: Persist any refreshed OAuth credentials
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          credential_file="$HOME/.config/.wrangler/config/default.toml"
          test -s "$credential_file"
          bundle=$(base64 -w0 < "$credential_file")
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CF_BROKER_AUDIENCE}"
          jwt=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value')
          payload="$RUNNER_TEMP/broker-refresh.json"
          jq -n --arg b "$bundle" '{action:"put",credentialBundle:$b}' > "$payload"
          response="$RUNNER_TEMP/broker-refresh-response.json"
          status=$(curl -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $jwt" \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload" \
            "$CF_BROKER_URL")
          test "$status" = 200
          jq -e '.ok==true and .stored==true' "$response" >/dev/null
          unset bundle jwt
          rm -f "$payload" "$response"

      - name: Verify production parity and core APIs
        id: verify
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api
          PAY: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-payment-api
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 18); do
            marker="$RUNNER_TEMP/deployment-$attempt.json"
            if curl -fsSL --max-time 20 "$ORIGIN/DEPLOYMENT.json?bootstrap=$GITHUB_RUN_ID-$attempt" -o "$marker" \
              && jq -e --arg o "$ORIGIN" --arg s "$SOURCE_SHA" '.canonicalOrigin==$o and .build=="2026-08-31-acquisition-r3" and .sourceSha==$s' "$marker" >/dev/null; then
              matched=1
              break
            fi
            sleep 5
          done
          test "$matched" = 1

          mismatches=0
          while IFS= read -r -d '' file; do
            rel=${file#dist/}
            case "$rel" in _headers|_redirects|DEPLOYMENT.json) continue;; esac
            tmp=$(mktemp)
            if ! curl -fsSL --max-time 30 "$ORIGIN/$rel?bootstrap=$GITHUB_RUN_ID" -o "$tmp"; then
              echo "LIVE_MISSING $rel"
              mismatches=$((mismatches+1))
            elif ! cmp -s "$file" "$tmp"; then
              echo "LIVE_MISMATCH $rel"
              mismatches=$((mismatches+1))
            fi
            rm -f "$tmp"
          done < <(find dist -type f -print0)
          test "$mismatches" = 0

          curl -fsSL -H "Origin: $ORIGIN" "$API" -o "$RUNNER_TEMP/api.json"
          jq -e '.ok==true and .ready==true and .accountDeletionAnonymizes==true' "$RUNNER_TEMP/api.json" >/dev/null
          curl -fsSL -H "Origin: $ORIGIN" "$PAY" -o "$RUNNER_TEMP/pay.json"
          jq -e '.ok==true and .ready==true and .amountJpy==3480 and .paymentLinkReady==true' "$RUNNER_TEMP/pay.json" >/dev/null

          curl -fsSL --max-time 30 -D "$RUNNER_TEMP/headers.txt" -o /dev/null "$ORIGIN/?bootstrap=$GITHUB_RUN_ID"
          tr -d '\r' < "$RUNNER_TEMP/headers.txt" > "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^strict-transport-security:.*max-age=' "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^content-security-policy:' "$RUNNER_TEMP/headers-normalized.txt"

      - name: Report bootstrap result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH: ${{ steps.auth.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$AUTH" = success ] && [ "$DEPLOY" = success ] && [ "$VERIFY" = success ]; then overall=PASS; else overall=FAIL; fi
          body=$(jq -n --arg o "$overall" --arg r "$GITHUB_RUN_ID" --arg a "$AUTH" --arg d "$DEPLOY" --arg v "$VERIFY" --arg s "$SOURCE_SHA" \
            '{body:("AKIYA_CF_BOOTSTRAP="+$o+"\nRUN_ID="+$r+"\nSOURCE_SHA="+$s+"\nAUTH="+$a+"\nDEPLOY="+$d+"\nPUBLIC_VERIFY="+$v)}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -d "$body" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
