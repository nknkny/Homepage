name: Deploy public sites to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'event-platform/**'
      - 'akiya-pocket/**'
      - '.github/workflows/deploy-public-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          cp -R event-platform dist/event-platform
          cp -R akiya-pocket dist/akiya-pocket
          test -f dist/akiya-pocket/index.html
          test -f dist/akiya-pocket/register.html
          test -f dist/akiya-pocket/member-login.html
          test -f dist/akiya-pocket/request.html
          test -f dist/akiya-pocket/checkout.html
          ! find dist -path '*/owner*' -print -quit | grep -q .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
