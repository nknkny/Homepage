name: Akiya emergency site verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public pages and reject invalid signup
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket'
          curl -fsSL --max-time 30 "$BASE?health=1" | tee health.json
          jq -e '.ok == true and .emailSending == false and .membership == true' health.json >/dev/null
          curl -fsSL --max-time 30 "$BASE" -o home.html
          grep -q '無料会員になる' home.html
          grep -q '月額0円' home.html
          curl -fsSL --max-time 30 "$BASE?page=register" -o register.html
          grep -q '無料会員登録' register.html
          grep -q '登録時のメール送信は行いません' register.html
          code="$(curl -sS -o invalid.html -w '%{http_code}' --max-time 30 -X POST "$BASE?action=register" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'name=' \
            --data-urlencode 'email=invalid' \
            --data-urlencode 'password=123' \
            --data-urlencode 'required_consent=0' \
            --data-urlencode 'started_at=0')"
          test "$code" = '400'
          grep -Eq '入力内容を確認|登録できませんでした' invalid.html
          echo 'PUBLIC_SITE_VERIFY=PASS'
