name: Cleanup Akiya Temporary Branches

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only 2026-08-07 temporary recovery branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "akiya-rescue-recovery-20260807-audit"
            "akiya-rescue-recovery-20260807-backup"
            "akiya-rescue-recovery-20260807-final"
            "akiya-rescue-recovery-20260807-safe"
            "akiya-rescue-recovery-20260807-working"
            "akiya-rescue-recovery-20260807"
            "agent/probe-apps-script-secrets-20260807"
            "agent/probe-cloudflare-secrets-20260807"
            "agent/run-akiya-api-live-check-20260807"
            "agent/run-akiya-live-check-20260807-v2"
            "agent/run-akiya-live-check-20260807"
            "agent/run-akiya-split-live-check-20260807"
            "agent/verify-restored-akiya-20260807"
            "agent/cleanup-akiya-temp-branches-20260807"
          )
          for b in "${branches[@]}"; do
            code=$(curl -sS -o response.txt -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/$b")
            if [ "$code" = "204" ]; then
              echo "$b=DELETED"
            elif [ "$code" = "422" ] || [ "$code" = "404" ]; then
              echo "$b=ALREADY_ABSENT_OR_PROTECTED ($code)"
            else
              echo "$b=FAILED ($code)"
              cat response.txt
              exit 1
            fi
          done
