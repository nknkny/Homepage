name: Akiya Form Sales Browser Self Test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  test:
    if: github.event.issue.number == 42 && contains(github.event.comment.body, 'RUN_AKIYA_FORM_SALES_BROWSER_SELFTEST')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Install Playwright package
        shell: bash
        run: npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
      - name: Submit only to public echo test form
        id: browser
        shell: bash
        run: |
          set +e
          node --input-type=module - <<'NODE' > /tmp/selftest.log 2>&1
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage();
          console.log('open');
          await p.goto('https://httpbin.org/forms/post',{waitUntil:'domcontentloaded',timeout:30000});
          console.log('title',await p.title());
          console.log('buttons',await p.locator('button').count());
          await p.locator('input[name="custname"]').fill('Akiya Form Sales Self Test');
          await p.locator('input[name="custtel"]').fill('0000000000');
          await p.locator('input[name="custemail"]').fill('akiya-form-test@example.invalid');
          await p.locator('textarea[name="comments"]').fill('Controlled browser automation test. No real recipient.');
          await p.locator('button').click();
          await p.waitForLoadState('domcontentloaded',{timeout:15000});
          const text=await p.locator('body').innerText();
          console.log('url',p.url());
          console.log('body',text.slice(0,1000));
          if(!text.includes('Akiya Form Sales Self Test')||!text.includes('akiya-form-test@example.invalid')) throw new Error('echo verification failed');
          console.log('FORM_BROWSER_SELFTEST=PASS');
          await b.close();
          NODE
          code=$?
          cat /tmp/selftest.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          tail -c 2500 /tmp/selftest.log >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          LOG: ${{ steps.browser.outputs.log }}
        shell: bash
        run: |
          node - <<'NODE'
          const log=(process.env.LOG||'').slice(-1800);
          const body={body:`AKIYA_FORM_SALES_BROWSER_SELFTEST=${process.env.STATUS==='success'?'PASS':'FAIL'}\n${log}`};
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/42/comments`,{method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'content-type':'application/json','accept':'application/vnd.github+json'},body:JSON.stringify(body)});
          if(!r.ok) throw new Error(`comment ${r.status}`);
          NODE
