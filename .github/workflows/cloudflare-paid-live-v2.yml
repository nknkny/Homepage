name: Cloudflare paid-live v2

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/cloudflare-auth/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_WORKER: rapid-hat-f45c
      ADMIN_WORKER: akiya-pocket-owner-private
      OWNER_EMAIL: jmdjdtdjdt@gmail.com
      CANDIDATE_BRANCH: akiya-r13-ready-20260818
      ROLLBACK_BRANCH: akiya-r13-static
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment completely before device timer
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/cfcli" wrangler@latest >/dev/null 2>&1
          W="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          "$W" --version
          mkdir -p "$RUNNER_TEMP/customer-deploy"
          git clone -q --depth 1 --single-branch --branch "$CANDIDATE_BRANCH" "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/customer-deploy/site"
          rm -rf "$RUNNER_TEMP/customer-deploy/site/.git" "$RUNNER_TEMP/customer-deploy/site/.github"
          grep -Fq 'siteVersion=2026-08-18-paid-live-r1' "$RUNNER_TEMP/customer-deploy/site/VERSION.txt"
          grep -Fq 'akiya-pocket-api' "$RUNNER_TEMP/customer-deploy/site/assets/config.js"
          grep -Fq 'akiya-pocket-payment-api' "$RUNNER_TEMP/customer-deploy/site/assets/config.js"
          grep -Fq '3,480円' "$RUNNER_TEMP/customer-deploy/site/request.html"
          grep -Fq '3,480円' "$RUNNER_TEMP/customer-deploy/site/checkout.html"
          echo PREAUTH_DEPLOYMENT_PAYLOAD_READY=PASS

      - name: Start fresh minimum-scope Cloudflare device authorization
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          "$W" login --device \
            --scopes account:read --scopes user:read --scopes workers:write --scopes workers_scripts:write \
            --no-use-keyring >"$RUNNER_TEMP/login.log" 2>&1 &
          pid=$!
          device_url=''
          for _ in $(seq 1 60); do
            device_url=$(grep -Eo 'https://dash\.cloudflare\.com/oauth2/device/verify\?user_code=[A-Za-z0-9]+' "$RUNNER_TEMP/login.log" | tail -1 || true)
            [ -n "$device_url" ] && break
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/login.log"; exit 1; fi
            sleep 1
          done
          test -n "$device_url"
          body=$(jq -n --arg run "$GITHUB_RUN_ID" --arg url "$device_url" '{body:("CLOUDFLARE_DEVICE_READY_V2\nRUN_ID="+$run+"\nCLOUDFLARE_DEVICE_URL="+$url+"\nSTATUS=All deploy files are already validated. Owner approval is the only remaining input before the customer-site deployment.")}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          echo DEVICE_READY_FOR_OWNER=PASS
          wait "$pid"
          "$W" whoami > "$RUNNER_TEMP/whoami.txt"
          grep -Fq 'workers (write)' "$RUNNER_TEMP/whoami.txt"
          if grep -Eq 'email_sending|email_routing|ai \(write\)|pages \(write\)' "$RUNNER_TEMP/whoami.txt"; then echo EXCESS_SCOPE_DETECTED; exit 1; fi
          echo MINIMUM_SCOPE_OWNER_OAUTH=PASS

      - name: Identify exact Cloudflare account and existing Worker
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          "$W" auth token --json > "$RUNNER_TEMP/token.json"
          token=$(jq -r '.token // empty' "$RUNNER_TEMP/token.json")
          test -n "$token"
          curl -fsSL -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/accounts?per_page=50' > "$RUNNER_TEMP/accounts.json"
          jq -e '.success==true' "$RUNNER_TEMP/accounts.json" >/dev/null
          : > "$RUNNER_TEMP/matches.txt"
          while read -r aid; do
            code=$(curl -sS -o "$RUNNER_TEMP/worker-$aid.json" -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$TARGET_WORKER/settings")
            if [ "$code" = 200 ] && jq -e '.success==true' "$RUNNER_TEMP/worker-$aid.json" >/dev/null 2>&1; then echo "$aid" >> "$RUNNER_TEMP/matches.txt"; fi
          done < <(jq -r '.result[].id' "$RUNNER_TEMP/accounts.json")
          test "$(wc -l < "$RUNNER_TEMP/matches.txt")" -eq 1
          ACCOUNT_ID=$(cat "$RUNNER_TEMP/matches.txt")
          echo "$ACCOUNT_ID" > "$RUNNER_TEMP/account-id.txt"
          curl -fsSL -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain" > "$RUNNER_TEMP/subdomain.json"
          jq -e '.success==true and (.result.subdomain|length>0)' "$RUNNER_TEMP/subdomain.json" >/dev/null
          jq -r '.result.subdomain' "$RUNNER_TEMP/subdomain.json" > "$RUNNER_TEMP/subdomain.txt"
          echo EXACT_EXISTING_WORKER_OWNERSHIP=PASS

      - name: Deploy audited paid-live customer site
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(cat "$RUNNER_TEMP/account-id.txt")
          W="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          cat > "$RUNNER_TEMP/customer-deploy/wrangler.jsonc" <<EOF
          {"name":"$TARGET_WORKER","account_id":"$ACCOUNT_ID","compatibility_date":"2026-08-18","workers_dev":true,"assets":{"directory":"./site"}}
          EOF
          "$W" deploy --dry-run --config "$RUNNER_TEMP/customer-deploy/wrangler.jsonc" >/dev/null
          "$W" deploy --keep-vars --config "$RUNNER_TEMP/customer-deploy/wrangler.jsonc" > "$RUNNER_TEMP/customer-deploy.log"
          echo CUSTOMER_DEPLOY_COMMAND=PASS

      - name: Verify customer production and auto-rollback if necessary
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://rapid-hat-f45c.jmdjdtdjdt.workers.dev'
          verify_live(){
            curl -fsSL --max-time 30 "$ORIGIN/VERSION.txt?v=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/v" &&
            curl -fsSL --max-time 30 "$ORIGIN/assets/config.js?v=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/c" &&
            curl -fsSL --max-time 30 "$ORIGIN/register.html?v=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/r" &&
            curl -fsSL --max-time 30 "$ORIGIN/member-login.html?v=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/l" &&
            curl -fsSL --max-time 30 "$ORIGIN/request.html?v=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/q" &&
            curl -fsSL --max-time 30 "$ORIGIN/checkout.html?v=${GITHUB_RUN_ID}-$RANDOM" -o "$RUNNER_TEMP/x" &&
            grep -Fq 'siteVersion=2026-08-18-paid-live-r1' "$RUNNER_TEMP/v" &&
            grep -Fq 'akiya-pocket-api' "$RUNNER_TEMP/c" &&
            grep -Fq 'akiya-pocket-payment-api' "$RUNNER_TEMP/c" &&
            grep -Fq 'id="registerForm"' "$RUNNER_TEMP/r" &&
            grep -Fq 'id="loginForm"' "$RUNNER_TEMP/l" &&
            grep -Fq '3,480円' "$RUNNER_TEMP/q" &&
            grep -Fq '3,480円' "$RUNNER_TEMP/x" &&
            ! grep -q '遨ｺ螳ｶ' "$RUNNER_TEMP/r"
          }
          ok=0
          for _ in $(seq 1 15); do if verify_live; then ok=1; break; fi; sleep 4; done
          if [ "$ok" -ne 1 ]; then
            echo LIVE_VERIFY_FAILED_ROLLING_BACK
            ACCOUNT_ID=$(cat "$RUNNER_TEMP/account-id.txt")
            W="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
            rm -rf "$RUNNER_TEMP/rollback"; mkdir -p "$RUNNER_TEMP/rollback"
            git clone -q --depth 1 --single-branch --branch "$ROLLBACK_BRANCH" "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/rollback/site"
            rm -rf "$RUNNER_TEMP/rollback/site/.git" "$RUNNER_TEMP/rollback/site/.github"
            cat > "$RUNNER_TEMP/rollback/wrangler.jsonc" <<EOF
          {"name":"$TARGET_WORKER","account_id":"$ACCOUNT_ID","compatibility_date":"2026-08-18","workers_dev":true,"assets":{"directory":"./site"}}
          EOF
            "$W" deploy --keep-vars --config "$RUNNER_TEMP/rollback/wrangler.jsonc" >/dev/null
            exit 1
          fi
          echo CUSTOMER_LIVE_PAID_R1=PASS

      - name: Prepare private-admin encrypted runtime channel after customer site is live
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -subj "/CN=akiya-admin-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1
          cert=$(base64 -w0 "$RUNNER_TEMP/cert.pem")
          body=$(jq -n --arg run "$GITHUB_RUN_ID" --arg cert "$cert" '{body:("AKIYA_ADMIN_RUNTIME_READY\nRUN_ID="+$run+"\nRUNTIME_CERT_B64="+$cert+"\nSTATUS=Customer site is already live and verified. Waiting for encrypted private-admin runtime only.")}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          echo ADMIN_RUNTIME_CHANNEL_READY=PASS

      - name: Receive and validate encrypted private-admin runtime
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 600); do
            comments=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")
            payload=$(printf '%s' "$comments" | jq -r --arg run "$GITHUB_RUN_ID" '[.[] | select(.body | startswith("AKIYA_ADMIN_RUNTIME_PAYLOAD\nRUN_ID="+$run+"\n")) | .body] | last // "" | split("\n")[] | select(startswith("PAYLOAD_B64=")) | sub("^PAYLOAD_B64=";"")' | tail -1)
            if [ -n "$payload" ]; then
              if printf '%s' "$payload" | base64 -d > "$RUNNER_TEMP/runtime.cms" 2>/dev/null && openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/runtime.cms" -recip "$RUNNER_TEMP/cert.pem" -inkey "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/payload.json" 2>/dev/null && jq -e '.owner_ui_key and .entry_key and .owner_email and .owner_password' "$RUNNER_TEMP/payload.json" >/dev/null 2>&1; then ready=1; break; fi
            fi
            sleep 1
          done
          test "$ready" = 1
          test "$(jq -r '.owner_email' "$RUNNER_TEMP/payload.json")" = "$OWNER_EMAIL"
          echo ADMIN_ENCRYPTED_RUNTIME_VALIDATED=PASS

      - name: Deploy private owner dashboard and verify
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(cat "$RUNNER_TEMP/account-id.txt")
          SUBDOMAIN=$(cat "$RUNNER_TEMP/subdomain.txt")
          W="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          mkdir -p "$RUNNER_TEMP/admin/src"
          cp .github/cloudflare/akiya-owner-worker.js "$RUNNER_TEMP/admin/src/index.js"
          cat > "$RUNNER_TEMP/admin/wrangler.jsonc" <<EOF
          {"name":"$ADMIN_WORKER","account_id":"$ACCOUNT_ID","main":"./src/index.js","compatibility_date":"2026-08-18","workers_dev":true}
          EOF
          "$W" deploy --config "$RUNNER_TEMP/admin/wrangler.jsonc" >/dev/null
          printf '%s' "$(jq -r '.owner_ui_key' "$RUNNER_TEMP/payload.json")" | "$W" secret put OWNER_UI_KEY --config "$RUNNER_TEMP/admin/wrangler.jsonc" >/dev/null
          printf '%s' "$(jq -r '.entry_key' "$RUNNER_TEMP/payload.json")" | "$W" secret put ENTRY_KEY --config "$RUNNER_TEMP/admin/wrangler.jsonc" >/dev/null
          ADMIN_ORIGIN="https://${ADMIN_WORKER}.${SUBDOMAIN}.workers.dev"
          ENTRY=$(jq -r '.entry_key' "$RUNNER_TEMP/payload.json")
          E=$(jq -r '.owner_email' "$RUNNER_TEMP/payload.json")
          P=$(jq -r '.owner_password' "$RUNNER_TEMP/payload.json")
          code=$(curl -sS -o "$RUNNER_TEMP/root" -w '%{http_code}' "$ADMIN_ORIGIN/")
          test "$code" = 404
          ENTRY_ESCAPED=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$ENTRY")
          curl -fsSL -c "$RUNNER_TEMP/cookies" -b "$RUNNER_TEMP/cookies" -L "$ADMIN_ORIGIN/enter?key=$ENTRY_ESCAPED" -o "$RUNNER_TEMP/owner"
          grep -Fq '空家ポケット 運営センター' "$RUNNER_TEMP/owner"
          login=$(jq -n --arg e "$E" --arg p "$P" '{action:"login",email:$e,password:$p}')
          curl -fsSL -c "$RUNNER_TEMP/cookies" -b "$RUNNER_TEMP/cookies" -H 'content-type: application/json' -d "$login" "$ADMIN_ORIGIN/api/owner" -o "$RUNNER_TEMP/login.json"
          jq -e '.ok==true and (.token|not)' "$RUNNER_TEMP/login.json" >/dev/null
          curl -fsSL -c "$RUNNER_TEMP/cookies" -b "$RUNNER_TEMP/cookies" -H 'content-type: application/json' -d '{"action":"dashboard"}' "$ADMIN_ORIGIN/api/owner" -o "$RUNNER_TEMP/dashboard.json"
          jq -e '.ok==true and (.data.members|type=="number") and (.data.requests|type=="number") and .data.settings.external_email_enabled==false' "$RUNNER_TEMP/dashboard.json" >/dev/null
          echo "$ADMIN_ORIGIN" > "$RUNNER_TEMP/admin-origin.txt"
          echo ADMIN_PRIVATE_E2E=PASS

      - name: Revoke one-shot Cloudflare OAuth and remove plaintext runtime
        if: always()
        shell: bash
        run: |
          W="$RUNNER_TEMP/cfcli/node_modules/.bin/wrangler"
          if [ -x "$W" ]; then "$W" logout >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/token.json" "$RUNNER_TEMP/runtime.cms" || true
          echo ONE_SHOT_OAUTH_REVOKED_AND_RUNTIME_REMOVED=PASS
