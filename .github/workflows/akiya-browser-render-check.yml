name: Akiya browser render check
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: github.event.issue.number == 42 && contains(github.event.comment.body, 'RUN_AKIYA_BROWSER_RENDER_CHECK')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Render and inspect
        id: inspect
        shell: bash
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const urls={customer:'https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-live/',admin:'https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner-ui'};
          const browser=await chromium.launch({headless:true});
          const out={};
          for(const [k,url] of Object.entries(urls)){
            const page=await browser.newPage();
            const resp=await page.goto(url,{waitUntil:'networkidle',timeout:45000});
            const title=await page.title();
            const text=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,1200);
            const charset=await page.evaluate(()=>document.characterSet);
            const mojibake=/[�]|(?:Ã.|Â.|ã[\x80-\xBF]|æ[\x80-\xBF]|ç[\x80-\xBF]|è[\x80-\xBF]|é[\x80-\xBF])/u.test(text);
            const japanese=/[ぁ-んァ-ヶ一-龠]/u.test(text);
            await page.screenshot({path:`${k}.png`,fullPage:true});
            out[k]={status:resp?.status()||0,title,charset,japanese,mojibake,text};
            await page.close();
          }
          await browser.close();
          console.log(JSON.stringify(out));
          EOF
          node check.mjs > result.json
          cat result.json
          customer_status=$(jq -r '.customer.status' result.json)
          customer_jp=$(jq -r '.customer.japanese' result.json)
          customer_moji=$(jq -r '.customer.mojibake' result.json)
          admin_status=$(jq -r '.admin.status' result.json)
          admin_jp=$(jq -r '.admin.japanese' result.json)
          admin_moji=$(jq -r '.admin.mojibake' result.json)
          admin_text=$(jq -r '.admin.text' result.json | head -c 500)
          customer_text=$(jq -r '.customer.text' result.json | head -c 500)
          {
            echo "customer_status=$customer_status"; echo "customer_jp=$customer_jp"; echo "customer_moji=$customer_moji";
            echo "admin_status=$admin_status"; echo "admin_jp=$admin_jp"; echo "admin_moji=$admin_moji";
            echo "customer_text<<EOF"; echo "$customer_text"; echo EOF;
            echo "admin_text<<EOF"; echo "$admin_text"; echo EOF;
          } >> "$GITHUB_OUTPUT"
      - name: Record browser result
        env:
          GH_TOKEN: ${{ github.token }}
          CS: ${{ steps.inspect.outputs.customer_status }}
          CJ: ${{ steps.inspect.outputs.customer_jp }}
          CM: ${{ steps.inspect.outputs.customer_moji }}
          AS: ${{ steps.inspect.outputs.admin_status }}
          AJ: ${{ steps.inspect.outputs.admin_jp }}
          AM: ${{ steps.inspect.outputs.admin_moji }}
          CT: ${{ steps.inspect.outputs.customer_text }}
          AT: ${{ steps.inspect.outputs.admin_text }}
        shell: bash
        run: |
          body=$(jq -n --arg cs "$CS" --arg cj "$CJ" --arg cm "$CM" --arg as "$AS" --arg aj "$AJ" --arg am "$AM" --arg ct "$CT" --arg at "$AT" '{body:("AKIYA_BROWSER_RENDER_CHECK\nCUSTOMER status="+$cs+" japanese="+$cj+" mojibake="+$cm+" text="+$ct+"\nADMIN status="+$as+" japanese="+$aj+" mojibake="+$am+" text="+$at)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
