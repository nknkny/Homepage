name: Akiya one-shot fallback path repair
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  fix:
    if: github.event.issue.number == 42 && contains(github.event.comment.body, 'RUN_AKIYA_FIX_FALLBACKS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair project-relative form fallbacks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          grep -R -l 'action="/form-unavailable.html"' akiya-pocket --include='*.html' > /tmp/files || true
          cat /tmp/files
          while IFS= read -r f; do [ -n "$f" ] && sed -i 's#action="/form-unavailable.html"#action="form-unavailable.html"#g' "$f"; done < /tmp/files
          if grep -R -n 'action="/form-unavailable.html"' akiya-pocket --include='*.html'; then exit 1; fi
          count=$(git diff --name-only -- akiya-pocket | wc -l | tr -d ' ')
          test "$count" -ge 1
          git add akiya-pocket
          git commit -m 'fix: use project-relative form failure fallbacks'
          git push origin HEAD:main
      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body=$(jq -n '{body:"AKIYA_FALLBACK_REPAIR=PASS"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
