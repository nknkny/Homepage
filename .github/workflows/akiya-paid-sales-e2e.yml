name: Akiya paid-sales production E2E

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    if: github.event.issue.number == 42 && contains(github.event.comment.body, 'RUN_AKIYA_PAID_SALES_E2E')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC: https://nknkny.github.io/Homepage/akiya-pocket
      ORIGIN: https://nknkny.github.io
      API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api
      PAY: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-payment-api
    steps:
      - name: Verify current public sales site
        id: site
        shell: bash
        run: |
          set -euo pipefail
          check(){ local path="$1" marker="$2"; curl -fsSL --max-time 30 "$PUBLIC/$path?v=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/page"; grep -Fq "$marker" "$RUNNER_TEMP/page"; }
          check index.html '空家ポケット'
          check register.html '無料会員登録'
          check member-login.html 'ログイン'
          check request.html '3,480円'
          check checkout.html '3,480円'
          curl -fsSL --max-time 30 "$PUBLIC/assets/config.js?v=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/config.js"
          grep -Fq 'akiya-pocket-api' "$RUNNER_TEMP/config.js"
          grep -Fq 'akiya-pocket-payment-api' "$RUNNER_TEMP/config.js"
          grep -Fq '"https://nknkny.github.io"' "$RUNNER_TEMP/config.js"
          echo 'site_ok=true' >> "$GITHUB_OUTPUT"

      - name: Exercise register request and Stripe handoff
        id: live
        shell: bash
        run: |
          set +e
          email="akiya.e2e.${GITHUB_RUN_ID}@example.invalid"
          password="Akiya-E2E-${GITHUB_RUN_ID}-X9!"
          token=''; rid=''
          api_cors=false; pay_cors=false; pay_ready=false; reg_ok=false; req_ok=false; payment_ok=false; cleanup_ok=true
          cleanup(){
            if [ -n "$token" ]; then
              jq -n --arg id "DEL-$GITHUB_RUN_ID" --arg token "$token" --arg password "$password" '{action:"delete_account",clientRequestId:$id,sessionToken:$token,currentPassword:$password}' > "$RUNNER_TEMP/delete.json"
              curl -sS -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/delete.json" "$API" -o "$RUNNER_TEMP/delete-response.json" >/dev/null 2>&1
              jq -e '.ok==true' "$RUNNER_TEMP/delete-response.json" >/dev/null 2>&1 || cleanup_ok=false
            fi
          }
          trap cleanup EXIT

          code=$(curl -sS -o /dev/null -D "$RUNNER_TEMP/api-headers" -w '%{http_code}' -X OPTIONS -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$API")
          acao=$(grep -i '^access-control-allow-origin:' "$RUNNER_TEMP/api-headers" | head -1 | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//')
          [ "$code" = 204 ] && [ "$acao" = "$ORIGIN" ] && api_cors=true

          code=$(curl -sS -o /dev/null -D "$RUNNER_TEMP/pay-headers" -w '%{http_code}' -X OPTIONS -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$PAY")
          acao=$(grep -i '^access-control-allow-origin:' "$RUNNER_TEMP/pay-headers" | head -1 | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//')
          [ "$code" = 204 ] && [ "$acao" = "$ORIGIN" ] && pay_cors=true

          curl -sS -H "Origin: $ORIGIN" "$PAY" -o "$RUNNER_TEMP/pay-ready.json"
          jq -e '.ok==true and .ready==true and .amountJpy==3480 and .paymentLinkReady==true and .buildVersion=="2026-08-18-payment-bridge-r2"' "$RUNNER_TEMP/pay-ready.json" >/dev/null 2>&1 && pay_ready=true

          jq -n --arg id "REG-$GITHUB_RUN_ID" --arg email "$email" --arg password "$password" '{action:"register_member",clientRequestId:$id,name:"E2E自動テスト",email:$email,password:$password,residencePrefecture:"青森県",propertyPrefecture:"青森県",propertyCity:"青森市",relationship:"所有者",propertyStatus:"空き家",requiredConsent:"yes",marketingOptIn:"no"}' > "$RUNNER_TEMP/register.json"
          reg_http=$(curl -sS -o "$RUNNER_TEMP/register-response.json" -w '%{http_code}' -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/register.json" "$API")
          jq -e '.ok==true and (.sessionToken|length>20) and .buildVersion=="2026-08-14-legal-final-r10"' "$RUNNER_TEMP/register-response.json" >/dev/null 2>&1 && reg_ok=true
          if [ "$reg_ok" = true ]; then token=$(jq -r '.sessionToken' "$RUNNER_TEMP/register-response.json"); fi

          if [ "$reg_ok" = true ]; then
            jq -n --arg id "REQ-$GITHUB_RUN_ID" --arg token "$token" '{action:"create_inspection_request",clientRequestId:$id,sessionToken:$token,propertyAddress:"青森市テスト町1-1（自動E2Eテスト）",requestRelationship:"所有者",propertyStatus:"空き家",accessPermission:"敷地外からの確認のみ",requestConsent:"yes",requestNotes:"自動E2Eテスト。実作業不要。"}' > "$RUNNER_TEMP/request.json"
            req_http=$(curl -sS -o "$RUNNER_TEMP/request-response.json" -w '%{http_code}' -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" "$API")
            jq -e '.ok==true and (.requestId|startswith("AKR-"))' "$RUNNER_TEMP/request-response.json" >/dev/null 2>&1 && req_ok=true
            if [ "$req_ok" = true ]; then rid=$(jq -r '.requestId' "$RUNNER_TEMP/request-response.json"); fi
          else req_http='skipped'; fi

          if [ "$req_ok" = true ]; then
            jq -n --arg id "PAY-$GITHUB_RUN_ID" --arg token "$token" --arg rid "$rid" '{action:"start_card_payment",clientRequestId:$id,sessionToken:$token,requestId:$rid,finalConsent:"yes"}' > "$RUNNER_TEMP/payment.json"
            pay_http=$(curl -sS -o "$RUNNER_TEMP/payment-response.json" -w '%{http_code}' -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/payment.json" "$PAY")
            jq -e '.ok==true and .amountTotal==3480 and .currency=="jpy" and (.paymentUrl|startswith("https://buy.stripe.com/"))' "$RUNNER_TEMP/payment-response.json" >/dev/null 2>&1 && payment_ok=true
          else pay_http='skipped'; fi

          cleanup
          trap - EXIT

          echo "api_cors=$api_cors" >> "$GITHUB_OUTPUT"
          echo "pay_cors=$pay_cors" >> "$GITHUB_OUTPUT"
          echo "pay_ready=$pay_ready" >> "$GITHUB_OUTPUT"
          echo "reg_ok=$reg_ok" >> "$GITHUB_OUTPUT"
          echo "req_ok=$req_ok" >> "$GITHUB_OUTPUT"
          echo "payment_ok=$payment_ok" >> "$GITHUB_OUTPUT"
          echo "cleanup_ok=$cleanup_ok" >> "$GITHUB_OUTPUT"
          echo "request_id=$rid" >> "$GITHUB_OUTPUT"
          echo "reg_http=${reg_http:-}" >> "$GITHUB_OUTPUT"
          echo "req_http=${req_http:-}" >> "$GITHUB_OUTPUT"
          echo "pay_http=${pay_http:-}" >> "$GITHUB_OUTPUT"

          if [ "$api_cors" = true ] && [ "$pay_cors" = true ] && [ "$pay_ready" = true ] && [ "$reg_ok" = true ] && [ "$req_ok" = true ] && [ "$payment_ok" = true ] && [ "$cleanup_ok" = true ]; then exit 0; else exit 1; fi

      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ steps.site.outcome }}
          LIVE: ${{ steps.live.outcome }}
          AC: ${{ steps.live.outputs.api_cors }}
          PC: ${{ steps.live.outputs.pay_cors }}
          PR: ${{ steps.live.outputs.pay_ready }}
          RO: ${{ steps.live.outputs.reg_ok }}
          QO: ${{ steps.live.outputs.req_ok }}
          PO: ${{ steps.live.outputs.payment_ok }}
          CO: ${{ steps.live.outputs.cleanup_ok }}
          RID: ${{ steps.live.outputs.request_id }}
          RH: ${{ steps.live.outputs.reg_http }}
          QH: ${{ steps.live.outputs.req_http }}
          PH: ${{ steps.live.outputs.pay_http }}
        shell: bash
        run: |
          if [ "$SITE" = success ] && [ "$LIVE" = success ]; then result=PASS; else result=FAIL; fi
          body=$(jq -n --arg result "$result" --arg run "$GITHUB_RUN_ID" --arg rid "$RID" --arg site "$SITE" --arg live "$LIVE" --arg ac "$AC" --arg pc "$PC" --arg pr "$PR" --arg ro "$RO" --arg qo "$QO" --arg po "$PO" --arg co "$CO" --arg rh "$RH" --arg qh "$QH" --arg ph "$PH" '{body:("AKIYA_PAID_SALES_E2E="+$result+"\nRUN_ID="+$run+" SITE="+$site+" LIVE="+$live+"\nAPI_CORS="+$ac+" PAY_CORS="+$pc+" PAY_READY="+$pr+" REGISTER="+$ro+"/"+$rh+" REQUEST="+$qo+"/"+$qh+" PAYMENT="+$po+"/"+$ph+" CLEANUP="+$co+"\nREQUEST_ID="+$rid+"\nPUBLIC_URL=https://nknkny.github.io/Homepage/akiya-pocket/")}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
