name: Akiya NTA Public Download Inspector TEMP

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official NTA public download endpoint implementation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://www.invoice-kohyo.nta.go.jp/download/zenken -o /tmp/zenken.html
          curl --fail --silent --show-error --location --max-time 30 https://www.invoice-kohyo.nta.go.jp/js/common.js -o /tmp/common.js
          echo '--- doDownload definition ---'
          sed -n '95,115p' /tmp/zenken.html
          echo '--- doActionLink definition/context ---'
          grep -n -A20 -B5 'function doActionLink' /tmp/common.js || true
          echo '--- personal CSV download identifiers ---'
          grep -n "doDownload('[0-9]*','1','01')" /tmp/zenken.html || true
