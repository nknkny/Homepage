name: Akiya NTA Public Download Inspector TEMP

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect exact official NTA PGP key block
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://www.invoice-kohyo.nta.go.jp/download/pgp_key.html -o /tmp/key.html
          sed -n '168,198p' /tmp/key.html
