name: Akiya NTA Public Download Inspector TEMP

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect official NTA differential download page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://www.invoice-kohyo.nta.go.jp/download/sabun -o /tmp/sabun.html
          echo '--- doDownload definition ---'
          grep -n -A12 -B3 'function doDownload' /tmp/sabun.html || true
          echo '--- CSV download calls and date context ---'
          grep -n -B8 -A8 "doDownload('[0-9].*'01')" /tmp/sabun.html | tail -500 || true
          echo '--- dates and labels ---'
          grep -nE '2026|令和8|CSV|zip|差分' /tmp/sabun.html | tail -500 || true
