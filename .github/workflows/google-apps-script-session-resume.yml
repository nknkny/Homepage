name: Google Apps Script Bound Resolve

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_PROJECT_KEY: Mr8jtt7g-n-GmM5Z7OVWja83LjTh8Dp91
      LISTED_SCRIPT_ID: 1hpIpog0lvz8usrIQiLBuB8LwBuXsfIOzPyY_omFQF-KRYn0B6PgETqKp
      TARGET_DEPLOYMENT: AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w
      OWNER_EMAIL: jmdjdtdjdt@gmail.com
    steps:
      - name: Restore encrypted clasp session
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout "$RUNNER_TEMP/resume-key.pem" \
            -out "$RUNNER_TEMP/resume-cert.pem" \
            -subj "/CN=akiya-bound-resolve-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1
          cert=$(base64 -w0 "$RUNNER_TEMP/resume-cert.pem")
          file=".github/auth/resume-${GITHUB_RUN_ID}.b64"
          body=$(jq -n --arg r "$GITHUB_RUN_ID" --arg c "$cert" --arg f "$file" \
            '{body:("GOOGLE_SESSION_RESUME_READY\nRUN_ID="+$r+"\nAUTH_CERT_B64="+$c+"\nAUTH_FILE="+$f)}')
          curl -fsSL --retry 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            -d "$body" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          enc=''
          for _ in $(seq 1 900); do
            ref=$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["HEAD_REF"],safe=""))')
            url="https://api.github.com/repos/$REPO/contents/$file?ref=$ref"
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" -o "$RUNNER_TEMP/session-file.json" 2>/dev/null; then
              enc=$(jq -r '.content // empty' "$RUNNER_TEMP/session-file.json" | tr -d '\n' | base64 -d 2>/dev/null || true)
              [ -n "$enc" ] && break
            fi
            sleep 1
          done
          test -n "$enc"
          printf '%s' "$enc" | base64 -d > "$RUNNER_TEMP/session.cms"
          openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/session.cms" \
            -recip "$RUNNER_TEMP/resume-cert.pem" -inkey "$RUNNER_TEMP/resume-key.pem" \
            -out "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo SESSION_RESTORED=PASS

      - name: Resolve legacy project key to canonical script
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/gcli" @google/clasp@3.3.0 >/dev/null 2>&1
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          "$CLASP" show-authorized-user --json > "$RUNNER_TEMP/user.json"
          jq -e --arg e "$OWNER_EMAIL" '.loggedIn==true and ((.email // "")|ascii_downcase)==($e|ascii_downcase)' "$RUNNER_TEMP/user.json" >/dev/null
          echo OWNER_MATCH=PASS

          for label in legacy listed; do
            if [ "$label" = legacy ]; then sid="$OLD_PROJECT_KEY"; else sid="$LISTED_SCRIPT_ID"; fi
            dir="$RUNNER_TEMP/$label"
            mkdir -p "$dir"
            cd "$dir"
            echo "=== $label clone input: $sid ==="
            "$CLASP" clone-script "$sid" > clone.out 2> clone.err
            echo CLONE=PASS
            echo CLASP_JSON_BEGIN
            cat .clasp.json
            echo CLASP_JSON_END
            echo FILES_BEGIN
            find . -maxdepth 2 -type f -printf '%P\n' | sort
            echo FILES_END
            echo DEPLOYMENTS_BEGIN
            "$CLASP" --json list-deployments || true
            echo DEPLOYMENTS_END
            echo SOURCE_MARKERS_BEGIN
            grep -RhoE "2026-[0-9]{2}-[0-9]{2}-[A-Za-z0-9_-]+|AKfycb[A-Za-z0-9_-]+|12nRr3Fkq8tYZWd-MQvdQXpeO9p9cGuT3CvtRnL_omw8" . --exclude='.clasp.json' | sort -u | head -100 || true
            echo SOURCE_MARKERS_END
          done

          legacy_id=$(jq -r '.scriptId // empty' "$RUNNER_TEMP/legacy/.clasp.json")
          listed_id=$(jq -r '.scriptId // empty' "$RUNNER_TEMP/listed/.clasp.json")
          echo "LEGACY_CANONICAL_SCRIPT_ID=$legacy_id"
          echo "LISTED_CANONICAL_SCRIPT_ID=$listed_id"
          if (cd "$RUNNER_TEMP/legacy" && "$CLASP" --json list-deployments | grep -Fq "$TARGET_DEPLOYMENT"); then
            echo TARGET_DEPLOYMENT_FOUND_IN_LEGACY=PASS
          else
            echo TARGET_DEPLOYMENT_FOUND_IN_LEGACY=FAIL
          fi
