name: Field Ops Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'field-ops/**'
      - '.github/workflows/field-ops-cloudflare-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: field-ops-cloudflare-pages
  cancel-in-progress: true
jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate site
        shell: bash
        run: |
          set -euo pipefail
          test -s field-ops/index.html
          test -s field-ops/_headers
          grep -Fq '現地に行かないと' field-ops/index.html
          grep -Fq '5,000' field-ops/index.html
          grep -Fq '4,000 × 拠点数' field-ops/index.html
          grep -Fq '時間課金は採用しません' field-ops/index.html
          grep -Fq 'Content-Security-Policy:' field-ops/_headers
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.h1=0
              def handle_starttag(self,t,a):
                  if t=='h1': self.h1+=1
          x=P(); x.feed(Path('field-ops/index.html').read_text(encoding='utf-8'))
          assert x.h1==1, x.h1
          print('FIELD_OPS_STATIC_VALIDATION=PASS')
          PY
      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo 'configured=true' >> "$GITHUB_OUTPUT"; else echo 'configured=false' >> "$GITHUB_OUTPUT"; fi
      - name: Create Pages project if needed
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 whoami >/dev/null
          if ! npx --yes wrangler@4.119.0 pages project list --json | jq -e '.[] | select(.name=="field-ops-aomori")' >/dev/null; then
            npx --yes wrangler@4.119.0 pages project create field-ops-aomori --production-branch main
          fi
      - name: Deploy
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deploy field-ops --project-name field-ops-aomori --branch main --commit-hash "$GITHUB_SHA" --commit-message 'FIELD OPS production deploy'
      - name: Verify production
        if: steps.cf.outputs.configured == 'true'
        run: |
          set -euo pipefail
          origin='https://field-ops-aomori.pages.dev'
          for i in $(seq 1 18); do
            if curl -fsSL --max-time 20 "$origin/?v=$GITHUB_RUN_ID-$i" -o /tmp/index.html && grep -Fq '現地に行かないと' /tmp/index.html; then break; fi
            sleep 5
          done
          grep -Fq '25,000円' /tmp/index.html
          curl -fsSL -D /tmp/h -o /dev/null "$origin/"
          tr -d '\r' < /tmp/h >/tmp/hn
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' /tmp/hn
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' /tmp/hn
          grep -Eiq '^content-security-policy:' /tmp/hn
          echo 'FIELD_OPS_PRODUCTION_VERIFY=PASS'
