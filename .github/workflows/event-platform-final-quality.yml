name: Event Platform Final Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'event-platform/**'
      - '.github/workflows/event-platform-final-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-platform-final-quality
  cancel-in-progress: true

env:
  PREVIEW_URL: https://nknkny.github.io/Homepage/event-platform/
  API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/localspace-api

jobs:
  final-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate source and legal boundaries
        shell: bash
        run: |
          set -euo pipefail
          for file in event-platform/app.js event-platform/app-data.js event-platform/app-render.js event-platform/app-form.js event-platform/app-dashboard.js event-platform/app-init.js event-platform/browser-e2e.mjs; do node --check "$file"; done
          grep -Fq 'noindex,nofollow,noarchive' event-platform/index.html
          grep -Fq '第一者利用計測' event-platform/privacy.html
          grep -Fq 'auditLegalPages' event-platform/browser-e2e.mjs
          grep -Fq '.btn.light{color:#912018}' event-platform/enterprise.css
          grep -Fq "frame-ancestors 'none'" event-platform/_headers
          ! grep -Fq "frame-ancestors 'none'" event-platform/index.html
          ! grep -R -E 'sk_(live|test)_[A-Za-z0-9]+|sb_secret_[A-Za-z0-9_-]+|whsec_[A-Za-z0-9]+' event-platform
          git diff --check

      - name: Verify live API safety scope
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$API_URL?action=health" -o /tmp/api-health.json
          jq -e '.ok==true' /tmp/api-health.json
          jq -e '.structuredGeography==true and .serverKeywordSearch==true and .cityStats==true and .imageSignatureValidation==true and .accountDeletion==true' /tmp/api-health.json
          jq -e '.commercialPayments==false and .successFee==false and .booking==false and .privateMessaging==false and .employmentMatching==false and .realEstateBrokerage==false and .underlyingPayments==false' /tmp/api-health.json

      - name: Wait for and verify GitHub Pages preview
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            code=$(curl --silent --show-error --location --max-time 30 -o /tmp/site.html -w '%{http_code}' "$PREVIEW_URL?quality=$GITHUB_RUN_ID-$i" || true)
            if [ "$code" = '200' ] && grep -Fq 'enterprise.css" data-enterprise-layer' /tmp/site.html && grep -Fq 'noindex,nofollow,noarchive' /tmp/site.html; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = '1'

      - name: Install Chromium audit runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run desktop mobile legal and accessibility audit
        shell: bash
        run: |
          set -euo pipefail
          node event-platform/browser-e2e.mjs

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-platform-final-quality-${{ github.run_id }}
          path: |
            /tmp/api-health.json
            /tmp/site.html
            /tmp/event-platform-home-desktop.png
            /tmp/event-platform-home-mobile.png
            /tmp/event-platform-desktop.png
            /tmp/event-platform-mobile.png
            /tmp/event-platform-legal-desktop.png
            /tmp/event-platform-legal-mobile.png
          if-no-files-found: ignore
          retention-days: 14
