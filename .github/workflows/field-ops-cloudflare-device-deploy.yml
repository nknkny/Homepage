name: 現場ポート Cloudflare device deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/field-ops-cloudflare-device-deploy.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: genbaport-cloudflare-device-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 42 && contains(github.event.comment.body, 'START_GENBAPORT_CF_DEPLOY'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html site.css app.js 404.html privacy.html terms.html sample-report.html sample-report.pdf favicon.svg apple-touch-icon.png og-image.png site.webmanifest robots.txt sitemap.xml _headers; do test -s "field-ops/$f"; done
          test -s field-ops-legacy/_redirects
          node --check field-ops/app.js
          grep -Fq '現場ポート' field-ops/index.html
          grep -Fq 'genbaport@gmail.com' field-ops/index.html
          grep -Fq '9,000円〜（税別）' field-ops/index.html
          grep -Fq '青森市内の追加交通費なし' field-ops/index.html
          grep -Fq '月末締め翌月末払い' field-ops/index.html
          grep -Fq '振込手数料は発注者様' field-ops/index.html
          grep -Fq 'PDF報告書＋元写真' field-ops/index.html
          ! grep -Fq 'aomori.akiya.rescue@gmail.com' field-ops/index.html
          ! grep -Fq 'Phase 0' field-ops/index.html
          source_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$source_sha" > field-ops/build-id.txt
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "GENBAPORT_DEPLOY_BUILD=$source_sha"

      - name: Cloudflare device authorization
        id: auth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-login.log"; clean="$RUNNER_TEMP/wrangler-login-clean.log"; : > "$log"
          (CI='' npx --yes wrangler@4.119.0 login --device --browser=false >"$log" 2>&1) & pid=$!
          url=''; code=''
          for n in $(seq 1 60); do
            perl -pe 's/\e\[[0-9;]*[mK]//g' "$log" > "$clean" || true
            url=$(grep -Eo 'https://dash\.cloudflare\.com/oauth2/device(/verify)?' "$clean" | tail -1 || true)
            code=$(grep -Eo '([A-Za-z0-9]{4}-[A-Za-z0-9]{4}|[A-Za-z0-9]{8})' "$clean" | tail -1 || true)
            if [ -n "$url" ] && [ -n "$code" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ -z "$url" ] || [ -z "$code" ]; then cat "$clean" || true; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; exit 1; fi
          complete_url="${url}?user_code=${code}"
          body=$(jq -n --arg url "$complete_url" --arg code "$code" --arg run "$GITHUB_RUN_ID" '{body:("GENBAPORT_CF_AUTH_READY\nURL="+$url+"\nCODE="+$code+"\nRUN_ID="+$run+"\nEXPIRES_IN_APPROX=5_MINUTES")}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
          wait "$pid"
          CI='' npx --yes wrangler@4.119.0 whoami >/dev/null
          rm -f "$log" "$clean"

      - name: Ensure canonical project
        shell: bash
        run: |
          set -euo pipefail
          if ! CI='' npx --yes wrangler@4.119.0 pages project list | grep -Fq 'genbaport'; then
            CI='' npx --yes wrangler@4.119.0 pages project create genbaport --production-branch main
          fi

      - name: Deploy canonical
        shell: bash
        run: |
          set -euo pipefail
          CI='' npx --yes wrangler@4.119.0 pages deploy field-ops --project-name genbaport --branch main --commit-hash "$SOURCE_SHA" --commit-message '現場ポート production deploy' --commit-dirty=true

      - name: Redirect legacy host
        shell: bash
        run: |
          set -euo pipefail
          if CI='' npx --yes wrangler@4.119.0 pages project list | grep -Fq 'field-ops-aomori'; then
            CI='' npx --yes wrangler@4.119.0 pages deploy field-ops-legacy --project-name field-ops-aomori --branch main --commit-hash "$SOURCE_SHA" --commit-message 'Redirect legacy host to 現場ポート' --commit-dirty=true
          fi

      - name: Verify exact production build
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          origin='https://genbaport.pages.dev'
          legacy='https://field-ops-aomori.pages.dev'
          expected="$SOURCE_SHA"

          fail() {
            echo "GENBAPORT_VERIFY_FAILURE: $*" >&2
            exit 1
          }

          echo "VERIFY_EXPECTED_SHA=$expected"
          ok=0
          actual=''
          for i in $(seq 1 36); do
            actual=$(curl -fsSL --max-time 20 "$origin/build-id.txt?v=$GITHUB_RUN_ID-$i" 2>/dev/null | tr -d '\r\n' || true)
            if [ "$actual" = "$expected" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" = 1 ] || fail "canonical build-id mismatch: expected=$expected actual=$actual"
          echo 'VERIFY_CANONICAL_BUILD_ID=PASS'

          curl -fsSL --max-time 20 "$origin/?v=$GITHUB_RUN_ID" -o /tmp/index.html || fail 'canonical root fetch failed'
          for s in '現場ポート' 'genbaport@gmail.com' '9,000円〜（税別）' '月末締め翌月末払い' '振込手数料は発注者様' 'PDF報告書＋元写真'; do
            grep -Fq "$s" /tmp/index.html || fail "canonical root missing expected text: $s"
          done
          ! grep -Fq 'Phase 0' /tmp/index.html || fail 'canonical root still contains Phase 0'
          echo 'VERIFY_CANONICAL_CONTENT=PASS'

          for p in /privacy.html /terms.html /sample-report.html /sample-report.pdf /site.css /app.js /favicon.svg /apple-touch-icon.png /og-image.png /site.webmanifest /robots.txt /sitemap.xml; do
            curl -fsSL --max-time 20 -o /dev/null "$origin$p" || fail "asset fetch failed: $p"
          done
          echo 'VERIFY_ASSETS=PASS'

          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$origin/__genbaport_missing_test__" || true)"
          [ "$code" = 404 ] || fail "404 check returned HTTP $code"
          echo 'VERIFY_404=PASS'

          curl -fsSL --max-time 20 -D /tmp/h -o /dev/null "$origin/" || fail 'header fetch failed'
          tr -d '\r' < /tmp/h > /tmp/hn
          grep -Eiq '^content-security-policy:.*script-src.*self' /tmp/hn || fail 'CSP header missing or invalid'
          grep -Eiq '^strict-transport-security:.*max-age=' /tmp/hn || fail 'HSTS header missing'
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' /tmp/hn || fail 'X-Content-Type-Options header missing'
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' /tmp/hn || fail 'X-Frame-Options header missing'
          echo 'VERIFY_SECURITY_HEADERS=PASS'

          legacy_ok=0
          legacy_code=''
          legacy_loc=''
          for i in $(seq 1 36); do
            curl -sS --max-time 20 -D /tmp/lh -o /dev/null "$legacy/test-path?v=$GITHUB_RUN_ID-$i" || true
            tr -d '\r' < /tmp/lh > /tmp/lhn || true
            legacy_code=$(awk 'NR==1{print $2}' /tmp/lhn 2>/dev/null || true)
            legacy_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{print $2; exit}' /tmp/lhn 2>/dev/null || true)
            if [ "$legacy_code" = 301 ] && { [ "$legacy_loc" = 'https://genbaport.pages.dev/test-path?v='"$GITHUB_RUN_ID-$i" ] || [ "$legacy_loc" = 'https://genbaport.pages.dev/test-path' ]; }; then
              legacy_ok=1
              break
            fi
            sleep 5
          done
          [ "$legacy_ok" = 1 ] || fail "legacy redirect mismatch: HTTP=$legacy_code location=$legacy_loc"
          echo 'VERIFY_LEGACY_301=PASS'

          echo 'GENBAPORT_EXACT_PRODUCTION_VERIFY=PASS'

      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH: ${{ steps.auth.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg a "$AUTH" --arg v "$VERIFY" --arg run "$GITHUB_RUN_ID" --arg sha "${SOURCE_SHA:-unknown}" '{body:("GENBAPORT_CF_DEVICE_RUN_FINISHED\nRUN_ID="+$run+"\nSOURCE_SHA="+$sha+"\nAUTH="+$a+"\nVERIFY="+$v)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
