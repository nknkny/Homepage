name: 現場ポート Cloudflare device deploy

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: genbaport-cloudflare-device-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 42 && contains(github.event.comment.body, 'START_GENBAPORT_CF_DEPLOY'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -s field-ops/index.html
          test -s field-ops/build-id.txt
          test -s field-ops-legacy/_redirects
          node --check field-ops/app.js
          grep -Fq '現場ポート' field-ops/index.html
          grep -Fq 'genbaport@gmail.com' field-ops/index.html
          grep -Fq '月末締め翌月末払い' field-ops/index.html
          ! grep -Fq 'aomori.akiya.rescue@gmail.com' field-ops/index.html
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path('field-ops')
          files=['index.html','site.css','app.js','404.html','privacy.html','terms.html','sample-report.html','sample-report.pdf','favicon.svg','apple-touch-icon.png','og-image.png','site.webmanifest','robots.txt','sitemap.xml','_headers']
          h=sha256()
          for fn in files:
              b=(root/fn).read_bytes(); h.update(fn.encode()+b'\0'+b+b'\0')
          expected=(root/'build-id.txt').read_text().strip()
          assert h.hexdigest()==expected,(h.hexdigest(),expected)
          print('GENBAPORT_BUILD_ID_SOURCE_MATCH=PASS')
          PY

      - name: Cloudflare device authorization
        id: auth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-login.log"; clean="$RUNNER_TEMP/wrangler-login-clean.log"; : > "$log"
          (CI='' npx --yes wrangler@4.119.0 login --device --browser=false >"$log" 2>&1) & pid=$!
          url=''; code=''
          for n in $(seq 1 60); do
            perl -pe 's/\e\[[0-9;]*[mK]//g' "$log" > "$clean" || true
            url=$(grep -Eo 'https://dash\.cloudflare\.com/oauth2/device(/verify)?' "$clean" | tail -1 || true)
            code=$(grep -Eo '([A-Za-z0-9]{4}-[A-Za-z0-9]{4}|[A-Za-z0-9]{8})' "$clean" | tail -1 || true)
            if [ -n "$url" ] && [ -n "$code" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ -z "$url" ] || [ -z "$code" ]; then cat "$clean" || true; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; exit 1; fi
          complete_url="${url}?user_code=${code}"
          body=$(jq -n --arg url "$complete_url" --arg code "$code" --arg run "$GITHUB_RUN_ID" '{body:("GENBAPORT_CF_AUTH_READY\nURL="+$url+"\nCODE="+$code+"\nRUN_ID="+$run+"\nEXPIRES_IN_APPROX=5_MINUTES")}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
          wait "$pid"; CI='' npx --yes wrangler@4.119.0 whoami >/dev/null; rm -f "$log" "$clean"

      - name: Ensure canonical project
        shell: bash
        run: |
          set -euo pipefail
          if ! CI='' npx --yes wrangler@4.119.0 pages project list | grep -Fq 'genbaport'; then CI='' npx --yes wrangler@4.119.0 pages project create genbaport --production-branch main; fi

      - name: Deploy canonical
        shell: bash
        run: |
          set -euo pipefail
          CI='' npx --yes wrangler@4.119.0 pages deploy field-ops --project-name genbaport --branch main --commit-hash "$GITHUB_SHA" --commit-message '現場ポート production deploy'

      - name: Redirect legacy host
        shell: bash
        run: |
          set -euo pipefail
          if CI='' npx --yes wrangler@4.119.0 pages project list | grep -Fq 'field-ops-aomori'; then CI='' npx --yes wrangler@4.119.0 pages deploy field-ops-legacy --project-name field-ops-aomori --branch main --commit-hash "$GITHUB_SHA" --commit-message 'Redirect legacy host to 現場ポート'; fi

      - name: Verify exact production build
        shell: bash
        run: |
          set -euo pipefail
          origin='https://genbaport.pages.dev'; expected="$(tr -d '\r\n' < field-ops/build-id.txt)"; ok=0
          for i in $(seq 1 36); do
            if actual=$(curl -fsSL --max-time 20 "$origin/build-id.txt?v=$GITHUB_RUN_ID-$i" 2>/dev/null | tr -d '\r\n') && [ "$actual" = "$expected" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsSL "$origin/?v=$GITHUB_RUN_ID" -o /tmp/index.html
          for s in '現場ポート' 'genbaport@gmail.com' '9,000円〜（税別）' '月末締め翌月末払い' '振込手数料は発注者様' 'PDF報告書＋元写真'; do grep -Fq "$s" /tmp/index.html; done
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/__genbaport_missing_test__")"; test "$code" = 404
          legacy='https://field-ops-aomori.pages.dev'; if curl -fsSI --max-time 20 "$legacy/test-path" -o /tmp/lh; then grep -Eiq '^location:[[:space:]]*https://genbaport\.pages\.dev/test-path' /tmp/lh; fi
          echo 'GENBAPORT_EXACT_PRODUCTION_VERIFY=PASS'

      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH: ${{ steps.auth.outcome }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg a "$AUTH" --arg run "$GITHUB_RUN_ID" '{body:("GENBAPORT_CF_DEVICE_RUN_FINISHED\nRUN_ID="+$run+"\nAUTH="+$a+"\nCHECK_ACTIONS_RUN_FOR_FINAL_RESULT")}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
