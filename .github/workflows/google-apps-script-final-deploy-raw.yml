name: Google Apps Script Final Deduplicated Deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRIPT_ID: 1pHn5wId7xIMZ3iwNqSqpePLf6eSMuiagDfvCktAZepSfpxQ0JgWcWhZp
      TARGET_DEPLOYMENT: AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w
      EXPECTED_DIRTY_SHA256: 5e694ab3be198c887f6372110733609450ad4abf2c970751d33c354638ec56dd
      EXPECTED_CLEAN_SHA256: 9dba6c727262a63e54d10514a76d410476793267e3b079c8b219dcbe4a9657ef
      EXPECTED_BUILD: 2026-08-06-insurance-optional
      SPREADSHEET_ID: 12nRr3Fkq8tYZWd-MQvdQXpeO9p9cGuT3CvtRnL_omw8
      API_URL: https://script.google.com/macros/s/AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w/exec
      OWNER_EMAIL: jmdjdtdjdt@gmail.com
      BRANCH: agent/auth-cli-bundle-20260807
      CLEAN_ARTIFACT_ID: 8988607496
    steps:
      - name: Restore encrypted saved Google session
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -subj "/CN=akiya-final-dedupe-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1
          cert=$(base64 -w0 "$RUNNER_TEMP/cert.pem")
          file=".github/auth/final-${GITHUB_RUN_ID}.b64"
          body=$(jq -n --arg r "$GITHUB_RUN_ID" --arg c "$cert" --arg f "$file" \
            '{body:("GOOGLE_FINAL_DEDUPE_SESSION_READY\nRUN_ID="+$r+"\nAUTH_CERT_B64="+$c+"\nAUTH_FILE="+$f)}')
          curl -fsSL --retry 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' -d "$body" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          enc=''
          for i in $(seq 1 300); do
            url="https://raw.githubusercontent.com/nknkny/Homepage/$BRANCH/$file?run=$GITHUB_RUN_ID&i=$i"
            if enc=$(curl -fsSL --retry 2 --retry-all-errors -H 'Cache-Control: no-cache' "$url" 2>/dev/null); then
              [ -n "$enc" ] && break
            fi
            sleep 1
          done
          test -n "$enc"
          printf '%s' "$enc" | base64 -d > "$RUNNER_TEMP/session.cms"
          openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/session.cms" \
            -recip "$RUNNER_TEMP/cert.pem" -inkey "$RUNNER_TEMP/key.pem" \
            -out "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo SESSION_RESTORED=PASS

      - name: Verify owner target deployment and current dirty HEAD
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/gcli" @google/clasp@3.3.0 >/dev/null 2>&1
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          "$CLASP" show-authorized-user --json > "$RUNNER_TEMP/user.json"
          jq -e --arg e "$OWNER_EMAIL" '.loggedIn==true and ((.email // "")|ascii_downcase)==($e|ascii_downcase)' "$RUNNER_TEMP/user.json" >/dev/null
          echo OWNER_MATCH=PASS
          mkdir -p "$RUNNER_TEMP/target"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > "$RUNNER_TEMP/target/.clasp.json"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json list-deployments > "$RUNNER_TEMP/deployments-before.json"
          grep -Fq "$TARGET_DEPLOYMENT" "$RUNNER_TEMP/deployments-before.json"
          echo TARGET_DEPLOYMENT_OWNERSHIP=PASS
          access_token=$(jq -r '.tokens.default.access_token // empty' "$HOME/.clasprc.json")
          curl -fsSL -H "Authorization: Bearer $access_token" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" -o "$RUNNER_TEMP/head-before.json"
          python - "$RUNNER_TEMP/head-before.json" "$EXPECTED_DIRTY_SHA256" "$EXPECTED_BUILD" "$SPREADSHEET_ID" <<'PY'
          import json,hashlib,sys
          p,h,b,s=sys.argv[1:]
          x=json.load(open(p,encoding='utf-8'))
          srcs=[f.get('source','') for f in x.get('files',[]) if f.get('type')=='SERVER_JS']
          assert len(srcs)==1
          src=srcs[0]
          actual=hashlib.sha256(src.encode()).hexdigest()
          print('CURRENT_HEAD_SHA256='+actual)
          assert actual==h,(actual,h)
          assert b in src and s in src
          print('CURRENT_DIRTY_HEAD_VERIFIED=PASS')
          PY

      - name: Download and verify exact approved clean artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/artifacts/$CLEAN_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/clean.zip"
          mkdir -p "$RUNNER_TEMP/clean"
          unzip -q "$RUNNER_TEMP/clean.zip" -d "$RUNNER_TEMP/clean"
          find "$RUNNER_TEMP/clean" -maxdepth 2 -type f -printf '%P\n' | sort
          code=$(find "$RUNNER_TEMP/clean" -type f -name 'apps-script-approved-clean-Code.gs' -print -quit)
          content=$(find "$RUNNER_TEMP/clean" -type f -name 'apps-script-approved-clean-content.json' -print -quit)
          test -n "$code" -a -n "$content"
          python - "$code" "$content" "$EXPECTED_CLEAN_SHA256" "$EXPECTED_BUILD" "$SPREADSHEET_ID" <<'PY'
          import json,hashlib,re,sys
          code,content,h,b,s=sys.argv[1:]
          src=open(code,encoding='utf-8').read()
          actual=hashlib.sha256(src.encode()).hexdigest()
          print('APPROVED_CLEAN_SHA256='+actual)
          assert actual==h,(actual,h)
          assert b in src and s in src
          names=re.findall(r'^function\s+([A-Za-z_$][\w$]*)\s*\(',src,flags=re.M)
          assert len(names)==151 and len(set(names))==151
          x=json.load(open(content,encoding='utf-8'))
          server=[f for f in x.get('files',[]) if f.get('type')=='SERVER_JS']
          assert len(server)==1 and server[0].get('source','')==src
          print('APPROVED_ARTIFACT=PASS FUNCTIONS=151 UNIQUE=151 DUPLICATES=0')
          PY
          cp "$code" "$RUNNER_TEMP/approved-Code.gs"
          cp "$content" "$RUNNER_TEMP/approved-content.json"

      - name: Write clean HEAD and print full Google response
        shell: bash
        run: |
          set -euo pipefail
          access_token=$(jq -r '.tokens.default.access_token // empty' "$HOME/.clasprc.json")
          http=$(curl -sS -X PUT \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @"$RUNNER_TEMP/approved-content.json" \
            -o "$RUNNER_TEMP/update-response.json" -w '%{http_code}' \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          echo "UPDATE_CONTENT_HTTP=$http"
          cat "$RUNNER_TEMP/update-response.json"
          if [ "$http" != 200 ]; then
            echo APPS_SCRIPT_WRITE_FAILED=TRUE
            exit 42
          fi
          jq -e --arg id "$SCRIPT_ID" '.scriptId==$id' "$RUNNER_TEMP/update-response.json" >/dev/null
          echo HEAD_UPDATE=PASS

          curl -fsSL -H "Authorization: Bearer $access_token" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" -o "$RUNNER_TEMP/head-after.json"
          python - "$RUNNER_TEMP/head-after.json" "$EXPECTED_CLEAN_SHA256" <<'PY'
          import json,hashlib,re,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          srcs=[f.get('source','') for f in x.get('files',[]) if f.get('type')=='SERVER_JS']
          assert len(srcs)==1
          src=srcs[0]
          actual=hashlib.sha256(src.encode()).hexdigest()
          print('POST_WRITE_HEAD_SHA256='+actual)
          assert actual==sys.argv[2]
          names=re.findall(r'^function\s+([A-Za-z_$][\w$]*)\s*\(',src,flags=re.M)
          assert len(names)==151 and len(set(names))==151
          print('HEAD_POST_WRITE_VERIFIED=PASS')
          PY

      - name: Update exact existing production deployment
        shell: bash
        run: |
          set -euo pipefail
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json update-deployment \
            "$TARGET_DEPLOYMENT" --description 'Production recovery 2026-08-07 approved deduplicated source' \
            > "$RUNNER_TEMP/update-deployment.json"
          cat "$RUNNER_TEMP/update-deployment.json"
          grep -Fq "$TARGET_DEPLOYMENT" "$RUNNER_TEMP/update-deployment.json"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json list-deployments > "$RUNNER_TEMP/deployments-after.json"
          jq -r --arg d "$TARGET_DEPLOYMENT" '.[] | select(.deploymentId==$d)' "$RUNNER_TEMP/deployments-after.json"
          echo EXISTING_DEPLOYMENT_UPDATED=PASS

      - name: Verify fixed production exec
        shell: bash
        run: |
          set -euo pipefail
          ok=''
          for _ in $(seq 1 40); do
            if curl -fsSL --location --max-time 30 "$API_URL?recovery=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.json" 2>/dev/null; then
              if jq -e --arg b "$EXPECTED_BUILD" '.buildVersion==$b and .app=="空き家レスキュー会員管理" and .ready==true' "$RUNNER_TEMP/live.json" >/dev/null 2>&1; then ok=1; break; fi
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/live.json"
          test -n "$ok"
          echo APPS_SCRIPT_PRODUCTION_RECOVERY=PASS
