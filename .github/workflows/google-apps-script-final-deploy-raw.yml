name: Google Apps Script Final Deduplicated Deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRIPT_ID: 1pHn5wId7xIMZ3iwNqSqpePLf6eSMuiagDfvCktAZepSfpxQ0JgWcWhZp
      TARGET_DEPLOYMENT: AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w
      EXPECTED_DIRTY_SHA256: 5e694ab3be198c887f6372110733609450ad4abf2c970751d33c354638ec56dd
      EXPECTED_CLEAN_SHA256: 9dba6c727262a63e54d10514a76d410476793267e3b079c8b219dcbe4a9657ef
      EXPECTED_BUILD: 2026-08-06-insurance-optional
      SPREADSHEET_ID: 12nRr3Fkq8tYZWd-MQvdQXpeO9p9cGuT3CvtRnL_omw8
      API_URL: https://script.google.com/macros/s/AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w/exec
      OWNER_EMAIL: jmdjdtdjdt@gmail.com
      BRANCH: agent/auth-cli-bundle-20260807
    steps:
      - name: Prepare encrypted saved-session channel
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -subj "/CN=akiya-final-dedupe-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1
          cert=$(base64 -w0 "$RUNNER_TEMP/cert.pem")
          file=".github/auth/final-${GITHUB_RUN_ID}.b64"
          body=$(jq -n --arg r "$GITHUB_RUN_ID" --arg c "$cert" --arg f "$file" \
            '{body:("GOOGLE_FINAL_DEDUPE_SESSION_READY\nRUN_ID="+$r+"\nAUTH_CERT_B64="+$c+"\nAUTH_FILE="+$f)}')
          curl -fsSL --retry 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' -d "$body" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          echo SESSION_CHANNEL_READY=PASS

          enc=''
          for i in $(seq 1 300); do
            url="https://raw.githubusercontent.com/nknkny/Homepage/$BRANCH/$file?run=$GITHUB_RUN_ID&i=$i"
            if enc=$(curl -fsSL --retry 2 --retry-all-errors -H 'Cache-Control: no-cache' "$url" 2>/dev/null); then
              [ -n "$enc" ] && break
            fi
            sleep 1
          done
          test -n "$enc"
          printf '%s' "$enc" | base64 -d > "$RUNNER_TEMP/session.cms"
          openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/session.cms" \
            -recip "$RUNNER_TEMP/cert.pem" -inkey "$RUNNER_TEMP/key.pem" \
            -out "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo SESSION_RESTORED=PASS

      - name: Verify exact production project and capture current HEAD
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/gcli" @google/clasp@3.3.0 >/dev/null 2>&1
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          "$CLASP" show-authorized-user --json > "$RUNNER_TEMP/user.json"
          jq -e --arg e "$OWNER_EMAIL" \
            '.loggedIn==true and ((.email // "")|ascii_downcase)==($e|ascii_downcase)' \
            "$RUNNER_TEMP/user.json" >/dev/null
          echo OWNER_MATCH=PASS

          mkdir -p "$RUNNER_TEMP/target"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > "$RUNNER_TEMP/target/.clasp.json"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json list-deployments \
            > "$RUNNER_TEMP/deployments-before.json"
          cat "$RUNNER_TEMP/deployments-before.json"
          grep -Fq "$TARGET_DEPLOYMENT" "$RUNNER_TEMP/deployments-before.json"
          before_version=$(jq -r --arg d "$TARGET_DEPLOYMENT" \
            '.[] | select(.deploymentId==$d) | .versionNumber // empty' \
            "$RUNNER_TEMP/deployments-before.json")
          test -n "$before_version"
          echo "TARGET_DEPLOYMENT_OWNERSHIP=PASS version=$before_version"

          access_token=$(jq -r '.tokens.default.access_token // empty' "$HOME/.clasprc.json")
          test -n "$access_token"
          curl -fsSL -H "Authorization: Bearer $access_token" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" \
            -o "$RUNNER_TEMP/head-before.json"
          cp "$RUNNER_TEMP/head-before.json" "$GITHUB_WORKSPACE/apps-script-head-before.json"

      - name: Build exact approved deduplicated source
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/head-before.json" "$RUNNER_TEMP/clean-content.json" \
            "$EXPECTED_DIRTY_SHA256" "$EXPECTED_CLEAN_SHA256" "$EXPECTED_BUILD" "$SPREADSHEET_ID" <<'PY'
          import json, hashlib, re, sys
          src_path, out_path, dirty_hash, clean_hash, build, sheet = sys.argv[1:]
          project = json.load(open(src_path, encoding='utf-8'))
          server = [f for f in project.get('files', []) if f.get('type') == 'SERVER_JS']
          manifest = [f for f in project.get('files', []) if f.get('type') == 'JSON']
          assert len(server) == 1, f'unexpected SERVER_JS count: {len(server)}'
          assert len(manifest) == 1, f'unexpected manifest count: {len(manifest)}'
          src = server[0].get('source', '')
          actual_dirty = hashlib.sha256(src.encode()).hexdigest()
          print('DIRTY_HEAD_SHA256=' + actual_dirty)
          assert actual_dirty == dirty_hash, (actual_dirty, dirty_hash)
          assert build in src and sheet in src

          # These are the eight insertion blocks proven by exact local diff.
          # Removing them removes nine stale duplicate function declarations.
          ranges = [(75,148),(226,231),(437,438),(625,638),
                    (663,705),(811,823),(824,830),(1092,1093)]
          lines = src.splitlines(keepends=True)
          assert len(lines) == 1094, len(lines)
          cleaned = ''.join(
              line for i, line in enumerate(lines)
              if not any(a <= i < b for a,b in ranges)
          )
          actual_clean = hashlib.sha256(cleaned.encode()).hexdigest()
          print('CLEAN_SOURCE_SHA256=' + actual_clean)
          print('CLEAN_SOURCE_BYTES=' + str(len(cleaned.encode())))
          assert actual_clean == clean_hash, (actual_clean, clean_hash)
          assert build in cleaned and sheet in cleaned

          names = re.findall(r'^function\s+([A-Za-z_$][\w$]*)\s*\(', cleaned, flags=re.M)
          assert len(names) == 151, len(names)
          assert len(set(names)) == 151, [n for n in set(names) if names.count(n) > 1]
          print('FUNCTION_DECLARATIONS=151 UNIQUE=151 DUPLICATES=0')

          files=[]
          for f in project['files']:
              if f.get('type') == 'SERVER_JS':
                  files.append({'name': f['name'], 'type': 'SERVER_JS', 'source': cleaned})
              elif f.get('type') == 'JSON':
                  files.append({'name': f['name'], 'type': 'JSON', 'source': f.get('source','')})
              elif f.get('type') == 'HTML':
                  files.append({'name': f['name'], 'type': 'HTML', 'source': f.get('source','')})
              else:
                  raise AssertionError('unexpected file type: '+str(f.get('type')))
          json.dump({'files':files}, open(out_path,'w',encoding='utf-8'), ensure_ascii=False)
          open('/tmp/clean-Code.gs','w',encoding='utf-8',newline='').write(cleaned)
          print('DEDUPLICATED_APPROVED_SOURCE=PASS')
          PY
          cp /tmp/clean-Code.gs "$GITHUB_WORKSPACE/apps-script-approved-clean-Code.gs"
          cp "$RUNNER_TEMP/clean-content.json" "$GITHUB_WORKSPACE/apps-script-approved-clean-content.json"

      - name: Replace dirty HEAD only after exact SHA proof
        shell: bash
        run: |
          set -euo pipefail
          access_token=$(jq -r '.tokens.default.access_token // empty' "$HOME/.clasprc.json")
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @"$RUNNER_TEMP/clean-content.json" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" \
            -o "$RUNNER_TEMP/update-content-response.json"
          cat "$RUNNER_TEMP/update-content-response.json"
          jq -e --arg id "$SCRIPT_ID" '.scriptId==$id' "$RUNNER_TEMP/update-content-response.json" >/dev/null
          echo HEAD_UPDATE=PASS

          curl -fsSL -H "Authorization: Bearer $access_token" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" \
            -o "$RUNNER_TEMP/head-after.json"
          python - "$RUNNER_TEMP/head-after.json" "$EXPECTED_CLEAN_SHA256" "$EXPECTED_BUILD" "$SPREADSHEET_ID" <<'PY'
          import json,hashlib,re,sys
          p,h,b,s=sys.argv[1:]
          x=json.load(open(p,encoding='utf-8'))
          srcs=[f.get('source','') for f in x.get('files',[]) if f.get('type')=='SERVER_JS']
          assert len(srcs)==1
          src=srcs[0]
          actual=hashlib.sha256(src.encode()).hexdigest()
          print('POST_WRITE_HEAD_SHA256='+actual)
          assert actual==h,(actual,h)
          assert b in src and s in src
          names=re.findall(r'^function\s+([A-Za-z_$][\w$]*)\s*\(',src,flags=re.M)
          assert len(names)==151 and len(set(names))==151
          print('POST_WRITE_FUNCTIONS=151 UNIQUE=151 DUPLICATES=0')
          print('HEAD_POST_WRITE_VERIFIED=PASS')
          PY
          cp "$RUNNER_TEMP/head-after.json" "$GITHUB_WORKSPACE/apps-script-head-after.json"

      - name: Update exact existing production deployment
        shell: bash
        run: |
          set -euo pipefail
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json update-deployment \
            "$TARGET_DEPLOYMENT" \
            --description 'Production recovery 2026-08-07 approved deduplicated source' \
            > "$RUNNER_TEMP/update-deployment.json"
          cat "$RUNNER_TEMP/update-deployment.json"
          grep -Fq "$TARGET_DEPLOYMENT" "$RUNNER_TEMP/update-deployment.json"

          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json list-deployments \
            > "$RUNNER_TEMP/deployments-after.json"
          cat "$RUNNER_TEMP/deployments-after.json"
          after_version=$(jq -r --arg d "$TARGET_DEPLOYMENT" \
            '.[] | select(.deploymentId==$d) | .versionNumber // empty' \
            "$RUNNER_TEMP/deployments-after.json")
          test -n "$after_version"
          echo "EXISTING_DEPLOYMENT_UPDATED=PASS version=$after_version"
          cp "$RUNNER_TEMP/deployments-after.json" "$GITHUB_WORKSPACE/apps-script-deployments-after.json"

      - name: Verify fixed production exec
        shell: bash
        run: |
          set -euo pipefail
          ok=''
          for _ in $(seq 1 40); do
            if curl -fsSL --location --max-time 30 \
              "$API_URL?recovery=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.json" 2>/dev/null; then
              if jq -e --arg b "$EXPECTED_BUILD" \
                '.buildVersion==$b and .app=="空き家レスキュー会員管理" and .ready==true' \
                "$RUNNER_TEMP/live.json" >/dev/null 2>&1; then
                ok=1
                break
              fi
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/live.json"
          test -n "$ok"
          echo APPS_SCRIPT_PRODUCTION_RECOVERY=PASS
          cp "$RUNNER_TEMP/live.json" "$GITHUB_WORKSPACE/apps-script-live-after.json"

      - name: Upload full recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-final-dedupe-${{ github.run_id }}
          path: |
            apps-script-head-before.json
            apps-script-approved-clean-Code.gs
            apps-script-approved-clean-content.json
            apps-script-head-after.json
            apps-script-deployments-after.json
            apps-script-live-after.json
          retention-days: 7
