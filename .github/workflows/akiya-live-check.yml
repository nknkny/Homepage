name: Akiya Live Production Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_FRONTEND_BUILD: 2026-08-21-cloudflare-pages-r1
  EXPECTED_API_BUILD: 2026-08-14-legal-final-r10
  SITE_ORIGIN: https://akiya-pocket-aomori.pages.dev
  ADMIN_URL: https://nknkny.github.io/Homepage/akiya-pocket/control-center/
  API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api
  PAYMENT_API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-payment-api

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify current Supabase APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --max-time 30 -H "Origin: $SITE_ORIGIN" "$API_URL" -o evidence/api.json
          jq -e --arg b "$EXPECTED_API_BUILD" '.ok==true and .ready==true and .buildVersion==$b' evidence/api.json >/dev/null
          curl --fail --silent --show-error --max-time 30 -H "Origin: $SITE_ORIGIN" "$PAYMENT_API_URL" -o evidence/payment.json
          jq -e '.ok==true and .ready==true and .amountJpy==3480 and .paymentLinkReady==true' evidence/payment.json >/dev/null

      - name: Verify live Cloudflare customer site
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$SITE_ORIGIN/DEPLOYMENT.json?check=$GITHUB_SHA" -o evidence/deployment.json
          jq -e --arg b "$EXPECTED_FRONTEND_BUILD" --arg o "$SITE_ORIGIN" '.build==$b and .canonicalOrigin==$o' evidence/deployment.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "$SITE_ORIGIN/?check=$GITHUB_SHA" -o evidence/home.html
          grep -Fq '空家ポケット' evidence/home.html
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/\">" evidence/home.html
          for page in register.html member-login.html request.html checkout.html payment-success.html commercial.html privacy.html service-terms.html; do
            code=$(curl --silent --show-error --max-time 30 -o "evidence/$page" -w '%{http_code}' "$SITE_ORIGIN/$page?check=$GITHUB_SHA")
            test "$code" = 200
          done
          ! grep -Eq 'sk_(live|test)_[A-Za-z0-9]+' evidence/home.html

      - name: Verify security headers and admin separation
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 30 -D evidence/headers.txt -o /dev/null "$SITE_ORIGIN/?headers=$GITHUB_SHA"
          tr -d '\r' < evidence/headers.txt > evidence/headers-normalized.txt
          grep -Eiq '^strict-transport-security:.*max-age=' evidence/headers-normalized.txt
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' evidence/headers-normalized.txt
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' evidence/headers-normalized.txt
          grep -Eiq '^content-security-policy:' evidence/headers-normalized.txt
          admin_code=$(curl --silent --show-error --max-time 30 -o evidence/admin.html -w '%{http_code}' "$ADMIN_URL")
          test "$admin_code" = 200
          grep -Fq '空家ポケット' evidence/admin.html

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akiya-live-production-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
