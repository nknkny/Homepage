name: Akiya Live Production Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_FRONTEND_BUILD: 2026-08-21-cloudflare-pages-r1
  SITE_ORIGIN: https://akiya-pocket-aomori.pages.dev
  ADMIN_URL: https://nknkny.github.io/Homepage/akiya-pocket/control-center/
  API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api
  PAYMENT_API_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-payment-api

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify current Supabase APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --max-time 30 -H "Origin: $SITE_ORIGIN" "$API_URL" -o evidence/api.json
          jq -e '.ok==true and .ready==true and .accountDeletionAnonymizes==true and .paymentManagedSeparately==true' evidence/api.json >/dev/null
          curl --fail --silent --show-error --max-time 30 -H "Origin: $SITE_ORIGIN" "$PAYMENT_API_URL" -o evidence/payment.json
          jq -e '.ok==true and .ready==true and .amountJpy==3480 and .paymentLinkReady==true' evidence/payment.json >/dev/null

      - name: Verify live Cloudflare customer site
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 "$SITE_ORIGIN/DEPLOYMENT.json?check=$GITHUB_SHA" -o evidence/deployment.json
          jq -e --arg b "$EXPECTED_FRONTEND_BUILD" --arg o "$SITE_ORIGIN" '.build==$b and .canonicalOrigin==$o' evidence/deployment.json >/dev/null
          curl --fail --location --silent --show-error --max-time 30 "$SITE_ORIGIN/?check=$GITHUB_SHA" -o evidence/home.html
          grep -Fq '空家ポケット' evidence/home.html
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/\">" evidence/home.html
          for page in register.html member-login.html request.html checkout.html payment-success.html commercial.html privacy.html service-terms.html; do
            code=$(curl --location --silent --show-error --max-time 30 -o "evidence/$page" -w '%{http_code}' "$SITE_ORIGIN/$page?check=$GITHUB_SHA")
            test "$code" = 200
          done
          ! grep -Eq 'sk_(live|test)_[A-Za-z0-9]+' evidence/home.html

      - name: Verify pushed main matches live artifact byte-for-byte
        if: github.event_name == 'push'
        shell: bash
        env:
          AKIYA_CANONICAL_ORIGIN: https://akiya-pocket-aomori.pages.dev
          AKIYA_DEPLOYMENT_URL: https://akiya-pocket-aomori.pages.dev
        run: |
          set -euo pipefail
          node scripts/build-akiya-cloudflare-pages.mjs >/tmp/akiya-build.json
          mismatches=0
          while IFS= read -r -d '' file; do
            rel=${file#dist/}
            case "$rel" in _headers|_redirects|DEPLOYMENT.json) continue;; esac
            tmp=$(mktemp)
            # Cloudflare Pages Pretty URLs redirect *.html requests to their
            # canonical route. Follow redirects before byte comparison so the
            # check compares the deployed resource rather than a 3xx body.
            if ! curl --fail --location --silent --show-error --max-time 30 "$SITE_ORIGIN/$rel?integrity=$GITHUB_SHA" -o "$tmp"; then
              echo "LIVE_MISSING $rel"
              mismatches=$((mismatches+1))
            elif ! cmp -s "$file" "$tmp"; then
              echo "LIVE_MISMATCH $rel"
              mismatches=$((mismatches+1))
            fi
            rm -f "$tmp"
          done < <(find dist -type f -print0)
          test "$mismatches" = 0

      - name: Verify security headers and admin separation
        shell: bash
        run: |
          set -euo pipefail
          curl --location --silent --show-error --max-time 30 -D evidence/headers.txt -o /dev/null "$SITE_ORIGIN/?headers=$GITHUB_SHA"
          tr -d '\r' < evidence/headers.txt > evidence/headers-normalized.txt
          grep -Eiq '^strict-transport-security:.*max-age=' evidence/headers-normalized.txt
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' evidence/headers-normalized.txt
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' evidence/headers-normalized.txt
          grep -Eiq '^content-security-policy:' evidence/headers-normalized.txt
          admin_code=$(curl --location --silent --show-error --max-time 30 -o evidence/admin.html -w '%{http_code}' "$ADMIN_URL")
          test "$admin_code" = 200
          grep -Fq '空家ポケット' evidence/admin.html

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akiya-live-production-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
