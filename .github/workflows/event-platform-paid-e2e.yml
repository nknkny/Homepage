name: Event Platform Paid Boundary E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/event-platform-paid-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/event-platform-api

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify free cap and purchase preparation
        shell: bash
        run: |
          set -euo pipefail
          ID=$(python -c 'import uuid; print(uuid.uuid4())')
          KEY=$(openssl rand -hex 32)
          call() { local id="$1"; local key="$2"; shift 2; curl --silent --show-error --max-time 30 -H 'Content-Type: application/json' -H "x-owner-id: $id" -H "x-owner-key: $key" "$@"; }

          call "$ID" "$KEY" -X POST -d '{}' "$API?action=bootstrap" -o /tmp/bootstrap.json
          jq -e '.ok==true and .billing.plan=="free" and .billing.freeActiveLimit==3' /tmp/bootstrap.json >/dev/null

          code=$(call "$ID" "$KEY" -o /tmp/no-consent.json -w '%{http_code}' -X POST -d '{"accepted":false}' "$API?action=prepare_pro_purchase")
          test "$code" = "400"
          jq -e '.error=="ACCEPT_REQUIRED"' /tmp/no-consent.json >/dev/null

          call "$ID" "$KEY" -X POST -d '{"accepted":true}' "$API?action=prepare_pro_purchase" -o /tmp/purchase.json
          jq -e '.ok==true and .price==1980 and .currency=="JPY" and .days==30 and .autoRenew==false' /tmp/purchase.json >/dev/null
          jq -r '.checkoutUrl' /tmp/purchase.json | grep -Fq "client_reference_id=$ID"

          for n in 1 2 3; do
            call "$ID" "$KEY" -X POST -d "{\"type\":\"venue\",\"title\":\"E2E無料枠テスト会場${n}\",\"area\":\"青森市\",\"category\":\"文化・アート\",\"description\":\"有料化境界の自動試験に使用する一時掲載です。試験完了後に削除します。\",\"availableFrom\":\"2026-08-20\",\"availableTo\":\"2026-12-31\",\"capacity\":10,\"tags\":[\"e2e\"],\"contactUrl\":\"https://example.com/\"}" "$API?action=save_listing" -o "/tmp/list$n.json"
            jq -e '.ok==true' "/tmp/list$n.json" >/dev/null
          done

          code=$(call "$ID" "$KEY" -o /tmp/fourth.json -w '%{http_code}' -X POST -d '{"type":"venue","title":"E2E無料枠テスト会場4","area":"青森市","category":"文化・アート","description":"無料プランの4件目がサーバ側で拒否されることを確認する自動試験用掲載です。","availableFrom":"2026-08-20","availableTo":"2026-12-31","capacity":10,"tags":["e2e"],"contactUrl":"https://example.com/"}' "$API?action=save_listing")
          test "$code" = "402"
          jq -e '.error=="PLAN_LIMIT" and .limit==3' /tmp/fourth.json >/dev/null

          for n in 1 2 3; do
            LID=$(jq -r '.listing.id' "/tmp/list$n.json")
            call "$ID" "$KEY" -X POST -d "{\"id\":\"$LID\"}" "$API?action=delete_listing" -o "/tmp/delete$n.json"
            jq -e '.ok==true' "/tmp/delete$n.json" >/dev/null
          done
          printf '{"owner_id":"%s"}\n' "$ID" >/tmp/e2e-owner.json
          echo PAID_BOUNDARY_E2E_OK

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-platform-paid-e2e-${{ github.run_id }}
          path: /tmp/*.json
          retention-days: 3
          if-no-files-found: ignore
