name: Akiya API Smoke Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test deployed API
        env:
          API_URL: https://script.google.com/macros/s/AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w/exec
        run: |
          set -uo pipefail
          mkdir -p result
          PHONE="050$(printf '%08d' $((GITHUB_RUN_ID % 100000000)))"
          PASSWORD="AkiyaTest-${GITHUB_RUN_ID}-Aa9!"

          parse_response() {
            python3 - "$1" <<'PY'
          import json, re, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'window\.parent\.postMessage\((\{.*?\}),"\*"\)', text, re.S)
          if not match:
              print(json.dumps({"ok": False, "code": "UNPARSEABLE_RESPONSE", "body": text[:500]}, ensure_ascii=False))
              raise SystemExit(0)
          try:
              print(json.dumps(json.loads(match.group(1)), ensure_ascii=False))
          except Exception as exc:
              print(json.dumps({"ok": False, "code": "INVALID_JSON", "error": str(exc), "body": text[:500]}, ensure_ascii=False))
          PY
          }

          post_form() {
            local outfile="$1"; shift
            curl -sS -L --max-time 60 -X POST "$API_URL" "$@" -o "$outfile"
          }

          GET_BODY=$(curl -sS -L --max-time 60 "$API_URL")
          printf '%s' "$GET_BODY" > result/get.json

          post_form result/register.html \
            --data-urlencode action=register_member \
            --data-urlencode name=自動動作試験 \
            --data-urlencode phone="$PHONE" \
            --data-urlencode password="$PASSWORD" \
            --data-urlencode recoveryQuestion=好きな色 \
            --data-urlencode recoveryAnswer=青 \
            --data-urlencode residencePrefecture=青森県 \
            --data-urlencode residenceCity=青森市 \
            --data-urlencode propertyPrefecture=青森県 \
            --data-urlencode propertyCity=青森市 \
            --data-urlencode relationship=動作試験 \
            --data-urlencode propertyStatus=動作試験 \
            --data-urlencode requiredConsent=1 \
            --data-urlencode clientRequestId="TEST-REGISTER-${GITHUB_RUN_ID}"
          parse_response result/register.html > result/register.json

          REGISTER_OK=$(python3 -c 'import json; print(str(json.load(open("result/register.json")).get("ok", False)).lower())')
          SESSION=$(python3 -c 'import json; print(json.load(open("result/register.json")).get("sessionToken", ""))')

          if [ "$REGISTER_OK" = "true" ] && [ -n "$SESSION" ]; then
            post_form result/login.html \
              --data-urlencode action=member_login \
              --data-urlencode credential="$PHONE" \
              --data-urlencode password="$PASSWORD" \
              --data-urlencode clientRequestId="TEST-LOGIN-${GITHUB_RUN_ID}"
            parse_response result/login.html > result/login.json
            LOGIN_SESSION=$(python3 -c 'import json; print(json.load(open("result/login.json")).get("sessionToken", ""))')
            [ -n "$LOGIN_SESSION" ] && SESSION="$LOGIN_SESSION"

            post_form result/dashboard.html \
              --data-urlencode action=get_dashboard \
              --data-urlencode sessionToken="$SESSION" \
              --data-urlencode clientRequestId="TEST-DASHBOARD-${GITHUB_RUN_ID}"
            parse_response result/dashboard.html > result/dashboard.json

            post_form result/request.html \
              --data-urlencode action=create_inspection_request \
              --data-urlencode sessionToken="$SESSION" \
              --data-urlencode propertyAddress=青森県青森市動作試験用0番地 \
              --data-urlencode requestRelationship=動作試験 \
              --data-urlencode propertyStatus=動作試験 \
              --data-urlencode preferredDate1=2099-12-01 \
              --data-urlencode accessPermission=動作試験用の権限確認済み \
              --data-urlencode requestNotes=本番API自動動作試験・削除対象 \
              --data-urlencode requestConsent=1 \
              --data-urlencode clientRequestId="TEST-REQUEST-${GITHUB_RUN_ID}"
            parse_response result/request.html > result/request.json

            post_form result/delete.html \
              --data-urlencode action=delete_account \
              --data-urlencode sessionToken="$SESSION" \
              --data-urlencode password="$PASSWORD" \
              --data-urlencode clientRequestId="TEST-DELETE-${GITHUB_RUN_ID}"
            parse_response result/delete.html > result/delete.json
          else
            printf '%s' '{"ok":false,"code":"SKIPPED_REGISTER_FAILED"}' > result/login.json
            cp result/login.json result/dashboard.json
            cp result/login.json result/request.json
            cp result/login.json result/delete.json
          fi

          python3 - <<'PY'
          import json, pathlib
          names = ['get','register','login','dashboard','request','delete']
          out = {}
          for name in names:
              path = pathlib.Path('result') / f'{name}.json'
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  data = {'ok': False, 'code': 'READ_ERROR', 'error': str(exc)}
              data.pop('sessionToken', None)
              if isinstance(data.get('member'), dict):
                  data['member'].pop('email', None)
                  data['member'].pop('phone', None)
              out[name] = data
          pathlib.Path('result/summary.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          required = ['register','login','dashboard','request','delete']
          failed = [name for name in required if out.get(name, {}).get('ok') is not True]
          print(json.dumps(out, ensure_ascii=False, indent=2))
          if failed:
              print('FAILED_STEPS=' + ','.join(failed))
              raise SystemExit(1)
          PY

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-result
          path: result/
          retention-days: 1
