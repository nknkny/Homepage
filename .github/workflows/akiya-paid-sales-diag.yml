name: Akiya paid-sales API diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diag:
    if: github.event.issue.number == 42 && contains(github.event.comment.body, 'RUN_AKIYA_PAID_SALES_DIAG')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORIGIN: https://akiya-pocket-aomori.pages.dev
      API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api
      PAY: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-payment-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Non-mutating production payment-path diagnostic
        id: diag
        shell: bash
        run: |
          set -euo pipefail
          api_options=$(curl -sS -o /dev/null -D "$RUNNER_TEMP/api-h" -w '%{http_code}' -X OPTIONS -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$API")
          pay_options=$(curl -sS -o /dev/null -D "$RUNNER_TEMP/pay-h" -w '%{http_code}' -X OPTIONS -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$PAY")
          api_acao=$(grep -i '^access-control-allow-origin:' "$RUNNER_TEMP/api-h" | head -1 | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//')
          pay_acao=$(grep -i '^access-control-allow-origin:' "$RUNNER_TEMP/pay-h" | head -1 | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//')
          api_get=$(curl -fsS -H "Origin: $ORIGIN" "$API")
          pay_get=$(curl -fsS -H "Origin: $ORIGIN" "$PAY")
          test "$api_options" = 204
          test "$pay_options" = 204
          test "$api_acao" = "$ORIGIN"
          test "$pay_acao" = "$ORIGIN"
          jq -e '.ok==true and .ready==true and .registrationPropertyOptional==true and .publicRegistrationDiagnostics==true' <<<"$api_get" >/dev/null
          jq -e '.ok==true and .ready==true and .amountJpy==3480 and .paymentLinkReady==true' <<<"$pay_get" >/dev/null

          curl -fsSL "$ORIGIN/register.html?diag=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/register.html"
          curl -fsSL "$ORIGIN/request.html?diag=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/request.html"
          curl -fsSL "$ORIGIN/checkout.html?diag=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/checkout.html"
          grep -Fq '無料会員登録する' "$RUNNER_TEMP/register.html"
          grep -Fq 'register-inline-1.js' "$RUNNER_TEMP/register.html"
          grep -Fq 'request-inline-1.js' "$RUNNER_TEMP/request.html"
          grep -Fq 'checkout-inline-1.js' "$RUNNER_TEMP/checkout.html"
          grep -Fq '1回3,480円' "$RUNNER_TEMP/checkout.html"

          api_build=$(jq -r '.buildVersion' <<<"$api_get")
          pay_build=$(jq -r '.buildVersion' <<<"$pay_get")
          {
            echo "api_options=$api_options"
            echo "api_acao=$api_acao"
            echo "pay_options=$pay_options"
            echo "pay_acao=$pay_acao"
            echo "api_build=$api_build"
            echo "pay_build=$pay_build"
          } >> "$GITHUB_OUTPUT"

      - name: Report diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.diag.outcome }}
          API_OPTIONS: ${{ steps.diag.outputs.api_options }}
          API_ACAO: ${{ steps.diag.outputs.api_acao }}
          PAY_OPTIONS: ${{ steps.diag.outputs.pay_options }}
          PAY_ACAO: ${{ steps.diag.outputs.pay_acao }}
          API_BUILD: ${{ steps.diag.outputs.api_build }}
          PAY_BUILD: ${{ steps.diag.outputs.pay_build }}
        shell: bash
        run: |
          overall=FAIL; [ "$RESULT" = success ] && overall=PASS
          body=$(jq -n --arg o "$overall" --arg a "${API_OPTIONS:-}" --arg aa "${API_ACAO:-}" --arg p "${PAY_OPTIONS:-}" --arg pa "${PAY_ACAO:-}" --arg ab "${API_BUILD:-}" --arg pb "${PAY_BUILD:-}" --arg r "$GITHUB_RUN_ID" '{body:("AKIYA_PAID_SALES_DIAG="+$o+"\nRUN_ID="+$r+"\nAPI_OPTIONS="+$a+" API_ACAO="+$aa+"\nPAY_OPTIONS="+$p+" PAY_ACAO="+$pa+"\nAPI_BUILD="+$ab+"\nPAY_BUILD="+$pb)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
