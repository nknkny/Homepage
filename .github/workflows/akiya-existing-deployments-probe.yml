name: Akiya Existing Deployments Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe all known deployments
        shell: bash
        run: |
          set -u
          urls=(
            'https://script.google.com/macros/s/AKfycbynkdZOqIm5IWkqU828NuedAKF39ukM-L76zEMzFxsIufA2W8ECMPMHVS0WsgoaIwQ75A/exec'
            'https://script.google.com/macros/s/AKfycbxdLJ6_IEl2qd_49lP5MwfF-zkEkbT8mnUiFJIo_oPx_ZKFXXywV0539qvMclVbXMTPoQ/exec'
            'https://script.google.com/macros/s/AKfycbzufU8XF9HnfPaAR-l49IPb2bmEgaox8pvDNxmAS2eHvuztFWVkrgc0-a5_bj8MQunyRQ/exec'
            'https://script.google.com/macros/s/AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w/exec'
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            echo "===== DEPLOYMENT_$i ====="
            echo "$u"
            code=$(curl -sS -L --max-time 30 -o "/tmp/body$i" -w '%{http_code}' "$u" || true)
            echo "HTTP=$code"
            echo 'BODY_BEGIN'
            head -c 3000 "/tmp/body$i" 2>/dev/null || true
            echo
            echo 'BODY_END'
          done
