name: Akiya API Final Check

on:
  push:
    paths:
      - '.github/workflows/akiya-api-final-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production API end to end
        env:
          API_URL: https://script.google.com/macros/s/AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w/exec
        run: |
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request, os, pathlib

          api = os.environ['API_URL']
          run_id = os.environ['GITHUB_RUN_ID']
          phone = '050' + str(int(run_id) % 100000000).zfill(8)
          password = f'AkiyaFinal-{run_id}-Aa9!'
          out = {}

          def fetch_get():
              with urllib.request.urlopen(api, timeout=60) as r:
                  return r.read().decode('utf-8', 'replace')

          def extract(text):
              try:
                  return json.loads(text)
              except Exception:
                  pass
              direct = re.search(r'window\.parent\.postMessage\((\{.*?\}),["\']\*["\']\)', text, re.S)
              if direct:
                  return json.loads(direct.group(1))
              outer = re.search(r'goog\.script\.init\("((?:\\.|[^"\\])*)"', text, re.S)
              if outer:
                  encoded = re.sub(r'\\x([0-9A-Fa-f]{2})', lambda m: '\\u00' + m.group(1), outer.group(1))
                  init_json = json.loads('"' + encoded + '"')
                  init_data = json.loads(init_json)
                  user_html = init_data.get('userHtml', '')
                  nested = re.search(r'window\.parent\.postMessage\((\{.*?\}),["\']\*["\']\)', user_html, re.S)
                  if nested:
                      return json.loads(nested.group(1))
              return {'ok': False, 'code': 'UNPARSEABLE_RESPONSE', 'body': text[:300]}

          def post(**data):
              body = urllib.parse.urlencode(data).encode('utf-8')
              req = urllib.request.Request(api, data=body, method='POST')
              with urllib.request.urlopen(req, timeout=60) as r:
                  return extract(r.read().decode('utf-8', 'replace'))

          out['get'] = extract(fetch_get())
          reg = post(action='register_member', name='最終動作試験', phone=phone, password=password,
                     recoveryQuestion='好きな色', recoveryAnswer='青', residencePrefecture='青森県',
                     residenceCity='青森市', propertyPrefecture='青森県', propertyCity='青森市',
                     relationship='動作試験', propertyStatus='動作試験', requiredConsent='1',
                     clientRequestId=f'FINAL-REGISTER-{run_id}')
          out['register'] = reg
          session = reg.get('sessionToken', '')

          login = post(action='member_login', credential=phone, password=password,
                       clientRequestId=f'FINAL-LOGIN-{run_id}')
          out['login'] = login
          session = login.get('sessionToken') or session

          out['dashboard'] = post(action='get_dashboard', sessionToken=session,
                                  clientRequestId=f'FINAL-DASHBOARD-{run_id}')
          out['request'] = post(action='create_inspection_request', sessionToken=session,
                                propertyAddress='青森県青森市最終動作試験用0番地', requestRelationship='動作試験',
                                propertyStatus='動作試験', preferredDate1='2099-12-01',
                                accessPermission='動作試験用の権限確認済み',
                                requestNotes='本番API最終動作試験・削除対象', requestConsent='1',
                                clientRequestId=f'FINAL-REQUEST-{run_id}')
          out['delete'] = post(action='delete_account', sessionToken=session, password=password,
                               clientRequestId=f'FINAL-DELETE-{run_id}')

          safe = json.loads(json.dumps(out, ensure_ascii=False))
          for value in safe.values():
              if isinstance(value, dict):
                  value.pop('sessionToken', None)
                  if isinstance(value.get('member'), dict):
                      value['member'].pop('email', None)
                      value['member'].pop('phone', None)
          pathlib.Path('final-check.json').write_text(json.dumps(safe, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          required = ['get','register','login','dashboard','request','delete']
          failed = [k for k in required if safe.get(k, {}).get('ok') is not True]
          if failed:
              raise SystemExit('FAILED_STEPS=' + ','.join(failed))
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akiya-api-final-check
          path: final-check.json
          retention-days: 1
