name: Fix autofill honeypot false positives r11
on:
  push:
    branches: [akiya-rescue-cloudflare]
    paths: ['.github/workflows/fix-autofill-honeypot-r11.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: akiya-rescue-cloudflare
      - name: Remove autofill-prone honeypot and bump frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          block='<div class="hp-field" aria-hidden="true"><label>ウェブサイト<input name="companyWebsite" tabindex="-1" autocomplete="off"></label></div>'
          for name in ['register.html','member-login.html','account-recovery.html','reset-password.html']:
              p=Path(name)
              s=p.read_text()
              if block not in s:
                  raise SystemExit(f'honeypot block missing: {name}')
              p.write_text(s.replace(block,''))
          p=Path('assets/config.js')
          s=p.read_text().replace('FRONTEND_BUILD: "2026-08-12-funnel-r10"','FRONTEND_BUILD: "2026-08-13-autofill-fix-r11"')
          p.write_text(s)
          p=Path('VERSION.txt')
          s=p.read_text().replace('siteVersion=2026-08-12-funnel-r10','siteVersion=2026-08-13-autofill-fix-r11').replace('audit_revision=2026-08-12-funnel-r10','audit_revision=2026-08-13-autofill-fix-r11')
          if 'autofill_honeypot=false_turnstile_only' not in s:
              s += '\nautofill_honeypot=false_turnstile_only\n'
          p.write_text(s)
          wf=Path('.github/workflows/fix-autofill-honeypot-r11.yml')
          wf.unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove autofill-prone honeypot fields r11'
          git push origin HEAD:akiya-rescue-cloudflare
