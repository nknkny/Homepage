name: Akiya Form Sales Runner

on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  submit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 42 && contains(github.event.comment.body, 'RUN_AKIYA_FORM_SALES_RUNNER'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      WORKER_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-form-sales-worker
    steps:
      - uses: actions/checkout@v4

      - name: Mint short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: return await core.getIDToken('akiya-pocket-form-sales')

      - name: Install matching Playwright package
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null

      - name: Process safe form outreach queue
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/akiya-form-sales-runner.mjs
