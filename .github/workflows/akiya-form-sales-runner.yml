name: Akiya Form Sales Runner

on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  submit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 42 && contains(github.event.comment.body, 'RUN_AKIYA_FORM_SALES_RUNNER'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      WORKER_URL: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-form-sales-worker
    steps:
      - uses: actions/checkout@v4

      - name: Mint short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: return await core.getIDToken('akiya-pocket-form-sales')

      - name: Install matching Playwright package
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null

      - name: Process safe form outreach queue
        id: process
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/akiya-form-sales-runner.mjs | tee /tmp/akiya-form-sales.log
          echo "log=$(tail -n 5 /tmp/akiya-form-sales.log | tr '\n' ' ' | cut -c1-1500)" >> "$GITHUB_OUTPUT"

      - name: Record manual diagnostic result
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.process.outcome }}
          LOG: ${{ steps.process.outputs.log }}
        shell: bash
        run: |
          node - <<'NODE'
          const body={body:`AKIYA_FORM_SALES_RUNNER=${process.env.OUTCOME==='success'?'PASS':'FAIL'}\n${process.env.LOG||''}`};
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/42/comments`,{method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'content-type':'application/json','accept':'application/vnd.github+json'},body:JSON.stringify(body)});
          if(!r.ok) throw new Error(`comment ${r.status}`);
          NODE
