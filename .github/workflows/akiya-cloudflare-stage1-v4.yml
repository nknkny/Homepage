name: Akiya Cloudflare stage1 v4

on:
  push:
    branches: [main]
    paths:
      - 'akiya-pocket/**'
      - 'scripts/build-akiya-cloudflare-pages.mjs'
      - '.github/workflows/akiya-cloudflare-stage1-v4.yml'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: akiya-cloudflare-stage1-v4
  cancel-in-progress: true

env:
  AKIYA_CF_BROKER: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-cloudflare-ci-broker
  AKIYA_CF_BROKER_AUDIENCE: akiya-cloudflare-ci-broker

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 42 &&
       contains(github.event.comment.body, 'START_AKIYA_CF_STAGE1_V4'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Resolve source and canonical Pages project
        id: target
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git log -1 --format=%H -- akiya-pocket scripts/build-akiya-cloudflare-pages.mjs)
          origin=$(tr -d '[:space:]' < akiya-pocket/CLOUDFLARE_CANONICAL.txt)
          case "$origin" in https://*.pages.dev) ;; *) echo "Invalid canonical Pages origin: $origin" >&2; exit 1;; esac
          project=$(node -e 'const u=new URL(process.argv[1]); console.log(u.hostname.replace(/\.pages\.dev$/, ""))' "$origin")
          test -n "$source_sha" && test -n "$project"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Resolve secure Cloudflare credential mode
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=0; account=0
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && token=1
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && account=1

          if [ "$token" = 1 ] && [ "$account" = 1 ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'mode=api-token' >> "$GITHUB_OUTPUT"
            echo 'CLOUDFLARE_CREDENTIAL_MODE=api-token'
            exit 0
          fi
          if [ "$token" != "$account" ]; then
            echo 'Partial Cloudflare secret configuration is invalid: both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required.' >&2
            exit 1
          fi

          oidc_json=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AKIYA_CF_BROKER_AUDIENCE}")
          oidc=$(printf '%s' "$oidc_json" | jq -r '.value // empty')
          test -n "$oidc"
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $oidc" \
            -H 'Content-Type: application/json' \
            -d '{"action":"get"}' "$AKIYA_CF_BROKER")
          http=$(printf '%s\n' "$response" | tail -1)
          body=$(printf '%s\n' "$response" | sed '$d')
          if [ "$http" = 200 ] && printf '%s' "$body" | jq -e '.ok==true and (.credentialBundle|type=="string") and (.credentialBundle|length>20)' >/dev/null 2>&1; then
            bundle=$(printf '%s' "$body" | jq -r '.credentialBundle')
            config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/.wrangler/config"
            mkdir -p "$config_dir"
            printf '%s' "$bundle" | base64 -d > "$config_dir/default.toml"
            chmod 600 "$config_dir/default.toml"
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'mode=broker-oauth' >> "$GITHUB_OUTPUT"
            echo 'CLOUDFLARE_CREDENTIAL_MODE=broker-oauth'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'mode=verify-only' >> "$GITHUB_OUTPUT"
            echo 'CLOUDFLARE_CREDENTIAL_MODE=verify-only'
            echo 'No reusable Cloudflare credential is bootstrapped yet; production will be verified only.'
          fi

      - name: Build Cloudflare Pages artifact
        env:
          AKIYA_CANONICAL_ORIGIN: ${{ steps.target.outputs.origin }}
          AKIYA_DEPLOYMENT_URL: ${{ steps.target.outputs.origin }}
          AKIYA_SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: node scripts/build-akiya-cloudflare-pages.mjs

      - name: Validate production artifact
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/DEPLOYMENT.json
          jq -e --arg o "$ORIGIN" --arg s "$SOURCE_SHA" '.canonicalOrigin==$o and .build=="2026-08-31-acquisition-r3" and .sourceSha==$s' dist/DEPLOYMENT.json >/dev/null
          grep -Fq "<link rel=\"canonical\" href=\"${ORIGIN}/\">" dist/index.html
          grep -Fq '新規無料会員登録' dist/index.html
          grep -Fq '現地確認を依頼する' dist/index.html
          grep -Fq '登録なしで無料チェック' dist/index.html
          grep -Fq '先に報告見本を見る' dist/index.html
          grep -Fq 'data-akiya-intent="request"' dist/index.html
          grep -Fq 'DeRiEY9nqJJKMJH_5k6HD9hK1i3I6Urvqid4mG2VxS8' dist/index.html
          test -f dist/assets/navigation-r1.css
          ! grep -R -F 'https://nknkny.github.io/Homepage/akiya-pocket' dist --include='*.html' --include='*.js' --include='*.xml' --include='*.txt'
          test ! -d dist/control-center
          while IFS= read -r path; do
            case "$path" in ''|'#'*) continue ;; esac
            test -f "dist/$path" || { echo "PUBLIC_URL_MISSING=$path"; exit 1; }
          done < akiya-pocket/PUBLIC_URLS.txt
          for page in remote-home-aomori.html inherited-home-aomori.html parent-facility-home-aomori.html vacant-home-notice-aomori.html vacant-home-weeds-aomori.html vacant-home-after-storm-aomori.html snow-vacant-home-aomori.html; do
            grep -Fq 'assets/config.js' "dist/$page"
            grep -Fq 'assets/api.js' "dist/$page"
            grep -Fq 'assets/site.js' "dist/$page"
          done
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.href=''; self.text=[]; self.in_a=False; self.bad=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='a': self.in_a=True; self.href=dict(attrs).get('href',''); self.text=[]
              def handle_data(self, data):
                  if self.in_a: self.text.append(data)
              def handle_endtag(self, tag):
                  if tag=='a' and self.in_a:
                      label=''.join(self.text).strip().replace('\n',' ')
                      if self.href.startswith('register.html') and any(x in label for x in ('無料チェックリスト','登録なしで無料チェック','無料チェックを使う')):
                          self.bad.append((label,self.href))
                      self.in_a=False; self.href=''; self.text=[]
          fail=[]
          for p in Path('dist').glob('*.html'):
              a=Audit(); a.feed(p.read_text(encoding='utf-8')); fail += [(p.name,*x) for x in a.bad]
          if fail:
              for row in fail: print('CTA_SEMANTIC_MISMATCH', *row)
              raise SystemExit(1)
          PY

      - name: Verify configured Cloudflare credentials
        if: steps.credentials.outputs.configured == 'true'
        id: auth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 whoami >/dev/null
          echo 'CLOUDFLARE_AUTH=PASS'

      - name: Deploy Cloudflare Pages
        if: steps.credentials.outputs.configured == 'true'
        id: pages_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.target.outputs.project }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$SOURCE_SHA" --commit-message 'Akiya Pocket verified production deployment'

      - name: Persist refreshed broker OAuth credential
        if: steps.credentials.outputs.mode == 'broker-oauth' && steps.pages_deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          credential_file="${XDG_CONFIG_HOME:-$HOME/.config}/.wrangler/config/default.toml"
          test -s "$credential_file"
          bundle=$(base64 -w0 "$credential_file")
          oidc_json=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AKIYA_CF_BROKER_AUDIENCE}")
          oidc=$(printf '%s' "$oidc_json" | jq -r '.value // empty')
          test -n "$oidc"
          body=$(jq -nc --arg c "$bundle" '{action:"put",credentialBundle:$c}')
          curl -fsSL -X POST -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' -d "$body" "$AKIYA_CF_BROKER" | jq -e '.ok==true and .stored==true' >/dev/null

      - name: Verify live production parity and core APIs
        id: verify
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          MODE: ${{ steps.credentials.outputs.mode }}
          API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-api
          PAY: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-payment-api
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 18); do
            marker="$RUNNER_TEMP/deployment-$attempt.json"
            if curl -fsSL --max-time 20 "$ORIGIN/DEPLOYMENT.json?v=$GITHUB_RUN_ID-$attempt" -o "$marker" \
              && jq -e --arg o "$ORIGIN" --arg s "$SOURCE_SHA" '.canonicalOrigin==$o and .build=="2026-08-31-acquisition-r3" and .sourceSha==$s' "$marker" >/dev/null; then
              matched=1; break
            fi
            if [ "$MODE" = 'verify-only' ]; then break; fi
            sleep 5
          done
          if [ "$matched" != 1 ]; then
            if [ "$MODE" = 'verify-only' ]; then
              echo 'PRODUCTION_STALE_AND_CREDENTIALS_MISSING: current source is not deployed; bootstrap the secure one-time repair credential.' >&2
            else
              echo 'DEPLOYMENT_MARKER_MISMATCH after deploy.' >&2
            fi
            exit 1
          fi

          : > "$RUNNER_TEMP/mismatches.initial"
          while IFS= read -r -d '' file; do
            rel=${file#dist/}
            case "$rel" in _headers|_redirects|DEPLOYMENT.json) continue;; esac
            tmp=$(mktemp)
            if ! curl -fsSL --max-time 30 "$ORIGIN/$rel?v=$GITHUB_RUN_ID-0" -o "$tmp" || ! cmp -s "$file" "$tmp"; then
              printf '%s\n' "$rel" >> "$RUNNER_TEMP/mismatches.initial"
            fi
            rm -f "$tmp"
          done < <(find dist -type f -print0)

          : > "$RUNNER_TEMP/mismatches.final"
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            matched_file=0
            for attempt in $(seq 1 12); do
              tmp=$(mktemp)
              if curl -fsSL --max-time 30 "$ORIGIN/$rel?v=$GITHUB_RUN_ID-$attempt" -o "$tmp" && cmp -s "dist/$rel" "$tmp"; then
                matched_file=1; rm -f "$tmp"; break
              fi
              rm -f "$tmp"
              [ "$MODE" = 'verify-only' ] && break
              sleep 5
            done
            if [ "$matched_file" != 1 ]; then echo "$rel" >> "$RUNNER_TEMP/mismatches.final"; fi
          done < "$RUNNER_TEMP/mismatches.initial"
          if [ -s "$RUNNER_TEMP/mismatches.final" ]; then
            echo 'LIVE_PARITY_MISMATCH:' >&2
            cat "$RUNNER_TEMP/mismatches.final" >&2
            exit 1
          fi

          url_count=0
          while IFS= read -r path; do
            case "$path" in ''|'#'*) continue ;; esac
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$ORIGIN/$path?v=$GITHUB_RUN_ID")
            test "$code" = 200 || { echo "PUBLIC_URL_FAIL path=$path final_http=$code" >&2; exit 1; }
            url_count=$((url_count+1))
          done < akiya-pocket/PUBLIC_URLS.txt
          echo "PUBLIC_URL_CONTRACT_PASS count=$url_count"

          curl -fsSL -H "Origin: $ORIGIN" "$API" -o "$RUNNER_TEMP/api.json"
          jq -e '.ok==true and .ready==true and .accountDeletionAnonymizes==true' "$RUNNER_TEMP/api.json" >/dev/null
          curl -fsSL -H "Origin: $ORIGIN" "$PAY" -o "$RUNNER_TEMP/pay.json"
          jq -e '.ok==true and .ready==true and .amountJpy==3480 and .paymentLinkReady==true' "$RUNNER_TEMP/pay.json" >/dev/null

          curl -fsSL --max-time 30 -D "$RUNNER_TEMP/headers.txt" -o /dev/null "$ORIGIN/?v=$GITHUB_RUN_ID"
          tr -d '\r' < "$RUNNER_TEMP/headers.txt" > "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^strict-transport-security:.*max-age=' "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' "$RUNNER_TEMP/headers-normalized.txt"
          grep -Eiq '^content-security-policy:' "$RUNNER_TEMP/headers-normalized.txt"
          echo "AKIYA_CF_LIVE_VERIFY=PASS mode=$MODE source=$SOURCE_SHA"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: ${{ steps.target.outputs.origin }}
          PROJECT: ${{ steps.target.outputs.project }}
          MODE: ${{ steps.credentials.outputs.mode }}
          AUTH: ${{ steps.auth.outcome }}
          DEPLOY: ${{ steps.pages_deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY" = success ] && { [ "$MODE" = 'verify-only' ] || { [ "$AUTH" = success ] && [ "$DEPLOY" = success ]; }; }; then overall=PASS; else overall=FAIL; fi
          body=$(jq -n --arg o "$overall" --arg u "$ORIGIN" --arg p "$PROJECT" --arg r "$GITHUB_RUN_ID" --arg m "$MODE" --arg a "$AUTH" --arg d "$DEPLOY" --arg v "$VERIFY" --arg s "$SOURCE_SHA" '{body:("AKIYA_CF_STAGE1_V4="+$o+"\nRUN_ID="+$r+"\nSOURCE_SHA="+$s+"\nPROJECT="+$p+"\nURL="+$u+"/\nMODE="+$m+"\nAUTH="+$a+"\nDEPLOY="+$d+"\nPUBLIC_VERIFY="+$v)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
