name: Akiya Cloudflare stage1 v4

on:
  push:
    branches: [main]
    paths:
      - 'akiya-pocket/**'
      - 'scripts/build-akiya-cloudflare-pages.mjs'
      - '.github/workflows/akiya-cloudflare-stage1-v4.yml'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: akiya-cloudflare-stage1-v4
  cancel-in-progress: false

env:
  AKIYA_CF_BROKER: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-cloudflare-ci-broker
  AKIYA_CF_BROKER_AUDIENCE: akiya-cloudflare-ci-broker

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 42 &&
       contains(github.event.comment.body, 'START_AKIYA_CF_STAGE1_V4'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Resolve source and canonical Pages project
        id: target
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git log -1 --format=%H -- akiya-pocket scripts/build-akiya-cloudflare-pages.mjs)
          origin=$(tr -d '[:space:]' < akiya-pocket/CLOUDFLARE_CANONICAL.txt)
          case "$origin" in https://*.pages.dev) ;; *) echo "Invalid canonical Pages origin: $origin" >&2; exit 1;; esac
          project=$(node -e 'const u=new URL(process.argv[1]); console.log(u.hostname.replace(/\.pages\.dev$/, ""))' "$origin")
          test -n "$source_sha" && test -n "$project"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Resolve secure Cloudflare credential mode
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=0; account=0
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && token=1
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && account=1

          if [ "$token" = 1 ] && [ "$account" = 1 ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'mode=api-token' >> "$GITHUB_OUTPUT"
            echo 'CLOUDFLARE_CREDENTIAL_MODE=api-token'
            exit 0
          fi
          if [ "$token" != "$account" ]; then
            echo 'Partial Cloudflare secret configuration is invalid: both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required.' >&2
            exit 1
          fi

          oidc_json=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AKIYA_CF_BROKER_AUDIENCE}")
          oidc=$(printf '%s' "$oidc_json" | jq -r '.value // empty')
          test -n "$oidc"
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $oidc" \
            -H 'Content-Type: application/json' \
            -d '{"action":"get"}' "$AKIYA_CF_BROKER")
          http=$(printf '%s\n' "$response" | tail -1)
          body=$(printf '%s\n' "$response" | sed '$d')
          if [ "$http" = 200 ] && printf '%s' "$body" | jq -e '.ok==true and (.credentialBundle|type=="string") and (.credentialBundle|length>20)' >/dev/null 2>&1; then
            bundle=$(printf '%s' "$body" | jq -r '.credentialBundle')
            config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/.wrangler/config"
            mkdir -p "$config_dir"
            printf '%s' "$bundle" | base64 -d > "$config_dir/default.toml"
            chmod 600 "$config_dir/default.toml"
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'mode=broker-oauth' >> "$GITHUB_OUTPUT"
            echo 'CLOUDFLARE_CREDENTIAL_MODE=broker-oauth'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'mode=verify-only' >> "$GITHUB_OUTPUT"
            echo 'CLOUDFLARE_CREDENTIAL_MODE=verify-only'
            echo 'No reusable Cloudflare credential is bootstrapped yet; production will be verified only.'
          fi

      - name: Build Cloudflare Pages artifact
        env:
          AKIYA_CANONICAL_ORIGIN: ${{ steps.target.outputs.origin }}
          AKIYA_DEPLOYMENT_URL: ${{ steps.target.outputs.origin }}
          AKIYA_SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: node scripts/build-akiya-cloudflare-pages.mjs

      - name: Preserve existing production-only improvements
        env:
          ORIGIN: https://akiya-pocket-aomori.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.request import Request, urlopen
          import os, re
          root=Path('dist')
          origin=os.environ['ORIGIN'].rstrip('/')
          protected={'index.html','request.html','checkout.html','payment-success.html','payment.html','register.html','assets/config.js','assets/pages/guest-request.js','assets/pages/guest-checkout.js','assets/pages/guest-payment-success.js','assets/warm-20261113.css','service.html','faq.html','service-terms.html','commercial.html','payment.html','_headers','_redirects','DEPLOYMENT.json','PUBLIC_URLS.txt','CLOUDFLARE_CANONICAL.txt'}
          extensions={'.html','.css','.js','.json','.xml','.txt','.jpg','.jpeg','.png','.webp','.svg','.gif','.ico'}
          targets=[p for p in root.rglob('*') if p.is_file() and p.relative_to(root).as_posix() not in protected and p.suffix.lower() in extensions and not p.relative_to(root).as_posix().startswith('control-center/')]
          def restore(p):
            rel=p.relative_to(root).as_posix()
            try:
              req=Request(origin+'/'+rel,headers={'User-Agent':'AkiyaProductionOverlayPreserver/1.0'})
              with urlopen(req,timeout=20) as res:
                if res.status!=200:return(rel,False)
                body=res.read(12_000_000)
                if not body or len(body)>11_000_000:return(rel,False)
                mime=res.headers.get('Content-Type','').lower()
                if p.suffix.lower()=='.html' and 'html' not in mime:return(rel,False)
                if p.suffix.lower() in ('.jpg','.jpeg','.png','.webp','.svg') and 'image/' not in mime:return(rel,False)
                p.write_bytes(body)
                return(rel,True)
            except Exception as exc:
              print('OVERLAY_PRESERVE_FALLBACK',rel,type(exc).__name__)
              return(rel,False)
          with ThreadPoolExecutor(max_workers=8) as pool:
            results=[f.result() for f in as_completed([pool.submit(restore,p) for p in targets])]
          print('OVERLAY_PRESERVED',sum(ok for _,ok in results),'OF',len(results))
          legacy={'register.html','member.html','member-login.html','profile.html','delete-account.html','account-recovery.html','member-survey.html','service.html','faq.html','service-terms.html','commercial.html','payment.html'}
          changed=0
          for p in root.glob('*.html'):
            if p.name in legacy:continue
            text=p.read_text(encoding='utf-8')
            out=re.sub(r'href="(?:register|member-login|member)\.html(?:\?[^"]*)?"','href="request.html"',text)
            out=out.replace('>新規無料会員登録</a>','>会員登録なしで依頼する</a>')
            out=out.replace('>無料会員登録</a>','>会員登録なしで依頼する</a>')
            out=out.replace('>会員ログイン</a>','>現地確認を依頼する</a>')
            out=out.replace('>会員ページ</a>','>現地確認を依頼する</a>')
            out=out.replace('>ログイン</a>','>現地確認を依頼する</a>')
            out=out.replace('依頼には無料会員登録が必要です','会員登録なしで依頼できます')
            if p.name=='faq.html':
              out=out.replace('会員登録に料金はかかりますか。','会員登録は必要ですか。')
              out=out.replace('無料です。月額課金もありません。','いいえ。会員登録・ログインなしで現地確認を依頼できます。月額課金もありません。')
              out=out.replace('現地確認は1回3,480円（税込）です。依頼送信後、会員ページからカード払い前の最終確認画面へ進み','青森市内の標準的な外観確認は1回3,480円（税込）です。むつ市などの遠方物件は出張料金を事前見積もりします。青森市内の標準案件は依頼送信後にカード払い前の最終確認画面へ進み')
              out=out.replace('標準の現地確認サービスは1回3,480円（税込）で、追加料金はありません。','青森市内の標準的な現地確認は1回3,480円（税込）で、追加料金はありません。むつ市などの遠方物件は出張料金を事前見積もりします。')
              out=out.replace('クレジットカードによる前払いです。カード払い前の最終確認画面からStripeの決済ページへ進みます。','青森市内の標準案件はクレジットカードによる前払いです。カード払い前の最終確認画面からStripeへ進みます。むつ市などの遠方物件は事前に料金と支払方法をご案内します。')
              out=out.replace('本人を識別できる会員情報、物件住所、写真を','本人を識別できる依頼者情報、物件住所、写真を')
            if p.name=='service.html':
              out=out.replace('1回3,480円（税込）。標準サービスについて追加料金はありません。','青森市内の標準的な外観確認は1回3,480円（税込）です。むつ市などの遠方物件は出張料金を含め事前見積もりします。')
              out=out.replace('依頼後、会員ページからカード払い前の最終確認画面へ進み','青森市内の標準案件は依頼送信後にカード払い前の最終確認画面へ進み')
            if p.name=='service-terms.html':
              out=out.replace('現地確認1回3,480円（税込）。標準サービスについて追加料金はありません。','青森市内の標準的な外観現地確認は1回3,480円（税込）で、追加料金はありません。むつ市などの遠方物件は出張費を含む合計料金を事前に個別見積もりし、利用者の同意なく後から加算しません。')
              out=out.replace('無料会員登録または現地確認依頼フォームの送信だけでは','現地確認依頼フォームの送信だけでは')
              out=out.replace('依頼受付後、会員ページからカード払い前の最終確認画面へ進み','青森市内の標準案件は依頼受付後にカード払い前の最終確認画面へ進み')
              out=out.replace('利用者が最終確認画面で申込みに同意し、Stripeで3,480円のカード決済を完了し、当事業者のシステムが支払いを正常に確認した時点で個別契約が成立します。','青森市内の標準案件は、利用者が最終確認画面で申込みに同意し、Stripeで3,480円のカード決済を完了し、当事業者のシステムが支払いを正常に確認した時点で個別契約が成立します。むつ市などの個別見積案件は、対応可否・合計料金・支払方法・提供条件を事前に提示し、利用者の同意および案内した支払いの確認後に契約成立とします。')
              out=out.replace('会員ページその他利用可能な方法で案内します','メールその他利用可能な連絡手段で案内します')
              out=out.replace('会員ページまたはカード払い前の最終確認画面に','個別見積書またはカード払い前の最終確認画面に')
              out=out.replace('最終改定日：2026年8月22日 適用開始日：2026年8月22日','最終改定日：2026年11月13日 適用開始日：2026年11月13日')
            if p.name=='commercial.html':
              out=out.replace('役務の対価：無料会員登録0円、月額0円。現地確認1回3,480円（税込）。標準サービスについて追加料金はありません。','役務の対価：会員登録・月額料金なし。青森市内の標準的な外観現地確認は1回3,480円（税込）。むつ市などの遠方物件は出張料金を含む合計額を事前見積もりします。')
              out=out.replace('支払方法：クレジットカード。Stripeが提供する決済ページで行います。','支払方法：青森市内の標準案件はクレジットカード。むつ市などの個別見積案件は見積もり時に支払方法を案内します。カード決済はStripeが提供する決済ページで行います。')
              out=out.replace('支払時期：カード払い前の最終確認画面で申込み内容を確認した後、Stripeで前払いします。','支払時期：青森市内の標準案件は最終確認画面で申込み内容を確認した後、Stripeで前払いします。個別見積案件は見積もり時に支払時期を案内します。')
              out=out.replace('依頼受付後、会員ページからカード払い前の最終確認画面へ進み','青森市内の標準案件は依頼受付後にカード払い前の最終確認画面へ進み')
              out=out.replace('契約成立：利用者が最終確認画面で申込みに同意してStripeで支払いを完了し、当事業者のシステムが当該支払いを正常に確認した時点で成立します。','契約成立：青森市内の標準案件は最終確認画面への同意とStripe決済を行い、当事業者のシステムが支払いを正常に確認した時点で成立します。個別見積案件は事前提示した条件への同意と案内した支払いの確認後に成立します。')
            if p.name=='service-terms.html':
              out=out.replace('最終改定日：2026年8月22日　適用開始日：2026年8月22日','最終改定日：2026年11月13日　適用開始日：2026年11月13日')
            if p.name=='commercial.html':
              out=out.replace('無料会員登録0円、月額0円。現地確認1回3,480円（税込）。標準サービスについて追加料金はありません。','会員登録・月額料金なし。青森市内の標準的な外観現地確認は1回3,480円（税込）。むつ市などの遠方物件は出張料金を含む合計額を事前見積もりします。')
              out=out.replace('クレジットカード。Stripeが提供する決済ページで行います。','青森市内の標準案件はクレジットカード。むつ市などの個別見積案件は見積もり時に支払方法を案内します。カード決済はStripeが提供する決済ページで行います。')
              out=out.replace('カード払い前の最終確認画面で申込み内容を確認した後、Stripeで前払いします。','青森市内の標準案件は最終確認画面で申込み内容を確認した後、Stripeで前払いします。個別見積案件は見積もり時に支払時期を案内します。')
              out=out.replace('利用者が最終確認画面で申込みに同意してStripeで支払いを完了し、当事業者のシステムが当該支払いを正常に確認した時点で成立します。','青森市内の標準案件は、利用者が最終確認画面で申込みに同意してStripeで支払いを完了し、当事業者のシステムが支払いを正常に確認した時点で成立します。個別見積案件は事前提示した条件への同意と案内した支払いの確認後に成立します。')
            # Eliminate the abandoned onsite attendance product option from public materials.
            if p.name=='service.html':
              out=re.sub(r'<div class="wrap mt-22"><div class="panel"><h2>現地での立会いは任意です</h2>.*?</div></div>','',out,flags=re.S)
              out=out.replace('現地での立会いは任意です','')
              out=out.replace('任意の現地立会い','')
            if p.name=='faq.html':
              out=re.sub(r'<details>\s*<summary>現地で立ち会うことはできますか。</summary>.*?</details>','',out,flags=re.S)
              out=out.replace('任意の現地立会いを希望した場合も、標準サービスの範囲内で追加料金はありません。','')
              out=out.replace('利用地域、任意の現地立会い、','利用地域、')
            if p.name=='service-terms.html':
              out=out.replace('確認範囲・現地立会い','確認範囲')
              out=out.replace('確認範囲、任意の現地立会い、権限','確認範囲、権限')
              out=re.sub(r'<p>利用者本人または利用者が指定した者が希望する場合、依頼時に.*?</p>','',out,flags=re.S)
            # Keep the transaction UI short, while legal and detailed information remain linked.
            out=out.replace('会員登録なしで依頼する','現地確認を依頼する')
            out=out.replace('会員登録なしで依頼','依頼する')
            out=out.replace('登録なしで現地確認を依頼する','現地確認を依頼する')
            out=out.replace('登録なしで依頼する','依頼する')
            if p.name not in legacy and 'assets/warm-20261113.css' not in out and '</head>' in out:
              out=out.replace('</head>','<link href="assets/warm-20261113.css" rel="stylesheet"></head>',1)
            # 2026-11-13: price policy still under review. Do not single out Mutsu as a distant surcharge region.
            out=out.replace('むつ市などの遠方物件は出張料金を事前見積もりします。','個別見積もりが必要な場合は、事前に正式料金をご案内します。')
            out=out.replace('むつ市などの遠方物件は出張料金を含め事前見積もりします。','個別見積もりが必要な場合は事前に正式料金をご案内します。')
            out=out.replace('むつ市などの遠方物件は出張費を含む合計料金を事前に個別見積もりし','個別見積もりが必要な場合は合計料金を事前に提示し')
            out=out.replace('むつ市などの遠方物件は出張料金を含む合計額を事前見積もりします。','個別見積もりが必要な場合は合計額を事前に提示します。')
            out=out.replace('むつ市などの遠方物件は出張料金を含む合計料金を事前見積もりします。','個別見積もりが必要な場合は合計料金を事前に提示します。')
            out=out.replace('むつ市などの遠方物件は','個別見積もりが必要な物件は')
            out=out.replace('むつ市などの遠方は','個別見積もりが必要な場合は')
            out=out.replace('むつ市などの個別見積案件は','個別見積案件は')
            out=out.replace('青森市内の標準的な外観確認は1回3,480円（税込）です。','青森の外観確認は基本料金1回3,480円（税込）からご案内しています。')
            out=out.replace('青森市内の標準的な現地確認は1回3,480円（税込）で、追加料金はありません。','外観確認の基本料金は1回3,480円（税込）です。追加料金が必要な場合は事前に合計額をご案内します。')
            out=out.replace('青森市内の標準的な外観現地確認は1回3,480円（税込）で、追加料金はありません。','外観現地確認の基本料金は1回3,480円（税込）です。個別見積もりが必要な場合は事前に合計額をご案内します。')
            out=out.replace('青森市内の標準的な外観現地確認は1回3,480円（税込）。','青森の外観確認は基本料金1回3,480円（税込）。')
            out=out.replace('青森市内の標準案件は','基本料金でお申し込みの場合は')
            out=out.replace('青森市内の標準的な外観現地確認','青森の外観現地確認')
            if p.name=='payment.html':
              out=out.replace('現地確認は1回3,480円（税込）。','外観現地確認の基本料金は1回3,480円（税込）。')
              out=out.replace('現地確認を依頼した回だけ3,480円をお支払いいただく','現地確認を依頼した回のみ料金が発生する')
            if p.name=='faq.html':
              out=out.replace('遠方の方は現地での立会いなしでも利用できます。','現地への同行は必要ありません。')
            if p.name=='service.html':
              out=out.replace('青森市内の対象物件へ訪問し','青森の対象物件へ訪問し')
              out=out.replace('青森市内の対象物件に','青森の対象物件に')
            out=out.replace('むつ市を遠方','青森の物件')
            if out!=text:p.write_text(out,encoding='utf-8');changed+=1
          print('REGISTRATION_CTA_REWRITTEN_PAGES',changed)
          PY

      - name: Apply and verify fixed-price public navigation patch
        run: node scripts/akiya-fixed-price-finalize.cjs dist

      - name: Validate production artifact
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq '会員登録・月額料金なし' dist/commercial.html
          ! grep -Fq '無料会員登録0円' dist/commercial.html
          grep -Fq '最終改定日：2026年11月13日' dist/service-terms.html
          test "$(grep -o '個別見積案件は' dist/service-terms.html | wc -l)" -le 1
          test "$(grep -o '基本料金でカード払いをご案内する場合は' dist/service-terms.html | wc -l)" -le 1
          ! grep -Fq '会員ページ' dist/service-terms.html
