name: Akiya ready r13 full paid-flow audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and verify ready branch
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/nknkny/Homepage/akiya-r13-ready-20260818'
          files=(
            assets/config.js assets/api.js assets/pages/checkout-inline-1.js
            assets/pages/request-inline-1.js assets/pages/member-inline-1.js
            assets/pages/payment-success-inline-1.js request.html checkout.html member.html
            service-terms.html commercial.html payment.html faq.html service.html
            aomori-city.html payment-success.html
          )
          for f in "${files[@]}"; do mkdir -p "$(dirname "$f")"; curl -fsSL --max-time 30 "$BASE/$f" -o "$f"; done
          for f in assets/api.js assets/pages/checkout-inline-1.js assets/pages/request-inline-1.js assets/pages/member-inline-1.js assets/pages/payment-success-inline-1.js; do node --check "$f"; done
          grep -q 'akiya-pocket-api' assets/config.js
          grep -q 'akiya-pocket-payment-api' assets/config.js
          grep -q '2026-08-18-payment-bridge-r2' assets/config.js
          grep -q "buy.stripe.com" assets/pages/checkout-inline-1.js
          grep -q "3,480円" checkout.html
          grep -q "原則7日以内" checkout.html
          grep -q "支払いを正常に確認した時点" service-terms.html
          grep -q "支払いを正常に確認した時点" commercial.html
          if grep -R -n -E '契約成立メール|個別案内メール|銀行振込' request.html checkout.html member.html service-terms.html commercial.html payment.html faq.html service.html aomori-city.html payment-success.html; then
            echo 'OLD_MAIL_OR_BANK_FLOW_FOUND'; exit 1
          fi
          if grep -R -n '遨ｺ螳ｶ' .; then echo 'MOJIBAKE_FOUND'; exit 1; fi
          echo 'AKIYA_READY_R13_PAID_FLOW_AUDIT=PASS'
