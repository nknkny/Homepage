name: Akiya ready r13 full paid-flow audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and verify ready branch
        shell: bash
        run: |
          set -u
          BASE='https://raw.githubusercontent.com/nknkny/Homepage/akiya-r13-ready-20260818'
          files=(
            assets/config.js assets/api.js assets/pages/checkout-inline-1.js
            assets/pages/request-inline-1.js assets/pages/member-inline-1.js
            assets/pages/payment-success-inline-1.js request.html checkout.html member.html
            service-terms.html commercial.html payment.html faq.html service.html
            aomori-city.html payment-success.html
          )
          fail=0
          for f in "${files[@]}"; do mkdir -p "$(dirname "$f")"; if curl -fsSL --max-time 30 "$BASE/$f" -o "$f"; then echo "FETCH_PASS $f"; else echo "FETCH_FAIL $f"; fail=1; fi; done
          for f in assets/api.js assets/pages/checkout-inline-1.js assets/pages/request-inline-1.js assets/pages/member-inline-1.js assets/pages/payment-success-inline-1.js; do if node --check "$f"; then echo "JS_PASS $f"; else echo "JS_FAIL $f"; fail=1; fi; done
          check(){ label="$1"; shift; if "$@"; then echo "CHECK_PASS $label"; else echo "CHECK_FAIL $label"; fail=1; fi; }
          check MAIN_API grep -q 'akiya-pocket-api' assets/config.js
          check PAYMENT_API grep -q 'akiya-pocket-payment-api' assets/config.js
          check PAYMENT_BUILD grep -q '2026-08-18-payment-bridge-r2' assets/config.js
          check STRIPE_HOST grep -q 'buy.stripe.com' assets/pages/checkout-inline-1.js
          check PRICE grep -q '3,480円' checkout.html
          check DELIVERY grep -q '原則7日以内' checkout.html
          check TERMS_CONTRACT grep -q '支払いを正常に確認した時点' service-terms.html
          check COMMERCIAL_CONTRACT grep -q '支払いを正常に確認した時点' commercial.html
          if grep -R -n -E '契約成立メール|個別案内メール|銀行振込' request.html checkout.html member.html service-terms.html commercial.html payment.html faq.html service.html aomori-city.html payment-success.html; then echo 'CHECK_FAIL OLD_MAIL_OR_BANK_FLOW'; fail=1; else echo 'CHECK_PASS NO_OLD_MAIL_OR_BANK_FLOW'; fi
          if grep -R -n '遨ｺ螳ｶ' .; then echo 'CHECK_FAIL MOJIBAKE'; fail=1; else echo 'CHECK_PASS NO_MOJIBAKE'; fi
          test "$fail" -eq 0 || exit 1
          echo 'AKIYA_READY_R13_PAID_FLOW_AUDIT=PASS'
