name: Akiya owner state accuracy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OWNER_API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner
  COMMAND_API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-command-center
  CONTROL_API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-automation-control
  AUTOMATION_RUNNER_API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-automation-runner
  SOCIAL_RUNNER_API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-social-runner
  SOCIAL_ANALYSIS_API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-social-analysis
  NEWSLETTER_API: https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-newsletter-control
  CANONICAL_CUSTOMER: https://akiya-pocket-aomori.pages.dev/

jobs:
  state-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify command center and runtime control surfaces
        shell: bash
        run: |
          set -euo pipefail
          dashboard='akiya-pocket/control-center/index.html'
          grep -Fq '運営司令塔' "$dashboard"
          grep -Fq 'akiya-pocket-command-center' "$dashboard"
          grep -Fq './acquisition.html' "$dashboard"
          grep -Fq './business.html' "$dashboard"
          grep -Fq './system.html' "$dashboard"
          grep -Fq './social.html' "$dashboard"
          grep -Fq './newsletter.html' "$dashboard"
          grep -Fq '現在あなたが今すぐやること' "$dashboard"

          acquisition='akiya-pocket/control-center/acquisition.html'
          test -s "$acquisition"
          grep -Fq '流入→価値閲覧→登録→依頼→支払で判定。' "$acquisition"
          grep -Fq '外部適格セッション 7日' "$acquisition"

          business='akiya-pocket/control-center/business.html'
          test -s "$business"
          grep -Fq 'Stripe実ライブイベント' "$business"
          grep -Fq '実売上' "$business"

          system='akiya-pocket/control-center/system.html'
          test -s "$system"
          grep -Fq 'Cloudflare / GitHub / 検索通知' "$system"
          grep -Fq 'DBセキュリティ基礎監査' "$system"

          controls='akiya-pocket/control-center/automation.html'
          test -s "$controls"
          grep -Fq '主要運営スイッチ' "$controls"
          grep -Fq 'akiya-pocket-automation-control' "$controls"
          grep -Fq "action:'set_growth'" "$controls"
          grep -Fq "action:'set_monitor'" "$controls"
          grep -Fq "action:'set_metrics'" "$controls"
          grep -Fq "action:'set_full_auto'" "$controls"
          grep -Fq 'data-module=' "$controls"
          grep -Fq '今すぐ実行' "$controls"
          grep -Fq './newsletter.html' "$controls"
          grep -Fq 'SNSは承認なしで、安全審査済み投稿だけ自動予約・公開します' "$controls"
          grep -Fq '同意済み無料会員の育成配信も自動です' "$controls"
          grep -Fq 'B2B営業メール・DM・企業への集客営業はOFFです' "$controls"
          ! grep -Fq 'SNS公開・外部メール送信は所有者承認なしでは行いません' "$controls"
          ! grep -Fq '汎用ジョブ実行器が完成していない' "$controls"

          social='akiya-pocket/control-center/social.html'
          grep -Fq 'akiya-pocket-social-analysis' "$social"
          grep -Fq '所有者の1投稿ごとの承認は不要です' "$social"
          grep -Fq '投稿効果の分析' "$social"
          grep -Fq '補助金・助成金・給付金' "$social"
          ! grep -Fq '承認して推奨時間に予約' "$social"
          ! grep -Fq '今すぐ公開' "$social"

          newsletter='akiya-pocket/control-center/newsletter.html'
          test -s "$newsletter"
          grep -Fq 'akiya-pocket-newsletter-control' "$newsletter"
          grep -Fq '通常の会員育成は自動運用です' "$newsletter"
          grep -Fq '所有者の毎回承認は不要です' "$newsletter"
          grep -Fq '手動キャンペーンを配信待ちへ' "$newsletter"
          grep -Fq 'marketing_opt_in=true' "$newsletter"

      - name: Verify live owner and command APIs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$OWNER_API" -o owner.json
          jq -e --arg u "$CANONICAL_CUSTOMER" '
            .ok==true and
            .ready==true and
            .fullAutoButton==true and
            .fullAutoExecutorReady==true and
            .socialPublishProtected==true and
            .canonicalCustomer==$u and
            .realOnlyMetrics==true
          ' owner.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "$COMMAND_API" -o command.json
          jq -e '.ok==true and .ready==true and .realOnlyMetrics==true' command.json >/dev/null

      - name: Verify automation control and runners are live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$CONTROL_API" -o control.json
          jq -e '
            .ok==true and
            .ready==true and
            .executorReady==true and
            .fullAutoAvailable==true and
            .socialApprovalRequired==false and
            .socialAutopublishEnabled==true and
            .socialTransport=="buffer" and
            .externalEmailAutoSend==false
          ' control.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "$AUTOMATION_RUNNER_API" -o automation-runner.json
          jq -e '.ok==true and .ready==true and .externalSalesEmail==false and .memberNurtureManagedSeparately==true and .socialAutoPublishPipeline==true and .testAuditDrillExcluded==true and (.supported|length)==8' automation-runner.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "$SOCIAL_RUNNER_API" -o social-runner.json
          jq -e '.ok==true and .ready==true and .transport=="buffer" and .ownerApprovalRequired==false and .autoPublishSafeVerified==true and .regulatedTopicsBlocked==true and .firstPartyScheduleAdaptation==true' social-runner.json >/dev/null

      - name: Verify social analysis and newsletter gates are live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$SOCIAL_ANALYSIS_API" -o social-analysis.json
          jq -e '.ok==true and .ready==true and .firstPartyAdaptive==true and .minimumPublishedForAdaptation==12' social-analysis.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "$NEWSLETTER_API" -o newsletter.json
          jq -e '.ok==true and .ready==true and .approvalRequired==false and .manualCampaignApprovalRequired==true and .optInOnly==true and .regulatedContentBlocked==true' newsletter.json >/dev/null
