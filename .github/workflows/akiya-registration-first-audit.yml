name: Akiya registration-first audit

on:
  push:
    branches: [main]
    paths:
      - 'akiya-pocket/**'
      - 'scripts/build-akiya-cloudflare-pages.mjs'
      - '.github/workflows/akiya-registration-first-audit.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event_name == 'push' || (github.event.issue.number == 42 && contains(github.event.comment.body, 'RUN_AKIYA_REGISTRATION_FIRST_AUDIT'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build customer artifact
        env:
          AKIYA_CANONICAL_ORIGIN: https://akiya-pocket-aomori.pages.dev
          AKIYA_DEPLOYMENT_URL: https://akiya-pocket-aomori.pages.dev
        run: |
          set -euo pipefail
          node scripts/build-akiya-cloudflare-pages.mjs

      - name: Enforce registration-first customer funnel
        run: |
          set -euo pipefail
          if grep -RFn --include='*.html' 'functions/v1/akiya-pocket-live' dist; then
            echo 'ERROR: legacy direct Edge UI link remains in customer HTML' >&2
            exit 1
          fi
          grep -Fq '入力は3項目です' dist/register.html
          grep -Fq 'name="name"' dist/register.html
          grep -Fq 'name="email"' dist/register.html
          grep -Fq 'name="password"' dist/register.html
          grep -Fq 'name="requiredConsent"' dist/register.html
          ! grep -Fq 'passwordConfirm' dist/register.html
          ! grep -Fq 'marketingOptIn' dist/register.html
          ! grep -Fq 'passwordConfirm' dist/assets/pages/register-inline-1.js
          grep -Fq 'register_member' dist/assets/pages/register-inline-1.js
          grep -Fq 'register_start' dist/assets/pages/register-inline-1.js
          grep -Fq 'register_submit_attempt' dist/assets/pages/register-inline-1.js
          grep -Fq 'register.html?utm_source=seo&utm_medium=organic&utm_campaign=aomori_city_hub' dist/aomori-city.html
          grep -Fq '>無料会員登録<' dist/aomori-city.html
          ! grep -Fq '>現地確認を依頼<' dist/aomori-city.html
          for f in index.html aomori-city.html remote-home-aomori.html inherited-home-aomori.html parent-facility-home-aomori.html snow-vacant-home-aomori.html; do
            grep -Fq 'register.html' "dist/$f" || { echo "ERROR: $f has no registration path" >&2; exit 1; }
          done
          echo 'AKIYA_REGISTRATION_FIRST_AUDIT=PASS'

      - name: Report audit
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = 'success' ]; then overall=PASS; else overall=FAIL; fi
          body=$(jq -n --arg o "$overall" '{body:("AKIYA_REGISTRATION_FIRST_AUDIT="+$o)}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$body" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/42/comments" >/dev/null
