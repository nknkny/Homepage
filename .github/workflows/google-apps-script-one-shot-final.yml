name: Google Apps Script One Shot Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRIPT_ID: 1pHn5wId7xIMZ3iwNqSqpePLf6eSMuiagDfvCktAZepSfpxQ0JgWcWhZp
      TARGET_DEPLOYMENT: AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w
      EXPECTED_DIRTY_SHA256: 5e694ab3be198c887f6372110733609450ad4abf2c970751d33c354638ec56dd
      EXPECTED_CLEAN_SHA256: 9dba6c727262a63e54d10514a76d410476793267e3b079c8b219dcbe4a9657ef
      EXPECTED_BUILD: 2026-08-06-insurance-optional
      SPREADSHEET_ID: 12nRr3Fkq8tYZWd-MQvdQXpeO9p9cGuT3CvtRnL_omw8
      API_URL: https://script.google.com/macros/s/AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w/exec
      OWNER_EMAIL: jmdjdtdjdt@gmail.com
      BRANCH: agent/auth-cli-bundle-20260807
      CLEAN_ARTIFACT_ID: 8988607496
    steps:
      - name: Authenticate exact owner once
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/gcli" @google/clasp@3.3.0 >/dev/null 2>&1
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -subj "/CN=akiya-one-shot-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1
          mkfifo "$RUNNER_TEMP/in"
          exec 3<>"$RUNNER_TEMP/in"
          "$CLASP" login --no-localhost --redirect-port 8888 <&3 >"$RUNNER_TEMP/login.log" 2>&1 &
          pid=$!
          auth_url=''
          for _ in $(seq 1 120); do
            auth_url=$(grep -Eo 'https://accounts\.google\.com/o/oauth2/v2/auth\?[^[:space:]]+' "$RUNNER_TEMP/login.log" | tail -1 || true)
            [ -n "$auth_url" ] && break
            sleep 1
          done
          test -n "$auth_url"
          auth_url="${auth_url}&login_hint=jmdjdtdjdt%40gmail.com"
          cert=$(base64 -w0 "$RUNNER_TEMP/cert.pem")
          file=".github/auth/one-shot-${GITHUB_RUN_ID}.b64"
          body=$(jq -n --arg r "$GITHUB_RUN_ID" --arg c "$cert" --arg u "$auth_url" --arg f "$file" \
            '{body:("GOOGLE_ONE_SHOT_READY\nRUN_ID="+$r+"\nOWNER_REQUIRED=jmdjdtdjdt@gmail.com\nGOOGLE_AUTH_URL="+$u+"\nAUTH_CERT_B64="+$c+"\nAUTH_FILE="+$f)}')
          curl -fsSL --retry 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' -d "$body" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          echo ONE_SHOT_CHANNEL_READY=PASS

          enc=''
          for i in $(seq 1 1200); do
            url="https://raw.githubusercontent.com/nknkny/Homepage/$BRANCH/$file?run=$GITHUB_RUN_ID&i=$i"
            if enc=$(curl -fsSL --retry 2 --retry-all-errors -H 'Cache-Control: no-cache' "$url" 2>/dev/null); then
              [ -n "$enc" ] && break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              sed -E 's#4/[A-Za-z0-9_-]+#[REDACTED_AUTH_CODE]#g' "$RUNNER_TEMP/login.log"
              exit 1
            fi
            sleep 1
          done
          test -n "$enc"
          printf '%s' "$enc" | base64 -d > "$RUNNER_TEMP/callback.cms"
          openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/callback.cms" \
            -recip "$RUNNER_TEMP/cert.pem" -inkey "$RUNNER_TEMP/key.pem" \
            -out "$RUNNER_TEMP/callback.txt"
          callback=$(cat "$RUNNER_TEMP/callback.txt")
          case "$callback" in http://localhost:8888/*|http://127.0.0.1:8888/*) :;; *) echo INVALID_CALLBACK; exit 1;; esac
          printf '%s\n' "$callback" >&3
          wait "$pid"
          exec 3>&-
          echo CLASP_LOGIN_EXCHANGE=PASS
          "$CLASP" show-authorized-user --json > "$RUNNER_TEMP/user.json"
          jq -e --arg e "$OWNER_EMAIL" '.loggedIn==true and ((.email // "")|ascii_downcase)==($e|ascii_downcase)' "$RUNNER_TEMP/user.json" >/dev/null
          echo OWNER_ACCOUNT_MATCH=PASS

      - name: Verify exact project and preserve current public manifest
        shell: bash
        run: |
          set -euo pipefail
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          mkdir -p "$RUNNER_TEMP/target"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > "$RUNNER_TEMP/target/.clasp.json"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json list-deployments > "$RUNNER_TEMP/deployments-before.json"
          before_version=$(jq -r --arg d "$TARGET_DEPLOYMENT" '.[]|select(.deploymentId==$d)|.versionNumber//empty' "$RUNNER_TEMP/deployments-before.json")
          test -n "$before_version"
          echo "TARGET_DEPLOYMENT_OWNERSHIP=PASS version=$before_version"
          token=$(jq -r '.tokens.default.access_token // empty' "$HOME/.clasprc.json")
          test -n "$token"
          curl -fsSL -H "Authorization: Bearer $token" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" -o "$RUNNER_TEMP/head-before.json"
          curl -fsSL -H "Authorization: Bearer $token" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content?versionNumber=$before_version" -o "$RUNNER_TEMP/public-version.json"
          python - "$RUNNER_TEMP/head-before.json" "$RUNNER_TEMP/public-version.json" "$EXPECTED_DIRTY_SHA256" "$EXPECTED_CLEAN_SHA256" "$EXPECTED_BUILD" "$SPREADSHEET_ID" <<'PY'
          import json,hashlib,sys
          hp,vp,dirty,clean,build,sheet=sys.argv[1:]
          h=json.load(open(hp,encoding='utf-8')); v=json.load(open(vp,encoding='utf-8'))
          hs=[f for f in h.get('files',[]) if f.get('type')=='SERVER_JS']; assert len(hs)==1
          sha=hashlib.sha256(hs[0].get('source','').encode()).hexdigest(); print('HEAD_SHA256='+sha)
          assert sha in (dirty,clean), (sha,dirty,clean)
          assert build in hs[0].get('source','') and sheet in hs[0].get('source','')
          vm=[f for f in v.get('files',[]) if f.get('type')=='JSON']; assert len(vm)==1
          manifest=json.loads(vm[0].get('source','{}'))
          webapp=manifest.get('webapp') or {}
          print('CURRENT_PUBLIC_WEBAPP='+json.dumps(webapp,ensure_ascii=False))
          assert webapp.get('access') not in (None,'MYSELF'), webapp
          assert webapp.get('executeAs') is not None, webapp
          print('PUBLIC_MANIFEST_PRESERVE=PASS')
          PY
          cp "$RUNNER_TEMP/head-before.json" "$GITHUB_WORKSPACE/apps-script-head-before.json"
          cp "$RUNNER_TEMP/public-version.json" "$GITHUB_WORKSPACE/apps-script-public-version-before.json"

      - name: Build exact approved source with preserved public manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/artifacts/$CLEAN_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/clean.zip"
          mkdir -p "$RUNNER_TEMP/clean"
          unzip -q "$RUNNER_TEMP/clean.zip" -d "$RUNNER_TEMP/clean"
          code=$(find "$RUNNER_TEMP/clean" -type f -name 'apps-script-approved-clean-Code.gs' -print -quit)
          test -n "$code"
          python - "$code" "$RUNNER_TEMP/public-version.json" "$RUNNER_TEMP/deploy-content.json" "$EXPECTED_CLEAN_SHA256" "$EXPECTED_BUILD" "$SPREADSHEET_ID" <<'PY'
          import json,hashlib,re,sys
          code,version,out,h,b,s=sys.argv[1:]
          src=open(code,encoding='utf-8').read(); actual=hashlib.sha256(src.encode()).hexdigest()
          print('APPROVED_CLEAN_SHA256='+actual); assert actual==h
          assert b in src and s in src
          names=re.findall(r'^function\s+([A-Za-z_$][\w$]*)\s*\(',src,flags=re.M)
          assert len(names)==151 and len(set(names))==151
          v=json.load(open(version,encoding='utf-8'))
          mf=[f for f in v.get('files',[]) if f.get('type')=='JSON']; assert len(mf)==1
          manifest=json.loads(mf[0].get('source','{}')); webapp=manifest.get('webapp') or {}
          assert webapp.get('access') not in (None,'MYSELF')
          files=[{'name':mf[0]['name'],'type':'JSON','source':mf[0]['source']}, {'name':'コード','type':'SERVER_JS','source':src}]
          json.dump({'files':files},open(out,'w',encoding='utf-8'),ensure_ascii=False)
          print('DEPLOY_CONTENT=PASS FUNCTIONS=151 UNIQUE=151 DUPLICATES=0')
          PY
          cp "$code" "$GITHUB_WORKSPACE/apps-script-approved-clean-Code.gs"

      - name: Replace HEAD only if necessary and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          token=$(jq -r '.tokens.default.access_token // empty' "$HOME/.clasprc.json")
          current=$(python - "$RUNNER_TEMP/head-before.json" <<'PY'
          import json,hashlib,sys
          x=json.load(open(sys.argv[1])); s=[f['source'] for f in x['files'] if f['type']=='SERVER_JS'][0]
          print(hashlib.sha256(s.encode()).hexdigest())
          PY
          )
          if [ "$current" != "$EXPECTED_CLEAN_SHA256" ]; then
            http=$(curl -sS -X PUT -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @"$RUNNER_TEMP/deploy-content.json" \
              -o "$RUNNER_TEMP/update-response.json" -w '%{http_code}' \
              "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
            echo "UPDATE_CONTENT_HTTP=$http"
            cat "$RUNNER_TEMP/update-response.json"
            test "$http" = 200
          else
            echo HEAD_CODE_ALREADY_CLEAN=PASS
            # Still restore the proven public webapp manifest before versioning.
            http=$(curl -sS -X PUT -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @"$RUNNER_TEMP/deploy-content.json" \
              -o "$RUNNER_TEMP/update-response.json" -w '%{http_code}' \
              "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
            test "$http" = 200
          fi
          curl -fsSL -H "Authorization: Bearer $token" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" -o "$RUNNER_TEMP/head-after.json"
          python - "$RUNNER_TEMP/head-after.json" "$EXPECTED_CLEAN_SHA256" <<'PY'
          import json,hashlib,re,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          src=[f.get('source','') for f in x.get('files',[]) if f.get('type')=='SERVER_JS'][0]
          actual=hashlib.sha256(src.encode()).hexdigest(); print('POST_WRITE_HEAD_SHA256='+actual); assert actual==sys.argv[2]
          names=re.findall(r'^function\s+([A-Za-z_$][\w$]*)\s*\(',src,flags=re.M); assert len(names)==151 and len(set(names))==151
          manifest=json.loads([f['source'] for f in x['files'] if f['type']=='JSON'][0]); webapp=manifest.get('webapp') or {}
          assert webapp.get('access') not in (None,'MYSELF')
          print('HEAD_POST_WRITE_VERIFIED=PASS FUNCTIONS=151 UNIQUE=151 DUPLICATES=0')
          PY
          cp "$RUNNER_TEMP/head-after.json" "$GITHUB_WORKSPACE/apps-script-head-after.json"

      - name: Update exact existing production deployment
        shell: bash
        run: |
          set -euo pipefail
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json update-deployment \
            "$TARGET_DEPLOYMENT" --description 'Production recovery 2026-08-08 approved clean source' \
            > "$RUNNER_TEMP/update-deployment.json"
          cat "$RUNNER_TEMP/update-deployment.json"
          grep -Fq "$TARGET_DEPLOYMENT" "$RUNNER_TEMP/update-deployment.json"
          "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" --json list-deployments > "$RUNNER_TEMP/deployments-after.json"
          jq -r --arg d "$TARGET_DEPLOYMENT" '.[]|select(.deploymentId==$d)' "$RUNNER_TEMP/deployments-after.json"
          echo EXISTING_DEPLOYMENT_UPDATED=PASS
          cp "$RUNNER_TEMP/deployments-after.json" "$GITHUB_WORKSPACE/apps-script-deployments-after.json"

      - name: Verify fixed public production exec
        shell: bash
        run: |
          set -euo pipefail
          ok=''
          for _ in $(seq 1 40); do
            if curl -fsSL --location --max-time 30 "$API_URL?recovery=$GITHUB_RUN_ID&n=$_" -o "$RUNNER_TEMP/live.json" 2>/dev/null; then
              if jq -e --arg b "$EXPECTED_BUILD" '.buildVersion==$b and .app=="空き家レスキュー会員管理" and .ready==true' "$RUNNER_TEMP/live.json" >/dev/null 2>&1; then ok=1; break; fi
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/live.json"
          test -n "$ok"
          echo APPS_SCRIPT_PRODUCTION_RECOVERY=PASS
          cp "$RUNNER_TEMP/live.json" "$GITHUB_WORKSPACE/apps-script-live-after.json"

      - name: Best effort owner health and Stripe probe through Execution API
        continue-on-error: true
        shell: bash
        run: |
          set +e
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"
          echo ADMIN_SETTINGS_BEGIN
          timeout 60 "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" run adminGetSettings > "$RUNNER_TEMP/admin-settings.txt" 2>&1
          cat "$RUNNER_TEMP/admin-settings.txt"
          echo ADMIN_SETTINGS_END
          echo HEALTH_BEFORE_BEGIN
          timeout 60 "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" run ownerHealthCheckLaunch > "$RUNNER_TEMP/health-before.txt" 2>&1
          cat "$RUNNER_TEMP/health-before.txt"
          echo HEALTH_BEFORE_END
          echo STRIPE_PROBE_BEGIN
          timeout 90 "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" run adminStripeLiveProbe > "$RUNNER_TEMP/stripe-probe.txt" 2>&1
          cat "$RUNNER_TEMP/stripe-probe.txt"
          echo STRIPE_PROBE_END
          echo HEALTH_AFTER_BEGIN
          timeout 60 "$CLASP" -P "$RUNNER_TEMP/target/.clasp.json" run ownerHealthCheckLaunch > "$RUNNER_TEMP/health-after.txt" 2>&1
          cat "$RUNNER_TEMP/health-after.txt"
          echo HEALTH_AFTER_END
          exit 0

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-one-shot-${{ github.run_id }}
          path: |
            apps-script-head-before.json
            apps-script-public-version-before.json
            apps-script-approved-clean-Code.gs
            apps-script-head-after.json
            apps-script-deployments-after.json
            apps-script-live-after.json
          retention-days: 7
