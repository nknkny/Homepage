name: Google Apps Script Production Recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gas-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOYMENT_ID: AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w
      EXPECTED_BUILD: 2026-08-06-insurance-optional
      SPREADSHEET_ID: 12nRr3Fkq8tYZWd-MQvdQXpeO9p9cGuT3CvtRnL_omw8
      API_URL: https://script.google.com/macros/s/AKfycbzWYTf9K_XyEfo1CD4Pshg18ANH5_zhOsTnyiFhKTwbDgs17ZOXqLgAxKrvO7TA3wYr0w/exec
    steps:
      - name: Prepare secure callback channel
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout "$RUNNER_TEMP/google-callback-key.pem" \
            -out "$RUNNER_TEMP/google-callback-cert.pem" \
            -subj "/CN=akiya-google-recovery-${GITHUB_RUN_ID}" -days 1 >/dev/null 2>&1

      - name: Authorize owner and deploy existing Apps Script web app
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/gcli" @google/clasp@3.3.0 >/dev/null 2>&1
          CLASP="$RUNNER_TEMP/gcli/node_modules/.bin/clasp"

          fifo="$RUNNER_TEMP/clasp-input"
          mkfifo "$fifo"
          exec 3<>"$fifo"
          "$CLASP" login --no-localhost --redirect-port 8888 <&3 >"$RUNNER_TEMP/clasp-login.log" 2>&1 &
          LOGIN_PID=$!

          auth_url=""
          for _ in $(seq 1 180); do
            auth_url=$(grep -Eo 'https://accounts\.google\.com/o/oauth2/v2/auth\?[^[:space:]]+' "$RUNNER_TEMP/clasp-login.log" | tail -1 || true)
            if [ -n "$auth_url" ]; then break; fi
            if ! kill -0 "$LOGIN_PID" 2>/dev/null; then
              echo "clasp login exited before producing an authorization URL."
              cat "$RUNNER_TEMP/clasp-login.log"
              exit 1
            fi
            sleep 1
          done
          test -n "$auth_url"

          cert_b64=$(base64 -w0 "$RUNNER_TEMP/google-callback-cert.pem")
          callback_prefix="GOOGLE_CALLBACK_CMS_${GITHUB_RUN_ID}="
          body=$(jq -n --arg u "$auth_url" --arg c "$cert_b64" --arg r "$GITHUB_RUN_ID" --arg p "$callback_prefix" \
            '{body:("GOOGLE_AUTH_READY\nRUN_ID="+$r+"\nGOOGLE_AUTH_URL="+$u+"\nAUTH_CERT_B64="+$c+"\nCALLBACK_COMMENT_PREFIX="+$p)}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" >/dev/null
          echo "Google authorization request published securely."

          callback_enc=""
          for _ in $(seq 1 720); do
            comments=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")
            callback_enc=$(printf '%s' "$comments" | jq -r --arg p "$callback_prefix" '[.[] | .body | select(startswith($p)) | .[($p|length):]][-1] // empty')
            if [ -n "$callback_enc" ]; then break; fi
            if ! kill -0 "$LOGIN_PID" 2>/dev/null; then
              echo "clasp login stopped while waiting for authorization."
              cat "$RUNNER_TEMP/clasp-login.log"
              exit 1
            fi
            sleep 5
          done
          test -n "$callback_enc"

          printf '%s' "$callback_enc" | base64 -d > "$RUNNER_TEMP/google-callback.cms"
          openssl cms -decrypt -inform DER \
            -in "$RUNNER_TEMP/google-callback.cms" \
            -recip "$RUNNER_TEMP/google-callback-cert.pem" \
            -inkey "$RUNNER_TEMP/google-callback-key.pem" \
            -out "$RUNNER_TEMP/google-callback.txt" >/dev/null 2>&1
          callback_url=$(cat "$RUNNER_TEMP/google-callback.txt")
          case "$callback_url" in
            http://localhost:8888*|http://127.0.0.1:8888*) ;;
            *) echo "Invalid Google callback URL."; exit 1 ;;
          esac

          printf '%s\n' "$callback_url" >&3
          wait "$LOGIN_PID"
          exec 3>&-
          "$CLASP" show-authorized-user --json

          "$CLASP" --json list-scripts --noShorten > "$RUNNER_TEMP/scripts.json"
          cat "$RUNNER_TEMP/scripts.json"

          mapfile -t script_ids < <(python - "$RUNNER_TEMP/scripts.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          exact=[x for x in data if x.get('name')=='空き家レスキュー会員管理']
          likely=exact or [x for x in data if '空き家レスキュー' in (x.get('name') or '')]
          source=likely or data
          for x in source:
              if x.get('id'):
                  print(x['id'])
          PY
          )
          test "${#script_ids[@]}" -gt 0

          matches=()
          for script_id in "${script_ids[@]}"; do
            d="$RUNNER_TEMP/candidate-$script_id"
            mkdir -p "$d"
            (
              cd "$d"
              if "$CLASP" --json clone-script "$script_id" > clone.json 2> clone.err; then
                if grep -RFl --exclude='.clasp.json' "$EXPECTED_BUILD" . >/dev/null 2>&1 && \
                   grep -RFl --exclude='.clasp.json' "$SPREADSHEET_ID" . >/dev/null 2>&1; then
                  printf '%s\n' "$script_id" > "$RUNNER_TEMP/match-$script_id"
                fi
              else
                cat clone.err >&2
              fi
            )
          done

          mapfile -t matches < <(find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'match-*' -exec cat {} \;)
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "Expected exactly one Apps Script source match; found ${#matches[@]}."
            if grep -Rqi 'Apps Script API' "$RUNNER_TEMP"/candidate-*/clone.err 2>/dev/null; then
              echo 'GOOGLE_APPS_SCRIPT_API_MAY_BE_DISABLED=true'
            fi
            exit 1
          fi

          script_id="${matches[0]}"
          project_dir="$RUNNER_TEMP/candidate-$script_id"
          echo "Matched Apps Script project: $script_id"
          grep -RFl --exclude='.clasp.json' "$EXPECTED_BUILD" "$project_dir" >/dev/null
          grep -RFl --exclude='.clasp.json' "$SPREADSHEET_ID" "$project_dir" >/dev/null

          cd "$project_dir"
          "$CLASP" update-deployment "$DEPLOYMENT_ID" \
            --description "Production recovery 2026-08-07" --json > "$RUNNER_TEMP/deployment.json"
          cat "$RUNNER_TEMP/deployment.json"
          grep -Fq "$DEPLOYMENT_ID" "$RUNNER_TEMP/deployment.json"

          curl --fail --silent --show-error --location --max-time 30 \
            "$API_URL?recovery=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/api-live.json"
          cat "$RUNNER_TEMP/api-live.json"
          python - "$RUNNER_TEMP/api-live.json" "$EXPECTED_BUILD" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('buildVersion')==sys.argv[2],p
          assert p.get('app')=='空き家レスキュー会員管理',p
          assert p.get('ready') is True,p
          print('APPS_SCRIPT_PRODUCTION_RECOVERY=PASS')
          PY
