              if i<3:d.line((360,y+120,360,y+180),fill=ORANGE if i<idx else (205,213,218),width=7)
            cap(d,['確認範囲を決める','安全に見える場所から撮る','断定せず観察事実を整理','写真と一緒に報告'][idx]); return im
          def winter_check(t):
            im,d=base((238,245,250));
