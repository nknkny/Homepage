name: Akiya Pocket diversified strategy creatives v8 (manual legacy)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 5

      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null
          python -m pip install -q pillow

      - name: Render and validate 18 creatives
        run: python .github/scripts/akiya_strategy_v8.py

      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add akiya-pocket/assets/social/generated-v8
          if git diff --cached --quiet; then
            echo 'No asset changes'
          else
            git commit -m 'Generate diversified v8 acquisition creatives'
            git push origin HEAD:main
          fi
          echo 'AKIYA_STRATEGY_V8=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
