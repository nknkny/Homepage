          videos=[('ig-calendar-story',calendar_story),('ig-decision-story',decision_story),('yt-one-time-faq',one_time_faq),('yt-family-chat',family_chat),('fb-report-process',process_walk),('yt-prewinter-check',winter_check),('yt-yard-scan',yard_scan),('yt-honest-mask',honest_mask)]
          for n,fn in videos: encode(n,fn)
          print('generated',len(stills)+len(videos))
          PY
          python /tmp/v8.py
          python - <<'PY'
          import os,glob,hashlib,subprocess,json
          fs=sorted(glob.glob('akiya-pocket/assets/social/generated-v8/*'))
          assert len(fs)==18, len(fs)
          rows=[]
          for f in fs:
            size=os.path.getsize(f); assert size>15000,(f,size)
            h=hashlib.sha256(open(f,'rb').read()).hexdigest()
            r={'file':f,'bytes':size,'sha256':h}
            if f.endswith('.mp4'):
              x=subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,avg_frame_rate,duration','-of','json',f],text=True); r['probe']=json.loads(x)['streams'][0]
            rows.append(r)
          assert len({r['sha256'] for r in rows})==18
          open('/tmp/v8-manifest.json','w').write(json.dumps(rows,ensure_ascii=False,indent=2))
          print(open('/tmp/v8-manifest.json').read())
          PY
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add akiya-pocket/assets/social/generated-v8
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m 'Generate diversified v8 acquisition creatives'; git push origin HEAD:main; fi
          echo "AKIYA_STRATEGY_V8=PASS" > /tmp/result
          echo "SHA=$(git rev-parse HEAD)" >> /tmp/result
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/result ]; then body=$(cat /tmp/result); else body='AKIYA_STRATEGY_V8=FAIL'; fi
          body="$body
RUN_ID=${{ github.run_id }}"
          gh issue comment 42 --body "$body"
