            else: ctext(d,'今の状態を、写真で。',430,45,NAVY); cap(d,'必要なら公式サイトでサービス範囲を見る。')
            return im
          def yard_scan(t):
            im,d=base((244,249,242)); house(d,240,270,1.05); pts=[(250,535,'建物'),(460,520,'窓'),(190,700,'庭'),(500,730,'外まわり')]
            idx=int(t*1.1)%len(pts)
            for i,(x,y,s) in enumerate(pts):
              d.ellipse((x-22,y-22,x+22,y+22),fill=ORANGE if i==idx else (180,195,183)); txt(d,s,(x-28,y+35),19,INK,True)
            d.arc((120,180,600,900),start=(t*40)%360,end=((t*40)%360)+65,fill=NAVY,width=10); cap(d,'建物だけでなく、外から見える敷地も確認対象。'); return im
          def honest_mask(t):
            im,d=base((248,247,244)); ctext(d,'見えない場所は、見えないまま。',120,35,NAVY)
            if t<6:
              report(d,230,285,1.05); d.rectangle((285,500,440,540),fill=(210,222,231)); cap(d,'確認できたことは写真＋観察事実。')
            elif t<12:
              report(d,230,285,1.05); rr(d,(255,570,465,660),20,(255,239,233)); ctext(d,'未確認',590,32,ORANGE); cap(d,'安全に見えなかった場所を断定しません。')
            else:
