<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Content-Security-Policy" content="default-src 'self';connect-src https://fpgtwgtoqtokpitzlbie.supabase.co;style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline';object-src 'none';frame-ancestors 'none'"><title>システム監視 | 空家ポケット</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:17px;margin-bottom:14px}.title{font-size:24px;font-weight:900;color:#082b58}.section{font-size:18px;font-weight:850;color:#082b58}.sub{font-size:12px;color:#68778b;line-height:1.7}.actions,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row{justify-content:space-between;padding:12px 0;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.btn{display:inline-block;border:1px solid #cbd5e1;border-radius:10px;padding:9px 12px;background:#fff;color:#172033;text-decoration:none;font-weight:750}.primary{background:#082b58;color:#fff;border-color:#082b58}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.on{background:#ecfdf3;color:#0c7a43}.warn{background:#fff7ed;color:#9a3412}.off{background:#fff1f0;color:#b42318}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:24px;font-weight:900;color:#082b58;margin-top:5px}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid #eef2f6;vertical-align:top}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.tbl{display:block;overflow:auto}.wrap{padding:10px}}</style></head><body><main class="wrap"><section class="card"><div class="actions" style="justify-content:space-between"><div><div class="title">システム・自動運営監視</div><div class="sub">本番/API、Cloudflare、IndexNow、GitHub監査、自動化、DBセキュリティを一元表示します。</div></div><div class="actions"><a class="btn" href="./">概要</a><a class="btn" href="./acquisition.html">集客</a><a class="btn" href="./business.html">顧客・売上</a><a class="btn" href="./social.html">SNS</a><a class="btn" href="./automation.html">自動運営</a><a class="btn primary" href="./system.html">システム</a><button class="btn" id="refresh">更新</button></div></div></section><div id="app"></div></main><script>(()=>{'use strict';const API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-command-center',token=sessionStorage.getItem('akp_owner_session')||'',app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmt=v=>v?new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'—';if(!token){location.href='./';return}function pill(ok,a='正常',b='要確認'){return `<span class="status ${ok?'on':'off'}">${ok?a:b}</span>`}async function load(){const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',token})}),x=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('akp_owner_session');location.href='./';return}if(!x.ok){app.innerHTML=`<section class="card">取得失敗: ${esc(x.code||x.message||'ERROR')}</section>`;return}const d=x.data,rt=d.runtime||[],sec=d.security||{},ext=d.external||{},cf=ext.cloudflare?.parsed||{},ix=ext.indexnow?.parsed||{},auto=d.automation||{},jobs=auto.jobs||[],ae=auto.events||[],buffer=d.channels?.buffer||{},channels=d.channels?.items||[],secOk=Number(sec.public_tables_without_rls||0)===0&&Number(sec.akiya_views_without_security_invoker||0)===0&&Number(sec.security_definer_anon_executable||0)===0&&Number(sec.security_definer_authenticated_executable||0)===0,rtOk=rt.length&&rt.every(z=>z.ok),cfOk=cf.AUTH==='success'&&cf.DEPLOY==='success'&&cf.PUBLIC_VERIFY==='success',ixOk=ix.HTTP_CODE==='200'||ix.HTTP_CODE==='202';app.innerHTML=`<section class="grid"><div class="card"><div class="sub">本番/API</div><div class="metric">${rtOk?'正常':'要確認'}</div></div><div class="card"><div class="sub">Cloudflare</div><div class="metric">${cfOk?'正常':'要確認'}</div></div><div class="card"><div class="sub">IndexNow</div><div class="metric">${ixOk?'正常':'要確認'}</div></div><div class="card"><div class="sub">自動化失敗 24h</div><div class="metric">${Number(auto.failed24||0)}</div></div></section><section class="card"><div class="section">本番/API疎通</div>${rt.map(z=>`<div class="row"><div><b>${esc(z.label)}</b><div class="sub">HTTP ${Number(z.status||0)}</div></div>${pill(z.ok)}</div>`).join('')}</section><section class="card"><div class="section">Cloudflare / GitHub / 検索通知</div><div class="row"><div><b>Cloudflare Pages</b><div class="sub">RUN ${esc(cf.RUN_ID||'—')} / source ${esc(cf.SOURCE_SHA||'—')} / 最終記録 ${esc(ext.cloudflare?.created_at?fmt(ext.cloudflare.created_at):'—')}</div></div>${pill(cfOk)}</div><div class="row"><div><b>IndexNow</b><div class="sub">URL ${esc(ix.URL_COUNT||'—')}件 / HTTP ${esc(ix.HTTP_CODE||'—')} / ownership key ${ext.indexNowKeyLive?'live':'not verified'}</div></div>${pill(ixOk)}</div><div class="row"><div><b>最終総合監査</b><div class="sub">${esc(ext.finalAudit?.body||'記録なし')}</div></div>${pill(String(ext.finalAudit?.body||'').includes('PASS'))}</div><div class="row"><div><b>GitHub main</b><div class="sub">${esc((ext.main?.sha||'').slice(0,12))} / ${esc(ext.main?.message||'—')} / ${esc(fmt(ext.main?.date))}</div></div><span class="status on">取得済み</span></div><div class="row"><div><b>外部状態キャッシュ</b><div class="sub">${esc(ext.cache||'—')} / 取得 ${esc(fmt(ext.fetchedAt))}</div></div>${pill(ext.ok!==false,'利用可能','取得異常')}</div></section><section class="card"><div class="section">DBセキュリティ基礎監査</div><div class="grid" style="margin-top:10px"><div><div class="sub">RLSなし public表</div><div class="metric">${Number(sec.public_tables_without_rls||0)}</div></div><div><div class="sub">非 security_invoker view</div><div class="metric">${Number(sec.akiya_views_without_security_invoker||0)}</div></div><div><div class="sub">匿名実行可 SECURITY DEFINER</div><div class="metric">${Number(sec.security_definer_anon_executable||0)}</div></div><div><div class="sub">認証ユーザー実行可 SECURITY DEFINER</div><div class="metric">${Number(sec.security_definer_authenticated_executable||0)}</div></div></div><div class="row"><div><b>総合判定</b><div class="sub">内部セキュリティ姿勢チェック ${esc(fmt(sec.checked_at))}</div></div>${pill(secOk,'PASS','要確認')}</div></section><section class="card"><div class="section">外部接続</div><div class="row"><div><b>Buffer</b><div class="sub">${esc(buffer.connection_status||'—')} / 最終確認 ${esc(fmt(buffer.last_verified_at))}${buffer.last_error?` / ${esc(buffer.last_error)}`:''}</div></div>${pill(buffer.connection_status==='connected')}</div>${channels.map(c=>`<div class="row"><div><b>${esc(c.provider)}</b><div class="sub">${esc(c.display_name||'')} / ${esc(fmt(c.last_verified_at))}</div></div>${pill(!!c.connected,'接続済み','未接続')}</div>`).join('')}</section><section class="card"><div class="section">直近自動化ジョブ</div>${jobs.length?`<table class="tbl"><thead><tr><th>処理</th><th>状態</th><th>結果</th><th>時刻</th></tr></thead><tbody>${jobs.slice(0,30).map(j=>`<tr><td>${esc(j.display_name||j.job_type)}</td><td><span class="status ${j.status==='completed'?'on':j.status==='failed'?'off':'warn'}">${esc(j.status)}</span></td><td>${esc(j.error||j.result_summary||'—')}</td><td>${esc(fmt(j.completed_at||j.created_at))}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">履歴なし</div>'}</section><section class="card"><div class="section">自動化イベントログ</div>${ae.length?`<table class="tbl"><thead><tr><th>イベント</th><th>重大度</th><th>Job</th><th>時刻</th></tr></thead><tbody>${ae.slice(0,30).map(e=>`<tr><td>${esc(e.event_type)}</td><td>${esc(e.severity)}</td><td>${esc(e.job_id||'—')}</td><td>${esc(fmt(e.created_at))}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">履歴なし</div>'}</section>`}document.getElementById('refresh').onclick=load;load()})();</script></body></html>
