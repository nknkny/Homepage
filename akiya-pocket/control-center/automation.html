<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Content-Security-Policy" content="default-src 'self';connect-src https://fpgtwgtoqtokpitzlbie.supabase.co;style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline';object-src 'none';frame-ancestors 'none'"><title>自動運営 | 空家ポケット</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1080px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:17px;margin-bottom:14px}.title{font-size:24px;font-weight:900;color:#082b58}.section{font-size:18px;font-weight:850;color:#082b58}.sub{font-size:12px;color:#68778b;line-height:1.7}.actions,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row{justify-content:space-between;padding:12px 0;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.btn{display:inline-block;border:1px solid #cbd5e1;border-radius:10px;padding:9px 12px;background:#fff;color:#172033;text-decoration:none;font-weight:750;cursor:pointer}.primary{background:#082b58;color:#fff;border-color:#082b58}.good{background:#0f766e;color:#fff;border-color:#0f766e}.danger{background:#fff1f0;color:#b42318;border-color:#fecaca}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.on{background:#ecfdf3;color:#0c7a43}.off{background:#fff1f0;color:#b42318}.warn{background:#fff7ed;color:#9a3412}.note{padding:12px;border-radius:12px;background:#eef6ff;color:#143b66;font-size:13px;line-height:1.7}@media(max-width:760px){.row{align-items:flex-start;flex-direction:column}.wrap{padding:10px}}</style></head><body><main class="wrap"><section class="card"><div class="actions" style="justify-content:space-between"><div><div class="title">自動運営コントロール</div><div class="sub">監視と実行を分離し、ここでは運営スイッチだけを操作します。</div></div><div class="actions"><a class="btn" href="./">概要</a><a class="btn" href="./acquisition.html">集客</a><a class="btn" href="./business.html">顧客・売上</a><a class="btn" href="./system.html">システム</a><a class="btn primary" href="./automation.html">自動運営</a><button class="btn good" id="runNow">今すぐ実行</button></div></div><div id="msg" class="sub" style="margin-top:8px"></div></section><div id="app"></div></main><script>(()=>{'use strict';const API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-automation-control',token=sessionStorage.getItem('akp_owner_session')||'',app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));if(!token){location.href='./';return}async function call(action,data={}){const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,token})});let x={};try{x=await r.json()}catch{}if(r.status===401){sessionStorage.removeItem('akp_owner_session');location.href='./'}return{...x,httpStatus:r.status}}function pill(on){return `<span class="status ${on?'on':'off'}">${on?'稼働':'停止'}</span>`}const controls=[{name:'Google / SEO 集客',desc:'検索・SEO・B2Cコンテンツを実データに基づいて改善します。',key:'growth_enabled',action:'set_growth'},{name:'運営監視',desc:'顧客サイト・会員API・決済APIを定期監視し、異常だけ要対応へ上げます。',key:'health_monitor_enabled',action:'set_monitor'},{name:'自動集計',desc:'会員・依頼・支払・売上・ファネルを定期集計します。',key:'auto_metrics_enabled',action:'set_metrics'},{name:'一括自動運営',desc:'安全なモジュールをまとめてON/OFFします。B2B営業送信・資金操作・契約判断は含みません。',key:'full_auto_enabled',action:'set_full_auto'}];async function load(){const x=await call('status');if(!x.ok){app.innerHTML=`<section class="card">取得失敗: ${esc(x.code||x.message||'ERROR')}</section>`;return}const d=x.data||{},st=d.settings||{},mods=d.modules||[],jobs=d.jobs||[];app.innerHTML=`<section class="card"><div class="section">主要運営スイッチ</div>${controls.map(c=>`<div class="row"><div><b>${esc(c.name)}</b><div class="sub">${esc(c.desc)}</div></div><div class="actions">${pill(!!st[c.key])}<button class="btn ${st[c.key]?'danger':'good'}" data-action="${c.action}" data-enabled="${st[c.key]?'0':'1'}">${st[c.key]?'OFFにする':'ONにする'}</button></div></div>`).join('')}</section><section class="card"><div class="section">個別モジュール</div>${mods.map(m=>`<div class="row"><div><b>${esc(m.display_name)}</b><div class="sub">${esc(m.description)}</div></div><div class="actions">${pill(!!m.enabled)}<button class="btn ${m.enabled?'danger':'good'}" data-module="${esc(m.job_type)}" data-enabled="${m.enabled?'0':'1'}">${m.enabled?'OFFにする':'ONにする'}</button></div></div>`).join('')}</section><section class="card"><div class="section">運用原則</div><div class="note">SNSは承認なしで、安全審査済み投稿だけ自動予約・公開します。同意済み無料会員の育成配信も自動です。B2B営業メール・DM・企業への集客営業はOFFです。</div></section><section class="card"><div class="section">直近ジョブ</div>${jobs.slice(0,20).map(j=>`<div class="row"><div><b>${esc(j.display_name||j.job_type)}</b><div class="sub">${esc(j.result_summary||j.error||'')}</div></div><span class="status ${j.status==='completed'?'on':j.status==='failed'?'off':'warn'}">${esc(j.status)}</span></div>`).join('')||'<div class="sub">履歴なし</div>'}</section><section class="card"><div class="actions"><a class="btn" href="./newsletter.html">会員育成</a><a class="btn" href="./social.html">SNS自動運用</a></div></section>`;bind()}function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;await call(b.dataset.action,{enabled:b.dataset.enabled==='1'});await load()});document.querySelectorAll('[data-module]').forEach(b=>b.onclick=async()=>{b.disabled=true;await call('set_module',{jobType:b.dataset.module,enabled:b.dataset.enabled==='1'});await load()})}document.getElementById('runNow').onclick=async e=>{e.target.disabled=true;document.getElementById('msg').textContent='実ジョブを実行中…';const x=await call('run_now');document.getElementById('msg').textContent=x.ok?'実行要求を反映しました。':`実行失敗: ${x.code||'ERROR'}`;e.target.disabled=false;await load()};load()})();</script></body></html>
