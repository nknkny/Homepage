<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src https://fpgtwgtoqtokpitzlbie.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"><title>SNS運用 | 空家ポケット</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:18px;margin-bottom:14px}.title{font-size:24px;font-weight:850;color:#082b58}.sub{font-size:13px;color:#66758a;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.provider{border:1px solid #e1e7ef;border-radius:14px;padding:14px}.chip{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:750}.on{background:#e9f8ef;color:#08743d}.off{background:#fff0ef;color:#b42318}.warn{background:#fff7e8;color:#9a5b00}.btn{display:inline-block;border:1px solid #cbd5e1;border-radius:10px;padding:10px 13px;background:#fff;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;color:inherit}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:#082b58;color:#fff;border-color:#082b58}.good{background:#0f766e;color:#fff;border-color:#0f766e}.reject{background:#fff1f0;color:#b42318;border-color:#fecaca}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.status{min-height:20px;margin-top:8px;font-size:13px;color:#42526a}.post{border-top:1px solid #eef2f6;padding:13px 0}.post:first-child{border-top:0}.posttext{white-space:pre-wrap;line-height:1.65;font-size:13px}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi .box{background:#f7f9fc;border-radius:12px;padding:13px}.kpi strong{font-size:22px;color:#082b58;display:block}.note{padding:12px;border-radius:12px;background:#eef6ff;color:#143b66;line-height:1.7;font-size:13px}@media(max-width:760px){.grid,.kpi{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><main class="wrap"><section class="card"><div class="actions" style="justify-content:space-between"><div><div class="title">SNS運用</div><div class="sub">実際に存在する投稿案だけを表示します。あなたが「承認して投稿」を押した1件だけ公開できます。</div></div><div class="actions"><a class="btn" href="./">運営センター</a><button class="btn" id="refresh">更新</button></div></div></section>
<section class="kpi"><div class="card box"><small>Buffer接続</small><strong id="connectedCount">—</strong></div><div class="card box"><small>投稿済み</small><strong id="publishedCount">—</strong></div><div class="card box"><small>承認前/保留</small><strong id="heldCount">—</strong></div></section>
<section class="card"><div style="font-size:18px;font-weight:800">SNS接続状態</div><div class="sub">接続判定はBuffer APIの実データを使います。</div><div class="grid" id="providers" style="margin-top:12px"></div><div id="bufferStatus" class="status"></div><div class="actions" style="margin-top:10px"><button class="btn" id="syncBuffer">接続状態を再確認</button></div></section>
<section class="card"><div style="font-size:18px;font-weight:800">Buffer APIキー</div><div class="sub">すでに接続済みなら入力不要です。キーを更新するときだけ使用します。</div><div class="field"><label>Buffer Personal API Key</label><input id="bufferKey" type="password" autocomplete="new-password" placeholder="更新する場合のみ貼り付け"></div><button class="btn good" id="saveBuffer">保存して接続を再認識</button></section>
<section class="card"><div style="font-size:18px;font-weight:800">投稿案</div><div class="sub">承認ボタンが出るのは、事実確認済み・メディアあり・未承認の投稿だけです。承認前の投稿は公開できません。</div><div id="posts" style="margin-top:8px"></div><div id="masterStatus" class="status"></div></section>
<section class="card"><div style="font-size:18px;font-weight:800">成果</div><div class="sub">フォロワー数ではなく、サイト訪問→登録→依頼→支払で評価します。</div><div id="metrics" style="margin-top:8px"></div></section><section class="card note">SNSの自動公開はOFFです。投稿は1件ごとに所有者承認が必要です。</section></main><script>(()=>{'use strict';
const BASE='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/';const SOCIAL=BASE+'akiya-pocket-social',BUFFER=BASE+'akiya-pocket-buffer',APPROVAL=BASE+'akiya-pocket-social-approval';const token=sessionStorage.getItem('akp_owner_session')||'', $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let social=null,buf=null;if(!token){location.href='./';return}
async function call(url,action,extra={}){const r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({...extra,action,token})});let x={};try{x=await r.json()}catch{}if(r.status===401){sessionStorage.removeItem('akp_owner_session');location.href='./'}return{...x,httpStatus:r.status}}
const names={instagram:'Instagram',facebook:'Facebook',youtube_shorts:'YouTube Shorts'};function card(p){return `<div class="provider"><div class="actions" style="justify-content:space-between"><b>${esc(names[p.provider]||p.provider)}</b><span class="chip ${p.connected?'on':'off'}">${p.connected?'接続済み':'未接続'}</span></div><div class="sub" style="margin-top:8px">${p.connected?esc(p.display_name||'Buffer経由で接続済み'):'BufferでこのSNSを接続してください。'}</div></div>`}function canApprove(p){return ['draft','held'].includes(p.status)&&p.fact_check_status==='verified'&&Array.isArray(p.media_urls)&&p.media_urls.length>0&&!p.owner_approved_at}
function render(){const channels=buf?.channels||[];$('providers').innerHTML=channels.map(card).join('');$('connectedCount').textContent=channels.filter(x=>x.connected).length+'/3';const posts=social?.posts||[];$('publishedCount').textContent=posts.filter(p=>p.status==='published').length;$('heldCount').textContent=posts.filter(p=>['held','draft'].includes(p.status)).length;$('bufferStatus').textContent=buf?.configured?(buf.connection_status==='connected'?'Buffer API接続済み。':'Buffer APIキーは保存済みですが接続確認が必要です。'):'Buffer未設定。';const visible=posts.slice(0,20);$('posts').innerHTML=visible.length?visible.map(p=>`<div class="post"><div class="actions"><b>${esc(names[p.provider]||p.provider)}</b><span class="chip ${p.status==='published'?'on':p.status==='publishing'?'warn':p.status==='held'?'warn':'off'}">${esc(p.status)}</span>${p.remote_post_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(p.remote_post_url)}">実投稿を見る</a>`:''}</div><div class="posttext">${esc((p.content_text||'').slice(0,900))}</div>${canApprove(p)?`<div class="actions" style="margin-top:10px"><button class="btn primary" data-approve="${esc(p.id)}">承認して投稿</button><button class="btn reject" data-reject="${esc(p.id)}">却下</button></div>`:'<div class="sub">現在この投稿は承認可能条件を満たしていません。</div>'}</div>`).join(''):'<div class="sub">投稿案はありません。</div>';const ms=social?.metrics||[];$('metrics').innerHTML=ms.length?ms.slice(0,8).map(m=>`<div class="post"><b>${esc(names[m.provider]||m.provider)} / ${esc(m.metric_date)}</b><div class="sub">表示・再生 ${esc(m.impressions??'—')} / いいね ${esc(m.likes??'—')} / シェア ${esc(m.shares??'—')}</div></div>`).join(''):'<div class="sub">実投稿後に表示します。</div>';bind()}
function bind(){document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{if(!confirm('この1件を今すぐ公開します。よろしいですか？'))return;b.disabled=true;$('masterStatus').textContent='承認済み投稿を公開しています…';const x=await call(APPROVAL,'approve',{postId:b.dataset.approve});$('masterStatus').textContent=x.ok?(x.remote_post_url?'投稿しました。':'投稿処理を受け付けました。'):`投稿できません: ${x.code||'ERROR'}`;await load()});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{b.disabled=true;const x=await call(APPROVAL,'reject',{postId:b.dataset.reject});$('masterStatus').textContent=x.ok?'却下しました。':'却下処理を確認できません。';await load()})}
async function load(){const [s,b]=await Promise.all([call(SOCIAL,'status'),call(BUFFER,'status')]);if(!s.ok){$('masterStatus').textContent='投稿状態を取得できません。';return}social=s;buf=b.ok?b:{configured:false,connection_status:'error',channels:[{provider:'instagram',connected:false},{provider:'facebook',connected:false},{provider:'youtube_shorts',connected:false}]};render()}
$('refresh').onclick=load;$('saveBuffer').onclick=async()=>{const key=$('bufferKey').value.trim();if(!key){$('bufferStatus').textContent='更新するAPIキーを貼ってください。';return}$('saveBuffer').disabled=true;const x=await call(BUFFER,'save_api_key',{apiKey:key});$('bufferKey').value='';$('bufferStatus').textContent=x.ok?'保存・再認識しました。':`保存できません: ${x.message||x.code||'ERROR'}`;$('saveBuffer').disabled=false;await load()};$('syncBuffer').onclick=async()=>{const x=await call(BUFFER,'sync');$('bufferStatus').textContent=x.ok?'接続状態を更新しました。':`確認できません: ${x.message||x.code||'ERROR'}`;await load()};load()})();</script></body></html>
