<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>空家ポケット 営業承認</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:16px;padding:16px;margin-bottom:14px}.title{font-size:22px;font-weight:850;color:#082b58}.sub{font-size:12px;color:#65758b;line-height:1.7}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.btn{border:1px solid #cbd5e1;border-radius:10px;padding:10px 14px;background:#fff;font-weight:750;cursor:pointer}.primary{background:#0f766e;color:#fff;border-color:#0f766e}.danger{background:#fff1f0;color:#b42318;border-color:#fecaca}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{white-space:pre-wrap;border:1px solid #e5e7eb;background:#fafafa;border-radius:10px;padding:12px;margin:10px 0;line-height:1.65}.login{max-width:430px;margin:7vh auto}.item{border-top:1px solid #eef2f6;padding-top:14px;margin-top:14px}.chip{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:12px}.status{font-size:13px;color:#475569;min-height:20px}</style></head><body><main id="app"></main><script>(()=>{'use strict';const OWNER='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner',API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner-approvals',app=document.getElementById('app');let token=sessionStorage.getItem('akp_owner_session')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function call(url,action,data={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,token}),cache:'no-store'});let x={};try{x=await r.json()}catch{}return{...x,httpStatus:r.status}}function login(){app.innerHTML=`<div class="wrap"><section class="card login"><div class="title">営業・フォーム送信 承認</div><div class="sub">本人承認がない限り送信されません。</div><div class="field"><label>管理者メール</label><input id="email" type="email"></div><div class="field"><label>管理パスワード</label><input id="pw" type="password"></div><button id="go" class="btn primary">ログイン</button><div id="st" class="status"></div></section></div>`;document.getElementById('go').onclick=async()=>{const st=document.getElementById('st');st.textContent='確認中…';const x=await call(OWNER,'login',{email:document.getElementById('email').value,password:document.getElementById('pw').value});if(!x.ok){st.textContent='ログインできません。';return}token=x.token;sessionStorage.setItem('akp_owner_session',token);render()}}function item(kind,x){const id=kind==='form'?x.form_id:x.mail_id,head=kind==='form'?`${x.company_name} / フォーム営業`:`${x.recipient_name||x.recipient_email} / 営業メール`,subject=kind==='form'?x.message_subject:x.subject,body=kind==='form'?x.message_body:x.body_text,source=kind==='form'?x.form_url:x.source_url,meta=kind==='form'?`適合度 ${x.fit_score??'-'} / ${x.fit_reason||''}`:x.verification_summary||'';return `<div class="item"><b>${esc(head)}</b> <span class="chip">${esc(id)}</span><div class="sub">送信先: ${esc(source||'')}</div><div class="sub">${esc(meta)}</div><div class="msg"><b>${esc(subject||'(件名なし)')}</b>\n\n${esc(body||'')}</div><div class="actions"><button class="btn primary" data-a="approve" data-k="${kind}" data-i="${esc(id)}">この文面を承認</button><button class="btn danger" data-a="reject" data-k="${kind}" data-i="${esc(id)}">却下</button></div></div>`}async function render(){if(!token){login();return}const x=await call(API,'list');if(x.httpStatus===401){token='';sessionStorage.removeItem('akp_owner_session');login();return}if(!x.ok){app.innerHTML='<div class="wrap"><section class="card">読み込みに失敗しました。</section></div>';return}const f=x.data.forms||[],m=x.data.mails||[];app.innerHTML=`<div class="wrap"><section class="card"><div class="title">営業・フォーム送信 承認</div><div class="sub">承認前は送信されません。文面・送信先・フォームURL等が承認後に変更された場合、承認は自動失効します。</div><div class="actions"><a class="btn" href="./">管理画面へ戻る</a><button class="btn" id="refresh">更新</button></div></section><section class="card"><b>問い合わせフォーム承認待ち ${f.length}件</b>${f.length?f.map(v=>item('form',v)).join(''):'<div class="sub">ありません。</div>'}</section><section class="card"><b>営業メール承認待ち ${m.length}件</b>${m.length?m.map(v=>item('mail',v)).join(''):'<div class="sub">ありません。</div>'}</section><div id="st" class="status"></div></div>`;document.getElementById('refresh').onclick=render;document.querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a,k=b.dataset.k,i=b.dataset.i;let reason='';if(a==='reject')reason=prompt('却下理由（任意）','')||'本人却下';b.disabled=true;const y=await call(API,a,{kind:k,id:i,reason});document.getElementById('st').textContent=y.ok?(a==='approve'?'承認しました。':'却下しました。'):`処理できません: ${y.code||'ERROR'}`;await render()})}render()})();</script></body></html>
