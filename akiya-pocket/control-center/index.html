<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src https://fpgtwgtoqtokpitzlbie.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"><title>空家ポケット 運営状況</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1040px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:17px;margin-bottom:14px}.top,.actions,.row{display:flex;gap:10px}.top{align-items:center;justify-content:space-between}.row{justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.actions{flex-wrap:wrap;align-items:center}.title{font-size:22px;font-weight:850;color:#082b58}.section{font-size:18px;font-weight:820;color:#082b58}.name{font-weight:800}.sub{font-size:12px;color:#68778b;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{font-size:28px;font-weight:850;color:#082b58;margin-top:5px}.label{font-size:12px;color:#68778b}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.on{background:#ecfdf3;color:#0c7a43}.warn{background:#fff7ed;color:#9a3412}.off{background:#fff1f0;color:#b42318}.btn{display:inline-block;border:1px solid #cbd5e1;border-radius:10px;padding:9px 12px;background:#fff;color:#172033;text-decoration:none;font-weight:750;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{background:#082b58;color:#fff;border-color:#082b58}.good{background:#0f766e;color:#fff;border-color:#0f766e}.danger{background:#fff1f0;color:#b42318;border-color:#fecaca}.note{padding:11px 12px;border-radius:11px;background:#eef6ff;color:#123b66;font-size:13px;line-height:1.7}.login{max-width:430px;margin:8vh auto}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.error{color:#b42318}.job{font-size:12px;padding:8px 0;border-top:1px solid #eef2f6}.job:first-child{border-top:0}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.top,.row{align-items:flex-start;flex-direction:column}}
</style></head><body><main id="app"></main><script>(()=>{'use strict';
const BASE='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/';const OWNER=BASE+'akiya-pocket-owner',SOCIAL=BASE+'akiya-pocket-social',BUFFER=BASE+'akiya-pocket-buffer',CONTROL=BASE+'akiya-pocket-automation-control',CUSTOMER='https://akiya-pocket-aomori.pages.dev/';let token=sessionStorage.getItem('akp_owner_session')||'';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const yen=v=>'¥'+Number(v||0).toLocaleString('ja-JP');
async function call(url,action,data={}){const r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,token})});let x={};try{x=await r.json()}catch{}if(r.status===401&&action!=='login'){token='';sessionStorage.removeItem('akp_owner_session');showLogin()}return{...x,httpStatus:r.status}}
function showLogin(){app.innerHTML=`<div class="wrap"><section class="card login"><div class="title">空家ポケット 運営センター</div><div class="sub">実データと実稼働状態だけを表示します。</div><div class="field"><label>管理者メール</label><input id="email" type="email"></div><div class="field"><label>管理パスワード</label><input id="password" type="password"></div><button class="btn primary" id="login">ログイン</button><div id="msg" class="sub error"></div></section></div>`;document.getElementById('login').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){const x=await call(OWNER,'login',{email:document.getElementById('email').value,password:document.getElementById('password').value});if(!x.ok){document.getElementById('msg').textContent='ログインできません。';return}token=x.token;sessionStorage.setItem('akp_owner_session',token);render()}
function pill(on,labelOn='稼働',labelOff='停止'){return `<span class="status ${on?'on':'off'}">${on?labelOn:labelOff}</span>`}function requestText(a){if(!a?.length)return '新しい依頼はありません。';const r=a[0];return `${esc(r.request_id)} / ${esc(r.status)} / ${esc(r.payment_status)} / ${yen(r.quoted_total)}`}
async function render(){const [o,s,b,c]=await Promise.all([call(OWNER,'dashboard'),call(SOCIAL,'status'),call(BUFFER,'status'),call(CONTROL,'status')]);if(!o.ok||!c.ok){if(o.httpStatus!==401)app.innerHTML='<div class="wrap"><section class="card error">運営状態を取得できません。更新してください。</section></div>';return}const d=o.data||{},a=c.data||{},st=a.settings||{},mods=a.modules||[],jobs=a.jobs||[];const channels=(b.ok?b.channels:[]).filter(x=>['instagram','facebook','youtube_shorts'].includes(x.provider));const connected=channels.filter(x=>x.connected).length,bufferHealthy=!!b.ok&&b.configured&&b.connection_status==='connected',drafts=(s.posts||[]).filter(x=>['draft','held'].includes(x.status)).length,snsAuto=!!s.global_publish_enabled||!!s.autopilot?.enabled;const running=jobs.filter(x=>x.status==='running'||x.status==='waiting').length,failed=jobs.filter(x=>x.status==='failed').length;
app.innerHTML=`<div class="wrap"><section class="card"><div class="top"><div><div class="title">空家ポケット 運営センター</div><div class="sub">ONにした機能は実ジョブとして定期実行されます。SNS公開・外部メール送信は所有者承認なしでは行いません。</div></div><div class="actions"><button class="btn" id="refresh">更新</button><button class="btn good" id="runNow">今すぐ実行</button><button class="btn" id="logout">ログアウト</button></div></div><div id="msg" class="sub" style="margin-top:8px"></div></section>
<section class="grid"><div class="card"><div class="label">実会員</div><div class="metric">${Number(d.members||0)}</div></div><div class="card"><div class="label">実依頼</div><div class="metric">${Number(d.requests||0)}</div></div><div class="card"><div class="label">支払済み</div><div class="metric">${Number(d.paid||0)}</div></div><div class="card"><div class="label">実売上</div><div class="metric">${yen(d.revenue||0)}</div></div></section>
<section class="card"><div class="section">主要運営スイッチ</div>
${controlRow('Google / SEO 集客','検索・集客計画、B2C下書き、提携候補検証を実行します。',!!st.growth_enabled,'set_growth')}
<div class="row"><div><div class="name">SNS</div><div class="sub">Buffer実接続 ${connected}/3。未承認・保留 ${drafts}件。自動公開 ${snsAuto?'ON':'OFF'}。投稿時間・反応・サイト流入・依頼・支払まで分析します。</div></div><div class="actions"><span class="status ${bufferHealthy&&connected===3?'on':'warn'}">${bufferHealthy?`接続 ${connected}/3`:'接続異常'}</span><a class="btn primary" href="./social.html">承認・分析</a></div></div>
${controlRow('運営監視','顧客サイト・会員API・決済APIを定期監視し、異常だけ要対応へ上げます。',!!st.health_monitor_enabled,'set_monitor')}
${controlRow('自動集計','会員・依頼・支払・売上・ファネルを定期集計します。',!!st.auto_metrics_enabled,'set_metrics')}
${controlRow('一括自動運営','安全な8モジュールをまとめてON/OFFします。SNS公開と外部メール送信は含みません。',!!st.full_auto_enabled,'set_full_auto')}
</section>
<section class="card"><div class="top"><div><div class="section">個別モジュール</div><div class="sub">必要なものだけ個別にON/OFFできます。</div></div><div>${pill(running>0,`処理中 ${running}`,failed?`失敗 ${failed}`:'待機なし')}</div></div><div id="mods">${mods.map(m=>`<div class="row"><div><div class="name">${esc(m.display_name)}</div><div class="sub">${esc(m.description)}</div></div><div class="actions">${pill(!!m.enabled)}<button class="btn ${m.enabled?'danger':'good'}" data-module="${esc(m.job_type)}" data-enabled="${m.enabled?'0':'1'}">${m.enabled?'OFFにする':'ONにする'}</button></div></div>`).join('')}</div></section>
<section class="card"><div class="section">実行器</div><div class="row"><div><div class="name">定期実行ランナー</div><div class="sub">15分ごとに起動。最終tick: ${esc(a.runner?.last_tick_at||'まだなし')}</div></div>${pill(!!a.runner?.ready,'利用可能','利用不可')}</div><div class="note">外部メール自動送信は通常運営ではOFF。会員メルマガだけは、配信同意済み会員に対して所有者がキャンペーン本文を承認した後の専用配信ゲートで処理します。SNSは1投稿ごとの所有者承認必須です。</div></section>
<section class="card"><div class="section">直近ジョブ</div>${jobs.length?jobs.slice(0,10).map(j=>`<div class="job"><b>${esc(j.display_name||j.job_type)}</b> / ${esc(j.status)}${j.error?` / <span class="error">${esc(j.error)}</span>`:''}<div class="sub">${esc(j.result_summary||'')} ${esc(j.completed_at||j.created_at||'')}</div></div>`).join(''):'<div class="sub">まだ実行履歴はありません。</div>'}</section>
<section class="card"><div class="section">最近の依頼</div><div class="sub" style="margin-top:8px">${requestText(d.recentRequests)}</div></section><section class="card"><div class="actions"><a class="btn" target="_blank" rel="noopener" href="${CUSTOMER}">顧客サイトを確認</a><a class="btn" href="./social.html">SNS承認・分析</a><a class="btn primary" href="./newsletter.html">会員メルマガ</a></div></section></div>`;bind()}
function controlRow(name,desc,on,action){return `<div class="row"><div><div class="name">${name}</div><div class="sub">${desc}</div></div><div class="actions">${pill(on)}<button class="btn ${on?'danger':'good'}" data-action="${action}" data-enabled="${on?'0':'1'}">${on?'OFFにする':'ONにする'}</button></div></div>`}
function bind(){document.getElementById('refresh').onclick=render;document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('akp_owner_session');token='';showLogin()};document.getElementById('runNow').onclick=async e=>{e.target.disabled=true;document.getElementById('msg').textContent='実ジョブを実行中…';const x=await call(CONTROL,'run_now');document.getElementById('msg').textContent=x.ok?'実行完了。結果を更新しました。':`実行失敗: ${x.code||'ERROR'}`;await render()};document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;const x=await call(CONTROL,btn.dataset.action,{enabled:btn.dataset.enabled==='1'});if(!x.ok)alert(`変更できません: ${x.message||x.code||'ERROR'}`);await render()});document.querySelectorAll('[data-module]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;const x=await call(CONTROL,'set_module',{jobType:btn.dataset.module,enabled:btn.dataset.enabled==='1'});if(!x.ok)alert(`変更できません: ${x.message||x.code||'ERROR'}`);await render()})}
if(token)render();else showLogin()})();</script></body></html>
