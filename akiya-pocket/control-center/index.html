<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src https://fpgtwgtoqtokpitzlbie.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>空家ポケット 運営センター</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1240px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:16px;padding:16px;margin-bottom:14px}.title{font-size:22px;font-weight:850;color:#082b58}.sub{font-size:12px;color:#65758b;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.num{font-size:27px;font-weight:850;color:#082b58}.label{font-size:12px;color:#69788c}.btn{border:1px solid #cbd5e1;border-radius:10px;padding:11px 14px;background:#fff;font-weight:750;cursor:pointer}.btn:hover{filter:brightness(.98)}.primary{background:#082b58;color:#fff;border-color:#082b58}.auto{background:#0f766e;color:#fff;border-color:#0f766e;font-size:17px;padding:14px 18px}.danger{background:#fff1f0;color:#b42318;border-color:#fecaca}.actions{display:flex;gap:8px;flex-wrap:wrap}.cols{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 7px;border-bottom:1px solid #eef2f6;text-align:left;vertical-align:top}.chip{display:inline-block;padding:5px 8px;border-radius:999px;margin:2px;background:#eef2f6;font-size:12px;font-weight:700}.on{background:#ecfdf3;color:#0c7a43}.off{background:#fff1f0;color:#b42318}.job{padding:10px 0;border-bottom:1px solid #eef2f6}.error{color:#b42318}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.notice{padding:10px 12px;border-radius:10px;background:#eef6ff;color:#123b66;font-size:13px;line-height:1.6}.login{max-width:430px;margin:7vh auto 0}.status{margin-top:9px;font-size:13px;min-height:20px}.hidden{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}}
  </style>
</head>
<body>
<main id="app"></main>
<script>
(()=>{
  'use strict';
  const API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner';
  const app=document.getElementById('app');
  let token=sessionStorage.getItem('akp_owner_session')||'';
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const yen=v=>'¥'+Number(v||0).toLocaleString('ja-JP');
  async function api(action,data={}){
    const r=await fetch(API,{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,token})});
    let x={}; try{x=await r.json()}catch{}
    if(r.status===401&&action!=='login'){token='';sessionStorage.removeItem('akp_owner_session');showLogin();}
    return {...x,httpStatus:r.status};
  }
  function showLogin(){
    app.innerHTML=`<div class="wrap"><section class="card login"><div class="title">空家ポケット 運営センター</div><div class="sub">本人専用・完全自動統合管理</div><div class="field"><label>管理者メール</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>管理パスワード</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="login">ログイン</button><div id="loginStatus" class="status sub"></div></section></div>`;
    document.getElementById('login').onclick=login;
    document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  }
  async function login(){
    const st=document.getElementById('loginStatus'); st.textContent='確認中…';
    const x=await api('login',{email:document.getElementById('email').value,password:document.getElementById('password').value});
    if(!x.ok){st.textContent=x.code==='RATE_LIMIT'?'ログイン試行回数が上限です。15分ほど置いてください。':'ログインできません。';return;}
    token=x.token;sessionStorage.setItem('akp_owner_session',token);await render();
  }
  function requestRows(a){return a?.length?a.map(r=>`<tr><td>${esc(r.request_id)}</td><td>${esc(r.property_address)}</td><td>${esc(r.status)}</td><td>${esc(r.payment_status)}</td><td>${esc(r.visit_date||'—')}</td><td>${yen(r.quoted_total)}</td></tr>`).join(''):'<tr><td colspan="6">依頼はありません。</td></tr>'}
  function memberRows(a){return a?.length?a.map(m=>`<tr><td>${esc(m.name)}<br><span class="sub">${esc(m.member_no)}</span></td><td>${esc((m.property_prefecture||'')+' '+(m.property_city||''))}</td><td>${esc(m.acquisition_source||'direct')}</td></tr>`).join(''):'<tr><td colspan="3">会員はまだいません。</td></tr>'}
  function jobRows(a){return a?.length?a.map(j=>`<div class="job"><b>${esc(j.display_name||j.job_type)}</b> <span class="chip">${esc(j.status)}</span><div class="sub">${esc(j.job_id)} / ${esc(j.created_at||'')}</div>${j.result_summary?`<div>${esc(j.result_summary)}</div>`:''}${j.error?`<div class="error">${esc(j.error)}</div>`:''}</div>`).join(''):'<div class="sub">実行履歴はまだありません。</div>'}
  function sourceRows(o){const a=Object.entries(o||{}).sort((a,b)=>Number(b[1])-Number(a[1]));return a.length?a.map(([k,v])=>`<div class="job"><b>${esc(k)}</b>：${esc(v)}</div>`).join(''):'<div class="sub">流入データはまだありません。</div>'}
  async function render(){
    const x=await api('dashboard'); if(!x.ok){showLogin();return;}
    const d=x.data,s=d.settings||{},jc=d.jobCounts||{};
    app.innerHTML=`<div class="wrap">
      <section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="title">空家ポケット 運営センター</div><div class="sub">顧客・依頼・決済・売上・集客・データ収集・AI完全自動運営を同じSupabase基盤で統合</div></div><div class="actions"><button class="btn" id="refresh">更新</button><button class="btn" id="logout">ログアウト</button></div></div></section>
      <section class="card"><div class="title" style="font-size:18px">完全自動</div><p class="sub">このボタン1つで、本番監視・AI運営・営業候補・CRM・営業メール準備・提携候補・B2Cコンテンツ・SNS/SEO・追客下書き・日次集計の10作業を一括キュー投入し、その後は毎時継続処理します。</p><div class="actions"><button class="btn auto" id="startAuto">完全自動で全作業を開始</button><button class="btn danger" id="stopAuto">完全自動を停止</button></div><div id="autoStatus" class="status sub"></div><div><span class="chip ${s.full_auto_enabled?'on':'off'}">完全自動 ${s.full_auto_enabled?'ON':'OFF'}</span><span class="chip ${s.growth_enabled?'on':'off'}">集客 ${s.growth_enabled?'ON':'OFF'}</span><span class="chip ${s.health_monitor_enabled?'on':'off'}">監視 ${s.health_monitor_enabled?'ON':'OFF'}</span><span class="chip ${s.auto_metrics_enabled?'on':'off'}">自動集計 ${s.auto_metrics_enabled?'ON':'OFF'}</span><span class="chip ${s.external_email_enabled?'on':'off'}">営業送信 ${s.external_email_enabled?'許可ON':'OFF'}</span></div></section>
      <div class="grid"><section class="card"><div class="label">実会員</div><div class="num">${d.members}</div></section><section class="card"><div class="label">依頼</div><div class="num">${d.requests}</div></section><section class="card"><div class="label">支払済み</div><div class="num">${d.paid}</div></section><section class="card"><div class="label">売上</div><div class="num">${yen(d.revenue)}</div></section><section class="card"><div class="label">待機ジョブ</div><div class="num">${jc.waiting||0}</div></section><section class="card"><div class="label">実行中</div><div class="num">${jc.running||0}</div></section></div>
      <div class="cols"><section class="card"><div class="title" style="font-size:17px">最近の依頼</div><div class="table-wrap"><table class="table"><thead><tr><th>案件</th><th>物件</th><th>状態</th><th>決済</th><th>訪問日</th><th>金額</th></tr></thead><tbody>${requestRows(d.recentRequests)}</tbody></table></div></section><section class="card"><div class="title" style="font-size:17px">完全自動 実行キュー</div><div class="sub">完了 ${jc.completed||0} / 保留 ${jc.held||0} / 失敗 ${jc.failed||0}</div>${jobRows(d.jobs)}</section></div>
      <div class="cols"><section class="card"><div class="title" style="font-size:17px">最近の会員</div><div class="table-wrap"><table class="table"><thead><tr><th>会員</th><th>地域</th><th>流入元</th></tr></thead><tbody>${memberRows(d.recentMembers)}</tbody></table></div></section><section class="card"><div class="title" style="font-size:17px">7日間の流入</div>${sourceRows(d.sources)}</section></div>
      <section class="card"><div class="actions"><button class="btn" id="metrics">今すぐ集計</button><button class="btn" id="diagnostic">本番診断</button></div><div id="diagStatus" class="status sub"></div></section>
      <section class="card"><div class="title" style="font-size:17px">現地確認後の報告</div><div class="cols"><div><div class="field"><label>案件ID</label><input id="requestId" placeholder="AKR-..."></div><div class="field"><label>写真枚数</label><input id="photoCount" type="number" min="0" value="0"></div></div><div><div class="field"><label>報告メモ</label><textarea id="summary" rows="3"></textarea></div><div class="field"><label>報告URL（任意）</label><input id="reportUrl"></div></div></div><button class="btn primary" id="completeReport">報告完了にする</button><span id="reportStatus" class="status sub"></span></section>
      <div class="notice">契約締結、価格・規約・法務方針変更、返金、銀行操作、任意の資金移動、有料広告・支出、現地訪問・撮影・鍵・現場安全最終判断、本人署名、不可逆削除、本人認証が必要な本番デプロイは完全自動の対象外です。</div>
    </div>`;
    const $=id=>document.getElementById(id);
    $('refresh').onclick=render;
    $('logout').onclick=async()=>{await api('logout');token='';sessionStorage.removeItem('akp_owner_session');showLogin()};
    $('startAuto').onclick=async()=>{const st=$('autoStatus');st.textContent='完全自動を開始しています…';const y=await api('start_full_auto');st.textContent=y.ok?'完全自動を開始しました。10作業を登録し、毎時継続処理します。':'開始できませんでした。';await render()};
    $('stopAuto').onclick=async()=>{const st=$('autoStatus');st.textContent='停止中…';await api('stop_full_auto');await render()};
    $('metrics').onclick=async()=>{const st=$('diagStatus');st.textContent='集計中…';const y=await api('refresh_metrics');st.textContent=y.ok?'集計を更新しました。':'集計できませんでした。';if(y.ok)await render()};
    $('diagnostic').onclick=async()=>{const st=$('diagStatus');st.textContent='診断中…';const y=await api('diagnostic');st.textContent=y.ok?y.checks.map(c=>`${c.label}:${c.ok?'正常':'異常'}(${c.status})`).join(' / '):'診断できませんでした。'};
    $('completeReport').onclick=async()=>{const st=$('reportStatus');st.textContent='更新中…';const y=await api('complete_report',{requestId:$('requestId').value,summary:$('summary').value,photoCount:$('photoCount').value,reportUrl:$('reportUrl').value});st.textContent=y.ok?'報告完了にしました。':'更新できませんでした。';if(y.ok)await render()};
  }
  if(token)render();else showLogin();
})();
</script>
</body>
</html>
