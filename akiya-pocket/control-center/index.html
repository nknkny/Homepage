<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src https://fpgtwgtoqtokpitzlbie.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>空家ポケット 運営状況</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:17px;margin-bottom:14px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.title{font-size:22px;font-weight:850;color:#082b58}.sub{font-size:12px;color:#68778b;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{font-size:28px;font-weight:850;color:#082b58;margin-top:5px}.label{font-size:12px;color:#68778b}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.on{background:#ecfdf3;color:#0c7a43}.warn{background:#fff7ed;color:#9a3412}.off{background:#fff1f0;color:#b42318}.btn{display:inline-block;border:1px solid #cbd5e1;border-radius:10px;padding:10px 13px;background:#fff;color:#172033;text-decoration:none;font-weight:750;cursor:pointer}.primary{background:#082b58;color:#fff;border-color:#082b58}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.name{font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{max-width:430px;margin:8vh auto}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.note{padding:11px 12px;border-radius:11px;background:#eef6ff;color:#123b66;font-size:13px;line-height:1.7}.error{color:#b42318}.small{font-size:12px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.top{align-items:flex-start;flex-direction:column}.row{flex-direction:column}}</style>
</head>
<body><main id="app"></main>
<script>(()=>{'use strict';
const OWNER='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner';
const SOCIAL='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-social';
const CUSTOMER='https://akiya-pocket-aomori.pages.dev/';
let token=sessionStorage.getItem('akp_owner_session')||'';const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const yen=v=>'¥'+Number(v||0).toLocaleString('ja-JP');
async function call(url,action,data={}){const r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,token})});let x={};try{x=await r.json()}catch{}if(r.status===401&&action!=='login'){token='';sessionStorage.removeItem('akp_owner_session');showLogin()}return x}
function showLogin(){app.innerHTML=`<div class="wrap"><section class="card login"><div class="title">空家ポケット 運営状況</div><div class="sub">実データと実際の稼働状態だけを表示します。</div><div class="field"><label>管理者メール</label><input id="email" type="email"></div><div class="field"><label>管理パスワード</label><input id="password" type="password"></div><button class="btn primary" id="login">ログイン</button><div id="msg" class="sub error"></div></section></div>`;document.getElementById('login').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){const x=await call(OWNER,'login',{email:document.getElementById('email').value,password:document.getElementById('password').value});if(!x.ok){document.getElementById('msg').textContent='ログインできません。';return}token=x.token;sessionStorage.setItem('akp_owner_session',token);render()}
function requestText(a){if(!a?.length)return '新しい依頼はありません。';const r=a[0];return `${esc(r.request_id)} / ${esc(r.status)} / ${esc(r.payment_status)} / ${yen(r.quoted_total)}`}
async function render(){const [o,s]=await Promise.all([call(OWNER,'dashboard'),call(SOCIAL,'status')]);if(!o.ok){showLogin();return}const d=o.data||{};const settings=d.settings||{};const providers=(s.providers||[]).filter(p=>['instagram','facebook','youtube_shorts'].includes(p.provider));const connected=providers.filter(p=>p.connection_status==='connected').length;const drafts=(s.posts||[]).filter(p=>['draft','held'].includes(p.status)).length;const seoActive=!!settings.growth_enabled;const monitorActive=!!settings.health_monitor_enabled;const fullAutoActive=!!settings.full_auto_enabled;const snsConnected=connected>0;const snsAutoPublish=!!s.global_publish_enabled||!!(s.autopilot&&s.autopilot.enabled);
app.innerHTML=`<div class="wrap">
<section class="card"><div class="top"><div><div class="title">空家ポケット 運営状況</div><div class="sub">実データとDB/APIが返す実際の稼働状態を表示します。表示だけを「稼働」にすることはしません。</div></div><div class="actions"><button class="btn" id="refresh">更新</button><button class="btn" id="logout">ログアウト</button></div></div></section>
<section class="grid"><div class="card"><div class="label">実会員</div><div class="metric">${Number(d.members||0)}</div></div><div class="card"><div class="label">実依頼</div><div class="metric">${Number(d.requests||0)}</div></div><div class="card"><div class="label">支払済み</div><div class="metric">${Number(d.paid||0)}</div></div><div class="card"><div class="label">実売上</div><div class="metric">${yen(d.revenue||0)}</div></div></section>
<section class="card"><div class="title" style="font-size:18px">運営機能の実状態</div>
<div class="row"><div><div class="name">① Google / SEO 集客</div><div class="sub">自動集客設定の現在値を表示。OFFなら自動実行中とは扱いません。</div></div><span class="status ${seoActive?'on':'off'}">${seoActive?'稼働':'停止'}</span></div>
<div class="row"><div><div class="name">② SNS</div><div class="sub">Instagram / Facebook / YouTube Shorts の接続状態。公開は必ず1投稿ごとの明示承認を通します。</div></div><span class="status ${snsConnected?'on':'warn'}">${snsConnected?`接続 ${connected}/3`:'接続待ち'}</span></div>
<div class="row"><div><div class="name">③ 運営監視</div><div class="sub">自動監視設定の現在値を表示。OFFならバックグラウンド監視中とは表示しません。</div></div><span class="status ${monitorActive?'on':'off'}">${monitorActive?'稼働':'停止'}</span></div>
<div class="row"><div><div class="name">④ 一括自動運営</div><div class="sub">汎用ジョブ実行器が完成していないため、現在は「完全自動」とは判定しません。</div></div><span class="status ${fullAutoActive?'warn':'off'}">${fullAutoActive?'設定ON（実行器未完）':'停止'}</span></div></section>
<section class="card"><div class="title" style="font-size:18px">SNS</div><div class="row"><div><div class="name">接続 ${connected}/3</div><div class="sub">未承認・保留中の投稿素材 ${drafts}件。自動公開設定は ${snsAutoPublish?'ON':'OFF'}。</div></div><a class="btn primary" href="./social.html">接続・承認画面</a></div><div class="note">SNSは1投稿ごとにあなたの明示承認が必須です。未承認投稿・テスト投稿・保留投稿を勝手に公開しません。</div></section>
<section class="card"><div class="title" style="font-size:18px">要対応</div><div class="row"><div><div class="name">${snsConnected?'SNS接続は確認済み':'SNS接続が未完了'}</div><div class="sub">${snsConnected?'投稿する場合は接続・承認画面で対象1件を確認してください。':'接続が終わるまでは公開できません。'}</div></div>${snsConnected?'':`<a class="btn primary" href="./social.html">SNSを接続</a>`}</div><div class="row"><div><div class="name">最近の依頼</div><div class="sub">${requestText(d.recentRequests)}</div></div></div></section>
<section class="card"><div class="actions"><a class="btn" target="_blank" rel="noopener" href="${CUSTOMER}">顧客サイトを確認</a><a class="btn" href="./social.html">SNS運用</a></div><div class="sub" style="margin-top:10px">料金・規約・返金・銀行操作・本人認証は自動変更しません。</div></section></div>`;document.getElementById('refresh').onclick=render;document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('akp_owner_session');token='';showLogin()}}
if(token)render();else showLogin();})();</script></body></html>
