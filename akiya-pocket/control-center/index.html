*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:17px;margin-bottom:14px}.top,.actions,.row,.nav{display:flex;gap:10px}.top{align-items:flex-start;justify-content:space-between}.row{justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.actions,.nav{flex-wrap:wrap;align-items:center}.title{font-size:24px;font-weight:900;color:#082b58}.section{font-size:18px;font-weight:850;color:#082b58}.name{font-weight:800}.sub{font-size:12px;color:#68778b;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{font-size:28px;font-weight:900;color:#082b58;margin-top:5px}.label{font-size:12px;color:#68778b}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.on{background:#ecfdf3;color:#0c7a43}.warn{background:#fff7ed;color:#9a3412}.off{background:#fff1f0;color:#b42318}.btn{display:inline-block;border:1px solid #cbd5e1;border-radius:10px;padding:9px 12px;background:#fff;color:#172033;text-decoration:none;font-weight:750;cursor:pointer}.btn:disabled{opacity:.5}.primary{background:#082b58;color:#fff;border-color:#082b58}.good{background:#0f766e;color:#fff;border-color:#0f766e}.danger{background:#fff1f0;color:#b42318;border-color:#fecaca}.hero{padding:18px;border-radius:14px;border:1px solid #cfe1f5;background:#f2f8ff}.hero.good{background:#ecfdf3;border-color:#bbf7d0;color:#14532d}.hero.bad{background:#fff1f0;border-color:#fecaca;color:#8f1f17}.hero .big{font-size:26px;font-weight:900}.mini{font-size:11px;color:#68778b}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid #eef2f6}.login{max-width:430px;margin:8vh auto}.field{margin:1 </style></head><body><main id="app"></main><script>(()=>{'use strict';
const BASE='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/',OWNER=BASE+'akiya-pocket-owner',CONTROL=BASE+'akiya-pocket-automation-control',COMMAND=BASE+'akiya-pocket-command-center',CUSTOMER='https://akiya-pocket-aomori.pages.dev/';let token=sessionStorage.getItem('akp_owner_session')||'';const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),yen=v=>'¥'+Number(v||0).toLocaleString('ja-JP'),pct=(a,b)=>b?`${(100*a/b).toFixed(1)}%`:'—',fmt=v=>v?new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'—';
async function call(url,action,data={}){const r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,token})});let x={};try{x=await r.json()}catch{}if(r.status===401&&action!=='login'){token='';sessionStorage.removeItem('akp_owner_session');showLogin()}return{...x,httpStatus:r.status}}
function showLogin(){app.innerHTML=`<div class="wrap"><section class="card login"><div class="title">空家ポケット 運営司令塔</div><div class="sub">経営・集客・顧客・決済・自動化・障害を一元監視します。</div><div class="field"><label>管理者メール</label><input id="email" type="email"></div><div class="field"><label>管理パスワード</label><input id="password" type="password"></div><button class="btn primary" id="login">ログイン</button><div id="msg" class="sub error"></div></section></div>`;document.getElementById('login').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){const x=await call(OWNER,'login',{email:document.getElementById('email').value,password:document.getElementById('password').value});if(!x.ok){document.getElementById('msg').textContent='ログインできません。';return}token=x.token;sessionStorage.setItem('akp_owner_session',token);render()}
function nav(){return `<div class="nav"><a class="btn primary" href="./">概要</a><a class="btn" href="./acquisition.html">集客</a><a class="btn" href="./business.html">顧客・売上</a><a class="btn" href="./social.html">SNS</a><a class="btn" href="./newsletter.html">会員育成</a><a class="btn" href="./system.html">システム</a></div>`}
function pill(ok,a='正常',b='異常'){return `<span class="status ${ok?'on':'off'}">${ok?a:b}</span>`}
async function render(){const [cc,ctrl]=await Promise.all([call(COMMAND,'status'),call(CONTROL,'status')]);if(!cc.ok){app.innerHTML=`<div class="wrap"><section class="card error">司令塔データを取得できません。HTTP ${cc.httpStatus||'—'} / ${esc(cc.code||cc.message||'ERROR')}</section></div>`;return}const d=cc.data,b=d.business||{},a=d.acquisition||{},required=(d.owner?.pending||[]).filter(x=>x.required_now!==false),optional=(d.owner?.pending||[]).filter(x=>x.required_now===false),runtime=d.runtime||[],runtimeOk=runtime.length>0&&runtime.every(x=>x.ok),sec=d.security||{},secOk=Number(sec.public_tables_without_rls||0)===0&&Number(sec.akiya_views_without_security_invoker||0)===0&&Number(sec.security_definer_anon_executable||0)===0&&Number(sec.security_definer_authenticated_executable||0)===0,failed=Number(d.automation?.failed24||0),channels=d.channels?.items||[],connected=channels.filter(x=>x.connected).length,pay=d.payments?.config||{},period=b.periods?.d7||{},ext=d.external||{},cf=ext.cloudflare?.parsed||{},ix=ext.indexnow?.parsed||{};
app.innerHTML=`<div class="wrap"><section class="card"><div class="top"><div><div class="title">空家ポケット 運営司令塔</div><div class="sub">ここだけ見れば、現在の経営・集客・顧客・決済・自動運営・障害が分かります。生成 ${esc(fmt(d.generatedAt))}</div></div><div class="actions"><button class="btn" id="refresh">更新</button><button class="btn good" id="runNow">自動運営を今すぐ実行</button><button class="btn" id="logout">ログアウト</button></div></div><div style="margin-top:12px">${nav()}</div><div id="msg" class="sub" style="margin-top:8px"></div></section>
<section class="card"><div class="hero ${required.length?'bad':'good'}"><div class="big">${required.length?`今すぐ要対応 ${required.length}件`:'現在あなたが今すぐやること：0件'}</div><div class="sub">${required.length?'本人判断・本人操作が必要なものだけ表示しています。':'通常運転は自動系が継続します。'}</div></div>${required.map(x=>`<div class="row"><div><div class="name">${esc(x.title)}</div><div class="sub">${esc(x.why_required)} / 影響: ${esc(x.blocking_scope)}</div></div><span class="status warn">要対応</span></div>`).join('')}${optional.length?`<details style="margin-top:12px"><summary class="sub">任意の集客拡張・本人連携 ${optional.length}件</summary>${optional.map(x=>`<div class="row"><div><div class="name">${esc(x.title)}</div><div class="sub">${esc(x.completion_note||x.why_required)}</div></div><span class="status warn">任意</span></div>`).join('')}</details>`:''}</section>
<section class="grid"><div class="card"><div class="label">実会員</div><div class="metric">${Number(b.members||0)}</div><div class="mini">7日 +${Number(period.members||0)}</div></div><div class="card"><div class="label">実依頼</div><div class="metric">${Number(b.requests||0)}</div><div class="mini">7日 +${Number(period.requests||0)}</div></div><div class="card"><div class="label">支払済み</div><div class="metric">${Number(b.paid||0)}</div><div class="mini">7日 +${Number(period.paid||0)}</div></div><div class="card"><div class="label">実売上</div><div class="metric">${yen(b.revenue||0)}</div><div class="mini">7日 ${yen(period.revenue||0)}</div></div></section>
<section class="card"><div class="top"><div><div class="section">集客ファネル</div><div class="sub">内部/テスト流入を除いた外部集客セッションを優先表示します。</div></div><a class="btn" href="./acquisition.html">詳細を見る</a></div><div class="grid" style="margin-top:12px"><div><div class="label">外部集客セッション 7日</div><div class="metric">${Number(a.externalSessions7||0)}</div></div><div><div class="label">外部集客セッション 30日</div><div class="metric">${Number(a.externalSessions30||0)}</div></div><div><div class="label">登録 / 外部セッション</div><div class="metric">${pct(period.members||0,a.externalSessions7||0)}</div></div><div><div class="label">依頼 / 登録</div><div class="metric">${pct(period.requests||0,period.members||0)}</div></div></div>${(a.sourceRows||[]).length?`<table class="tbl" style="margin-top:12px"><thead><tr><th>流入元</th><th>セッション</th><th>登録</th><th>依頼</th><th>支払</th><th>売上</th></tr></thead><tbody>${a.sourceRows.slice(0,6).map(x=>`<tr><td>${esc(x.source)} / ${esc(x.medium||'—')}<div class="mini">${esc(x.campaign||'')}</div></td><td>${Number(x.sessions||0)}</td><td>${Number(x.registrations||0)}</td><td>${Number(x.requests||0)}</td><td>${Number(x.paid||0)}</td><td>${yen(x.revenue||0)}</td></tr>`).join('')}</tbody></table>`:'<div class="sub" style="margin-top:10px">外部集客データはまだありません。</div>'}</section>
<section class="grid"><div class="card"><div class="section">SNS</div><div class="metric">${connected}/3</div><div class="sub">Buffer接続。公開/予約 ${(a.posts||[]).filter(x=>['queued','publishing','published'].includes(x.status)).length}件</div><a class="btn" style="margin-top:8px" href="./social.html">投稿・成果</a></div><div class="card"><div class="section">決済</div><div class="metric">${pay.active?yen(pay.amount_jpy):'停止'}</div><div class="sub">Stripe設定 ${pay.active?'有効':'無効'} / 実ライブイベント ${(d.payments?.liveStripeEvents||[]).length}件</div><a class="btn" style="margin-top:8px" href="./business.html">依頼・決済</a></div><div class="card"><div class="section">自動運営</div><div class="metric">${failed?`失敗 ${failed}`:'正常'}</div><div class="sub">直近24時間のジョブ失敗数</div></div><div class="card"><div class="section">システム</div><div class="metric">${runtimeOk&&secOk?'正常':'確認'}</div><div class="sub">本番/API ${runtime.filter(x=>x.ok).length}/${runtime.length} / セキュリティ ${secOk?'PASS':'要確認'}</div><a class="btn" style="margin-top:8px" href="./system.html">詳細監視</a></div></section>
<section class="card"><div class="section">本番・検索通知</div><div class="row"><div><div class="name">Cloudflare本番</div><div class="sub">最新記録 ${esc(cf.RUN_ID||'—')} / source ${esc(cf.SOURCE_SHA||'—')}</div></div>${pill(cf.AUTH==='success'&&cf.DEPLOY==='success'&&cf.PUBLIC_VERIFY==='success','デプロイ正常','要確認')}</div><div class="row"><div><div class="name">IndexNow</div><div class="sub">URL ${esc(ix.URL_COUNT||'—')}件 / HTTP ${esc(ix.HTTP_CODE||'—')} / 所有キー ${ext.indexNowKeyLive?'実配信確認済み':'未確認'}</div></div>${pill(ix.HTTP_CODE==='200'||ix.HTTP_CODE==='202','送信正常','要確認')}</div><div class="row"><div><div class="name">本番/API疎通</div><div class="sub">${runtime.map(x=>`${esc(x.label)}:${x.status}`).join(' / ')}</div></div>${pill(runtimeOk)}</div><div class="row"><div><div class="name">DBセキュリティ基礎監査</div><div class="sub">RLSなし ${Number(sec.public_tables_without_rls||0)} / 非invoker view ${Number(sec.akiya_views_without_security_invoker||0)} / 匿名実行可能SECURITY DEFINER ${Number(sec.security_definer_anon_executable||0)}</div></div>${pill(secOk,'PASS','要確認')}</div></section>
<section class="card"><div class="actions"><a class="btn" target="_blank" rel="noopener" href="${CUSTOMER}">顧客サイト</a><a class="btn" href="./acquisition.html">集客分析</a><a class="btn" href="./business.html">顧客・売上</a><a class="btn" href="./system.html">システム監視</a></div></section></div>`;bind()}
function bind(){document.getElementById('refresh').onclick=render;document.getElementById('logout').onclick=async()=>{await call(OWNER,'logout');sessionStorage.removeItem('akp_owner_session');token='';showLogin()};document.getElementById('runNow').onclick=async e=>{e.target.disabled=true;document.getElementById('msg').textContent='実ジョブを実行中…';const x=await call(CONTROL,'run_now');document.getElementById('msg').textContent=x.ok?'実行要求を反映しました。':'実行失敗: '+esc(x.code||'ERROR');e.target.disabled=false;await render()}}
if(token)render();else showLogin()})();</script></body></html>
