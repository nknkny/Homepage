<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src https://fpgtwgtoqtokpitzlbie.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"><title>紹介業者候補 | 空家ポケット</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1380px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:16px;padding:16px;margin-bottom:14px}.title{font-size:22px;font-weight:850;color:#082b58}.sub{font-size:12px;color:#65758b;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.btn{border:1px solid #cbd5e1;border-radius:10px;padding:10px 14px;background:#fff;font-weight:750;cursor:pointer;text-decoration:none;color:inherit}.primary{background:#082b58;color:#fff;border-color:#082b58}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px;min-width:980px}.table th,.table td{padding:8px 7px;border-bottom:1px solid #eef2f6;text-align:left;vertical-align:top}.chip{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:700}.status{min-height:20px;font-size:13px;margin-top:8px}.link{color:#0b57d0;text-decoration:none}.notice{background:#eef6ff;border:1px solid #cfe3ff;border-radius:12px;padding:12px;line-height:1.7;font-size:13px;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><section class="card"><div class="actions" style="justify-content:space-between"><div><div class="title">紹介業者候補</div><div class="sub">集客は消費者へ直接行い、この画面では顧客獲得後に必要となる修繕・解体・家財整理等の紹介候補だけを管理します。</div></div><div class="actions"><a class="btn" href="./">運営センター</a><a class="btn" href="./social.html">SNS運用</a></div></div><div class="notice">企業を使った顧客獲得用の営業リスト・営業メール・問い合わせフォーム営業は廃止済みです。ここで作るのは、顧客から追加作業の希望が出た場合に本人同意のうえ案内する下流業者候補だけです。</div></section><section class="card"><div class="grid"><div class="field"><label>都道府県</label><select id="prefecture"><option value="">選択</option><option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option><option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option><option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option><option>静岡県</option><option>愛知県</option><option>三重県</option><option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option><option>奈良県</option><option>和歌山県</option><option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option><option>福岡県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option></select></div><div class="field"><label>市区町村（任意）</label><input id="municipality" placeholder="例：青森市"></div><div class="field"><label>業種（カンマ区切り・任意）</label><input id="categories" value="修繕,リフォーム,解体,遺品整理・家財整理,草刈り・除雪,清掃,害虫・害獣対応"></div><div class="field"><label>目標件数</label><input id="targetCount" type="number" min="1" max="500" value="50"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="create">この条件で紹介業者候補を作成</button><button class="btn" id="refresh">更新</button></div><div class="status sub" id="status"></div></section><section class="card"><div class="title" style="font-size:17px">作成リクエスト</div><div class="table-wrap"><table class="table"><thead><tr><th>地域</th><th>業種</th><th>目標</th><th>進捗</th><th>状態</th><th>作成日時</th></tr></thead><tbody id="requests"></tbody></table></div></section><section class="card"><div class="title" style="font-size:17px">紹介業者候補一覧</div><div class="table-wrap"><table class="table"><thead><tr><th>会社</th><th>業種</th><th>地域</th><th>連絡先</th><th>公式サイト</th><th>紹介適合理由</th><th>紹介料情報</th><th>契約状態</th><th>確認内容</th></tr></thead><tbody id="partners"></tbody></table></div></section></main><script>(()=>{'use strict';const API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-owner-lists';const token=sessionStorage.getItem('akp_owner_session')||'';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));async function api(action,data={}){const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,token})});let x={};try{x=await r.json()}catch{}if(r.status===401){location.href='./';return{ok:false}}return x}function reqRows(a){const rows=a.filter(r=>r.list_type==='referral_partner');$('requests').innerHTML=rows.length?rows.map(r=>`<tr><td>${esc(r.prefecture)} ${esc(r.municipality||'')}</td><td>${esc((r.categories||[]).join(' / ')||'指定なし')}</td><td>${esc(r.target_count)}</td><td>${esc(r.progress_count)} / ${esc(r.target_count)}</td><td><span class="chip">${esc(r.status)}</span></td><td>${esc(r.created_at||'')}</td></tr>`).join(''):'<tr><td colspan="6">まだありません。</td></tr>'}function partnerRows(a){$('partners').innerHTML=a.length?a.map(r=>`<tr><td><b>${esc(r.company_name)}</b></td><td>${esc(r.category)}</td><td>${esc(r.prefecture)} ${esc(r.municipality)}</td><td>${esc(r.email)}<br>${esc(r.phone)}</td><td>${r.official_url?`<a class="link" target="_blank" rel="noopener" href="${esc(r.official_url)}">公式</a>`:'—'}</td><td>${esc(r.referral_fit_reason)}</td><td>${esc(r.commission_model||'要確認')} ${esc(r.commission_amount_note)}</td><td>${esc(r.contract_status)}</td><td>${esc(r.verification_summary)}</td></tr>`).join(''):'<tr><td colspan="9">まだありません。</td></tr>'}async function load(){if(!token){location.href='./';return}const x=await api('list_data');if(!x.ok)return;reqRows(x.requests||[]);partnerRows(x.partners||[])}$('create').onclick=async()=>{const st=$('status');st.textContent='登録中…';const x=await api('create_request',{prefecture:$('prefecture').value,municipality:$('municipality').value,categories:$('categories').value,targetCount:$('targetCount').value});st.textContent=x.ok?'紹介業者候補の作成依頼を登録しました。順次、一次情報を確認して作成します。':x.code==='PREFECTURE_REQUIRED'?'都道府県を選択してください。':'登録できませんでした。';if(x.ok)load()};$('refresh').onclick=load;load()})();</script></body></html>
