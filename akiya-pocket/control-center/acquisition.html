<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Content-Security-Policy" content="default-src 'self';connect-src https://fpgtwgtoqtokpitzlbie.supabase.co;style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline';object-src 'none';frame-ancestors 'none'"><title>集客分析 | 空家ポケット</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#172738;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1280px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce4ea;border-radius:14px;padding:17px;margin-bottom:14px}.title{font-size:24px;font-weight:900;color:#173a5e}.section{font-size:18px;font-weight:850;color:#173a5e}.sub,.mini{font-size:12px;color:#647486;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{display:inline-block;border:1px solid #b9c7d1;border-radius:9px;padding:9px 12px;background:#fff;color:#172738;text-decoration:none;font-weight:750}.primary{background:#173a5e;color:#fff;border-color:#173a5e}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric{font-size:28px;font-weight:900;color:#173a5e;margin-top:5px}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid #edf1f4;vertical-align:top}.tbl th{position:sticky;top:0;background:#f8fafb;z-index:1}.chip{display:inline-block;padding:4px 7px;border-radius:999px;background:#edf3f8;color:#294e6c;font-weight:800}.on{background:#ecf7f1;color:#176440}.warn{background:#fff5e8;color:#8b4d18}.bad{background:#fdeeee;color:#8f2e2e}.scroll{overflow:auto;max-height:520px}.bar{height:8px;background:#e7edf1;border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:#397b79}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tab{border:1px solid #cbd6de;background:#fff;padding:7px 10px;border-radius:8px;font-weight:800;cursor:pointer}.tab.active{background:#173a5e;color:#fff}.paneltab{display:none}.paneltab.active{display:block}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.tbl{min-width:900px}.wrap{padding:10px}}</style></head><body><main class="wrap"><section class="card"><div class="actions" style="justify-content:space-between"><div><div class="title">集客・帰属分析</div><div class="sub">First touch（最初に来た経路）と Session/Conversion touch（行動を起こした経路）を分離。表示数ではなく、流入→価値閲覧→登録→依頼→支払で判定。</div></div><div class="actions"><a class="btn" href="./">概要</a><a class="btn primary" href="./acquisition.html">集客</a><a class="btn" href="./business.html">顧客・売上</a><a class="btn" href="./social.html">SNS</a><a class="btn" href="./system.html">システム</a><button class="btn" id="refresh">更新</button></div></div></section><div id="app"></div></main><script>(()=>{'use strict';const API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-command-center',token=sessionStorage.getItem('akp_owner_session')||'',app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),yen=v=>'¥'+Number(v||0).toLocaleString('ja-JP'),pct=(a,b)=>b?`${(100*a/b).toFixed(1)}%`:'—',fmt=v=>v?new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'—';if(!token){location.href='./';return}const table=(rows,cols)=>rows?.length?`<div class="scroll"><table class="tbl"><thead><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="sub" style="margin-top:10px">まだ対象データはありません。</div>';
async function load(){const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',token})});const x=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('akp_owner_session');location.href='./';return}if(!x.ok){app.innerHTML=`<section class="card">取得失敗: ${esc(x.code||x.message||'ERROR')}</section>`;return}const d=x.data,a=d.acquisition||{},b=d.business||{},p7=b.periods?.d7||{},p30=b.periods?.d30||{},cov=a.coverage||{},funnel=a.funnel||[],firstEvents=a.firstTouchEventRows||[],sessionEvents=a.sessionTouchEventRows||[],firstOutcome=a.sourceRows||[],convOutcome=a.conversionRows||[],landing=a.landingRows||[],aud=a.audienceRows||[],sp=a.socialPerformance||[];
app.innerHTML=`<section class="grid"><div class="card"><div class="sub">外部適格セッション 7日</div><div class="metric">${Number(a.externalSessions7||0)}</div></div><div class="card"><div class="sub">外部適格セッション 30日</div><div class="metric">${Number(a.externalSessions30||0)}</div></div><div class="card"><div class="sub">7日 無料会員</div><div class="metric">${Number(p7.members||0)}</div></div><div class="card"><div class="sub">7日 依頼 / paid</div><div class="metric">${Number(p7.requests||0)} / ${Number(p7.paid||0)}</div></div><div class="card"><div class="sub">7日 売上</div><div class="metric">${yen(p7.revenue||0)}</div></div></section>
<section class="card"><div class="section">計測健全性</div><div class="sub">100%に近いほど、新しい詳細計測が各イベントに残っています。古いイベントが含まれる間は100%未満でも異常とは限りません。</div><div class="grid" style="margin-top:12px"><div><div class="mini">Session ID</div><b>${Number(cov.sessionIdPct||0)}%</b><div class="bar"><span style="width:${Math.min(100,Number(cov.sessionIdPct||0))}%"></span></div></div><div><div class="mini">First landing</div><b>${Number(cov.firstLandingPct||0)}%</b><div class="bar"><span style="width:${Math.min(100,Number(cov.firstLandingPct||0))}%"></span></div></div><div><div class="mini">Session touch</div><b>${Number(cov.sessionTouchPct||0)}%</b><div class="bar"><span style="width:${Math.min(100,Number(cov.sessionTouchPct||0))}%"></span></div></div><div><div class="mini">Audience job</div><b>${Number(cov.audienceJobPct||0)}%</b><div class="bar"><span style="width:${Math.min(100,Number(cov.audienceJobPct||0))}%"></span></div></div><div><div class="mini">30日イベント</div><b>${Number(cov.events30||0)}</b></div></div></section>
<section class="card"><div class="section">30日ファネル</div>${table(funnel,[['段階',r=>`<b>${esc(r.event_type)}</b>`],['7日',r=>Number(r.d7||0)],['30日',r=>Number(r.d30||0)]])}</section>
<section class="card"><div class="section">流入帰属モデル</div><div class="tabs"><button class="tab active" data-tab="first">First touch</button><button class="tab" data-tab="session">Session touch</button><button class="tab" data-tab="outcome">会員・paid帰属</button></div><div class="paneltab active" id="tab-first"><div class="sub">初回に空家ポケットを知った経路。長期獲得チャネルの評価向け。</div>${table(firstEvents.slice(0,60),[['流入元',r=>`<b>${esc(r.source)}</b><br>${esc(r.medium)}`],['キャンペーン',r=>esc(r.campaign||'—')],['最初のLP',r=>esc(r.landing_page||'—')],['セッション',r=>Number(r.sessions||0)],['価値閲覧',r=>Number(r.value_engagements||0)],['登録開始',r=>Number(r.register_starts||0)],['登録',r=>Number(r.registrations||0)],['依頼',r=>Number(r.requests||0)]])}</div><div class="paneltab" id="tab-session"><div class="sub">そのセッションで実際に行動を起こした経路。最後の後押し・CTA評価向け。</div>${table(sessionEvents.slice(0,60),[['流入元',r=>`<b>${esc(r.source)}</b><br>${esc(r.medium)}`],['キャンペーン',r=>esc(r.campaign||'—')],['Session LP',r=>esc(r.landing_page||'—')],['セッション',r=>Number(r.sessions||0)],['価値閲覧',r=>Number(r.value_engagements||0)],['登録開始',r=>Number(r.register_starts||0)],['登録',r=>Number(r.registrations||0)],['依頼',r=>Number(r.requests||0)]])}</div><div class="paneltab" id="tab-outcome"><div class="sub">会員レコードと依頼・paidを結合した確定結果。First / Conversionを並べて確認。</div><h3>First touch → 成果</h3>${table(firstOutcome,[['流入元',r=>`<b>${esc(r.source)}</b><br>${esc(r.medium)}`],['キャンペーン',r=>esc(r.campaign||'—')],['LP',r=>esc(r.landing_page||'—')],['登録',r=>Number(r.registrations||0)],['依頼',r=>Number(r.requests||0)],['paid',r=>Number(r.paid||0)],['売上',r=>yen(r.revenue||0)]])}<h3>Conversion touch → 成果</h3>${table(convOutcome,[['流入元',r=>`<b>${esc(r.source)}</b><br>${esc(r.medium)}`],['キャンペーン',r=>esc(r.campaign||'—')],['LP',r=>esc(r.landing_page||'—')],['登録',r=>Number(r.registrations||0)],['依頼',r=>Number(r.requests||0)],['paid',r=>Number(r.paid||0)],['売上',r=>yen(r.revenue||0)]])}</div></section>
<section class="card"><div class="section">ランディングページ別</div><div class="sub">どの入口が実際に下流へ進ませているか。</div>${table(landing,[['LP',r=>`<b>${esc(r.key)}</b>`],['セッション',r=>Number(r.sessions||0)],['価値閲覧',r=>Number(r.value_engagements||0)],['登録閲覧',r=>Number(r.register_views||0)],['登録開始',r=>Number(r.register_starts||0)],['登録',r=>Number(r.registrations||0)],['依頼',r=>Number(r.requests||0)]])}</section>
<section class="card"><div class="section">生活イベント / Audience Job別</div>${table(aud,[['Audience job',r=>`<b>${esc(r.key)}</b>`],['セッション',r=>Number(r.sessions||0)],['価値閲覧',r=>Number(r.value_engagements||0)],['登録開始',r=>Number(r.register_starts||0)],['登録',r=>Number(r.registrations||0)],['依頼',r=>Number(r.requests||0)]])}</section>
<section class="card"><div class="section">SNS投稿 → サイト成果</div><div class="sub">露出は補助指標。サイト・登録・依頼・paidを優先。</div>${table(sp.slice(0,50),[['媒体',r=>esc(r.provider)],['テーマ',r=>esc(r.theme||r.source_topic||'—')],['公開',r=>esc(fmt(r.published_at))],['露出',r=>Number(r.reach??r.impressions??r.views??0)],['クリック',r=>Number(r.clicks||0)],['サイト',r=>Number(r.site_sessions??r.site_visits??0)],['登録',r=>Number(r.registrations||0)],['依頼',r=>Number(r.inspection_requests||0)],['paid',r=>Number(r.paid_requests||0)],['診断',r=>esc(r.funnel_diagnosis||r.social_sample_state||'学習中')]])}</section>
<section class="card"><div class="section">30日経営結果</div><div class="grid" style="margin-top:10px"><div><div class="sub">登録</div><div class="metric">${Number(p30.members||0)}</div></div><div><div class="sub">依頼</div><div class="metric">${Number(p30.requests||0)}</div></div><div><div class="sub">paid</div><div class="metric">${Number(p30.paid||0)}</div></div><div><div class="sub">売上</div><div class="metric">${yen(p30.revenue||0)}</div></div><div><div class="sub">管理API</div><div class="mini">${esc(d.build||'—')}</div></div></div></section>`;
document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.paneltab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('tab-'+btn.dataset.tab)?.classList.add('active')})}document.getElementById('refresh').onclick=load;load()})();</script></body></html>
