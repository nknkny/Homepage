<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Content-Security-Policy" content="default-src 'self';connect-src https://fpgtwgtoqtokpitzlbie.supabase.co;style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline';object-src 'none';frame-ancestors 'none'"><title>集客分析 | 空家ポケット</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:17px;margin-bottom:14px}.title{font-size:24px;font-weight:900;color:#082b58}.section{font-size:18px;font-weight:850;color:#082b58}.sub,.mini{font-size:12px;color:#68778b;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{display:inline-block;border:1px solid #cbd5e1;border-radius:10px;padding:9px 12px;background:#fff;color:#172033;text-decoration:none;font-weight:750}.primary{background:#082b58;color:#fff;border-color:#082b58}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:28px;font-weight:900;color:#082b58;margin-top:5px}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid #eef2f6;vertical-align:top}.chip{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef6ff;color:#123b66;font-weight:800}.on{background:#ecfdf3;color:#0c7a43}.warn{background:#fff7ed;color:#9a3412}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.tbl{display:block;overflow:auto}.wrap{padding:10px}}</style></head><body><main class="wrap"><section class="card"><div class="actions" style="justify-content:space-between"><div><div class="title">集客ファネル</div><div class="sub">表示数ではなく、外部流入→登録→依頼→支払→売上で判定します。</div></div><div class="actions"><a class="btn" href="./">概要</a><a class="btn primary" href="./acquisition.html">集客</a><a class="btn" href="./business.html">顧客・売上</a><a class="btn" href="./social.html">SNS</a><a class="btn" href="./system.html">システム</a><button class="btn" id="refresh">更新</button></div></div></section><div id="app"></div></main><script>(()=>{'use strict';const API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-command-center',token=sessionStorage.getItem('akp_owner_session')||'',app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),yen=v=>'¥'+Number(v||0).toLocaleString('ja-JP'),pct=(a,b)=>b?`${(100*a/b).toFixed(1)}%`:'—',fmt=v=>v?new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'—';if(!token){location.href='./';return}async function load(){const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',token})});const x=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('akp_owner_session');location.href='./';return}if(!x.ok){app.innerHTML=`<section class="card">取得失敗: ${esc(x.code||x.message||'ERROR')}</section>`;return}const d=x.data,a=d.acquisition||{},b=d.business||{},p7=b.periods?.d7||{},p30=b.periods?.d30||{},rows=a.sourceRows||[],sp=a.socialPerformance||[],posts=a.posts||[];app.innerHTML=`<section class="grid"><div class="card"><div class="sub">外部集客セッション 7日</div><div class="metric">${Number(a.externalSessions7||0)}</div></div><div class="card"><div class="sub">外部集客セッション 30日</div><div class="metric">${Number(a.externalSessions30||0)}</div></div><div class="card"><div class="sub">7日 登録</div><div class="metric">${Number(p7.members||0)}</div><div class="mini">外部セッション比 ${pct(p7.members||0,a.externalSessions7||0)}</div></div><div class="card"><div class="sub">7日 依頼 / 支払</div><div class="metric">${Number(p7.requests||0)} / ${Number(p7.paid||0)}</div><div class="mini">売上 ${yen(p7.revenue||0)}</div></div></section><section class="card"><div class="section">流入元別成果</div><div class="sub">direct・内部・E2Eテストは主要集客評価から除外しています。</div>${rows.length?`<table class="tbl"><thead><tr><th>流入元</th><th>キャンペーン</th><th>セッション</th><th>登録</th><th>依頼</th><th>支払</th><th>売上</th><th>判定</th></tr></thead><tbody>${rows.map(r=>{const good=Number(r.paid||0)>0||Number(r.requests||0)>0||Number(r.registrations||0)>0;return `<tr><td><b>${esc(r.source)}</b><br>${esc(r.medium||'—')}</td><td>${esc(r.campaign||'—')}</td><td>${Number(r.sessions||0)}</td><td>${Number(r.registrations||0)}</td><td>${Number(r.requests||0)}</td><td>${Number(r.paid||0)}</td><td>${yen(r.revenue||0)}</td><td><span class="chip ${good?'on':'warn'}">${good?'成果あり':'学習中'}</span></td></tr>`}).join('')}</tbody></table>`:'<div class="sub" style="margin-top:10px">まだ外部集客セッションはありません。</div>'}</section><section class="card"><div class="section">SNS投稿→サイト成果</div><div class="sub">Bufferの露出/反応は参考値。サイトセッション・登録・依頼・支払を優先します。</div>${sp.length?`<table class="tbl"><thead><tr><th>媒体</th><th>テーマ</th><th>公開</th><th>露出</th><th>クリック</th><th>サイト</th><th>登録</th><th>依頼</th><th>支払</th><th>診断</th></tr></thead><tbody>${sp.slice(0,40).map(r=>`<tr><td>${esc(r.provider)}</td><td>${esc(r.theme||r.source_topic||'—')}</td><td>${esc(fmt(r.published_at))}</td><td>${Number(r.reach??r.impressions??r.views??0)}</td><td>${Number(r.clicks||0)}</td><td>${Number(r.site_sessions??r.site_visits??0)}</td><td>${Number(r.registrations||0)}</td><td>${Number(r.inspection_requests||0)}</td><td>${Number(r.paid_requests||0)}</td><td>${esc(r.funnel_diagnosis||r.social_sample_state||'学習中')}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">まだ公開後データがありません。</div>'}</section><section class="card"><div class="section">配信予定・公開状態</div>${posts.length?`<table class="tbl"><thead><tr><th>媒体</th><th>テーマ</th><th>状態</th><th>予定/公開</th><th>公開先</th></tr></thead><tbody>${posts.slice(0,40).map(r=>`<tr><td>${esc(r.provider)}</td><td>${esc(r.source_topic||'—')}</td><td>${esc(r.status)}</td><td>${esc(fmt(r.published_at||r.scheduled_for))}</td><td>${r.remote_post_url?`<a href="${esc(r.remote_post_url)}" target="_blank" rel="noopener">投稿を見る</a>`:'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">投稿なし</div>'}</section><section class="card"><div class="section">30日経営結果</div><div class="grid" style="margin-top:10px"><div><div class="sub">登録</div><div class="metric">${Number(p30.members||0)}</div></div><div><div class="sub">依頼</div><div class="metric">${Number(p30.requests||0)}</div></div><div><div class="sub">支払</div><div class="metric">${Number(p30.paid||0)}</div></div><div><div class="sub">売上</div><div class="metric">${yen(p30.revenue||0)}</div></div></div></section>`}document.getElementById('refresh').onclick=load;load()})();</script></body></html>
