<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Content-Security-Policy" content="default-src 'self';connect-src https://fpgtwgtoqtokpitzlbie.supabase.co;style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline';object-src 'none';frame-ancestors 'none'"><title>顧客・売上 | 空家ポケット</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:17px;margin-bottom:14px}.title{font-size:24px;font-weight:900;color:#082b58}.section{font-size:18px;font-weight:850;color:#082b58}.sub,.mini{font-size:12px;color:#68778b;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{display:inline-block;border:1px solid #cbd5e1;border-radius:10px;padding:9px 12px;background:#fff;color:#172033;text-decoration:none;font-weight:750}.primary{background:#082b58;color:#fff;border-color:#082b58}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:28px;font-weight:900;color:#082b58;margin-top:5px}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid #eef2f6;vertical-align:top}.chip{display:inline-block;padding:4px 7px;border-radius:999px;font-weight:800;background:#eef6ff;color:#123b66}.on{background:#ecfdf3;color:#0c7a43}.warn{background:#fff7ed;color:#9a3412}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.tbl{display:block;overflow:auto}.wrap{padding:10px}}</style></head><body><main class="wrap"><section class="card"><div class="actions" style="justify-content:space-between"><div><div class="title">顧客・依頼・売上</div><div class="sub">実会員・実依頼・支払・現地対応・売上だけを確認します。</div></div><div class="actions"><a class="btn" href="./">概要</a><a class="btn" href="./acquisition.html">集客</a><a class="btn primary" href="./business.html">顧客・売上</a><a class="btn" href="./newsletter.html">会員育成</a><a class="btn" href="./system.html">システム</a><button class="btn" id="refresh">更新</button></div></div></section><div id="app"></div></main><script>(()=>{'use strict';const API='https://fpgtwgtoqtokpitzlbie.supabase.co/functions/v1/akiya-pocket-command-center',token=sessionStorage.getItem('akp_owner_session')||'',app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),yen=v=>'¥'+Number(v||0).toLocaleString('ja-JP'),fmt=v=>v?new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'—';if(!token){location.href='./';return}async function load(){const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',token})}),x=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('akp_owner_session');location.href='./';return}if(!x.ok){app.innerHTML=`<section class="card">取得失敗: ${esc(x.code||x.message||'ERROR')}</section>`;return}const d=x.data,b=d.business||{},p=d.payments||{},c=d.newsletter||{},req=b.recentRequests||[],live=p.liveStripeEvents||[],cfg=p.config||{};app.innerHTML=`<section class="grid"><div class="card"><div class="sub">実会員</div><div class="metric">${Number(b.members||0)}</div></div><div class="card"><div class="sub">実依頼</div><div class="metric">${Number(b.requests||0)}</div></div><div class="card"><div class="sub">支払済み</div><div class="metric">${Number(b.paid||0)}</div><div class="mini">現地対応待ち ${Number(b.openPaid||0)}</div></div><div class="card"><div class="sub">実売上</div><div class="metric">${yen(b.revenue||0)}</div></div></section><section class="card"><div class="section">最近の依頼</div>${req.length?`<table class="tbl"><thead><tr><th>依頼ID</th><th>状態</th><th>支払</th><th>金額</th><th>訪問日</th><th>受付</th><th>報告</th></tr></thead><tbody>${req.map(r=>`<tr><td><b>${esc(r.request_id)}</b></td><td>${esc(r.status)}</td><td><span class="chip ${['paid','支払済み'].includes(String(r.payment_status))?'on':'warn'}">${esc(r.payment_status)}</span></td><td>${yen(r.quoted_total||0)}</td><td>${esc(r.visit_date||'—')}</td><td>${esc(fmt(r.created_at))}</td><td>${r.report_url?'あり':'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="sub" style="margin-top:10px">実依頼はまだありません。</div>'}</section><section class="card"><div class="section">決済設定</div><div class="grid" style="margin-top:10px"><div><div class="sub">価格</div><div class="metric">${yen(cfg.amount_jpy||0)}</div></div><div><div class="sub">Payment Link</div><div class="metric" style="font-size:18px">${cfg.active?'有効':'停止'}</div></div><div><div class="sub">Stripe実ライブイベント</div><div class="metric">${live.length}</div></div><div><div class="sub">最終ライブイベント</div><div class="metric" style="font-size:15px">${live[0]?esc(fmt(live[0].processed_at)):'まだなし'}</div></div></div>${live.length?`<table class="tbl" style="margin-top:12px"><thead><tr><th>イベント</th><th>依頼</th><th>処理時刻</th></tr></thead><tbody>${live.slice(0,20).map(e=>`<tr><td>${esc(e.event_type)}</td><td>${esc(e.request_id||'—')}</td><td>${esc(fmt(e.processed_at))}</td></tr>`).join('')}</tbody></table>`:'<div class="sub" style="margin-top:10px">実Stripe由来イベントはまだ記録されていません。</div>'}</section><section class="card"><div class="section">会員育成</div><div class="grid" style="margin-top:10px"><div><div class="sub">送信累計</div><div class="metric">${Number(c.sent||0)}</div></div><div><div class="sub">失敗累計</div><div class="metric">${Number(c.failed||0)}</div></div><div><div class="sub">キャンペーン</div><div class="metric">${(c.campaigns||[]).length}</div></div><div><a class="btn" href="./newsletter.html">配信履歴・設定</a></div></div></section>`}document.getElementById('refresh').onclick=load;load()})();</script></body></html>
