<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/style.css"><title>メール配信停止｜空き家レスキュー</title></head><body><header class="site-header"><div class="wrap head"><a class="brand" href="index.html"><span>空き家レスキュー</span></a><div class="header-actions"><a class="btn btn-ghost" href="member.html">会員ページ</a></div></div></header><main><section class="section section-soft"><div class="wrap form-shell"><div class="panel"><h1>地域情報・サービス案内の配信停止</h1><p>このメールアドレスへの案内配信を停止します。会員資格と現地確認サービスの利用には影響しません。</p><div id="unsubStatus" class="status-box"></div><button id="unsubButton" class="btn btn-primary" type="button">配信を停止する</button></div></div></section></main><footer class="footer"><div class="wrap"><p>空き家レスキュー　お問い合わせ：aomori.akiya.rescue@gmail.com</p></div></footer><script src="assets/config.js"></script><script src="assets/api.js"></script><script src="assets/site.js"></script><script>
const token=new URLSearchParams(location.search).get('token')||'';unsubButton.addEventListener('click',async()=>{if(!token)return AkiyaUI.show(unsubStatus,'配信停止用の情報がありません。');AkiyaUI.busy(unsubButton,true);try{const r=await AkiyaAPI.submit('newsletter_unsubscribe',{unsubscribeToken:token});AkiyaUI.show(unsubStatus,r.message||'配信を停止しました。',!!r.ok)}catch(e){AkiyaUI.show(unsubStatus,e.message||'配信停止を完了できませんでした。')}finally{AkiyaUI.busy(unsubButton,false)}});
</script></body></html>
