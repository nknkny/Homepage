<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/style.css"><title>カード支払い確認｜空き家レスキュー</title></head><body><header class="site-header"><div class="wrap head"><a class="brand" href="index.html"><span>空き家レスキュー</span></a><div class="header-actions"><a class="btn btn-ghost" href="member.html">会員ページ</a></div></div></header><main><section class="section section-soft"><div class="wrap form-shell"><div class="panel"><h1>カード支払いを確認しています</h1><div id="paymentStatus" class="status-box show">Stripeの支払いを照合し、契約成立メールを送信しています。</div><div id="paymentActions" class="form-actions hidden"><a class="btn btn-primary" href="member.html">会員ページへ戻る</a></div></div></div></section></main><footer class="footer"><div class="wrap"><p>空き家レスキュー　お問い合わせ：aomori.akiya.rescue@gmail.com</p></div></footer><script src="assets/config.js"></script><script src="assets/api.js"></script><script src="assets/site.js"></script><script>
(async()=>{const sessionId=new URLSearchParams(location.search).get('session_id')||'';const token=AkiyaAPI.token();if(!sessionId){AkiyaUI.show(paymentStatus,'決済番号がありません。会員ページから確認してください。');paymentActions.classList.remove('hidden');return}if(!token){AkiyaUI.show(paymentStatus,'支払い確認にはログインが必要です。会員ページへ戻り、ログインしてください。');paymentActions.classList.remove('hidden');return}try{const r=await AkiyaAPI.submit('verify_card_payment',{sessionToken:token,stripeSessionId:sessionId},90000);AkiyaUI.show(paymentStatus,r.message||(r.ok?'支払いを確認しました。':'支払いを確認できませんでした。'),!!r.ok)}catch(e){AkiyaUI.show(paymentStatus,e.message||'支払いを確認できませんでした。')}finally{paymentActions.classList.remove('hidden')}})();
